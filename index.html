: "#2d6a30", "sub": "Departure · ch.lat · ch.long · parallels", "title": "Departure & Distances", "questions": [{"type": "mcq", "t": "The 'departure' between positions 60°N 160°E and 60°N 'x' is 900 NM. What is the longitude of 'x'?", "o": ["170°W", "190°E", "175°E", "145°E"], "a": 0, "x": "Departure = ch.long (min) × cos lat, so ch.long = 900 ÷ cos 60° = 1800' = 30°. 160°E + 30° = 190°E, which is written as 170°W.\n\n[Keith Williams · CIRCLES 15 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "The 'departure' between positions 60°N 160°E and 60°N 'x' is 1200 NM. What is the longitude of 'x'?", "o": ["160°W", "200°E", "170°E", "140°E"], "a": 0, "x": "ch.long = 1200 ÷ cos 60° = 2400' = 40°. 160°E + 40° = 200°E, written as 160°W.\n\n[Keith Williams · CIRCLES 18 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "The 'departure' between positions 60°N 060°E and 60°N 'x' is 1800 NM East. What is the longitude of 'x'?", "o": ["120°E", "090°E", "150°E", "075°E"], "a": 0, "x": "ch.long = 1800 ÷ cos 60° = 3600' = 60° East. 060°E + 60° = 120°E.\n\n[Keith Williams · CIRCLES 19 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "The 'departure' between positions 60°N 100°E and 60°N 'x' is 1200 NM. What is the longitude of 'x'?", "o": ["140°E", "120°E", "160°E", "130°E"], "a": 0, "x": "ch.long = 1200 ÷ cos 60° = 2400' = 40°. 100°E + 40° = 140°E.\n\n[Keith Williams · CIRCLES 75 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "The 'departure' between positions 60°N 090°E and 60°N 'x' is 1200 NM. What is the longitude of 'x'?", "o": ["130°E", "110°E", "150°E", "120°E"], "a": 0, "x": "ch.long = 1200 ÷ cos 60° = 2400' = 40°. 090°E + 40° = 130°E.\n\n[Keith Williams · CIRCLES 78 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "The 'departure' between positions 60°N 160°E and 60°N 'x' is 1800 NM East. What is the longitude of 'x'?", "o": ["140°W", "220°E", "160°W", "130°E"], "a": 0, "x": "ch.long = 1800 ÷ cos 60° = 3600' = 60° East. 160°E + 60° = 220°E, written as 140°W.\n\n[Keith Williams · CIRCLES 79 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "The angle between the true great circle track and the true rhumb line track joining A (60°S 165°W) and B (60°S 177°E), at the place of departure A, is:", "o": ["7.8°", "15.6°", "9.0°", "4.5°"], "a": 0, "x": "Conversion angle = ½ × ch.long × sin(mean lat). Crossing the 180th meridian, 165°W to 177°E is 18°. CA = ½ × 18 × sin 60° = 7.79°, so about 7.8°.\n\n[Keith Williams · CIRCLES 31 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "An aircraft passes position A (60°00'N 120°00'W) en route to position B (60°00'N 140°30'W). What is the great circle track on departure from A?", "o": ["279°", "270°", "261°", "288°"], "a": 0, "x": "Both points share a latitude, so the rhumb line track is 270°. CA = ½ × 20°30' × sin 60° = 8.9°. Northern hemisphere westbound, the initial great circle track is the rhumb line plus the conversion angle: 270° + 9° = 279°.\n\n[Keith Williams · CIRCLES 36 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "An aircraft passes position A (75°00'N 120°00'W) en route to position B (75°00'N 140°30'W). What is the great circle track on departure from A?", "o": ["280°", "270°", "260°", "290°"], "a": 0, "x": "Rhumb line track 270°. CA = ½ × 20°30' × sin 75° = 9.9°. Initial great circle track = 270° + 10° = 280°.\n\n[Keith Williams · CIRCLES 96 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "What is the change of latitude from 52°15'N to 39°35'N?", "o": ["12°40'S", "12°40'N", "13°20'S", "91°50'S"], "a": 0, "x": "Same hemisphere, so subtract: 52°15' − 39°35' = 12°40'. Moving toward the equator from the north, so the change is southerly.\n\n[Oxford ATPL · Ch2 Q1a · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "What is the change of latitude from 49°35'N to 60°20'S?", "o": ["109°55'S", "10°45'S", "109°55'N", "10°45'N"], "a": 0, "x": "Crossing the equator, so add: 49°35' + 60°20' = 109°55', southerly.\n\n[Oxford ATPL · Ch2 Q1b · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "What is the change of latitude from 74°20'S to 34°30'S?", "o": ["39°50'N", "39°50'S", "108°50'N", "40°50'N"], "a": 0, "x": "Same hemisphere, subtract: 74°20' − 34°30' = 39°50'. Moving toward the equator from the south, so the change is northerly.\n\n[Oxford ATPL · Ch2 Q1c · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "What is the change of latitude from 71°20'N to 86°45'N travelling over the North Pole?", "o": ["21°55'", "15°25'", "18°40'", "158°05'"], "a": 0, "x": "Over the pole the two legs add: 90° − 71°20' = 18°40', then 90° − 86°45' = 3°15'. Total 21°55'. Going direct without crossing the pole would give 15°25'.\n\n[Oxford ATPL · Ch2 Q1d · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "What is the change of longitude from 075°40'W to 125°35'W?", "o": ["49°55'W", "49°55'E", "201°15'W", "50°55'W"], "a": 0, "x": "Same hemisphere, subtract: 125°35' − 075°40' = 49°55', westerly.\n\n[Oxford ATPL · Ch2 Q3a · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "What is the change of longitude from 001°20'E to 004°20'W?", "o": ["05°40'W", "03°00'W", "05°40'E", "03°00'E"], "a": 0, "x": "Crossing the Greenwich meridian, so add: 1°20' + 4°20' = 5°40', westerly.\n\n[Oxford ATPL · Ch2 Q3b · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "What is the change of longitude from 150°40'E to 179°30'E?", "o": ["28°50'E", "28°50'W", "29°50'E", "330°10'E"], "a": 0, "x": "Same hemisphere, subtract: 179°30' − 150°40' = 28°50', easterly.\n\n[Oxford ATPL · Ch2 Q3c · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "What is the change of longitude from 162°36'W to 140°42'E?", "o": ["56°42'W", "303°18'E", "56°42'E", "21°54'W"], "a": 0, "x": "Take the shorter arc across the 180th meridian: 180° − 162°36' = 17°24', then 180° − 140°42' = 39°18'. Total 56°42' westerly. Going the long way round gives 303°18', which is not what is wanted.\n\n[Oxford ATPL · Ch2 Q3d · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "You are at position A at 54°20'N 002°30'W. Given a ch.lat of 16°20'N and a ch.long of 20°30'W to B, what is the position of B?", "o": ["70°40'N 023°00'W", "38°00'N 023°00'W", "70°40'N 018°00'E", "70°40'N 018°00'W"], "a": 0, "x": "54°20'N + 16°20'N = 70°40'N. 002°30'W + 20°30'W = 023°00'W.\n\n[Oxford ATPL · Ch2 Q7 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "You are at position C at 36°47'S 179°21'E. Given a ch.lat of 46°47'N and a ch.long of 20°30'E to D, what is the position of D?", "o": ["10°00'N 160°09'W", "10°00'N 199°51'E", "83°34'N 160°09'W", "10°00'S 160°09'W"], "a": 0, "x": "36°47'S with 46°47'N applied crosses the equator: 46°47' − 36°47' = 10°00'N. 179°21'E + 20°30' = 199°51'E, which is written as 160°09'W.\n\n[Oxford ATPL · Ch2 Q8 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "What is the shortest distance, in nautical miles and kilometres, from position A (41°25'N) to position B (79°30'N)? Both are on the same meridian.", "o": ["2285 NM, 4232 km", "2285 NM, 1234 km", "3805 NM, 7047 km", "2285 NM, 2626 km"], "a": 0, "x": "ch.lat = 38°05' = 2285'. One minute of latitude is one nautical mile, so 2285 NM. Multiplying by 1.852 gives 4232 km.\n\n[Oxford ATPL · Ch2 Q2 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Give the change of latitude and change of longitude from X (50°31'N 006°30'W) to Y (52°00'N 008°35'W).", "o": ["01°29'N 002°05'W", "01°29'S 002°05'E", "01°29'N 002°05'E", "02°29'N 002°05'W"], "a": 0, "x": "52°00' − 50°31' = 01°29' northerly. 008°35' − 006°30' = 002°05' westerly.\n\n[Oxford ATPL · Ch2 Q4a · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Give the change of latitude and change of longitude from X (47°32'N 002°46'W) to Y (43°56'N 001°33'W).", "o": ["03°36'S 001°13'E", "03°36'N 001°13'W", "03°36'S 001°13'W", "04°36'S 001°13'E"], "a": 0, "x": "47°32' − 43°56' = 03°36' southerly. 002°46'W to 001°33'W moves toward Greenwich, so 001°13' easterly.\n\n[Oxford ATPL · Ch2 Q4b · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Give the change of latitude and change of longitude from X (61°47'N 003°46'W) to Y (62°13'N 001°36'E).", "o": ["00°26'N 005°22'E", "00°26'N 002°10'E", "00°26'S 005°22'E", "00°26'N 005°22'W"], "a": 0, "x": "62°13' − 61°47' = 00°26' northerly. Crossing Greenwich the longitudes add: 003°46' + 001°36' = 005°22' easterly.\n\n[Oxford ATPL · Ch2 Q4c · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Give the change of latitude and change of longitude from X (31°27'S 091°47'E) to Y (35°57'N 096°31'E).", "o": ["67°24'N 004°44'E", "04°30'N 004°44'E", "67°24'S 004°44'E", "67°24'N 004°44'W"], "a": 0, "x": "Crossing the equator the latitudes add: 31°27' + 35°57' = 67°24' northerly. 096°31' − 091°47' = 004°44' easterly.\n\n[Oxford ATPL · Ch2 Q4d · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Give the change of latitude and change of longitude from X (51°05'N 177°42'E) to Y (51°06'N 167°42'W).", "o": ["00°01'N 014°36'E", "00°01'N 010°00'W", "00°01'N 345°24'W", "00°01'S 014°36'E"], "a": 0, "x": "51°06' − 51°05' = 00°01' northerly. Across the 180th meridian: 180° − 177°42' = 002°18', then 180° − 167°42' = 012°18'. Total 014°36' easterly.\n\n[Oxford ATPL · Ch2 Q4e · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Give the shortest distance in nautical miles and kilometres between 52°06'N 002°32'E and 53°36'N 002°32'E.", "o": ["90 NM, 167 km", "90 NM, 49 km", "150 NM, 278 km", "90 NM, 104 km"], "a": 0, "x": "Same meridian, so ch.lat = 01°30' = 90' = 90 NM. 90 × 1.852 = 167 km.\n\n[Oxford ATPL · Ch2 Q5a · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Give the shortest distance in nautical miles and kilometres between 04°41'S 163°36'W and 03°21'N 163°36'W.", "o": ["482 NM, 893 km", "80 NM, 148 km", "482 NM, 260 km", "802 NM, 1485 km"], "a": 0, "x": "Same meridian and crossing the equator, so the latitudes add: 04°41' + 03°21' = 08°02' = 482' = 482 NM. 482 × 1.852 = 893 km.\n\n[Oxford ATPL · Ch2 Q5b · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Give the shortest distance in nautical miles and kilometres between 62°00'N 093°00'E and 62°00'N 087°00'W.", "o": ["3360 NM, 6223 km", "5070 NM, 9390 km", "10 800 NM, 20 000 km", "3360 NM, 1814 km"], "a": 0, "x": "The two meridians are 180° apart, so the great circle runs over the North Pole: (90° − 62°) × 2 = 56° = 3360 NM, which is 6223 km. Measuring along the parallel instead would give 5070 NM and would not be the shortest route.\n\n[Oxford ATPL · Ch2 Q5c · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Give the shortest distance in nautical miles and kilometres between 00°00' 176°00'E and 00°00' 173°00'W.", "o": ["660 NM, 1222 km", "660 NM, 356 km", "20 940 NM, 38 780 km", "180 NM, 333 km"], "a": 0, "x": "Both on the equator, which is itself a great circle. Across the 180th meridian: 4° + 7° = 11° = 660 NM, which is 1222 km.\n\n[Oxford ATPL · Ch2 Q5d · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Give the shortest distance in nautical miles and kilometres between 43°57'N 071°37'W and 43°57'S 108°23'E.", "o": ["10 800 NM, 20 000 km", "5274 NM, 9767 km", "21 600 NM, 40 000 km", "10 800 NM, 5832 km"], "a": 0, "x": "The positions are antipodal: the latitudes are equal and opposite and the longitudes differ by 180°. Any great circle between them is half the circumference: 180° × 60 = 10 800 NM, about 20 000 km.\n\n[Oxford ATPL · Ch2 Q5e · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "An aircraft is to fly from 72°00'N 002°30'E to 72°00'N 177°30'W by the shortest route. What is the initial true track?", "o": ["360°(T)", "270°(T)", "090°(T)", "180°(T)"], "a": 0, "x": "The two meridians are 180° apart, so the shortest route is the great circle over the North Pole. The initial track is true north, and after the pole it becomes true south.\n\n[Oxford ATPL · Ch2 Q6a · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "A flight is made along the parallel of latitude from A (48°00'N 004°00'W) to B (48°00'N 002°27'E). Calculate the distance.", "o": ["259 NM", "387 NM", "578 NM", "288 NM"], "a": 0, "x": "ch.long = 6°27' = 387'. Departure = 387 × cos 48° = 259 NM. 387 NM would be the answer only on the equator.\n\n[Oxford ATPL · Ch15 Q1 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "What is the track and distance measured along the parallel of latitude of 80°S from 176°15'W to 179°45'E?", "o": ["270°(T), 41.7 NM", "090°(T), 41.7 NM", "270°(T), 240 NM", "270°(T), 236 NM"], "a": 0, "x": "Across the 180th meridian the ch.long is 3°45' + 0°15' = 4°00' = 240'. Departure = 240 × cos 80° = 41.7 NM. Going from 176°15'W to 179°45'E is westward, so the track is 270°(T).\n\n[Oxford ATPL · Ch15 Q4 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "In which latitude is a difference in longitude of 44°10' the equivalent of a departure of 2295 NM?", "o": ["30°N or S", "60°N or S", "45°N or S", "15°N or S"], "a": 0, "x": "44°10' = 2650'. cos lat = departure ÷ ch.long = 2295 ÷ 2650 = 0.866, so lat = 30°N or S.\n\n[Oxford ATPL · Ch15 Q5 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "At which latitude is the departure in nautical miles between two points equal to their difference in longitude in minutes?", "o": ["The equator", "60°N or S", "45°N or S", "The poles"], "a": 0, "x": "Departure = ch.long × cos lat, so they are equal only where cos lat = 1, at the equator.\n\n[Oxford ATPL · Ch15 Q7a-i · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "At which latitude is the departure in nautical miles between two points equal to half their difference in longitude in minutes?", "o": ["60°N or S", "30°N or S", "45°N or S", "The equator"], "a": 0, "x": "Departure is half the ch.long where cos lat = 0.5, which is 60°N or S.\n\n[Oxford ATPL · Ch15 Q7a-ii · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "At latitude 52°N, what is the departure between the meridians of 136°16'W and 043°44'E?", "o": ["6653 NM", "10 800 NM", "8508 NM", "4560 NM"], "a": 0, "x": "ch.long = 136°16' + 043°44' = 180° = 10 800'. Departure = 10 800 × cos 52° = 6653 NM. Note this is the distance along the parallel, not the shortest distance.\n\n[Oxford ATPL · Ch15 Q7b-i · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "At latitude 52°N, what is the shortest distance between the meridians of 136°16'W and 043°44'E?", "o": ["4560 NM", "6653 NM", "10 800 NM", "2280 NM"], "a": 0, "x": "The meridians are 180° apart, so the great circle runs over the pole: (90° − 52°) × 2 = 76° = 4560 NM. The 6653 NM figure is the departure along the parallel, which is longer.\n\n[Oxford ATPL · Ch15 Q7b-ii · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "An aircraft flies for 1000 NM along a rhumb line track of 090°(T) from C (36°00'N 174°45'E) to D. What is the longitude of D?", "o": ["164°39'W", "195°21'E", "165°21'W", "154°45'E"], "a": 0, "x": "ch.long = 1000 ÷ cos 36° = 1236' = 20°36' easterly. 174°45'E + 20°36' = 195°21'E, which is written as 164°39'W.\n\n[Oxford ATPL · Ch15 Q2 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Starting from E in latitude 50°N the following rhumb line tracks and distances are flown: E to F 000°(T) 300 NM, F to G 090°(T) 300 NM, G to H 180°(T) 300 NM. What is the rhumb line bearing and distance of H from E?", "o": ["090°(T), 336 NM", "090°(T), 300 NM", "090°(T), 262 NM", "000°(T), 300 NM"], "a": 0, "x": "E to F puts F at 55°N. At 55°N, 300 NM eastward is a ch.long of 300 ÷ cos 55° = 523'. G to H returns to 50°N with the same ch.long. At 50°N that same 523' of longitude is 523 × cos 50° = 336 NM. So H is 336 NM due east of E.\n\n[Oxford ATPL · Ch15 Q3 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "An aircraft leaves J (36°00'S 130°14'E) at 0946 UTC on a rhumb line track of 270°(T) at FL100, temperature 0°C, Mach 0.81, with a 35 kt tailwind. What is its position at 1004 UTC?", "o": ["36°00'S 126°48'E", "36°00'S 133°40'E", "36°00'S 127°28'E", "36°00'S 128°21'E"], "a": 0, "x": "At 0°C the local speed of sound gives a TAS of about 520 kt; with 35 kt of tailwind the groundspeed is 555 kt. In 18 minutes that is 166.5 NM. ch.long = 166.5 ÷ cos 36° = 206' = 3°26' westerly. 130°14'E − 3°26' = 126°48'E.\n\n[Oxford ATPL · Ch15 Q6 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "An aircraft leaves L in latitude 37°S and makes good: L to M 270°(T) at 310 kt, M to N 180°(T) at 280 kt, N to P 090°(T) at 250 kt. P is due south of L. M is reached 80 minutes after leaving L, and P is reached 93.5 minutes after leaving N. What is the distance from M to N?", "o": ["240 NM", "413 NM", "390 NM", "517 NM"], "a": 0, "x": "L to M is 413.3 NM, which at 37°S is a ch.long of 413.3 ÷ cos 37° = 517'. N to P covers the same ch.long in 389.6 NM, so cos lat = 389.6 ÷ 517 = 0.7536, putting N and P at 41°00'S. M to N is 41° − 37° = 4° of latitude = 240 NM.\n\n[Oxford ATPL · Ch15 Q8 (distance) · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "An aircraft leaves L in latitude 37°S and makes good: L to M 270°(T) at 310 kt, M to N 180°(T) at 280 kt, N to P 090°(T) at 250 kt. P is due south of L. M is reached 80 minutes after leaving L, and P is reached 93.5 minutes after leaving N. How long does the leg from M to N take?", "o": ["51.25 min", "88.6 min", "42.5 min", "80 min"], "a": 0, "x": "M to N is 4° of latitude = 240 NM. At 280 kt that is about 51 minutes.\n\n[Oxford ATPL · Ch15 Q8 (time) · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Aircraft Q, groundspeed 301 kt, flies along the parallel of latitude 46°N through 10° of longitude. Aircraft R, groundspeed 364 kt, flies between the same meridians in the same time. What is the latitude of aircraft R's track?", "o": ["33°N or S", "46°N or S", "56°N or S", "23°N or S"], "a": 0, "x": "At 46°N, 10° of longitude is 600 × cos 46° = 417 NM, which at 301 kt takes 83 minutes. In 83 minutes R covers 503.5 NM over the same 600' of longitude, so cos lat = 503.5 ÷ 600 = 0.839, giving 33°N or S. R is nearer the equator because it must cover more distance for the same change of longitude.\n\n[Oxford ATPL · Ch15 Q9 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Aircraft S leaves 36°N 010°E at 1522 and flies 090°(T) at 470 kt to the 013°E meridian, then turns to 180°(T) at 460 kt. Aircraft T leaves 30°N 010°E at 1522 and flies 090°(T) at 150 kt. Which aircraft reaches 30°N 013°E first?", "o": ["Aircraft T", "Aircraft S", "They arrive together", "Neither reaches the position"], "a": 0, "x": "S covers 180' of longitude at 36°N, which is 145.6 NM at 470 kt = 18.5 min, then 360 NM south at 460 kt = 47 min, totalling 65.5 min. T covers 180' at 30°N, which is 155.9 NM at 150 kt = 62 min. T arrives first.\n\n[Oxford ATPL · Ch15 Q10-1 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Aircraft S leaves 36°N 010°E at 1522 and flies 090°(T) at 470 kt to the 013°E meridian, then turns to 180°(T) at 460 kt. Aircraft T leaves 30°N 010°E at 1522 and flies 090°(T) at 150 kt. At what time is 30°N 013°E first reached?", "o": ["1624", "1628", "1618", "1640"], "a": 0, "x": "Aircraft T arrives first, taking 62 minutes for 155.9 NM at 150 kt. 1522 + 62 min = 1624.\n\n[Oxford ATPL · Ch15 Q10-2 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Aircraft S leaves 36°N 010°E at 1522 and flies 090°(T) at 470 kt to the 013°E meridian, then turns to 180°(T) at 460 kt. Aircraft T leaves 30°N 010°E at 1522 and flies 090°(T) at 150 kt. Where is aircraft S when 30°N 013°E is first reached?", "o": ["30°27'N 013°00'E", "30°00'N 012°33'E", "29°33'N 013°00'E", "30°27'N 012°33'E"], "a": 0, "x": "S needs 65.5 minutes against T's 62, so S is 3.5 minutes short. At 460 kt that is 27 NM, which on a southbound track is 27' of latitude. S is at 30°27'N 013°00'E.\n\n[Oxford ATPL · Ch15 Q10-3 · converted from a free-answer exercise; distractors written for this app]"}]}, {"id": "ch5", "icon": "🧲", "color": "#9e2a1c", "sub": "Variation · Deviation · DRC", "title": "Magnetism & Compasses", "questions": [{"type": "mcq", "t": "When accelerating on an easterly heading in the Northern hemisphere, the compass card of a direct reading magnetic compass will turn?", "o": ["Anti-clockwise giving an apparent turn toward the south", "Clockwise giving an apparent turn toward the north", "Clockwise giving an apparent turn toward the south", "Anti-clockwise giving an apparent turn toward the north"], "a": 1, "x": "This question is concerned with the effects of acceleration on a direct reading magnetic compass. These effects depend upon the magnetic latitude, the direction of flight and the acceleration rate. The lines of force produced by the earths magnetic field flow vertically upwards, out of the ground at the magnetic South Pole and vertically into the ground at the magnetic North pole. The degree to which they are inclined vertically at all other points on the earth is determined by the magnetic latitude. At the magnetic equator they are horizontal or parallel with the surface. As magnetic latitudes increase towards the magnetic poles the degree of inclination also increases. The inclination of the lines of force causes the magnets in compasses to dip below the horizontal, thereby reducing their accuracy. In order to minimise this problem, compasses are typically suspended such that their C of G is lower than their pivot. I n this way the weight of the magnet is made to oppose the dipping caused by the lines of magnetic force. This is termed pendulous suspension. Although this reduces compass dip, it does not entirely eliminate it. This means that whenever an aircraft heading is anything other than magnetic north or south, the C of G of the compass magnet will be off-set to one side of the pivot, as illustrated below. 1 Aircraft flying on castcrly heading in the northcrn ...\n\n[Keith Williams · MAGNETISM & COMPASSES 1]"}, {"type": "mcq", "t": "Sensitivity of a direct reading magnetic compass is?", "o": ["Proportional to the vertical component of the magnetic field of the earth", "Inversely proportional to the vertical and horizontal components of the magnetic field of the earth", "Inversely proportional to horizontal component of the magnetic field of the earth", "Proportional to horizontal component of the magnetic field of the earth"], "a": 3, "x": "A magnetic compass provides heading information by using a magnetic sensor. This sensor is magnetic and aligns itself with the lines of force that make up the magnetic field of the earth. These lines of force flow vertically upwards, out of the ground at the magnetic South Pole and vertically into the ground at the magnetic North pole. The degree to which they are inclined vertically at all other points on the earth is determined by the magnetic latitude. At the magnetic equator they are horizontal or parallel with the surface. As magnetic latitudes increase towards the magnetic poles the degree of inclination also increases. The inclination of the lines of force causes the n~sgnetsin compasses to dip below the horizontal, thereby reducing their accuracy. The accuracy of a magnetic compass is therefore proportional to the horizontal component of the magnetic field of the earth (option d).\n\n[Keith Williams · MAGNETISM & COMPASSES 2]"}, {"type": "mcq", "t": "When turning right from 320' (C) to 050' (C) in the Southern hemisphere, the reading of a direct reading magnetic compass will?", "o": ["Over-indicate the turn and liquid swirl will decrease the effect", "Under-indicate the turn and liquid swirl will decrease the effect", "Over-indicate the turn and liquid swirl will increase the effect", "Under-indicate the turn and liquid swirl will increase the effect"], "a": 0, "x": "This question is concerned with the effects of acceleration on a direct reading magnetic compass. These effects depend upon the magnetic latitude, the direction of flight and the acceleration rate. The lines of force produced by the earths magnetic field flow vertically upwards, out of the ground at the magnetic South Pole and vertically into the ground at the magnetic North pole. The degree to which they are inclined vertically at all other points on the earth is determined by the magnetic latitude. At the magnetic equator they are horizontal or parallel with the surface. As magnetic latitudes increase towards the magnetic poles the degree of inclination also increases. The inclination of the lines of force causes the magnets in compasses to dip below the horizontal, thereby reducing their accuracy. In order to minimise this problem, compasses are typically suspended such that their C of G is lower than their pivot. In this way the weight of the magnet is made to oppose the dipping caused by the lines of magnetic force. This is termed pendulous suspension. Although this reduces compass dip, it does not entirely eliminate it. This means that whenever an aircraft heading is anything other than magnetic north or south, the C of G of the compass magnet will be off-set to one side of the pivot, as illustrated below. When the compass magnet dips to align itself with the lines of ...\n\n[Keith Williams · MAGNETISM & COMPASSES 3]"}, {"type": "mcq", "t": "An aircraft is completing a timed turn in the Northern hemisphere from 330°C to 040°C. After the turn has been stopped but before the direct indicating magnetic compass settles down, will the compass (1) over-read or under-read, and (2) is this error increased or decreased by liquid swirl?", "o": ["(1) over-read (2) increased", "(1) over-read (2) decreased", "(1) under-read (2) increased", "(1) under-read (2) decreased"], "a": 2, "x": "This question is concerned with the effects of acceleration on a direct reading magnetic compass. These effects depend upon the magnetic latitude, the direction of flight and the acceleration rate. The lines of force produced by the earths magnetic field flow vertically upwards, out of the ground at the magnetic South Pole and vertically into the ground at the magnetic North pole. The degree to which they are inclined vertically at all other points on the earth is determined by the magnetic latitude. At the magnetic equator they are horizontal or parallel with the surface. As magnetic latitudes increase towards the magnetic poles the degree of inclination also increases. The inclination of the lines of force causes the magnets in compasses to dip below the horizontal, thereby reducing their accuracy. In order to minimise this problem, compasses are typically suspended such that their C of G is lower than their pivot. In this way the weight of the magnet is made to oppose the dipping caused by the lines of magnetic force. This is termed pendulous suspension. Although this reduces compass dip, it does not entirely eliminate it. This means that whenever an aircraft heading is anything other than magnetic north o r south, the C of G of the compass magnet will be off-set to one side of the pivot, as illustrated below. When the compass magnet dips to aligll itself with the lines of ...\n\n[Keith Williams · MAGNETISM & COMPASSES 4]"}, {"type": "mcq", "t": "What is magnetic variation?", "o": ["The angle between Magnetic North and True North", "The angle between Magnetic Heading and Magnetic North", "The angle between the direction indicated on the compass and Magnetic North", "The angle between True North and Compass North"], "a": 0, "x": "The North and South magnetic ~ o l e of s the Earth do not coincide exactly with the geographic North a n d s o u t h Poles. The term \"magnetic variation\" refers to the horizontal angle between the magnetic meridian the true meridian (option a). MAGNETISM & COMPASSES 6 cl. This question is concerned with the effects of acceleration on a direct reading magnetic compass. These effects depend upon the magnetic latitude, the direction of flight and the acceleration rate. The lines of force produced by the earths magnetic field flow vertically upwards, out of the ground at the magnetic South Pole and vertically into the ground at the magnetic North pole. The degree to which they are inclined vertically at all other points on the earth is determined by the magnetic latitude. At the magnetic equator they are horizontal or parallel with the surface. As magnetic latitudes increase towards the magnetic poles the degree of inclination also increases. The inclination of the lines of force causes the magnets in compasses to dip below the horizontal, thereby reducing their accuracy. In order to minimise this problem, compasses are typically suspended such that their C of G is lower than their pivot. In this way the weight of the magnet is made to oppose the dipping caused by the lines of magnetic force. This is termed pendulous suspension. Although this reduces compass dip, it does not ...\n\n[Keith Williams · MAGNETISM & COMPASSES 5]"}, {"type": "mcq", "t": "At the magnetic equator?", "o": ["Deviation is zero", "The isogonal is an agonic line", "Dip is zero", "Variation is zero"], "a": 2, "x": "The dip angle is the angle between the total magnetic field and the earth horizontal. The lines of force produced by the earths magnetic field flow vertically upwards, out of the ground at the magnetic north pole and vertically into the ground at the magnetic South Pole. The lines of force are horizontal oi~lyat the magnetic equator. So at the magnetic equator the dip angle is zero (option c).\n\n[Keith Williams · MAGNETISM & COMPASSES 7]"}, {"type": "mcq", "t": "The horizontal component of the earth's magnetic field?", "o": ["Weakens with increasing distance from the magnetic poles", "Weakens with increasing distance from the nearer magnetic pole", "Is approximately the same at all magnetic latitudes less than 60'", "Is approximately the same at magnetic latitudes 50° N and 50\"s"], "a": 3, "x": "The dip angle is the angle between the total magnetic field and the earth horizontal. The lines of force produced by the earths magnetic field flow vertically upwards, out of the ground at the magnetic north pole and vertically into the ground at the magnetic South Pole. At the magnetic equator the lines are horizontal an the dip is zero. The rate of change of dip is proportional to latitude north or south of the magnetic equator. So the horizontal component of the earth's magnetic field at any northern latitude is equal to that at the equivalent southern latitude. So for example, the horizontal component is the same a t magnetic latitudes 50' N and 50' S (option d). .\n\n[Keith Williams · MAGNETISM & COMPASSES 9]"}, {"type": "mcq", "t": "Which of the following is correct when the variation is West?", "o": ["True North is East of Magnetic North", "Magnetic North is West of Compass North", "True North is West of Magnetic North", "Compass North is West of Magnetic North"], "a": 0, "x": "The term \"variation\" refers to the horizontal angle between the True North and Magnetic North. In effect variation indicates the position of Magnetic North relative to true North. So if variation is West then Magnetic North is West of True North. This means that True North is East of magnetic North (option a).\n\n[Keith Williams · MAGNETISM & COMPASSES 11]"}, {"type": "mcq", "t": "A line drawn on a chart which joins all points where the value of magnetic variation is zero is called an?", "o": ["Agonic line", "Aclinic line", "Isogonal", "Isotach"], "a": 0, "x": "The term \"variation\" refers to the horizontal angle between the True North and Magnetic North. I t may be West in which case Magnetic North is to the West of True North, or East, in which case Magnetic North is to the East of True North. Isogonal or Isogonic lines are lines on charts, joining points of equal variation. Isogonal lines joining points of zero variation are called Agonic lines (option a).\n\n[Keith Williams · MAGNETISM & COMPASSES 12]"}, {"type": "mcq", "t": "How is the direct reading magnetic compass made aperiodic or dead beat?", "o": ["Using a pendulous suspension system for the magnetic assembly", "Using the lowest possible viscosity liquid in the compass", "Using short magnets", "Positioning the magnetic assembly mass close to the compass point and using damping wires"], "a": 3, "x": "The terms \"aperiodic\" and \"dead beat\" mean that the compass must settle down quickly on steady indication following any disturbance such as turbulence or aircraft manoeuvres. This is achieved by including three design factors. Firstly by using several short magnets instead of a single long magnet, the mass of the magnet is brought closer to the compass point. This reduces the inertia of the unit thereby enabling oscillations to be damped out very quickly. Secondly the magnets are immersed in a liquid which acts as a damping fluid. Thirdly by attaching damping wires to the magnets. As the magnets oscillate these wires move back and forth through the fluid. The fluid friction on these wires thereby damps out oscillations. (Option d), therefore gives the best description of the methods used.\n\n[Keith Williams · MAGNETISM & COMPASSES 13]"}, {"type": "mcq", "t": "Isogonals converge a t the?", "o": ["Magnetic equator", "North magnetic pole only", "North and South magnetic poles only", "North and South geographic and magnetic poles"], "a": 3, "x": "The term \"variation\" refers to the horizontal angle between the True North and Magnetic North. It may be West in which case Magnetic North is to the West of True North, or East, in which case Magnetic North is to the East of True North. Isogonal or Isogonic lines are lines on charts, joining points of equal variation. All Lsogonals converge at the North and South geographic and magnetic poles (option d).\n\n[Keith Williams · MAGNETISM & COMPASSES 14]"}, {"type": "mcq", "t": "Why does the value of magnetic variation on a chart change with time?", "o": ["Movements of the magnetic poles, cause it to increase", "Movements of the magnetic poles, cause it to increase or decrease", "Increases in the magnetic field, cause it to increase", "Reductions in the magnetic field, cause it to decrease"], "a": 1, "x": "Magnetic variation at m y given point on the Earth is a measure of the angle between the True North pole and the Magnetic North pole, measured from that point. This means that the variation at any point is determined by the locations of the true North and Magnetic north Poles. But the positions of these poles varies with the passing of time, thereby causing the variation at any given point to gradually change (option b).\n\n[Keith Williams · MAGNETISM & COMPASSES 15]"}, {"type": "mcq", "t": "The value of magnetic variation?", "o": ["Must be 0' a t the magnetic equator", "Varies between a maximum of 45' East and 45' West", "Cannot exceed 90'", "Has a maximum of 180'"], "a": 3, "x": "The term \"variation\" refers to the horizontal angle between the True North and Magnetic North. I t may be West in which case Magnetic North is to the West of True North, or East, in which case Magnetic North is to the East of True North. Isogonal or Isogonic lines are lines on charts 'oining points of equal variation. ' J o ,which occurs a t all point located The greatest possible value of variations is 180 directly between the Magnetic and True North Poles (option d).\n\n[Keith Williams · MAGNETISM & COMPASSES 17]"}, {"type": "mcq", "t": "At what point on the earth is a magnetic compass most effective?", "o": ["At the geographic equator", "Close to the magnetic North Pole", "Close to the magnetic South Bole", "Approximately midway between the magnetic poles"], "a": 3, "x": "The lines of force produced by the earths magnetic field flow vertically upwards, out of the ground a t the magnetic South Pole and vertically into the ground at the magnetic North pole. The degree to which they are inclined vertically at all other points on the earth is determined by the magnetic latitude. At the magnetic equator they are horizontal or parallel with the surface. As magnetic latitudes increase towards the magnetic poles the degree of inclination also increases. The inclination of the lines of force causes the magnets in compasses to dip below the horizontal, thereby reducing their accuracy. This means that magnetic compasses are most accurate a t the magnetic equator which is midway between the magnetic poles (option d).\n\n[Keith Williams · MAGNETISM & COMPASSES 18]"}, {"type": "mcq", "t": "Which of the following is true of the value of magnetic variation?", "o": ["I t is 0' at the magnetic equator", "It varies between 45' East and 45' West", "I t cannot exceed 90'", "It cannot exceed 180'"], "a": 3, "x": "The term \"variation\" refers to the horizontal angle between the True North and Magnetic North. I t may be West in which case Magnetic North is to the West of True North, or East, in which case Magnetic North is to the East of True North. Isogonal or Isogonic lines are lines on charts, joining points of equal variation. The greatest possible value of variations is 180', which occurs a t all point located directly between the Magnetic and True North Poles (option d).\n\n[Keith Williams · MAGNETISM & COMPASSES 19]"}, {"type": "mcq", "t": "An aircraft in the northern hemisphere is making an accurate rate one turn to the right. If the initial heading was 135', after 30 seconds the direct reading magnetic compass should read?", "o": ["225'", "Less than 225'", "More or less than 225' depending on the pendulous suspension used", "More than 225'"], "a": 3, "x": "The lines of magnetic force in the magnetic field of the Earth are horizontal a t the magnetic equator and dip down towards the surface as latitude increases to the North and South. This means that the lines of force are horizontal a t the magnetic equator and vertical a t the North and South magnetic poles. Because the compass magnet aligns itself with these lines of force, the magnet is horizontal only when the aircraft is over the magnetic equator. In order minimize the effects of this dipping of the lines of force the compass magnet uses a pendulous suspension system, whereby the magnet hangs below its point of suspension. Although this reduces compass dip, it does not entirely eliminate it. This means that whenever an aircraft heading is anything other than magnetic north or south, the C of G of the compass magnet will be off-set to one side of the pivot. Because the C of G of the magnet is no longer directly below its point of suspension, its inertia will cause its C of G to lag behind its suspension point whenever the aircraft turns or changes speed. The compass card is attached to the magnet. So the effect will be to cause the compass to over-read or under- read depending upon whether the aircraft is turning towards or away from the nearest or furthest pole as illustrated below. TURNING ERROR WREN AIRCRAFT IS TURNING ERROR WREN AIRCRAlT IS POINTING TOWARDS NEAREST POLE ...\n\n[Keith Williams · MAGNETISM & COMPASSES 20]"}, {"type": "mcq", "t": "When using a direct reading magnetic compass in the northern hemisphere?", "o": ["A longitudinal acceleration on a Westerly heading causes an apparent turn to the South", "A longitudinal acceleration on an Easterly heading causes an apparent turn to the North", "A longitudinal deceleration on a Westerly heading causes an apparent turn to the North", "A longitudinal acceleration on an Easterly heading causes an apparent turn to the South"], "a": 1, "x": "This question is concerned with the effects of acceleration on a direct reading magnetic compass. These effects depend upon the magnetic latitude, the direction of flight and the acceleration rate. The lines of force produced by the earths magnetic field flow vertically upwards, out of the ground a t the magnetic South Pole and vertically into the ground a t the magnetic North pole. The degree to which they are inclined vertically at all other points on the earth is determined by the magnetic latitude. At the magnetic equator they are horizontal or parallel with the surface. As magnetic latitudes increase towards the magnetic poles the degree of inclination also increases. The inclination of the lines of force causes the magnets in compasses to dip below the horizontal, thereby reducing their accuracy. In order to minimise this problem, compasses are typically suspended such that their C of G is lower than their pivot. I n this way the weight of the magnet is made to oppose the dipping caused by the lines of magnetic force. This is termed pendulous suspension. Although this reduces compass dip, it does not entirely eliminate it. This means that whenever an aircraft heading is anything other than magnetic north or south, the C of G of the compass magnet will be off-set to one side of the pivot, as illustrated below. 1 Aircrait flying on easterly heading in the northern ...\n\n[Keith Williams · MAGNETISM & COMPASSES 21]"}, {"type": "mcq", "t": "What is the main cause of permanent magnetism in aircraft?", "o": ["Electrical currents in internal wiring and electrical storms", "Exposure to the terrestrial magnetic field during normal operation", "The combined effect of aircraft electrical equipment and the terrestrial magnetic field", "Hammering, and the effect of the earth's magnetic field, whilst under construction"], "a": 3, "x": "The creation of permanent magnetism in an object requires two things. Pirstly the object must contain materials capable of supporting permanent magnetism. These materials are said to be \"magnetically hard\". This term does not refer to the physical hardness of the materials but to the degree of effort required to induce of remove permanent magnetism. One explanation of the magnetic properties of materials uses the concept of magnetic domains within the material. Each domain can be considered to be a microscopically small magnet, with a North and South Pole. If a majority of these domains become permanently aligned in one direction, the material possesses permanent magnetism. The second factor required to induce permanent magnetism is some means by which the magnetic domains within the material can be aligned in one direction. Whenever a material is subjected to physical shocks such as when hammering it, the magnetic domains are shaken lose from their alignment. If this process is repeated over a long period of time, such as when riveting together the skin of an aircraft, the magnetic domains can become aligned with the magnetic field of the earth. This combination of hammering and the effects of the earth's magnetic field during construction is the most common cause of permanent magnetism in aircraft (option d).\n\n[Keith Williams · MAGNETISM & COMPASSES 22]"}, {"type": "mcq", "t": "When accelerating on a westerly heading in the northern hemisphere, the compass card of a direct reading magnetic compass will turn?", "o": ["Clockwise giving an apparent turn towards the north", "Clockwise giving an apparent turn towards the south", "Anti-clockwise giving an apparent turn towards the north", "Anti-clockwise giving an apparent turn towards the south"], "a": 2, "x": "This question is concerned with the effects of acceleration on a direct reading magnetic compass. These effects depend upon the magnetic latitude, the direction of flight and the deceleration rate. The lines of force produced by the earths magnetic field flow vertically upwards, out of the ground a t the magnetic north pole and vertically into the ground a t the magnetic South Pole. The degree to which they are inclined vertically at all other points on the earth is determined by the magnetic latitude. At the magnetic equator they are horizontal or parallel with the surface. As magnetic latitudes increase towards the magnetic poles the degree of inclination also increases. The inclination of the lines of force causes the magnets in compasses to dip below the horizontal, thereby reducing their accuracy. In order to minimise this problem, compasses are typically suspended such that their C of G is lower than their pivot. In this way the weight of the magnet is made to oppose the dipping caused by the lines of magnetic force. This is termed pendulous suspension. Although this reduces compass dip, it does not entirely eliminate it. This means that whenever an aircraft heading i s anything other than magnetic north or south, the C of G of the compass magnet will be off-set to one side of the pivot. Whenever an aircraft accelerates or decelerates on such a heading, the lateral ...\n\n[Keith Williams · MAGNETISM & COMPASSES 23]"}, {"type": "mcq", "t": "What is the main advantage of a remote indicating compass compared to a direct reading compass is that it?", "o": ["It has less moving parts", "I t requires less maintenance", "I t magnifies the earth's magnetic field in order to attain greater accuracy", "I t senses, rather than seeks, the magnetic meridian"], "a": 3, "x": "In a direct reading magnetic compass the magnet is required to align itself with the magnetic field of the Earth. This alignment process is commonly referred to as seeking the magnetic field. But the seeking process is inevitably subject to errors due to friction losses and inertia within the compass. I n a remote indicating compass, the detector unit does not align itself with the Earth's magnetic field, but detects this field. The detector unit then produces an electrical signal proportional to the direction of the magnetic field. This largely eliminates the friction and inertia losses thereby making the remote reading compass more accurate. (option d).\n\n[Keith Williams · MAGNETISM & COMPASSES 24]"}, {"type": "mcq", "t": "Where do the isogonal lines converge?", "o": ["At the both the North and South Geographic Poles", "At both the North and South Magnetic Poles", "Only at the Magnetic equator", "Only at the Magnetic North Pole"], "a": 1, "x": "The term \"variation\" refers to the horizontal angle between the True North and Magnetic North. I t may be West in which case Magnetic North is to the West of True North, or East, in which case Magnetic North is to the East of True North. Isogonal or Isogonic lines are lines on charts, joining points of equal variation. All Isogonals converge at both the North and South Magnetic Poles (option b).\n\n[Keith Williams · MAGNETISM & COMPASSES 25]"}, {"type": "mcq", "t": "When decelerating on a westerly heading in the Northern hemisphere, the compass card of a direct reading magnetic compass will turn?", "o": ["Anti-clockwise giving an apparent turn towards the north", "Clockwise giving an apparent turn toward the south", "Anti-clockwise giving an apparent turn towards the south", "Clockwise giving an apparent turn towards the north"], "a": 1, "x": "This question is concerned with the effects of deceleration on a direct reading magnetic compass. These effects depend upon the magnetic latitude, the direction of flight and the deceleration rate. The lines of force produced by the earths magnetic field flow vertically upwards, out of the ground at the magnetic north pole and vertically into the ground at the magnetic South Pole. The degree to which they are inclined vertically at all other points on the earth is determined by the magnetic latitude. At the magnetic equator they are horizontal o r parallel with the surface. As magnetic latitudes increase towards the magnetic poles the degree of inclination also increases. The inclination of the lines of force causes the magnets in compasses to dip below the horizontal, thereby reducing their accuracy. In order to minimise this problem, compasses are typically suspended such that their C of G is lower than their pivot. In this way the weight of the magnet is made to oppose the dipping caused by the lines of magnetic force. This is termed pendulous suspension. Although this reduces compass dip, it does not entirely eliminate it. This means that whenever an aircraft heading is anything other than magnetic north or south, the C of G of the compass magnet will be off-set to one side of the pivot. Whenever an aircraft accelerates or decelerates on such a heading, the lateral ...\n\n[Keith Williams · MAGNETISM & COMPASSES 26]"}, {"type": "mcq", "t": "Why are the detector units in slaved gyro compasses usually fitted in or close to the wingtips of an aircraft?", "o": ["In order to isolate the detector unit from the terrestrial magnetic field", "In order to reduce or eliminate turning and acceleration errors", "Having one detector in each wingtip, cancels out compass deviation", "In order to isolate the detector unit from the aircraft deviation sources"], "a": 3, "x": "In a direct reading magnetic compass the magnet must be located within the cockpit area in view of the pilot. This can cause inaccuracies due to the effects of magnetic fields caused by materials and electrical, equipment in the cockpit area. These fields represent additional deviation sources. One of the principal advantages of a remote or slaved gyro compass is that it enables the detector unit to be located in another area such as the wingtips, thereby isolating it from the aircraft deviation sources (option d).\n\n[Keith Williams · MAGNETISM & COMPASSES 27]"}, {"type": "mcq", "t": "Which of the following statements is true of the Earth's magnetic field?", "o": ["It may be permanent, temporary, transient", "It does not affect aircraft deviation", "It acts like a large blue magnetic pole in Northern Canada", "The dip angle is between the vertical and the total magnetic force"], "a": 2, "x": "The lines of force produced by the earths magnetic field flow vertically upwards, out of the ground a t the magnetic South Pole snd vertically into the ground at the magnetic North pole. Magnetic fields are conventionally represented by lines of magnetic force flowing out of the North Pole of magnets and into the South Pole. So the North Pole of the earth, with its lines of force flow-ing into it is effectively the South Pole of a magnet. South Poles of magnets are conventionally painted Blue, so the Earth can be considered as being a magnet with the blue pole in Northern Canada (option c).\n\n[Keith Williams · MAGNETISM & COMPASSES 28]"}, {"type": "mcq", "t": "In a remote indicating compass system the amount of deviation caused by aircraft magnetism and electrical circuits may be minimised by?", "o": ["Positioning the master unit in the centre of the aircraft", "Using a vertically mounted gyroscope", "Mounting the detector unit in the wingtip", "The use of repeater cards"], "a": 2, "x": "In a direct reading magnetic compass the magnet must be located within the cockpit area in view of the pilot. This can cause inaccuracies d?re to the effects of magnetic fields caused by materials and electrical, equipment in the cockpit area. These fields represent additional deviation sources. One of the principal advantages of a remote o r slaved gyro compass is that it enables the detector unit to be located in another area such as the wingtips, thereby isolating it from the aircraft deviation sources (option c).\n\n[Keith Williams · MAGNETISM & COMPASSES 29]"}, {"type": "mcq", "t": "What is the angle between True North and Magnetic North?", "o": ["Drift", "Variation", "Dip", "Deviation"], "a": 1, "x": "The term \"variation\" refers to the horizontal angle between the True North and Magnetic North (option b). I t may be West in which case Magnetic North is to the West of True North, or East, in which case Magnetic North is to the East of True North. Isogonal lines are lines on charts, joining points of equal variation. MAGNETISM Bi COMPASSES 31 b. The lines of magnetic force in the magnetic field of the Earth are horizontal a t the magnetic equator and dip down towards the surface as latitude increases to the North and South. This means that the lines of force are horizontal a t the magnetic equator and vertical a t the North and South magnetic poles. Because the compass magnet aligns itself with these lines of force, the magnet is horizontal only when the aircraft is over the magnetic equator. In order minimize the effects of this dipping of the liiaes of force the compass magnet uses a pendulous suspension system, whereby the magnet hangs below its point of suspension. Because the C of G of the magnet is no longer directly below its point of suspension, its inertia will cause its C of G to lag behind its suspension point. This will cause the compass to over-read o r under-read depending upon whether the aircraft is turning towards o r away from the nearest o r furthest pole as illustrated below. North pole AircraR turning Compass turning h r n i n g or aircraft pulls magnet ...\n\n[Keith Williams · MAGNETISM & COMPASSES 30]"}, {"type": "mcq", "t": "The sensitivity of a direct reading compass varies?", "o": ["Inversely with the vertical component of the earth's magnetic field", "Directly with the horizontal component of the earth's magnetic field", "Directly with the vertical component of the earth's magnetic field", "Inversely with both vertical and horizontal components of the earth's magnetic field"], "a": 1, "x": "A magnetic compass gives an indication of direction by aligning itself with the horizontal component of the magnetic field of the Earth. But the lines of force ' that make up this magnetic field are truly horizontal only a t the magnetic equator. As latitudes increase to the North and South of the magnetic equator the magnetic lines of force dip down towards the surface of the Earth. As this dipping angle increases the horizontal component of the magnetic field becomes weaker and the vertical component becomes stronger. Because magnetic compass can derive direction information only from the horizontal component of the Earth's magnetic field, their accuracy and effectiveness are proportional to the horizontal component of the field (option b).\n\n[Keith Williams · MAGNETISM & COMPASSES 32]"}, {"type": "mcq", "t": "An aircraft's compass must be swung?", "o": ["If the aircraft has been in the hangar for a long time and has been moved several times", "If the aircraft has been subjected to hammering", "Every maintenance inspection", "After a change of theatre of operations which leads to a change of magnetic longitude"], "a": 1, "x": "The creation of permanent magnetism in an object requires two things. Firstly the object must contain materials capable of supporting permanent magnetism. These materials are said to be \"magnetically hard\". This term does not refer to the physical hardness of the materials but to the degree of effort required to induce of remove permanent magnetism. One explanation of the magnetic properties of materials uses the concept of magnetic domains within the material. Each domain can be considered to be a microscopically small magnet, with a North and South Pole. If a majority of these domains become permanently aligned in one direction, the material possesses permanent magnetism. The-second factor required to induce permanent magnetism is some means by which the magnetic domains within the material can be aligned in one direction. Whenever a material is subjected to physical shocks such as when hammering it, the magnetic domains are shaken lose from their alignment. If this process is repeated over a long period of time, such as when riveting together the skin of an aircraft, the magnetic domains can become aligned with the magnetic field of the earth. This combination of hammering and the effects of the earth's magnetic field during construction is the most common cause of permanent magnetism in aircraft (option b).\n\n[Keith Williams · MAGNETISM & COMPASSES 33]"}, {"type": "mcq", "t": "At the magnetic equator, when accelerating after take off on heading West, a direct reading compass?", "o": ["Underreads", "The heading indicates a turn to the south", "Indicates the correct heading", "Overreads the heading"], "a": 2, "x": "The principal cause of compass acceleration errors is the dipping of the magnets due to dipping of the lines of magnetic force in the Earth's magnetic field. This dipping causes the C of g of the compass magnets to move out of alignment with the suspension point. This misalignment causes the compass magnet to rotate when the aircraft accelerates o r decelerates. The magnitude of these errors depends upon the magnitude of the acceleration, the direction of flight and the degree of dip. But a t the magnetic equator the lines of magnetic force are horizontal so the dip angle is zero. This means that the C of G of the compass magnet is directly below its suspension point, so there will be no acceleration errors. So the compass will indicate correctly (option c) when accelerating on the magnetic equator.\n\n[Keith Williams · MAGNETISM & COMPASSES 35]"}, {"type": "mcq", "t": "What is the name for a line of equal magnetic variation?", "o": ["An isocline", "An isogonal", "An isogriv", "An isovar"], "a": 1, "x": "The term \"variation\" refers to the horizontal angle between the True North and Magnetic North. I t may be West in which case Magnetic North is to the West of True North, or East, in which case Magnetic North is to the East of True North. Isogonal lines are lines on charts, joining points of equal variation (option b).\n\n[Keith Williams · MAGNETISM & COMPASSES 36]"}, {"type": "mcq", "t": "The agonic line?", "o": ["Is midway between the magnetic North and South Poles", "Follows the geographic equator", "Is the shorter distance between the respective True and Magnetic North and South Poles", "Follows separate paths out of the North polar regions, one currently running through Western Europe and the other through the USA"], "a": 3, "x": "The term \"magnetic variation\" refers to the angle between True North Pole and the Magnetic North Pole. Lines on charts joining points of equal variation are called Isogonal lines. Lines joining points of zero variation are called Agonic lines. There are two agonic lines. These follow separate paths out of the North polar regions, one currently running through western Europe and the other through the USA (option d).\n\n[Keith Williams · MAGNETISM & COMPASSES 37]"}, {"t
