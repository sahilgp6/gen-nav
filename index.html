ic headings (option a).\n\n[Keith Williams · INS/IRS/FMS/EFIS 84]"}, {"type": "mcq", "t": "What are, in order of highest priority followed by lowest, the two levels of message produced by the CDU of the B737-400 EFIS?", "o": ["Caution and Advisory", "Urgent and Routine", "Warning and Caution", "Warning and Advisory"], "a": 3, "x": "Messages provided by the CDU of a Boeing 737-400 EFIS fall into three categories. The highest priority massages are Warnings. These relate to situations or events requiring immediate corrective action on the part of the crew. The second priority messages are Cautions. These refer to situations or events, which do not require immediate corrective action, but which may affect the performance or operation of the aircraft. The lowest category is Advisory messages, which inform the crew of routine changes in the status-of the aircraft and its systems, which do not require corrective action. Option d, is therefore the most accurate in this question.\n\n[Keith Williams · INS/IRS/FMS/EFIS 85]"}, {"type": "mcq", "t": "The CDUs in the B737-400 Flight Management System are used during preflight to?", "o": ["Manually initialise the IRSs and FMC with dispatch information", "Manually initialise the IRSs, FMC and Autothrottle with dispatch information", "Automatically initialise the IRSs and FMC with dispatch information", "Manually initialise the Flight Director System and FMC with dispatch information"], "a": 0, "x": "In the Boeing 737-400 aircraft the MCDU is used for a number of functions including inserting data into the FMS and IRS. Prior to the start of a flight, the MCDU is used to initialize the IRSs such that the carry out their initial alignment processes. I n addition to this the MCDU is used to insert dispatch information such as destination, waypoints and cost index values, into the FMS. I t should be noted that the MCDU is not used to input data directly into the Flight Director nor Autothrottle because these systems get their information via the FMS. Option a, is therefore the most accurate in this question.\n\n[Keith Williams · INS/IRS/FMS/EFIS 86]"}, {"type": "mcq", "t": "The Boeing 737-400 Flight Management System (FMS) provides?", "o": ["Manual navigation & manual-performance management", "Manual navigation & automatic performance management", "Automatic navigation & manual performance management", "Automatic navigation & automatic performance management"], "a": 3, "x": "The Boeing 737-400 Flight Management System (FMS) takes inputs from a wide range of sources including the IRS, Air Data Computers, MCDU, radio navigation aids, Autopilot, Flight Director, and Autothrottle system. By combining the data from these sources it is able to provide a range of services. These include automatic navigation and automatic performance management (option d). As an example of this letter function, the pilot can control the trade- off between fuel costs and flight duration, by inputting various cost index values into the FMS MCDU.\n\n[Keith Williams · INS/IRS/FMS/EFIS 87]"}, {"type": "mcq", "t": "List the sequence of pages on start-up of the Boeing 737- 400 FMS?", "o": ["IDENT, POS INIT, RTE", "POS INIT, RTE, IDENT", "IDENT, POS INIT, DEPARTURES", "POS INIT, IDENT, DEPARTURES"], "a": 0, "x": "The first page used after powering up the system is IDENT, which allows the crew to confirm the details of the aircraft. This in turn causes the system to produce a series of prompts to guide the crew through the route procedures that need to be generated for the flight. The second page is POS INIT, which enables the crew to confirm that the FMS clock and the aircraft clock are synchronised. This page is then used to align the IRS. The third page is RTE, which appears after the tasks on the POS INIT page have been completed. The RTE page is used to input details such as destination airport and route to be flown. Option a, is therefore the most accurate in this question.\n\n[Keith Williams · INS/IRS/FMS/EFIS 88]"}, {"type": "mcq", "t": "In the Boeing 737-400 aircraft the FMC aircraft position determined by radio navigation is derived from?", "o": ["DMEIDME", "VORJDME", "DME /ADF", "VORNOR"], "a": 0, "x": "FMC positions can be updated using information form various radio navigation aids. The most accurate of those used in the Boeing 737-400 is DMEIDME (option a)\n\n[Keith Williams · INS/IRS/FMS/EFIS 89]"}, {"type": "mcq", "t": "When aligning the B737-400 FMS, the system?", "o": ["Rejects initial latitude or longitude error", "Cannot detect input errors, and accepts whatever is put in", "Rejects initial latitude error, but it will accept longitude error", "Rejects initial longitude error, but it will accept latitude error"], "a": 0, "x": "The Boeing 737-400 FMS is coupled to an Inertial reference System (IRS). This includes a back up battery and memory, which is able to remember the position of the aircraft a t the time of shut down a t the end of a flight. When the system is switched on in preparation for the next flight the pilot is required to input the geographical coordinate's of its position. The IRS then compares these with the coordinates stored in IRS memory and warns the pilot if they are not the same. In this way the system is able to reject initial latitude and longitude errors (option a): This is an improvement on the older INS systems,-which were only able to detect latitude errors.\n\n[Keith Williams · INS/IRS/FMS/EFIS 90]"}, {"type": "mcq", "t": "What is the period of validity of an FMS database?", "o": ["56 days", "One week", "28 days", "Variable"], "a": 2, "x": "The FMS database contains two sets of data each of which is valid for 28 days (option c). Prior to each flight the pilot is able to select which set of data will be used. Maintenance personnel update the database regularly to ensure that it remains valid for all flights. From the viewpoint of the pilot, the FMS database is read only and can never be updated.\n\n[Keith Williams · INS/IRS/FMS/EFIS 91]"}, {"type": "mcq", "t": "In what formats can created waypoints be entered into the scratch pad of the B737-400 FMS?", "o": ["Place BearingIDistance, Place DistanceIPlace Distance, Along-Track Displacement, Latitude and Longitude", "Place BearingIDistance, Place BearingIPlace Bearing, Across-Track Displacement, Latitude and Longitude", "Place, Place BearingIDistance, Along-Track Displacement, Latitude and Longitude", "Place BearingIDistance, Place BearingIPlace Bearing, Along-Track Displacement, Latitude and Longitude"], "a": 3, "x": "Each manufacturer of electronic equipment provides the range of facilities considered to be most appropriate at the time that the equipment is being designed. The methods available for the input of created waypoints in, depends upon the type of system being used. In the case of the B737-400 EFIS, these are methods are identifier berrring/dfstance; place bearing/place bearing; alohg-track displacemeat; latitude and longitude, (option d). INS IR§ FMS El??§94 d. The trend vector is represented on EFIS by a triangle with a series of dashed lines running from it in the direction of the trend (option d).\n\n[Keith Williams · INS/IRS/FMS/EFIS 93]"}, {"type": "mcq", "t": "What information is required by the FMS to enable it to calculate groundspeed ?", "o": ["Input from IRS", "Input from ADC of TAS and wind velocity", "Input from DME with change of range integrated with respect to time", "Input of heading from either the IRS or gyro compass, TAS from ADC and wind velocity from selected meteorological data"], "a": 0, "x": "The term \"integration7' refers to a mathematical process whereby the outputs of the accelerometers in a n IRS a r e converted into velocities and distances. An accelerometer produces a n output signal that is proportional to acceleration in the direction of its alignment. The first integration of this signal produces another signal that is proportional to velocity relative to the ground. So to carry out ground speed calculations the FMS uses inputs from the IRS (option a).\n\n[Keith Williams · INS/IRS/FMS/EFIS 95]"}, {"type": "mcq", "t": "Which FMCICDU page normally appears on initial power application to the B737-400 Electronic Flight Instrument System?", "o": ["IDENT", "POS INIT", "PERF INIT", "RTE"], "a": 0, "x": "W h e i ~first powered u p the Boeing 737-400 EFIS CDU displays the IDENT page (option a).\n\n[Keith Williams · INS/IRS/FMS/EFIS 96]"}, {"type": "mcq", "t": "A pilot accidentally turning OFF the INS in flight, and then turns it back ON a few moments later. Following this incident?", "o": ["I t cannot be used for the remainder of the flight", "It can only be used for attitude reference", "I t must be switched off or its gyros will topple", "I t can be used as normal"], "a": 1, "x": "The principal of operation of a n IRS is that the platform is mathematically aligned to a known position and orientation prior to flight, then continuously recalculates its position and orientation by sensing all accelerations experienced by the aircraft during the subsequent flight. These accelerations are integrated once to give velocities and again to give distance moved. The ability of a n IRS to provide accurate navigation information a t any point during a flight is therefore dependent upon its having sensed all accelerations throughout all of the previous stages of the flight. Whenever a n IRS is switched off its memory retains details of the situation a t the time of shutdown, but it is unable to detect accelerations that occur throughout the period during which it is left shut down. The system will therefore lose its position as the flight progresses. If the IRS is then switched on again, all subsequent navigation calculations will be based upon the position a t the instant a t which the shutdown occurred. Such calculations will therefore be inaccurate. So if an IRS is temporarily switched off in flight it can only be w e d in tlie attitude mode (option b).\n\n[Keith Williams · INS/IRS/FMS/EFIS 98]"}, {"type": "mcq", "t": "If an INS temporarily loses its power supply in flight?", "o": ["I t will functions normally", "I t will be usable only in the NASV mode", "I t must be switched off for the remainder of the flight", "I t can only be used for attitude reference"], "a": 3, "x": "The principal of operation of an IRS is that the platform is mathematically aligned to a known position and orientation prior to flight, then continuously recalculates its position and orientation by sensing all accelerations experienced by the aircraft during the subsequent flight. These accelerations are integrated once to give velocities and again to give distance moved. The ability of an IRS to provide accurate navigation information at any point during a flight is therefore clependeiit upon its having sensed all accelerations throughout all of the previous stages of the flight. Whenever an IRS is switched off its memory retains details of tlie situation a t the time of shutdown, but it is unab'le to detect accelerations that occur throughout the period during which it is left shut down. The system will thereforelose its position as the flight progresses. If the IRS is then switched on again, all subsequent navigation calculations will be based upon the position a t the instant a t which the shutdown occurred. Such calculations will therefore be inaccurate. So if an IRS loses its power supply in flight it can then be used only in tlie attitude mode for the remainder of the flight (option d).\n\n[Keith Williams · INS/IRS/FMS/EFIS 99]"}, {"type": "mcq", "t": "The sensors of an INS measure?", "o": ["Position", "Acceleration", "Velocity", "TAS"], "a": 1, "x": "The term \"integration\" refers to a mathematical process whereby the outputs of tlie accelerometers in an IRS a r e converted into velocities and distances. The sensors in an INS measure acceleration in the direction of its alignment (option b). The Brst integration of the accelerometer output signal produces another signal that is proportional to velocity relative to the ground. The second integration produces a signal that is proportional to distance moved over the ground.\n\n[Keith Williams · INS/IRS/FMS/EFIS 100]"}, {"type": "mcq", "t": "Waypoints can be entered in a n INS memory in different formats. In which of the following formats can waypoints be entered into all INS systems?", "o": ["Grid references", "Airport names", "Geographic coordinates", "Index numbers"], "a": 2, "x": "Although INS systems designed by different manufacturers will inevitably differ in some respects, certain aspects are common to all systems. For example, positions are entered into all INS systems in the form of geographical coordinates (option c).\n\n[Keith Williams · INS/IRS/FMS/EFIS 101]"}, {"type": "mcq", "t": "How often can a pilot update the data in the FMS database?", "o": ["Every 28 days", "When it is deemed to be necessary", "When there is a fault", "Never, because the FMS database is read-only"], "a": 3, "x": "Tlie FMS database contains two sets of data each of which is valid for 28 days. Prior to each flight the pilot is able to select which set of data will be used. Maintenance personnel update the database regularly to ensure that it remains valid for all flights. From the viewpoint of the pilot, the FMS database is read only and can never be updated (option d).\n\n[Keith Williams · INS/IRS/FMS/EFIS 103]"}, {"type": "mcq", "t": "From what information is the FMC position calculated?", "o": ["Computer generated from the IRS and radio navigation positions", "The average of the IRS positions", "Computer generated from the radio navigation positions", "Half way between the IRS and radio navigation positions"], "a": 0, "x": "Tlie position calculated by the IRS is most accurate immediately after alignment a t the gate. As the flight progresses minor errors in detecting accelerations and integrating the results, cause the accuracy of the IRS position to gradual degrade. In order to compensate for this gradual degradation, the Flight Management Computer (FMC) continuously calculates aircraft position using information provided by the IRS and various radio navigation aids (option a). Because the information from radio aids is not cumulative, its accuracy does not degrade as the flight progresses. So by combining inputs from the IRS and the radio navigation aids, the FMC is able to maintain a more accurate estimate of aircraft position. An IRS system includes a memory in which it holds extensive records concerning the earth, together with the algorithms employed in making navigation computations. These records include details of Magnetic variation a t various points on the Earth. These details of Magnetic variation are applied to the true heading calculated by the respective IRS in order to calculate magnetic headings (option d).\n\n[Keith Williams · INS/IRS/FMS/EFIS 104]"}, {"type": "mcq", "t": "What is the highest priority and lowest priority, message produced by the CDU of the B737-400 EFIS?", "o": ["Caution and Advisory", "Warning and Advisory", "Urgent and Routine", "Warning and Caution"], "a": 1, "x": "Messages provided by the CDU of a Boeing 737-400 EFIS fall into three categories. The highest priority massages are Warnings. These relate to situations or events requiring immediate corrective action on the part of the crew. Tlie second priority messages are Cautions. These refer to situations or events, which do not require immediate corrective action, but which may affect the performance or operation of the aircraft. The lowest category is Advisory messages, which inform the crew of routine changes in the status of t h e aircraft and its systems, which do not r,equire corrective action. Option b, is therefore the most accurate in this question.\n\n[Keith Williams · INS/IRS/FMS/EFIS 106]"}, {"type": "mcq", "t": "What is the function of the MCDUs in the B737-400 Flight Management System when carrying out preflight checks?", "o": ["Manually initialise the IRSs, FMC and Autothrottle with dispatch information", "Automatically initialise the IRSs and FMC with dispatch information", "Manually initialise the Flight Director System and FMC with dispatch information", "Manually initialise the IRSs and FMC with dispatch information"], "a": 3, "x": "In the Boeing 737-400 aircraft the MCDU is used for a number of functions including inserting data into the FMS and IRS. Prior to the start of a flight, the MCDU is used to initialize the IRSs such that the carry out their initial alignment processes. I n addition to this the MCDU is used to insert dispatch information such as destination, waypoints and cost index values, into the FMS. I t should be noted that the MCDU is not used to input data directly into the Flight Director nor Autothrottle because these systems get their information via the FMS. Option d, is therefore the most accurate in this question.\n\n[Keith Williams · INS/IRS/FMS/EFIS 107]"}, {"type": "mcq", "t": "The functions of the Boeing 737-400 FMS include?", "o": ["Automatic navigation & automatic performance management", "Manual navigation & manual performance management", "Manual navigation & automatic performance management", "Automatic navigation & manual performance management"], "a": 0, "x": "Tlie Boeing 737-400 Flight Management System (FMS) takes inputs from a wide range of sources including the IRS, Air Data Computers, MCDU, radio navlgatlon aids, Autopilot, Flight Director, and Autothrottle system. By combinirig the data from these sources it is able to provide a range of services, Tliese include automatic navigation and automatic performance management (option a), As an example of this letter function, the pilot can control the trade- off between fuel costs and flight duration, by inputting various cost index values into the FMS MCDU. LNS IRS FMS EFlS 109 b. Tlie first page used after powering up the system is IDENT, which allows the crew to confirm the detalls of the aircraft. This in turn causes the system to produce a series of prompts to guide the crew through the route procedures that need to be geherated for tlie flight. The second page is PO§ INIT, which enables the crew to confirm that the FMS clock and the aircraft clock are synchronised, This page is then used to align the IRS. The third page is RTE, which appears after the tasks on the POS INIT page have been completed. The RTE page is used to input details such as destination airport and route to be flown. Option b is therefore the most accurate in this question.\n\n[Keith Williams · INS/IRS/FMS/EFIS 108]"}, {"type": "mcq", "t": "From what source is the FMC aircraft position determined by radio navigation in the Boeing 737-400 aircraft derived?", "o": ["VOWDME", "DMEIDME", "DME IADF", "VOWVOR"], "a": 1, "x": "FMC positions can be updated using information form various radio navigation aids. The most accurate of those used in the Boeing 737-400 is DMEIDME (option b)\n\n[Keith Williams · INS/IRS/FMS/EFIS 110]"}, {"type": "mcq", "t": "For how long does the data in the FMS database remain valid?", "o": ["56 days", "One week", "28 days", "Variable"], "a": 2, "x": "Tlie FhllS database contains two sets of data each of which is valid for 28 days (option c). Prior to each flight the pilot is able to select which set of data will be used. Maintenance personnel update the database regularly to ensure that it remains valid for all flights. From the viewpoint of the pilot, the FMS database is read only and can never be updated.\n\n[Keith Williams · INS/IRS/FMS/EFIS 112]"}, {"type": "mcq", "t": "Weather radar Displays are available on the Boeing 737-400 EFIS EHSI, when the system is set to?", "o": ["MAP, PLAN, FULL VOWILS", "MAP, PLAN, EXP VORIILS", "MAP, EXP VORIILS, EXP NAV", "MAP, FULL VOWILS, FULL NAV"], "a": 2, "x": "In designing their systems, each manufacturer determines the range of functions that will be provided and the means by which these functions can be accessed. This inevitably means that different systems will provide different functions, which will be activated by different methods. In the case of the Boeing 737- 400 aircraft, the Weather Radar Display is available on the EFIS EHSI in the MAP, EXP VORIILS, and EXP NAV modes (option c).\n\n[Keith Williams · INS/IRS/FMS/EFIS 113]"}, {"type": "mcq", "t": "How does the FMS calculate groundspeed ?", "o": ["Input from IRS", "Input from ADC of TAS and wind velocity", "Input from DME with change of range integrated with respect to time", "Input of heading from either the IRS or gyro compass, TAS from ADC and wind velocity from selected meteorological data"], "a": 0, "x": "The term \"integration\" refers to a mathematical process whereby the outputs of the accelerometers in an IRS are converted into velocities and distances. An accelerometer produces an output signal that is proportional to acceleration in the direction of its alignment. The first integration of this signal produces another signal that is proportional to velocity relative to the ground. So to carry out ground speed calculations the FMS uses inputs from the IRS (option a).\n\n[Keith Williams · INS/IRS/FMS/EFIS 116]"}, {"type": "mcq", "t": "A Ring Laser Gyro?", "o": ["It is fixed to true north and is quick to erect", "I t doesn't suffer from 'lock in' and is unaffected by the earth's gravitational force", "I t is not necessarily fixed to true north but takes along time to erect", "It is not necessarily fixed to true north and is quick to erect"], "a": 3, "x": "Ring laser gyros, do not employ spinning rotors, but use variations in the length of travel of beams of light within a triailgular housing. Because there is no spinning mass to be accelerated to operating RPM, laser gyros can be erected more quickly than conventional gyros. Laser gyros are employed in Inertial Reference systems (IRS). Unlike an INS, an IRS does not use a gyro stabilised platform, but uses a platform mounted directly onto the aircraft structure. Although the platform pitches and rolls with the aircraft, the IRS computers coiltinuously calculate the true north, and vertical directions. The signals from the various gyros and accelerometers are then modified to take account of the actual alignment relative to true north and vertical. This means that the laser gyros do not need to be aligned with true north. So a ring laser gyro it is not necessarily fixed to true north and is quick to erect (option d).\n\n[Keith Williams · INS/IRS/FMS/EFIS 118]"}, {"type": "mcq", "t": "I11 a laser reference system (IRS), as compared to a gyro reference system (INS):", "o": ["The accelerometers are strapped down but the platform is gyro stabilised", "Accelerometers and platform are both strapped down", "The platform is strapped down but the accelerometers are gyro-stabilised", "Accelerometers and platform are both gyro-stabilised"], "a": 1, "x": "The principal difference between Inertial Navigation Systems (INS) and Inertial Reference systems (IRS) is that INS uses accelerometers mounted on gyro- stabilised platforms, whereas IRS platforms are not stabilised, but are fixed rigidly to the aircraft structure. So in the IRS system the gyros and accelerometers are both strapped down (option b).\n\n[Keith Williams · INS/IRS/FMS/EFIS 119]"}, {"type": "mcq", "t": "What will be the effect if the crew of an aircraft switch off the power to his IRS whilst in flight, before switching it back on a few seconds later?", "o": ["I t cannot be used for navigation, but can be used to provide attitude information", "I t must be re-aligned whilst in flight", "The system will operate normally", "I t cannot be used and must be shut down or the gyros will topple"], "a": 0, "x": "The principal of operation of an IRS is that the platform is mathematically aligned to a known position and orientation prior to flight, then continuously recalculates its position and orientation by sensing all accelerations experienced by the aircraft during the subsequent flight. These accelerations are integrated oilce to give velocities and again to give distance moved. The ability of an IRS to provide accurate navigation information a t any point during a flight is therefore dependent upon its having sensed all accelerations throughout all of the previous stages of the flight. Whenever an IRS is switched off its memory retains details of the situation a t the time of shutdown, but it is unable to detect accelerations that occur throughout the period during which it is left shut down. If the IRS is then switched on again, all subsequent navigation calculations will be based upon the position a t the instant at which the shutdown occurred. Such calculations will therefore be inaccurate. A further problem is that the platform will move out of alignment as the aircraft pitches rolls and yaws during the period of shutdown. Under normal circumstances after shut down on the ground, the platform would re-align itself prior the start of the next flight. But during the period of this alignment process the aircraft must not be moved. So if an IRS is switched off in the air it ...\n\n[Keith Williams · INS/IRS/FMS/EFIS 121]"}, {"type": "mcq", "t": "If an INSIIRS, an azimuth gyro is found to be drifting in flight, and if t is the time since selecting the system from ALIGN to NAV, the azimuth gyro heading error will be?", "o": ["Proportional to the square root oft", "Proportional to tl2", "Sinusoidal", "Proportional to t"], "a": 3, "x": "The drifting of an azimuth gyro may be caused by a number of factors. The first of these is Earth Rate wander. This is caused by the rotation of the Earth. The drift caused by Earth Rate (in degrees per hour) is equal to 15 times the sine of the latitude. The second possible cause is Transport Wander. This is caused by the movement of the aircraft across the surface of the earth. This (in degrees per hour) is equal to the 1/60 of the ground speed multiplied by the tangent of the latitude. The third possible cause is due to mechanical imperfections in the gyros. All three of these causes of drift are directly proportional to the elapsed time since the system was switched from ALIGN to NAV (option d).\n\n[Keith Williams · INS/IRS/FMS/EFIS 134]"}, {"type": "mcq", "t": "On the IRS, selection of ATT mode gives attitude?", "o": ["Altitude, and heading", "Only", "Heading, and groundspeed", "And heading"], "a": 3, "x": "The ATT selection is normally used following a computer/processing failure. With ATT selected all of the navigation computations are disabled but the system is still able to provide pitch, roll and heading information. Option d is therefore the most accurate in this question.\n\n[Keith Williams · INS/IRS/FMS/EFIS 135]"}, {"type": "mcq", "t": "How much time is required to align an Inertial Reference System?", "o": ["1 minute", "5 minutes", "10 minutes", "15 minutes"], "a": 2, "x": "Because they do not use mechanical gyros with spinning masses and do not physically level the platform, an IRS is able to complete the alignment process much more quickly than an INS. A modern IRS can complete alignment within 10 minutes (option c).\n\n[Keith Williams · INS/IRS/FMS/EFIS 136]"}, {"type": "mcq", "t": "What principle is utilized by employing a piezo-electric motor to overcome laser lock in an IRS system?", "o": ["Shake", "Shudder", "Dither", "Vibrate"], "a": 2, "x": "The ring laser gyro senses rates of rotation by measuring the difference between the resonant frequencies of two laser beams. The two beams travel in opposite directions around the triangle and are captured by a collecting mirror and detector unit. The detector unit then compares the resonant frequencies of the two beams to measure the difference between the two. These resonant frequencies are proportional to the length of the resonant structure through which they have passed. If the gyro is stationary the path taken by the two beams and hence the resonant frequencies are identical. If however the aircraft yaws, the gyro will rotate with it. This means that the path of the beam travelling in the same direction as the gyro becomes slightly longer, whilst that of the lother beam becomes slightly shorter. This difference in path length will cause a difference in resonant frequency that is proportional to the rate and direction of rotation. But when the gyro is rotating scatter from the mirrored surfaces sometimes causes the beams to lock together making the detection of small yaw rates impossible. To prevent this laser lock, a piezo- electric dither motor vibrates the gyro a t a resonant frequency, thereby causing the beams to unlock (option c). A simple ring laser gyro is illustrated below. 7 DITHER MOTOR VIBRATES GYRO TO PREVENT LASER LOCK 5 PRISM REFLECTS LASER LIGHT ONTO 6 ...\n\n[Keith Williams · INS/IRS/FMS/EFIS 137]"}, {"type": "mcq", "t": "In order to keep the platform of an inertial navigation system (INS) at right angles to the local vertical in flight, corrections must be applied to compensate for?", "o": ["Aircraft manoeuvres, earth rotation, transport wander and coriolis", "Vertical velocities, earth precession, centrifugal forces and transport drift", "Movement in the yawing plane, secondary precession and pendulous oscillation", "Gyroscopic inertia, earth rotation and real drift"], "a": 0, "x": "In order to ensure that the accelerometers in an INS sense only accelerations in their required directions, it is essential that the platform remains level throughout all phases of flight. I n order to achieve this, it is necessary to apply corrects to counter the effects of a number of factors. The first of these is the pitching, rolling and yawing of the aircraft as it manoeuvres in flight. The second and third factors are Earth Rate Wander, caused by the rotation of the Earth and Transport Wanders caused by the movement of the aircraft above the surface of the earth. The fourth factor is coriolis effect, which is caused by the fact that the aircraft takes a curved path around the world. O$tion a, is therefore the most accurate in this question. ! The term \"integration\" refers to a mathematical process whereby the outputs of the accelerometers in an IRS or INS are converted into velocitiks and distances. An accelerometer produces an output signal that is proportional to acceleration in the direction of its alignment. The first integration of this s i p a l produces another signal that is proportional to velocity. The second inteeration gives a signal that is proportional to distance moved. So the ground sqeed is calculated by integrating measured accelerations (option c).\n\n[Keith Williams · INS/IRS/FMS/EFIS 139]"}, {"type": "mcq", "t": "After an IRS has lost its position mid-flight it must?", "o": ["Not be used in NAV mode", "Be turned OFF", "Have a new position inserted", "Be selected to ALIGN and then to NAV"], "a": 0, "x": "The principal of operation of an IRS is that the platform is mathematically aligned to a known position and orientation prior to flight, then continuously recalculates its position and orientation by sensing all accelerations experienced by the aircraft during the subsequent flight. These accelerations are integrated once to give velocities and again to give distance moved. The ability of an IRS to provide accurate navigation information at any point during a flight is therefore dependent upon its having sensed all accelerations throughout all of the previous stages of the flight. Whenever an IRS is switched off its memory retains details of the situation at the time of shutdown, but it is unable to detect accelerations that occur throughout the period during which it is left shut down. The system will therefore lose its position as the flight progresses. If the IRS is then switched on. again, all subsequent navigation calculations will be based upon the position at the instant at which the shutdown occurred. Such calculations will therefore be inaccurate. So if an IRS loses its position in flight it cannot be used in the NAV mode for the remainder of the flight (option a).\n\n[Keith Williams · INS/IRS/FMS/EFIS 142]"}, {"type": "mcq", "t": "What is the latest time a t which the INSIIRS may be selected to NAV mode?", "o": ["After passengers and freight are aboard", "Immediately prior to push back or taxi from the gate", "On operation of the TOGA switch when opening the throttles for the take-off", "At the holding point"], "a": 1, "x": "Prior to the commencement of each flight the INSIIRS systems must be aligned. This must be carried out with the aircraft stationary on the ground a t the gate (or ramp). During the alignment process the pilot inputs the geographical coordinates of the gate. The system then uses these coordinates as the starting point for all subsequent calculations. The system is then set to NAV, which causes it to continuously calculate accelerations, velocities and distances moved from the ramp. I n order for these calculations to be accurate the system must be set to NAV immediately prior to push back from the gate (option d). Selecting NAV a t any later time will inevitably reduce the accuracy of the system, by an amount equal to the distance from the gate a t the time that NAV is actually selected.\n\n[Keith Williams · INS/IRS/FMS/EFIS 145]"}, {"type": "mcq", "t": "What can be used to enter positions on all INS systems?", "o": ["Waypoint names", "Hexadecimals", "Geographic coordinates", "Ranges and bearings"], "a": 2, "x": "Although INS systems designed by different manufacturers will inevitably differ in some respects, certain aspects are common to all systems. For example, positions are entered into all INS systems in the form of geographical coordinates (option c).\n\n[Keith Williams · INS/IRS/FMS/EFIS 146]"}, {"type": "mcq", "t": "Which of the following lists all of the methods that can be used to enter 'Created Waypoints' into the CDU of a B737-400 Electronic Flight Instrument System?", "o": ["Identifier name and range; location name; Height above MSL; latitude and longitude", "Identifier grid reference, location name, Height above MSL, latitude and Rhumb line position", "Identifier range, location name; Height above MSL; latitude and longitude", "Identifier bearingldistance; place bearinglplace bearing; along-track displacement; latitude and longitude"], "a": 3, "x": "Each manufacturer of electronic equipment provides the range of facilities considered to be most appropriate a t the time that the equipment is being designed. The methods available for the input of created waypoints in, depends upon the type of system being used. In the case of the B737-400 EFIS, these are methods are identifier bearingldistance; place bearinglplace bearing; along-track displacement; latitude and longitude, (option d).\n\n[Keith Williams · INS/IRS/FMS/EFIS 149]"}]}, {"id": "ch13", "icon": "📝", "color": "#8b6914", "sub": "Oxford mid-course test", "title": "Mid Course Test", "questions": [{"type": "mcq", "t": "What is the shortest distance in kilometres between San Francisco (38N 123W) and Dubai (25N 057E)?", "o": ["7020", "8073", "13001", "11250"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q1]"}, {"type": "mcq", "t": "A great circle has a northern vertex of 50N 100W. the southern vertex is:", "o": ["40S 100W", "40S 080E", "50S 100W", "50S 080E"], "a": 3, "x": "[Oxford ATPL · Oxford Ch20 Q2]"}, {"type": "mcq", "t": "An ICAO nautical mile is defined as:", "o": ["6080 feet", "1852 metres", "1863 feet", "6062 feet"], "a": 1, "x": "[Oxford ATPL · Oxford Ch20 Q3]"}, {"type": "mcq", "t": "How much is the polar diameter of the Earth different from the equatorial diameter?", "o": ["less by 40 km", "greater by 27 statute miles", "less by 27 statute miles", "greater by 27 nautical miles"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q4]"}, {"type": "mcq", "t": "The maximum difference between geodetic and geocentric latitude occurs at about?", "o": ["45° North and South", "90° North and South", "60° North and South", "0° (Equator)"], "a": 0, "x": "[Oxford ATPL · Oxford Ch20 Q5]"}, {"type": "mcq", "t": "Required course 045°(T), W/V = 190°(T)/30, FL=55@ISA, Variation = 15°E. CAS = 120 knots. What is magnetic heading and G/S?", "o": ["052°(M) 154", "067°(M) 154", "037°(M) 154", "037°(M) 113"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q6]"}, {"type": "mcq", "t": "What is the shortest distance in kilometres between Cairo (30°17’N 030°10’E) and Durban(29°48’S 030°10’E)?", "o": ["3605", "4146", "4209", "6676"], "a": 3, "x": "[Oxford ATPL · Oxford Ch20 Q7]"}, {"type": "mcq", "t": "An aircraft at latitude 02°20’N tracks 180°(T) for 685 km. What is its latitude at the end of the flight?", "o": ["03°50’S", "02°50’S", "02°10’S", "08°55’S"], "a": 0, "x": "[Oxford ATPL · Oxford Ch20 Q8]"}, {"type": "mcq", "t": "An aircraft is at latitude 10N and is flying south at 444 km/hour. After 3 hours the latitude is:", "o": ["10S", "02N", "02S", "0N/S"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q9]"}, {"type": "mcq", "t": "SAT = +35°C. Pressure alt (corrected for barometric error) = 5000 feet. What is true alt?", "o": ["4550 feet", "5550 feet", "4920 feet", "5320 feet"], "a": 1, "x": "[Oxford ATPL · Oxford Ch20 Q11]"}, {"type": "mcq", "t": "Given that the value of ellipticity of the Earth is 1/297 and that the semi-major axis of the Earth, measured at the axis of the Equator is 6378.4 km, what is the semi- major axis of the Earth measured at the axis of the Poles?", "o": ["6399.9 km", "6356.9 km", "6378.4 km", "6367.0 km"], "a": 1, "x": "[Oxford ATPL · Oxford Ch20 Q12]"}, {"type": "mcq", "t": "You plan to fly a track (course) of 348°(T), Drift is 17°port, Variation is 32°W. Deviation is 4°E. What compass heading should you fly?", "o": ["041°", "033°", "016°", "359°"], "a": 1, "x": "[Oxford ATPL · Oxford Ch20 Q13]"}, {"type": "mcq", "t": "One purpose of a compass calibration is to reduce the difference, if any, between:", "o": ["Compass North and True North", "Compass North and Magnetic North", "True North and Magnetic North", "Compass North and the lubber line"], "a": 1, "x": "[Oxford ATPL · Oxford Ch20 Q17]"}, {"type": "mcq", "t": "Given: True Track = 352°(T) Variation = 11°W Deviation = - 5° Drift = 10°R What is heading °(C)?", "o": ["078°(C)", "346°(C)", "358°(C)", "025°(C)"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q18]"}, {"type": "mcq", "t": "Pressure altitude is 27 000 feet, OAT = -35°C, Mach No. = 0.45, W/V = 270/85, Track = 200°(T). What is drift and ground speed?", "o": ["18L / 252 knots", "15R / 310 knots", "17L / 228 knots", "17R / 287 knots"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q19]"}, {"type": "mcq", "t": "You plan to take off from Khamis Mushayt, Saudi Arabia, elevation 6500 ft. The ambient temperature is +25°C. What is your density altitude?", "o": ["3500 ft", "6500 ft", "9500 ft", "12 500 ft"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q20]"}, {"type": "mcq", "t": "You are flying at 400 kt TAS, Indicated temperature -50°C. What is your COAT?", "o": ["-67°C", "-50°C", "-33°C", "-17°C"], "a": 0, "x": "[Oxford ATPL · Oxford Ch20 Q21]"}, {"type": "mcq", "t": "You are flying at FL330 at Mach No. 0.9. Ambient temperature is ISA +15. What is your TAS?", "o": ["600 knots", "595 knots", "540 knots", "505 knots"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q22]"}, {"type": "mcq", "t": "You plan to land on R/W 14. The met forecast wind velocity is 110/30. Variation is 30°W. What crosswind do you expect?", "o": ["15 kt", "0 kt", "26 kt", "30 kt"], "a": 1, "x": "[Oxford ATPL · Oxford Ch20 Q23]"}, {"type": "mcq", "t": "Given: IAS 120 knots, FL80, OAT +20°C. What is the TAS?", "o": ["132 kt", "141 kt", "102 kt", "120 kt"], "a": 1, "x": "[Oxford ATPL · Oxford Ch20 Q24]"}, {"type": "mcq", "t": "Given: TAS 200 kt, Track 110°(T), W/V 015/40, calculate heading (°T) and ground speed.", "o": ["097° - 201 kt", "099° - 200 kt", "121° - 207 kt", "121° - 199 kt"], "a": 1, "x": "[Oxford ATPL · Oxford Ch20 Q25]"}, {"type": "mcq", "t": "Given: True Hdg 145°, TAS 240 kt, True Track 150°, G/S 210 kt, calculate the W/V.", "o": ["360/35", "295/35", "180/35", "115/35"], "a": 3, "x": "[Oxford ATPL · Oxford Ch20 Q26]"}, {"type": "mcq", "t": "Given: TAS 140 kt, heading 005°(T), W/V 265/25, calculate the drift and ground speed.", "o": ["11R - 140 kt", "10R - 146 kt", "9R - 140 kt", "11R - 142 kt"], "a": 1, "x": "[Oxford ATPL · Oxford Ch20 Q27]"}, {"type": "mcq", "t": "An aircraft is maintaining a 5.2% gradient on a flat terrain. Its height at 7 NM from the runway is approximately:", "o": ["3640 feet", "1890 feet", "2210 feet", "680 feet"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q28]"}, {"type": "mcq", "t": "G/S = 240 knots, distance to go = 500 NM. What is time to go?", "o": ["20 minutes", "29 minutes", "2h 05 m", "2h 12 m"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q29]"}, {"type": "mcq", "t": "Course 040°(T), TAS 120 kt, wind speed = 30 knots. From which direction will the wind give the greatest drift?", "o": ["215°(T)", "230°(T)", "235°(T)", "240°(T)"], "a": 3, "x": "[Oxford ATPL · Oxford Ch20 Q30]"}, {"type": "mcq", "t": "X Y Z 30 NM 20 NM ATA X is 1420. ETA Y is 1447. ATA Y is 1450. What is new ETA Z?", "o": ["1506", "1512", "1510", "1515"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q31]"}, {"type": "mcq", "t": "Heading is 156°(T), TAS is 320 knots, W/V 130/45. What is your true track?", "o": ["160", "152", "104", "222"], "a": 0, "x": "[Oxford ATPL · Oxford Ch20 Q32]"}, {"type": "mcq", "t": "You are flying at a True Mach No. of .72 in a SAT of -45°C. At 1000 hours you are 100 NM from the CPT DME and your ETA at CPT is 1012. ATC ask you to slow down to be at CPT at 1016. What should your new Mach No be if you reduce speed at 100 NM to go?", "o": [".67", ".63", ".54", ".51"], "a": 3, "x": "[Oxford ATPL · Oxford Ch20 Q33]"}, {"type": "mcq", "t": "Track = 090°(T), TAS = 460 knots, W/V = 360°(T) / 100, Variation = 10°E, Deviation = -2. What is compass heading and ground speed?", "o": ["079° - 470 kt", "069° - 450 kt", "068° - 460 kt", "070° - 455 kt"], "a": 1, "x": "[Oxford ATPL · Oxford Ch20 Q34]"}, {"type": "mcq", "t": "You leave A to fly to B, 475 NM away, at 1000 hours. Your ETA at B is 1130. At 1040, you are 190 NM from A. What ground speed is required to arrive on time at B?", "o": ["317 knots", "330 knots", "342 knots", "360 knots"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q35]"}, {"type": "mcq", "t": "The wind velocity is 359/25. An aircraft is heading 180°(T)at a TAS of 198 knots. (All directions are True). What is its track and ground speed?", "o": ["180° - 223 kt", "179° - 220 kt", "180° - 220 kt", "179° - 223 kt"], "a": 0, "x": "[Oxford ATPL · Oxford Ch20 Q36]"}, {"type": "mcq", "t": "An aircraft is climbing at a constant CAS in ISA conditions. What will be the effect on TAS and Mach No.?", "o": ["TAS increases and Mach No. decreases", "Both increase", "Both decrease", "TAS decreases and Mach No. increases"], "a": 1, "x": "[Oxford ATPL · Oxford Ch20 Q37]"}, {"type": "mcq", "t": "Convert 70 metres/sec into knots.", "o": ["136 knots", "36 knots", "146 knots", "54 knots"], "a": 0, "x": "[Oxford ATPL · Oxford Ch20 Q38]"}, {"type": "mcq", "t": "Airfield elevation is 1000 feet. The QNH is 988. Use 27 feet per hectopascal. What is pressure altitude?", "o": ["675 feet", "325 feet", "1675 feet", "825 feet"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q39]"}, {"type": "mcq", "t": "You are flying from A to B, planned track 245°(M), distance 225 NM. Your ground speed is 180 knots. After 15 minutes flying, you fix your position as 3 NM left of planned track. Which of the following statements is correct?", "o": ["Your drift is 2P", "Your drift is 4P", "You should turn 5 right to go direct to B", "You should turn 8 right to go direct to B"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q40]"}, {"type": "mcq", "t": "A pilot receives the following signals from a VOR DME station. Radial = 180° +/- 1°, distance = 200 NM What is the approximate maximum error?", "o": ["+/- 2 NM", "+/- 3.5 NM", "+/- 7 NM", "+/- 1 NM"], "a": 1, "x": "[Oxford ATPL · Oxford Ch20 Q41]"}, {"type": "mcq", "t": "An aircraft has planned to fly from A to B a total distance of 135 NM. After flying 45 NM the aircraft is 3 NM left of the planned track. Using the 1 in 60 Rule, what would be the alteration of heading to flying directly to B?", "o": ["6˚ right", "4˚ right", "8˚ right", "4˚ left"], "a": 0, "x": "[Oxford ATPL · Oxford Ch20 Q42]"}, {"type": "mcq", "t": "By what amount must you change your rate of descent given a 10 knot increase in headwind on a 3° glide slope?", "o": ["50 feet per minute increase", "30 feet per minute increase", "50 feet per minute decrease", "30 feet per minute decrease"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q43]"}, {"type": "mcq", "t": "You are on an ILS 3-degree glide slope which passes over the runway threshold at 50 feet. Your DME range is 25 NM from the threshold. What is your height above the runway threshold elevation? (Use the 1 in 60 rule and 6000 feet = 1 nautical mile).", "o": ["8010 feet", "7450 feet", "6450 feet", "7550 feet"], "a": 3, "x": "[Oxford ATPL · Oxford Ch20 Q44]"}, {"type": "mcq", "t": "An aircraft flies directly from 56N 020W to 56N 030W. The initial Great Circle track from 020W is:", "o": ["086°(T)", "082°(T)", "274°(T)", "278°(T)"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q45]"}, {"type": "mcq", "t": "An aircraft starts at position 0410S 17822W and tracks true north for 2950 NM, then turns 90 degrees left, and maintains a rhumb line track for 314 kilometres. What is the final position?", "o": ["5500N 17422W", "4500N 17422W", "5500N 17738E", "4500N 17738E"], "a": 3, "x": "[Oxford ATPL · Oxford Ch20 Q46]"}, {"type": "mcq", "t": "On a chart, 49 nautical miles is represented by 7.0 centimetres. What is the scale?", "o": ["1 / 700 000", "1 / 2 015 396", "1 / 1 296 400", "1 / 1 156 600"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q47]"}, {"type": "mcq", "t": "Which of the following differences in latitude will give the biggest difference in the initial great circle track and the mean great circle track between 2 points separated by 10° change of longitude?", "o": ["60N and 60S", "60N and 55N", "30S and 30N", "30S and 25S"], "a": 1, "x": "[Oxford ATPL · Oxford Ch20 Q49]"}, {"type": "mcq", "t": "On a chart, meridians at 43N are shown every 10 degrees apart. This is shown on the chart by a distance of 14 cm. What is the approximate scale?", "o": ["1 / 2 00 000", "1 / 4 000 000", "1 / 5 000 000", "1 / 6 000 000"], "a": 3, "x": "[Oxford ATPL · Oxford Ch20 Q50]"}, {"type": "mcq", "t": "A non-perspective chart:", "o": ["is produced directly from a light projection of a Reduced Earth", "cannot be used for navigation", "is produced by mathematically adjusting a light projection of the Reduced Earth", "is used for a polar stereographic projection"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q51]"}, {"type": "mcq", "t": "On a Mercator chart, a rhumb line appears as a:", "o": ["small circle concave to the nearer pole", "curve convex to the nearer pole", "complex curve", "straight line"], "a": 3, "x": "[Oxford ATPL · Oxford Ch20 Q52]"}, {"type": "mcq", "t": "Mercator charts use ................... projections.", "o": ["cylindrical", "conical", "plane/azimuthal", "complex"], "a": 0, "x": "[Oxford ATPL · Oxford Ch20 Q53]"}, {"type": "mcq", "t": "How does scale change on a normal Mercator chart?", "o": ["expands as the secant2 (½ co-latitude)", "expands directly with the secant of the latitude", "correct on the standard parallels, expands outside them, contracts within them", "expands as the secant of the E/W great circle distance"], "a": 1, "x": "[Oxford ATPL · Oxford Ch20 Q54]"}]}, {"id": "ch14", "icon": "🎯", "color": "#2d6a30", "sub": "Oxford full revision set", "title": "Revision Questions", "questions": [{"type": "mcq", "t": "Pressure Altitude is 28 000 feet, OAT = -45°C, Mach No = 0.46, W/V = 270/85, Track = 200°T. What is the drift and groundspeed?", "o": ["18L / 252 knots", "15R / 310 knots", "17L / 228 knots", "17R / 287 knots"], "a": 2, "x": "A common mistake here is to set the W/V, then put 200 up at the 12 o’clock\n\n[Oxford ATPL · Oxford Ch32 Q1]"}, {"type": "mcq", "t": "G/S = 240 knots, Distance go = 530 NM. What is time to go?", "o": ["27 minutes", "29 minutes", "2 h 05 m", "2 h 12 m"], "a": 3, "x": "[Oxford ATPL · Oxford Ch32 Q2]"}, {"type": "mcq", "t": "‘ISA Dev = +30°C, Pressure alt = 5000 feet. What is true alt?", "o": ["4550 feet", "5600 feet", "4290 feet", "5320 feet"], "a": 1, "x": "We recommend that you use the CRP-5 for true altitude problems, especially if\n\n[Oxford ATPL · Oxford Ch32 Q3]"}, {"type": "mcq", "t": "Required course 045°(T), W/V = 190 /30, FL = 55 @ ISA, Variation = 15°W. CAS = 120 knots. What is mag heading and G/S?", "o": ["052°(M) 154", "067°(M) 154", "037°(M) 154", "037°(M) 113"], "a": 1, "x": "[Oxford ATPL · Oxford Ch32 Q5]"}, {"type": "mcq", "t": "An aircraft flies a great circle track from 56°N 070°W to 62°N 110°E. The total distance travelled is:", "o": ["3720 NM", "5420 NM", "1788 NM", "2040 NM"], "a": 0, "x": "You should note that these longitudes are meridian and anti-meridian. This is\n\n[Oxford ATPL · Oxford Ch32 Q6]"}, {"type": "mcq", "t": "An aircraft at position 60°N 005°W tracks 090°(T) for 315 km. On completion of the flight the longitude will be:", "o": ["010°40’W", "000°15’E", "000°40’E", "002°10’W"], "a": 2, "x": "This is a departure question. A very similar example is given in Chapter 15\n\n[Oxford ATPL · Oxford Ch32 Q10]"}, {"type": "mcq", "t": "What is the definition of magnetic variation?", "o": ["The angle between the direction indicated by a compass and Magnetic North", "The angle between True North and Compass North", "The angle between Magnetic North and True North", "The angle between Magnetic Heading and Magnetic North"], "a": 2, "x": "[Oxford ATPL · Oxford Ch32 Q11]"}, {"type": "mcq", "t": "Grivation is the combination of", "o": ["Variation and Deviation", "Deviation and the Agonic value", "Variation and Grid Convergence", "Grid Convergence and Deviation"], "a": 2, "x": "[Oxford ATPL · Oxford Ch32 Q16]"}, {"type": "mcq", "t": "A useful method of a pilot resolving, on a visual flight, any uncertainty in the aircraft’s position is to maintain visual contact with the ground and:", "o": ["set heading towards a line feature such as a coastline, river or motorway", "fly the reverse of the heading being flown prior to becoming uncertain until a pinpoint is obtained", "fly expanding circles until a pinpoint is obtained", "fly reverse headings and associated timings until the point of departure is reached"], "a": 0, "x": "[Oxford ATPL · Oxford Ch32 Q21]"}, {"type": "mcq", "t": "An aircraft is at FL140 with an IAS of 210 and a true OAT of -5°(C). The wind component is -35 knots. When the aircraft is at 150 NM from a reporting point, ATC request the crew to lose 5 minutes by the time they get to the beacon. How much do they need to reduce IAS?", "o": ["15 knots", "25 knots", "30 knots", "20 knots"], "a": 3, "x": "Find the present TAS, apply the wind and get the present G/S (230 knots)\n\n[Oxford ATPL · Oxford Ch32 Q22]"}, {"type": "mcq", "t": "Given: Airport elevation is 1000 feet. QNH is 988 hPa What is the approximate airport pressure altitude?", "o": ["320", "1680", "-320", "680"], "a": 1, "x": "The QNH is 988 hPa. The datum for Pressure Altitude is 1013 hPa, which is 25\n\n[Oxford ATPL · Oxford Ch32 Q24]"}, {"type": "mcq", "t": "An aircraft starts at position 0410S 17822W and heads true north for 2950 NM, then turns 90 degrees right, and maintains a rhumb line track for 314 kilometres. What is its final position?", "o": ["5500N 17422W", "4500N 17422W", "5500N 17738E", "4500N 17738E"], "a": 1, "x": "The aircraft flies 2950 NM N, which takes it to 4500N 17822W. Now convert\n\n[Oxford ATPL · Oxford Ch32 Q25]"}, {"type": "mcq", "t": "You are heading 080°(T) when you get a range and bearing fix from your AWR on a headland at 185 NM 30° left of the nose. What true bearing do you plot on the chart?", "o": ["050 from the headland, using the headland’s /* ================= storage durability =================
   iOS Safari gives a file:// page a throwaway origin, so localStorage is
   discarded when the tab closes. Detect it, say so plainly, and provide a
   backup route that does not depend on the browser keeping anything.        */
let _storageMode='unknown';
function storageProbe(){
  try{
    const k='__probe__'+Date.now();
    localStorage.setItem(k,'1');
    const ok=localStorage.getItem(k)==='1';
    localStorage.removeItem(k);
    if(!ok)return 'blocked';
  }catch(e){return 'blocked';}
  if(location.protocol==='file:')return 'ephemeral';
  return 'ok';
}
function storageBanner(){
  _storageMode=storageProbe();
  if(_storageMode==='ok')
    return '<div class="stok">💾 Progress is saving normally in this browser. '
      +'Still take a backup file now and then.</div>';
  const why = _storageMode==='blocked'
    ? 'This browser is refusing to store anything, which usually means Private Browsing.'
    : 'You opened this file directly from Files or a download, so the browser treats it as a '
      +'temporary page and throws the saved progress away when you close the tab.';
  return '<div class="stwarn"><b>⚠️ Progress will not survive closing this tab.</b>'
    +'<p>'+why+'</p>'
    +'<p><b>To fix it permanently, pick one:</b></p>'
    +'<ol><li>Put the file on a free static host (Netlify Drop, GitHub Pages), open that '
    +'https link in Safari, then Share → <b>Add to Home Screen</b>. Progress then persists like an app.</li>'
    +'<li>Or keep using it as-is and press <b>Save backup file</b> before you close. '
    +'Restore it next time with <b>Load backup file</b>.</li></ol>'
    +'<div class="btnrow"><button onclick="downloadBackup()">💾 Save backup file</button>'
    +'<button onclick="pickBackup()">📂 Load backup file</button></div></div>';
}
/* ---- file-based backup, works even with no storage at all ---- */
function backupPayload(){
  const m=loadMem();
  return JSON.stringify({app:MEM_KEY,v:1,savedAt:new Date().toISOString(),mem:m});
}
function downloadBackup(){
  try{
    const blob=new Blob([backupPayload()],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='atpl-progress-'+MEM_KEY.replace(/^atpl_/,'')+'-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},800);
    uiNotice('Backup saved. Keep it in Files or email it to yourself, then load it next time.');
  }catch(e){ uiNotice('Could not create the file. Use Export instead and paste the text somewhere safe.'); }
}
function pickBackup(){
  let inp=document.getElementById('bk-file');
  if(!inp){
    inp=document.createElement('input');
    inp.type='file'; inp.accept='.json,application/json'; inp.id='bk-file';
    inp.style.display='none';
    inp.addEventListener('change',()=>{
      const f=inp.files&&inp.files[0]; if(!f)return;
      const r=new FileReader();
      r.onload=()=>{ applyBackup(String(r.result)); inp.value=''; };
      r.onerror=()=>uiNotice('Could not read that file.');
      r.readAsText(f);
    });
    document.body.appendChild(inp);
  }
  inp.click();
}
function applyBackup(text){
  let d=null;
  try{ d=JSON.parse(text); }catch(e){ uiNotice('That file is not a valid backup.'); return; }
  if(d&&d.app&&d.app!==MEM_KEY){
    uiNotice('That backup is from a different question bank, so its progress would not match '
      +'any question here. Load the file saved from this app instead.');
    return;
  }
  const incoming = d && d.mem ? d.mem : d;
  const looksLikeRecord=v=>v&&typeof v==='object'&&('a' in v||'c' in v||'f' in v||'del' in v);
  const bareMap = incoming && typeof incoming==='object' && !incoming.qs
    && Object.keys(incoming).length>0
    && Object.values(incoming).every(looksLikeRecord);
  if(!incoming || typeof incoming!=='object' || (!incoming.qs && !bareMap)){
    uiNotice('That file does not contain any progress.'); return;
  }
  const src = incoming.qs ? incoming : {qs:incoming,sessions:[],streak:{last:'',count:0}};
  const cur = loadMem();
  Object.keys(src.qs||{}).forEach(k=>{
    const a=cur.qs[k], b=src.qs[k];
    if(!a){ cur.qs[k]={...b}; return; }
    a.a=Math.max(a.a||0,b.a||0); a.c=Math.max(a.c||0,b.c||0);
    a.f=a.f||b.f; a.del=a.del||b.del; a.last=Math.max(a.last||0,b.last||0);
  });
  const seen=new Set(cur.sessions.map(s=>s.ts));
  (src.sessions||[]).forEach(s=>{ if(!seen.has(s.ts)) cur.sessions.push(s); });
  cur.sessions.sort((x,y)=>y.ts-x.ts);
  if(cur.sessions.length>25)cur.sessions=cur.sessions.slice(0,25);
  if((src.streak&&src.streak.count||0)>(cur.streak.count||0))cur.streak=src.streak;
  saveMem(cur);
  buildHome(); switchTab('progress');
  uiNotice('✅ Progress restored from the file.');
}
/* remind the user to back up when storage cannot be trusted */
function maybeRemindBackup(){
  if(_storageMode==='ok')return;
  const m=loadMem();
  const answered=Object.keys(m.qs||{}).length;
  if(answered && answered % 40 === 0){
    uiConfirm('You have worked '+answered+' questions and this browser will not keep them. '
      +'Save a backup file now?', downloadBackup, 'Save backup');
  }
}

/* ===== in-app dialogs: iOS Safari suppresses native alert/confirm in
   home-screen web apps and after async work, so both are replaced. ===== */
function uiNotice(msg,kind){
  const old=document.getElementById('ui-dialog');if(old)old.remove();
  const m=document.createElement('div');m.className='io-modal';m.id='ui-dialog';
  m.innerHTML='<div class="io-box"><p class="ui-dialog-msg">'+msg+'</p>'
    +'<div class="io-actions"><button class="io-confirm" '
    +'onclick="document.getElementById(\'ui-dialog\').remove()">OK</button></div></div>';
  m.addEventListener('click',e=>{if(e.target===m)m.remove();});
  document.body.appendChild(m);
}
function uiConfirm(msg,onYes,yesLabel){
  const old=document.getElementById('ui-dialog');if(old)old.remove();
  window.__uiYes=()=>{const d=document.getElementById('ui-dialog');if(d)d.remove();onYes();};
  const m=document.createElement('div');m.className='io-modal';m.id='ui-dialog';
  m.innerHTML='<div class="io-box"><p class="ui-dialog-msg">'+msg+'</p>'
    +'<div class="io-actions">'
    +'<button class="io-cancel" onclick="document.getElementById(\'ui-dialog\').remove()">Cancel</button>'
    +'<button class="io-confirm" onclick="window.__uiYes()">'+(yesLabel||'Continue')+'</button>'
    +'</div></div>';
  m.addEventListener('click',e=>{if(e.target===m)m.remove();});
  document.body.appendChild(m);
}
/* ===== clipboard that actually works on iOS ===== */
function copyExport(btn){
  const ta=document.getElementById('export-ta');if(!ta)return;
  const done=ok=>{
    btn.textContent=ok?'✅ Copied':'⚠️ Select & copy manually';
    btn.classList.toggle('copied',ok);
    setTimeout(()=>{btn.textContent='📋 Copy';btn.classList.remove('copied');},2200);
  };
  const legacy=()=>{
    /* iOS ignores select() on a readonly field, so drop readonly first */
    const ro=ta.hasAttribute('readonly');
    if(ro)ta.removeAttribute('readonly');
    ta.focus();ta.setSelectionRange(0,ta.value.length);
    let ok=false;try{ok=document.execCommand('copy');}catch(e){ok=false;}
    if(ro)ta.setAttribute('readonly','');
    done(ok);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText&&window.isSecureContext){
    navigator.clipboard.writeText(ta.value).then(()=>done(true)).catch(legacy);
  }else legacy();
}

/* ===== per-session answer-option shuffling ===== */
const _LTR='abcdefgh';
function _remapExpl(x,perm){
  if(!x)return x;
  const map={};
  perm.forEach((oldIdx,newIdx)=>{map[_LTR[oldIdx]]=_LTR[newIdx];});
  const sw=l=>{const lo=l.toLowerCase();if(!(lo in map))return l;
    const nl=map[lo];return l===l.toUpperCase()?nl.toUpperCase():nl;};
  /* One pass over "option c" / "answers a. and b." / "(d)" phrases only, so that
     enumerated worked-solution steps ("a. Flight time = ...") are left alone and

function resumeSession(){

    const idMap={};

function renderTableCard(q,idx){
  if(!q.rows||!q.rows.length)return'';
  const tblId='tbl-'+idx;
  const firstRow=q.rows[0];
  const isHeader=firstRow.every(c=>!c.hi&&isNaN(parseFloat(c.t)));
  let thead='',tbody='';
  const dataRows=isHeader?q.rows.slice(1):q.rows;
  if(isHeader){thead='<thead><tr>'+firstRow.map(c=>`<th>${c.t}</th>`).join('')+'</tr></thead>';}
  tbody='<tbody>'+dataRows.map(row=>'<tr>'+row.map(c=>c.hi
    ?`<td class="hi" onclick="revealTblCell(this)" title="Tap to reveal">${c.t}</td>`
    :`<td>${c.t}</td>`
  ).join('')+'</tr>').join('')+'</tbody>';
  const hasHidden=dataRows.some(row=>row.some(c=>c.hi));
  const hint=hasHidden?`<div style="font-size:11px;color:var(--muted);margin-top:6px">🟡 Tap any cell to reveal · or</div><button class="tbl-reveal-btn" id="rbtn-${tblId}" onclick="revealAllTbl('${tblId}')">👁 Reveal All Answers</button>`:'';
  return `<div class="qcard"><div class="qcard-header"><div class="qnum qnum-tbl">${idx+1}</div><div style="flex:1"><span class="qtype-badge qtype-tbl">📋 Fill-in Table</span><div class="tbl-caption">${q.caption}</div></div></div><div style="overflow-x:auto"><table class="ref-table" id="${tblId}">${thead}${tbody}</table></div>${hint}</div>`;
}

function startQuiz(questions,title,opts){
  opts=opts||{};
  currentQ=opts.perms
    ?questions.map((q,i)=>_applyPerm(q,opts.perms[i]))
    :questions.map(_shuffleOpts);
  questions=currentQ;
  userA=new Array(questions.length).fill(null);submitted=false;currentTitle=title;
  document.getElementById('quiz-title').textContent=title;
  document.getElementById('live-score').textContent='';
  renderQuiz();
  const mcqCount=questions.filter(q=>q.type==='mcq').length;
  const footer=document.getElementById('quiz-footer');
  if(mcqCount>0){footer.innerHTML='<button class="btn btn-secondary" onclick="clearAll()">Clear</button><button class="btn btn-primary" onclick="submitQuiz()">Submit</button>';}
  else{footer.innerHTML='<button class="btn btn-primary" onclick="goHome()">← Back to Home</button>';}
  if(opts.mins&&mcqCount>0)startTimer(opts.mins);else stopTimer();
  show('quiz');
}

function renderQuiz(){
  const body=document.getElementById('quiz-body');body.innerHTML='';
  let mcqIdx=0;
  currentQ.forEach((q,i)=>{
    const qId=q._qId||(q._ch?q._ch+'_'+i:'');
    if(q.type==='table'){body.innerHTML+=renderTableCard(q,i);return;}
    if(q.type==='calc'){body.innerHTML+=renderCalcCard(q,i,qId);return;}
    // MCQ
    const chBadge=q._ch?`<span style="font-size:10px;color:var(--muted)">${q._ch}</span><br>`:'';
    let opts='';['A','B','C','D'].forEach((l,j)=>{if(j<q.o.length)opts+=`<div class="opt" id="opt-${i}-${j}" onclick="sel(${i},${j})"><span class="opt-l">${l}</span><span class="opt-t">${q.o[j]}</span></div>`;});
    const mem=loadMem();const qr=mem.qs[q._qId||'']||{};const isFlagged=!!qr.f;
    const flagId=q._qId?`flag-${q._qId}`:`flag-qi-${i}`;
    const flagBtn=`<button class="flag-btn${isFlagged?' flagged':''}" id="${flagId}" onclick="toggleFlag('${q._qId||''}',event)" title="Flag">${isFlagged?'🚩':'⚑'}</button>`+(q._qId?`<button class="del-btn" onclick="delQ('${q._qId}',event)" title="Delete this question">🗑</button>`:'');
    const noAns=q.a<0?'<div style="font-size:11px;color:var(--muted);margin-top:8px;font-style:italic">⚠️ Answer not available in source PDF</div>':'';
    const card=document.createElement('div');card.className='qcard';card.id='card-'+i;
    card.innerHTML=`<div class="qcard-header"><div class="qnum">${i+1}</div><div style="flex:1">${chBadge}<div class="qtext">${q.t}</div></div>${flagBtn}</div><div class="opts">${opts}</div>${noAns}<div class="exp" id="exp-${i}"></div>`;
    body.appendChild(card);
    if(userA[i]!==null){const so=document.getElementById(`opt-${i}-${userA[i]}`);if(so)so.classList.add('sel');}
    mcqIdx++;
  });
  updateProg();
}

function sel(qi,oi){if(submitted)return;if(userA[qi]!==null)document.getElementById(`opt-${qi}-${userA[qi]}`).classList.remove('sel');userA[qi]=oi;saveSession();document.getElementById(`opt-${qi}-${oi}`).classList.add('sel');updateProg();}

function updateProg(){
  const mcqs=currentQ.filter(q=>q.type==='mcq');const tot=mcqs.length;if(!tot)return;
  const ans=mcqs.reduce((s,q,i)=>{const qi=currentQ.indexOf(q);return s+(userA[qi]!==null?1:0);},0);
  const pct=Math.round(ans/tot*100);
  document.getElementById('prog-bar').style.width=pct+'%';
  document.getElementById('prog-text').textContent=`${ans} of ${tot} MCQ answered`;
  document.getElementById('live-score').textContent=`${ans}/${tot}`;
}

function clearAll(){if(submitted)return;userA=new Array(currentQ.length).fill(null);renderQuiz();}

function submitQuiz(){
  const mcqs=currentQ.map((q,i)=>({q,i})).filter(({q})=>q.type==='mcq');
  const una=mcqs.filter(({i})=>userA[i]===null).length;
  if(una>0&&!_forceSubmit){uiConfirm(`${una} unanswered question`+(una>1?'s':'')+`. Submit anyway?`,()=>{_forceSubmit=true;submitQuiz();_forceSubmit=false;},'Submit');return;}
  stopTimer();
  submitted=true;let correct=0,total=0;
  currentQ.forEach((q,i)=>{
    if(q.type!=='mcq')return;
    const ca=q.a,ua=userA[i];
    total++;
    if(ca>=0){if(ua===ca)correct++;recordResult(q._qId||null,ua===ca);}
    const card=document.getElementById('card-'+i);
    if(card){card.classList.add(ca>=0&&ua===ca?'correct':'wrong');}
    ['A','B','C'].forEach((_,j)=>{
      const opt=document.getElementById(`opt-${i}-${j}`);if(!opt)return;
      opt.style.cursor='default';
      if(ca>=0){if(j===ca&&ua!==ca)opt.classList.add('miss');if(j===ua&&ua!==ca)opt.classList.add('fail');if(j===ua&&ua===ca)opt.classList.add('ok');}
      else if(j===ua){opt.classList.add('miss');}
    });
    const exp=document.getElementById('exp-'+i);
    if(exp){
      const isOk=ca>=0&&ua===ca;
      const label=ca>=0?(['A','B','C','D'][ca]||'?'):'?';
      exp.innerHTML=`<span class="verdict ${isOk?'v-ok':'v-fail'}">${isOk?'✓ Correct':ca<0?'⚠️ No answer key':'✗ Wrong — Correct: '+label}</span>${q.x||''}`;
      exp.style.display='block';
    }
  });
  if(total===0){goHome();return;}
  const pct=Math.round(correct/total*100);
  document.getElementById('r-title').textContent=currentTitle;
  document.getElementById('s-correct').textContent=correct;
  document.getElementById('s-wrong').textContent=total-correct;
  document.getElementById('s-pct').textContent=pct+'%';
  const circle=document.getElementById('r-circle');
  const rLabel=document.getElementById('r-label');const rSub=document.getElementById('r-sub');
  if(pct>=90){circle.className='result-circle rc-pass';rLabel.textContent='Exam Ready ✓';rSub.textContent=`${correct}/${total} correct · Target 90%+ achieved`;}
  else if(pct>=70){circle.className='result-circle rc-mid';rLabel.textContent='Good — Review Needed';rSub.textContent=`${correct}/${total} correct · Study marked questions`;}
  else{circle.className='result-circle rc-fail';rLabel.textContent='Needs More Study';rSub.textContent=`${correct}/${total} correct · Focus on red questions`;}
  circle.textContent=pct+'%';
  recordSession(currentTitle,correct,total);
  clearSession();
  // Per-question review on the results screen (was previously only shown on the hidden quiz screen)
  const rq=document.getElementById('results-quiz');
  if(rq){
    rq.innerHTML='';
    currentQ.forEach((q,i)=>{
      if(q.type!=='mcq')return;
      const ca=q.a,ua=userA[i],isOk=ca>=0&&ua===ca;
      const chBadge=q._ch?`<span style="font-size:10px;color:var(--muted)">${q._ch}</span><br>`:'';
      let opts='';['A','B','C','D'].forEach((l,j)=>{
        if(j>=q.o.length)return;
        let cls='opt';
        if(ca>=0){
          if(j===ca&&ua!==ca)cls+=' miss';
          if(j===ua&&ua!==ca)cls+=' fail';
          if(j===ua&&ua===ca)cls+=' ok';
        }else if(j===ua){cls+=' miss';}
        opts+=`<div class="${cls}"><span class="opt-l">${l}</span><span class="opt-t">${q.o[j]}</span></div>`;
      });
      const label=ca>=0?(['A','B','C','D'][ca]||'?'):'?';
      const verdict=`<span class="verdict ${isOk?'v-ok':'v-fail'}">${isOk?'✓ Correct':ca<0?'⚠️ No answer key':'✗ Wrong — Correct: '+label}</span>${q.x||''}`;
      const card=document.createElement('div');
      card.className=`qcard ${isOk?'correct':'wrong'}`;
      card.dataset.qi=i;
      card.innerHTML=`<div class="qcard-header"><div class="qnum">${i+1}</div><div style="flex:1">${chBadge}<div class="qtext">${q.t}</div></div></div><div class="opts">${opts}</div><div class="exp" style="display:block">${verdict}</div>`;
      rq.appendChild(card);
    });
  }
  const oldWrongBtn=document.getElementById('wrong-only-btn');if(oldWrongBtn)oldWrongBtn.remove();
  const wrongBtn=document.createElement('button');
  wrongBtn.className='weak-btn';wrongBtn.id='wrong-only-btn';
  wrongBtn.textContent='👁 Wrong Only';
  let showAll=true;
  wrongBtn.onclick=()=>{
    showAll=!showAll;
    wrongBtn.textContent=showAll?'👁 Wrong Only':'👁 Show All';
    document.querySelectorAll('#results-quiz .qcard').forEach(card=>{
      const qi=+card.dataset.qi;const q=currentQ[qi];if(!q)return;
      const ua=userA[qi];const ca=q.a;
      card.style.display=(!showAll&&ua===ca)?'none':'';
    });
  };
  if(rq)rq.parentNode.insertBefore(wrongBtn,rq);
  show('results');
}

let _pendingChId=null;
function _pickSize(n){const id=_pendingChId;const m=document.getElementById('size-modal');if(m)m.remove();if(id)doStartCh(id,n);}
function doStartCh(chId,n){
  const ch=CHAPTERS.find(c=>c.id===chId);if(!ch)return;
  const mem=loadMem();
  let qs=ch.questions.map((q,i)=>({...q,_qId:ch.id+'_'+hashQ(q.t||''),_ch:ch.title})).filter(q=>q.type==='table'||!isDel(mem,q._qId));
  if(n===-1){
    const unseen=qs.filter(q=>q.type==='mcq'&&(!mem.qs[q._qId]||mem.qs[q._qId].a===0));
    if(!unseen.length){uiNotice('All questions attempted! Try a random drill instead.');return;}
    qs=[...unseen,...qs.filter(q=>q.type!=='mcq')];n=0;
  }
  if(n>0&&qs.filter(q=>q.type==='mcq').length>n){
    const mcq=qs.filter(q=>q.type==='mcq');
    const shuffled=[...mcq].sort(()=>Math.random()-0.5).slice(0,n);
    const nonMcq=qs.filter(q=>q.type!=='mcq');
    qs=[...shuffled,...nonMcq];
  }
  startQuiz(qs,ch.title+(n>0?' ('+n+' random)':''));
}

function buildHome(){
  const stats=getChStats();const statMap={};stats.forEach(s=>statMap[s.id]=s);
  const mem=loadMem();
  const cg=document.getElementById('chapter-grid');cg.innerHTML='';
  const banner=document.getElementById('resume-banner');
  try{
    const raw=localStorage.getItem(SESSION_KEY);
    if(raw){
      const s=JSON.parse(raw);
      const qCount=(s.q||[]).length;
      const answered=(s.a||[]).filter((a,i)=>a!==null).length;
      const elapsed=s.ts?Math.round((Date.now()-s.ts)/60000):null;
      const timeStr=elapsed===null?'':elapsed<60?elapsed+'m ago':Math.round(elapsed/60)+'h ago';
      document.getElementById('resume-banner-title').textContent=s.t||'Session';
      document.getElementById('resume-banner-meta').textContent=`${answered}/${qCount} answered · ${timeStr}`;
      banner.classList.add('visible');
    }else{banner.classList.remove('visible');}
  }catch(e){banner.classList.remove('visible');}
  // Global stats strip
  const totalQs=stats.reduce((s,c)=>s+c.qs,0);
  const totalAttempted=stats.reduce((s,c)=>s+c.attempted,0);
  const totalA=stats.reduce((s,c)=>s+c.a,0);
  const totalC=stats.reduce((s,c)=>s+c.c,0);
  const globalAcc=totalA>0?Math.round(totalC/totalA*100):null;
  const strip=document.createElement('div');strip.className='global-stats';
  strip.innerHTML=`<div class="global-stat"><div class="global-stat-val">${totalAttempted}/${totalQs}</div><div class="global-stat-lbl">Attempted</div></div><div class="global-stat"><div class="global-stat-val">${globalAcc!==null?globalAcc+'%':'—'}</div><div class="global-stat-lbl">Accuracy</div></div><div class="global-stat"><div class="global-stat-val">${CHAPTERS.length}</div><div class="global-stat-lbl">Chapters</div></div>`;
  cg.appendChild(strip);
  const now=Date.now();
  let lastSection='';
  CHAPTERS.forEach(ch=>{
    const sec=ch.section||'General Navigation';
    if(sec!==lastSection){
      lastSection=sec;
      const lbl=document.createElement('div');
      lbl.className='section-label';lbl.style.gridColumn='1/-1';
      lbl.textContent=sec;
      cg.appendChild(lbl);
    }
    const s=statMap[ch.id];
    const acc=s&&s.acc!==null?s.acc:null;
    const attempted=s?s.attempted:0;
    const mcqTotal=s?s.qs:ch.questions.filter(q=>q.type==='mcq').length;
    const attemptedPct=mcqTotal>0?Math.round(attempted/mcqTotal*100):0;
    const accColor=acc===null?'var(--muted)':acc>=80?'var(--green)':acc>=60?'var(--yellow)':'var(--red)';
    const isStale=s&&s.lastAt>0&&(now-s.lastAt>7*86400000);
    const staleDot=isStale?'<span class="stale-dot" title="Not practiced in 7+ days"></span>':'';
    const calcs=ch.questions.filter(q=>q.type==='calc'&&!isDel(mem,ch.id+'_'+hashQ(q.t||''))).length;
    const tbls=ch.questions.filter(q=>q.type==='table').length;
    const extraStr=(calcs||tbls)?` · ${[calcs?calcs+' calc':'',tbls?tbls+' tbl':''].filter(Boolean).join(' · ')}`:'';
    const statText=attempted>0?`<span style="color:var(--muted)">${attempted}/${mcqTotal}</span> · <span style="color:${accColor};font-weight:700">${acc!==null?acc+'%':'—'}</span>${extraStr}`:`<span style="color:var(--muted)">${mcqTotal} MCQ${extraStr}</span>`;
    const sub=ch.sub||'';
    const nonMcqCount=ch.questions.filter(q=>q.type==='table'||(q.type!=='mcq'&&!isDel(mem,ch.id+'_'+hashQ(q.t||'')))).length;
    const totalQ=mcqTotal+nonMcqCount;
    const unseenMcq=ch.questions.filter(q=>{
      if(q.type!=='mcq')return false;
      const r=mem.qs[ch.id+'_'+hashQ(q.t||'')];
      if(r&&r.del)return false;
      return !r||r.a===0;
    }).length;
    const unseenTotal=unseenMcq+nonMcqCount;
    const chipSizes=[{l:'All ('+totalQ+')',v:0,p:true},{l:'▶ '+unseenTotal+' unseen',v:-1,p:false},{l:'50',v:50,p:false},{l:'30',v:30,p:false},{l:'20',v:20,p:false},{l:'10',v:10,p:false}];
    const chipsHtml=chipSizes.map(cs=>`<button class="ch-chip${cs.p?' ch-chip-primary':''}" onclick="event.stopPropagation();doStartCh('${ch.id}',${cs.v})">${cs.l}</button>`).join('');
    const card=document.createElement('div');card.className='chapter-card';card.id='ch-card-'+ch.id;
    card.innerHTML=`<div style="display:flex;align-items:flex-start;gap:8px"><div class="card-icon">${ch.icon}</div><div style="flex:1"><div class="card-title">${ch.title}</div><div class="card-sub">${sub}</div></div>${staleDot}</div><div class="ch-prog-bar"><div class="ch-prog-fill" style="width:${attemptedPct}%;background:${accColor}"></div></div><div class="ch-stat-row"><span style="font-size:11px">${statText}</span></div><div class="ch-chips" id="chips-${ch.id}">${chipsHtml}</div>`;
    card.onclick=()=>{
      const chips=document.getElementById('chips-'+ch.id);
      const wasOpen=chips.classList.contains('open');
      document.querySelectorAll('.ch-chips.open').forEach(c=>c.classList.remove('open'));
      if(!wasOpen)chips.classList.add('open');
    };
    cg.appendChild(card);
  });
}
buildHome();
</script>
</body></html>
