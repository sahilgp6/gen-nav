", "o": ["40 NM", "50 NM", "60 NM", "70 NM"], "a": 0, "x": "This is covered in detail in the ‘General Navigation Problems’ Chapter. The\n\n[Oxford ATPL · Oxford Ch32 Q121]"}, {"type": "mcq", "t": "Given: True Track = 352 Variation = 11W Deviation = - 5 Drift = 8°R What is Heading (C)?", "o": ["078°(C)", "346°(C)", "000°(C)", "025°(C)"], "a": 2, "x": "Do not forget that a deviation of -5° is equivalent to 5°W.\n\n[Oxford ATPL · Oxford Ch32 Q122]"}, {"type": "mcq", "t": "What is the radial and DME distance from CRK VOR (5151N 00830W) to position 5220N 00910W?", "o": ["322(M) 39 NM", "330(M) 41 NM", "330(M) 39 NM", "322(M) 41 NM"], "a": 2, "x": "Plotting question. Solve by measurement on the chart.\n\n[Oxford ATPL · Oxford Ch32 Q123]"}, {"type": "mcq", "t": "What is the radial and DME distance from SHA VOR (5243N 00853W) to Birr airport (5304N 00755W)?", "o": ["068(M) 42 NM", "060(M) 40 NM", "068(M) 40 NM", "060(M) 42 NM"], "a": 0, "x": "Plotting question. Solve by measurement on the chart.\n\n[Oxford ATPL · Oxford Ch32 Q124]"}, {"type": "mcq", "t": "What is the lat and long of the SHA VOR (5243N 00853W) 239(M)/36 NM radial/ range?", "o": ["5215N 00930W", "5220N 00937W", "5212N 00930W", "5212N 00915W"], "a": 1, "x": "Plotting question. Solve by measurement on the chart.\n\n[Oxford ATPL · Oxford Ch32 Q125]"}, {"type": "mcq", "t": "A Lambert conformal conic chart has a constant of the cone of 0.80. A straight line course drawn on this chart from A (53°N 004°W) to B is 080° at A; course at B is 092°. What is the longitude of B?", "o": ["019°E", "008°E", "009°36’E", "011°E"], "a": 3, "x": "‘Constant of the cone’ is just another term for ‘sine of the parallel of origin’.\n\n[Oxford ATPL · Oxford Ch32 Q126]"}, {"type": "mcq", "t": "An aircraft at position 0000N/S 16327W flies a track of 225°(T) for 70 NM. What is its new position?", "o": ["0049N 16238W", "0049S 16238W", "0049N 16416W", "0049S 16416W"], "a": 3, "x": "Resolve 70 NM along a track of 225 into their change of latitude and change of\n\n[Oxford ATPL · Oxford Ch32 Q127]"}, {"type": "mcq", "t": "On a Polar Stereographic map, a straight line is drawn from position A (70N 102W) to position B (80N 006E). The point of highest latitude along this line occurs at longitude 035W. What is the straight-line track angle from B to A, measured at B?", "o": ["023°(T)", "077°(T)", "229°(T)", "131°(T)"], "a": 3, "x": "[Oxford ATPL · Oxford Ch32 Q128]"}, {"type": "mcq", "t": "On a chart, meridians at 45N are shown every 10 degrees apart. This is shown on the chart by a distance of 14 cm. What is the scale?", "o": ["1: 2 000 000", "1: 4 000 000", "1: 5 000 000", "1: 5 600 000"], "a": 3, "x": "This is a combination of a departure and a representative fraction (scale)\n\n[Oxford ATPL · Oxford Ch32 Q130]"}, {"type": "mcq", "t": "How do rhumb lines (with the exception of meridians) appear on a Polar Stereographic chart?", "o": ["concave to the nearer pole", "convex to the nearer pole", "ellipses round the pole", "straight lines"], "a": 0, "x": "[Oxford ATPL · Oxford Ch32 Q132]"}, {"type": "mcq", "t": "What is the chart convergence factor on a Polar Stereographic chart?", "o": ["0", "1.0", "0.866", "0.5"], "a": 1, "x": "[Oxford ATPL · Oxford Ch32 Q134]"}, {"type": "mcq", "t": "Given: Heading 165(M), Variation 25W, Drift 10°R, G/S 360 knots. At ‘A’ your relative bearing to an NDB is 325R. Five minutes later, at ‘B’, the relative bearing is 280(R). What is the true bearing and distance from ‘B’ to the NDB?", "o": ["060°(T) 40 NM", "105°(T) 30 NM", "060°(T) 30 NM", "105°(T) 40 NM"], "a": 2, "x": "True heading is 140, true track is 150. Relative bearing at A is 35° left of the\n\n[Oxford ATPL · Oxford Ch32 Q136]"}, {"type": "mcq", "t": "What is the diameter of the Earth?", "o": ["40 000 km", "12 732 km", "21 600 km", "6366 km"], "a": 1, "x": "You are not supposed to remember the diameter of the Earth. But you should\n\n[Oxford ATPL · Oxford Ch32 Q137]"}, {"type": "mcq", "t": "An aircraft flies 100 stat.m in 20 minutes. How long does it take to fly 215 NM?", "o": ["50 min", "37 min", "57 min", "42 min"], "a": 0, "x": "Use the CRP-5.\n\n[Oxford ATPL · Oxford Ch32 Q138]"}, {"type": "mcq", "t": "What is the duration of civil twilight?", "o": ["From the moment when the centre of the Sun is on the sensible horizon until the centre reaches a depression angle of 6° from the sensible horizon", "From the moment when the tip of the Sun disappears below the sensible horizon until the centre reaches a depression angle of 6° from the sensible horizon", "From the moment when the centre of the Sun is on the visual horizon until the centre reaches a depression angle of 6° from the sensible horizon", "From the moment when the tip of the Sun disappears below the visual horizon until the centre reaches a depression angle of 6° from the sensible horizon"], "a": 3, "x": "[Oxford ATPL · Oxford Ch32 Q139]"}, {"type": "mcq", "t": "What is the shortest distance between Point ‘A’ (3543N 00841E) and Point ‘B’ (5417N 17119W)?", "o": ["5400 NM", "6318 NM", "6557 NM", "6000 NM"], "a": 0, "x": "Plotting question. Solve by measurement on the chart.\n\n[Oxford ATPL · Oxford Ch32 Q141]"}, {"type": "mcq", "t": "Given: Runway direction 083°(M), Surface W/V 045/35 kt. Calculate the effective headwind component.", "o": ["29 kt", "27 kt", "31 kt", "34 kt"], "a": 0, "x": "CRP-5 problem.\n\n[Oxford ATPL · Oxford Ch32 Q143]"}, {"type": "mcq", "t": "Given: TAS=375 Trk=335°(T) W/V=340°(T)/50 What is heading and Ground speed?", "o": ["335°(T) 322", "335°(T) 318", "336°(T) 326", "333°(T) 326"], "a": 2, "x": "[Oxford ATPL · Oxford Ch32 Q144]"}, {"type": "mcq", "t": "Lines of latitude on a chart are always:", "o": ["Great circles", "Small circles except for the Equator", "Vertices", "Meridians"], "a": 1, "x": "[Oxford ATPL · Oxford Ch32 Q145]"}, {"type": "mcq", "t": "On a Lambert chart, the convergence factor is .78585. What is the parallel of tangency?", "o": ["51°02’", "51°36’", "51°15’", "51°48’"], "a": 3, "x": "The ‘constant of the cone’ is the sine of the parallel of origin (or tangency).\n\n[Oxford ATPL · Oxford Ch32 Q146]"}, {"type": "mcq", "t": "On which chart projection is it not possible to show the North Pole?", "o": ["Direct Mercator", "Lambert’s", "Transverse Mercator", "Polar Stereographic"], "a": 0, "x": "The North Pole is in the hole at the end of the cylinder.\n\n[Oxford ATPL · Oxford Ch32 Q148]"}, {"type": "mcq", "t": "What is the formula for conversion angle?", "o": ["Change of longitude × Sine latitude", "Change of longitude / 2 × Sine mean longitude", "Change of longitude / 2 × Sine mean latitude", "Change of longitude × Cosine latitude"], "a": 2, "x": "[Oxford ATPL · Oxford Ch32 Q150]"}, {"type": "mcq", "t": "On the Polar Stereographic projection, a great circle appears as:", "o": ["a straight line", "a curve which becomes more near to a straight line as the latitude increases", "a curve convex to the nearer pole", "a curve which can be concave or convex to the nearer pole, depending on the latitude"], "a": 1, "x": "[Oxford ATPL · Oxford Ch32 Q151]"}, {"type": "mcq", "t": "An aircraft departs Guam (13N 145E) at 2300 Standard Time on 30th April local date. Flight time to Los Angeles, California, USA (34N 118W) is 11 hours 15 minutes. What is the California Standard Time and local date of arrival? Assume Summer Time is being kept.", "o": ["1715 ST 30 Apr", "1215 ST 01 May", "1315 ST 01 May", "1615 ST 30 Apr"], "a": 0, "x": "As always, use a table:\n\n[Oxford ATPL · Oxford Ch32 Q152]"}, {"type": "mcq", "t": "What rate of descent is required to maintain a 3.5° glide slope at a ground speed of 150 knots?", "o": ["850 fpm", "800 fpm", "600 fpm", "875 fpm"], "a": 3, "x": "[Oxford ATPL · Oxford Ch32 Q153]"}, {"type": "mcq", "t": "What is the meaning of the term ‘standard time’?", "o": ["It is another term for UTC", "It is the time zone system applicable only in the USA", "It is an expression for local mean time", "It is the time set by the legal authorities for a country or part of a country"], "a": 3, "x": "[Oxford ATPL · Oxford Ch32 Q154]"}, {"type": "mcq", "t": "On 27 Feb at 52°S 040°E Sunrise is at 0243UTC. On the same day at 52°S 035°W the time of Sunrise is:", "o": ["0743 UTC", "0243 UTC", "2143 UTC", "0543 UTC"], "a": 0, "x": "The change in longitude between 040°E and 035°W is 75°. The Earth rotates\n\n[Oxford ATPL · Oxford Ch32 Q155]"}, {"type": "mcq", "t": "A compass swing is performed in order to correct for:", "o": ["acceleration", "deviation", "variation", "aperiodicity"], "a": 1, "x": "[Oxford ATPL · Oxford Ch32 Q156]"}, {"type": "mcq", "t": "Given: IAS 120 kt FL80 OAT +20°(C) What is the TAS?", "o": ["141 kt", "102 kt", "120 kt", "132 kt"], "a": 0, "x": "[Oxford ATPL · Oxford Ch32 Q159]"}, {"type": "mcq", "t": "Given: True course 300° Drift 8°R Variation 10°W Deviation -4° Calculate the compass heading.", "o": ["322°", "306°", "278°", "294°"], "a": 1, "x": "The JAA use the term ‘course’ to mean ‘desired track’. If the drift is 8° starboard,\n\n[Oxford ATPL · Oxford Ch32 Q161]"}, {"type": "mcq", "t": "Given: True track 180° Drift 8°R Compass Heading 195° Deviation -2° Calculate the variation.", "o": ["21°W", "25°W", "5°W", "9°W"], "a": 0, "x": "If the compass heading is 195C, apply -2 degrees deviation to get 193 Mag\n\n[Oxford ATPL · Oxford Ch32 Q162]"}, {"type": "mcq", "t": "Given the following: Magnetic heading: 060° Magnetic variation: 8°W Drift angle: 4° right What is the true track?", "o": ["064°", "056°", "072°", "048°"], "a": 1, "x": "Apply 8°W variation to 060°(M) to get 052°(T). With 4° starboard drift, the\n\n[Oxford ATPL · Oxford Ch32 Q163]"}, {"type": "mcq", "t": "Given: W/V 262/90 kt, Track 234° and TAS 305 kt, what are the Heading and Groundspeed?", "o": ["226° and 224 kt", "252° and 214 kt", "242° and 224 kt", "250° and 224 kt"], "a": 2, "x": "[Oxford ATPL · Oxford Ch32 Q164]"}, {"type": "mcq", "t": "Given: Half way between two reporting points the navigation log gives the following information: TAS 360 kt W/V 330°/80 kt Compass heading 237° Deviation on this heading -5° Variation 19°W What is the average ground speed for this leg?", "o": ["403 kt", "354 kt", "373 kt", "360 kt"], "a": 0, "x": "[Oxford ATPL · Oxford Ch32 Q165]"}, {"type": "mcq", "t": "During a low level flight 2 parallel roads are crossed at right angles by an aircraft. The time between these roads can be used to check the aircraft:", "o": ["track", "drift", "ground speed", "heading"], "a": 2, "x": "Ground speed is the only of these options which depends on time difference.\n\n[Oxford ATPL · Oxford Ch32 Q167]"}, {"type": "mcq", "t": "The angle between the true great circle track and the true rhumb line track joining the following points: A (60S 165W) and B (60S 177E) at the place of departure A, is:", "o": ["9°", "15.6°", "5.2°", "7.8°"], "a": 3, "x": "This is a conversion angle problem:\n\n[Oxford ATPL · Oxford Ch32 Q168]"}, {"type": "mcq", "t": "Given the following: True track: 192° Magnetic variation: 7°E Drift angle: 5° left What is the magnetic heading required to maintain the given track?", "o": ["180°", "190°", "194°", "204°"], "a": 1, "x": "192°(T) + 7E Var = 185°(M)ag Track. With 5° of left drift, you need\n\n[Oxford ATPL · Oxford Ch32 Q170]"}, {"type": "mcq", "t": "Given: A Polar Stereographic chart whose grid is aligned with the zero meridian. Grid track 344°, longitude 115°00’W, calculate the true course. (Assume N hemisphere).", "o": ["099°", "279°", "049°", "229°"], "a": 3, "x": "The datum meridian is Greenwich, so the aircraft is 115° West of the datum in\n\n[Oxford ATPL · Oxford Ch32 Q171]"}, {"type": "mcq", "t": "The rhumb line distance between points A (60°00’N 002°30’E) and B (60°00’N 007°30’W) is:", "o": ["300 NM", "450 NM", "600 NM", "150 NM"], "a": 0, "x": "Rhumb line distance between 2 points at the same latitude is the Departure.\n\n[Oxford ATPL · Oxford Ch32 Q172]"}, {"type": "mcq", "t": "Given: TAS = 485 kt, OAT = ISA +10°C, FL410. Calculate the Mach Number.", "o": ["0.87", "0.825", "0.90", "0.85"], "a": 1, "x": "Do not forget that ISA at FL410 is still -56.5°(C), even though you are higher\n\n[Oxford ATPL · Oxford Ch32 Q173]"}, {"type": "mcq", "t": "Given: Position A is 60N 020W, Position B is 60N 021W, and Position C is 59N 020W, what are, respectively, the distances from A to B and from A to C?", "o": ["60 NM and 30 NM", "30 NM and 60 NM", "52 NM and 60 NM", "60 NM and 52 NM"], "a": 1, "x": "A and B are at the same latitude but different longitudes. So it is a departure\n\n[Oxford ATPL · Oxford Ch32 Q175]"}, {"type": "mcq", "t": "Given: FL350, Mach 0.80, OAT -55°(C), calculate values for TAS and local speed of sound?", "o": ["461 kt, LSS 296 kt", "461 kt, LSS 576 kt", "237 kt, LSS 296 kt", "490 kt, LSS 461 kt"], "a": 1, "x": "Use the CRP-5.\n\n[Oxford ATPL · Oxford Ch32 Q176]"}, {"type": "mcq", "t": "How many nautical miles are travelled in 1 minute 45 seconds at a ground speed of 135 knots?", "o": ["2.36", "3.25", "39.0", "3.94"], "a": 3, "x": "[Oxford ATPL · Oxford Ch32 Q177]"}, {"type": "mcq", "t": "The distance A to B is 90 NM in a straight line. You are 60 NM from A when you fix your position 4 NM to the left of track. What correction do you need to make to arrive at B?", "o": ["4°", "8°", "12°", "10°"], "a": 2, "x": "You need 4° right to correct for track error angle and parallel track. Then, with\n\n[Oxford ATPL · Oxford Ch32 Q178]"}, {"type": "mcq", "t": "A Great Circle crosses the Equator at longitude 030°W. The direction of the GC at Equator is 035°(T). An aircraft following this Great Circle will reach its highest latitude (N or S) at position:", "o": ["35S 120W", "55S 060E", "35N 120W", "55N 060E"], "a": 3, "x": "[Oxford ATPL · Oxford Ch32 Q179]"}, {"type": "mcq", "t": "The heading is 299°(G). Magnetic variation is 90°W and chart convergence is 55°W. What is magnetic heading?", "o": ["154°(M)", "084°(M)", "264°(M)", "334°(M)"], "a": 1, "x": "[Oxford ATPL · Oxford Ch32 Q180]"}, {"type": "mcq", "t": "The orbit of the Earth round the Sun is elliptical. An ellipse has 2 foci. Which of the following is a correct statement?", "o": ["The Earth is positioned at one of the foci", "The Sun is positioned at the mid-point of the 2 foci", "The Sun is positioned at one of the foci", "The Earth is positioned at the mid-point of the 2 foci"], "a": 2, "x": "[Oxford ATPL · Oxford Ch32 Q181]"}, {"type": "mcq", "t": "An aircraft homing to a VOR/DME loses 2500 feet in 11.1 NM change of DME range. What is the gradient of the slope?", "o": ["4.1%", "3.5%", "3.9%", "3.7%"], "a": 3, "x": "[Oxford ATPL · Oxford Ch32 Q182]"}, {"type": "mcq", "t": "An aircraft at position 8500N 02000E flies a rhumb line track of 075°(T). What will be its path over the Earth?", "o": ["The shortest route to a destination", "A spiral path leading towards the North Pole", "A great circle route continuing over the pole and then southwards over the other side", "An increasing track angle"], "a": 1, "x": "[Oxford ATPL · Oxford Ch32 Q183]"}, {"type": "mcq", "t": "Given: For take-off an aircraft requires a headwind component of at least 15 kt and has a cross-wind limit of 35 kt. The angle between the wind direction and the runway is 60°. Calculate the maximum and minimum allowable wind speeds.", "o": ["30 kt and 40 kt", "15 kt and 43 kt", "12 kt and 38 kt", "18 kt and 50 kt"], "a": 0, "x": "[Oxford ATPL · Oxford Ch32 Q184]"}, {"type": "mcq", "t": "An aircraft is cruising at FL350, Temp -50°C and is told to descend to FL80, Temp -10°C. If the IAS for the descent was 188 kt, what would be the appropriate TAS?", "o": ["260 kt", "188 kt", "335 kt", "224 kt"], "a": 0, "x": "To calculate the TAS for the descent you need to have the mean altitude\n\n[Oxford ATPL · Oxford Ch32 Q185]"}, {"type": "mcq", "t": "An aircraft has to climb from FL50 -10°C to FL260 -25°C. The IAS for the climb is 180 kt and the WC is +30 kt. If the ROC is 900 ft/min, how many miles will the climb take?", "o": ["96 NM", "106 NM", "83 NM", "120 NM"], "a": 1, "x": "For a climb the TAS is calculated using the 2/3 change in altitude and\n\n[Oxford ATPL · Oxford Ch32 Q186]"}]}, {"id": "mb1", "icon": "📋", "color": "#4a3570", "sub": "Weighing · standard masses · documentation", "title": "JAR-OPS 1 Subpart J", "questions": [{"type": "mcq", "t": "JAR legislation can be found in:", "o": ["JAR OPS-1 subpart A", "JAR OPS-1 subpart D", "JAR OPS-1 subpart K", "JAR OPS-1 subpart J"], "a": 3, "x": "[Oxford ATPL Book 6 · p19 Q1]"}, {"type": "mcq", "t": "The mass and centre of gravity of an aircraft must be established by actual weighing:", "o": ["by the pilot on entry of aircraft into service", "by the engineers before commencing service", "by the operator prior to initial entry of aircraft into service", "by the owner operator before the first flight of the day"], "a": 2, "x": "[Oxford ATPL Book 6 · p19 Q2]"}, {"type": "mcq", "t": "The operator must establish the mass of the Traffic Load:", "o": ["prior to initial entry into service", "by actual weighing or determine the mass of the traffic load in accordance with standard masses as specified in JAR-OPS sub part J", "prior to embarking on the aircraft", "by using an appropriate method of calculation as specified in the JAR Ops subpart J"], "a": 1, "x": "[Oxford ATPL Book 6 · p19 Q3]"}, {"type": "mcq", "t": "The mass of the fuel load must be determined:", "o": ["by the operator using actual density or by density calculation specified in the Operations Manual", "by the owner using actual density or by density calculation specified in JAR OPS - 1", "by the pilot using actual density or by density calculation specified in the Operations Manual", "by the fuel bowser operator using actual density or by density calculation specified in the Fuelling Manual"], "a": 0, "x": "[Oxford ATPL Book 6 · p19 Q4]"}, {"type": "mcq", "t": "The Dry Operating Mass is the total mass of the aeroplane ready for a specific type of operation and includes:", "o": ["Crew and passenger baggage, special equipment, water and chemicals", "Crew and their hold baggage, special equipment, water and contingency fuel", "Crew baggage, catering and other special equipment, potage water and lavatory chemicals", "Crew and baggage, catering and passenger service equipment, potable water and lavatory chemicals"], "a": 3, "x": "[Oxford ATPL Book 6 · p19 Q5]"}, {"type": "mcq", "t": "The Maximum Zero Fuel Mass is the maximum permissible mass of the aeroplane:", "o": ["with no useable fuel", "with no useable fuel unless the Aeroplane Flight Manual Limitations explicitly include it", "including the fuel taken up for take-off", "including all useable fuel unless the Aeroplane Flight Operations Manual explicitly excludes it"], "a": 1, "x": "[Oxford ATPL Book 6 · p19 Q6]"}, {"type": "mcq", "t": "The Maximum Structural Take-off Mass is:", "o": ["the maximum permissible total aeroplane mass on completion of the refuelling operation", "the maximum permissible total aeroplane mass for take-off subject to the limiting conditions at the departure airfield", "the maximum permissible total aeroplane mass for take-off but excluding fuel", "the maximum permissible total aeroplane mass at the start of the take-off run"], "a": 3, "x": "[Oxford ATPL Book 6 · p20 Q7]"}, {"type": "mcq", "t": "The Regulated Take-off Mass:", "o": ["is the lower of maximum structural take-off mass and the performance limited take- off mass", "is the higher of the maximum structural zero fuel mass and the performance limited take- off mass", "the maximum structural take-off mass subject to any last minute mass changes", "the maximum performance limited take-off mass subject to any last minute mass changes"], "a": 0, "x": "[Oxford ATPL Book 6 · p20 Q8]"}, {"type": "mcq", "t": "The Take-off mass", "o": ["the maximum permissible total aeroplane mass on completion of the refuelling operation", "the mass of the aeroplane including everyone and everything contained within it at the start of the take-off run", "the maximum permissible total aeroplane mass for take-off but excluding fuel", "the maximum permissible total aeroplane mass at the start of the take-off run"], "a": 1, "x": "[Oxford ATPL Book 6 · p20 Q9]"}, {"type": "mcq", "t": "The Operating Mass:", "o": ["is the lower of the structural mass and the performance limited mass", "is the higher of the structural mass and the performance limited mass", "is the actual mass of the aircraft on take-off", "is the dry operating mass and the fuel load"], "a": 3, "x": "[Oxford ATPL Book 6 · p20 Q10]"}, {"type": "mcq", "t": "The Basic Empty Mass is the mass of the aeroplane:", "o": ["plus non-standard items such as lubricating oil, fire extinguishers, emergency oxygen equipment etc", "minus non-standard items such as lubricating oil, fire extinguishers, emergency oxygen equipment etc", "plus standard items such as unusable fluids, fire extinguishers, emergency oxygen equipment, supplementary electronics etc", "minus non-standard items such as unusable fluids, fire extinguishers, emergency oxygen and supplementary electronic equipment etc"], "a": 2, "x": "[Oxford ATPL Book 6 · p20 Q11]"}, {"type": "mcq", "t": "The Traffic Load:", "o": ["includes passenger masses and baggage masses but excludes any non-revenue load", "includes passenger masses, baggage masses and cargo masses but excludes any non- revenue load", "includes passenger masses, baggage masses, cargo masses and any non-revenue load", "includes passenger masses, baggage masses and any non-revenue load but excludes cargo"], "a": 2, "x": "[Oxford ATPL Book 6 · p21 Q12]"}, {"type": "mcq", "t": "The Traffic Load is:", "o": ["The Zero Fuel Mass minus the Dry operating Mass", "The Take-off Mass minus the sum of the Dry Operating Mass and the total fuel load", "The landing Mass minus the sum of the Dry Operating Mass and the mass of the remaining fuel", "all the above"], "a": 3, "x": "[Oxford ATPL Book 6 · p21 Q14]"}, {"type": "mcq", "t": "The Basic Empty Mass is the:", "o": ["MZFM minus both traffic load and the fuel load", "Take-off mass minus the traffic load and the fuel load", "Operating mass minus the crew and fuel load", "Landing mass less traffic load"], "a": 2, "x": "[Oxford ATPL Book 6 · p21 Q15]"}, {"type": "mcq", "t": "Is it possible to fly a certified aircraft at a Regulated Take-off mass with both a full traffic load and a full fuel load?", "o": ["It might be possible on some aircraft providing the mass and CG remain within limits", "Yes, all aircraft are able to do this", "No, it is not possible on any aeroplane!", "Only if the performance limited take-off mass is less than the structural limited take-off mass"], "a": 0, "x": "[Oxford ATPL Book 6 · p21 Q16]"}, {"type": "mcq", "t": "It is intended to fly a certified aircraft loaded to the MZFM and MSTOM.", "o": ["The CG must be within limits during take-off and landing", "The CG limits must be in limits throughout the flight, including loading/unloading", "The CG does not have to be within limits during the whole of the flight", "The CG does not have to be within limits during loading and unloading the aeroplane"], "a": 1, "x": "[Oxford ATPL Book 6 · p21 Q17]"}, {"type": "mcq", "t": "The term ‘baggage’ means:", "o": ["Excess frieght", "Any non-human, non-animal cargo", "any frieght or cargo not carried on the person", "personal belongings"], "a": 3, "x": "[Oxford ATPL Book 6 · p22 Q18]"}, {"type": "mcq", "t": "Certified Transport category aircraft with less than 10 seats:", "o": ["may accept a verbal mass from or on behalf of each passenger", "estimate the total mass of the passengers and add a pre-determined constant to account for hand baggage and clothing", "may compute the actual mass of passengers and checked baggage", "all the above"], "a": 3, "x": "[Oxford ATPL Book 6 · p22 Q19]"}, {"type": "mcq", "t": "When computing the mass of passengers and baggage: 1. Personal belongings and hand baggage must be included 2. Infants must be classed as children it they occupy a seat 3. Standard masses include infants being carried by an adult . 4. Table 1, Table 2 and Table 3 must be used as appropriate if using standard masses for passengers and freight. 5. Weighing must be carried out immediately prior to boarding and at an adjacent location.", "o": ["1, 2 and v only", "2 and 4 only", "1, 2, 3 and 5 only", "All the above"], "a": 2, "x": "[Oxford ATPL Book 6 · p22 Q20]"}, {"type": "mcq", "t": "When computing the mass of passengers and baggage for an aircraft with 20 seats or more: 1. Standard masses of male and female in Table 1 are applicable. 2. If there are thirty seats or more, the ‘All Adult’ mass values in Table 1 may be used as an alternative. 3. Holiday Charter masses apply to Table 1 and Table 3 if the charter is solely intended as an element of a holiday travel package. 4. Holiday flights and holiday charters attract the same mass values.", "o": ["1, 3 and 4 only", "1 and 2 only", "3 and 4 only", "All the above"], "a": 1, "x": "[Oxford ATPL Book 6 · p22 Q21]"}, {"type": "mcq", "t": "When computing the mass of passengers and baggage for an aircraft with 19 seats or less: 1. The standard masses in Table 2 apply 2. If hand baggage is accounted for separately, 6 kg may be deducted from the mass of each male and female. 3. Table 2 masses vary with both the gender (male or female) of the seat occupant and the number of seats on the aircraft. 4. Standard masses are not available for baggage. 5. Standard masses are not available for freight.", "o": ["1 only", "1, 2 and 4 only", "3 and 5 only", "All the above"], "a": 3, "x": "[Oxford ATPL Book 6 · p23 Q22]"}, {"type": "mcq", "t": "When computing the mass of checked baggage for an aircraft with twenty seats or more: 1. Table 1 applies 2. Table 2 applies 3. Table 3 applies 4. Mass is categorised by destination. 5. Mass is categorised by gender", "o": ["1, 3 and 4 only", "2, 3 and 5 only", "3 and 4 only", "All the above"], "a": 2, "x": "[Oxford ATPL Book 6 · p23 Q23]"}, {"type": "mcq", "t": "On any flight identified as carrying a significant number of passengers whose masses, including hand baggage, are expected to exceed the standard passenger mass the operator:", "o": ["must determine the actual mass of such passengers", "must add an adequate mass increment to each of such passengers", "must determine the actual masses of such passengers or add an adequate increment to each of such passengers", "need only determine the actual masses or apply an increment if the Take-off mass is likely to be exceeded"], "a": 2, "x": "[Oxford ATPL Book 6 · p23 Q24]"}, {"type": "mcq", "t": "If standard mass tables are being used for checked baggage and a number of passengers check in baggage that is expected to exceed the standard baggage mass, the operator:", "o": ["determine the actual masses of such baggage", "must determine the actual mass of such baggage by weighing or by deducting an adequate mass increment", "need may no alterations if the Take-off mass is not likely to be exceeded", "must determine the actual mass of such baggage by weighing or adding an adequate mass increment"], "a": 3, "x": "[Oxford ATPL Book 6 · p23 Q25]"}, {"type": "mcq", "t": "documentation: 1. must be established prior to each flight 2. must enable the commander to determine that the load and its distribution is such that the limits of the aircraft are not exceeded. 3. must include the name of the person preparing the document. 4. must be signed by the person supervising the loading to the effect that the load and its distribution is in accordance with the data on the document. 5. must include the aircraft commander’s signature to signify acceptance of the document.", "o": ["All the above", "2, 4 and 5 only", "1, 4 and 5 only", "1 and 3 only"], "a": 0, "x": "[Oxford ATPL Book 6 · p24 Q26]"}, {"type": "mcq", "t": "Once the documentation has been signed prior to flight:", "o": ["no load alterations are allowed", "documented last minute changes to the load may be incorporated", "the documentation is not signed prior to flight", "acceptable last minute changes to the load must be documented"], "a": 3, "x": "[Oxford ATPL Book 6 · p24 Q27]"}, {"type": "mcq", "t": "Aircraft must be weighed: 1. on initial entry into service 2. if the records have not been adjusted for alterations or modifications. 3. every four years after initial weigh 4. whenever the cumulative changes to the dry operating mass exceed plus or minus 0.5% of the maximum landing mass. 5. if the cumulative change in CG position exceeds 0.5% of the mean aerodynamic chord.", "o": ["1 and 3 only", "1, 2, 3, 4 and 5", "1, 2 and 3 only", "1, 3 and 5 only"], "a": 1, "x": "[Oxford ATPL Book 6 · p24 Q28]"}, {"type": "mcq", "t": "Aeroplane loading: 1. must be performed under the supervision of qualified personnel 2. must be consistent with the data used for calculating the . 3. must comply with compartment dimension limitations 4. must comply with the maximum load per running metre 5. must comply with the maximum mass per cargo compartment", "o": ["1 and 2B only", "1, 2, 4 and 5 only", "1, 2, 3, 4 and 5", "3, 4 and 5 only"], "a": 2, "x": "[Oxford ATPL Book 6 · p24 Q29]"}, {"type": "mcq", "t": "An average dry operating mass and CG position may be used for a fleet or group of aeroplanes: 1. if they are of the same model and configuration 2. providing the individual masses and CG positions meet specific tolerances specified in JAR OPS section J. 3. providing the dry operating mass of any aeroplane does not vary by more than 0.5% of the maximum structural landing mass of the fleet. 4. providing that the CG position varies by more than 0.5% of the mean aerodynamic chord of the fleet. 5. providing appropriate corrections to mass and CG position are applied to aircraft within the fleet which have a physical, accurately accountable difference.", "o": ["1, 2, 3, 4 and 5", "1, 2, 3 and 5 only", "2, 3 and 4 only", "1, 4 and 5 only"], "a": 1, "x": "[Oxford ATPL Book 6 · p25 Q30]"}]}, {"id": "mb2", "icon": "⚖️", "color": "#4a3570", "sub": "MZFW · MTOM · MLM · DOM · traffic load · %MAC", "title": "Mass & Balance Definitions", "questions": [{"type": "mcq", "t": "Define the useful load:", "o": ["traffic load plus dry operating mass", "traffic load plus usable fuel mass", "dry operating mass plus usable fuel load", "that part of the traffic load which generates revenue"], "a": 0, "x": "[Oxford ATPL Book 6 · p101 Q1]"}, {"type": "mcq", "t": "Determine the position of the CG as a percentage of the MAC given that the balance arm of the CG is 724 and the MAC balance arms are 517 to 1706.", "o": ["14.2 %", "15.3 %", "16.3 %", "17.4 %"], "a": 3, "x": "[Oxford ATPL Book 6 · p101 Q2]"}, {"type": "mcq", "t": "The distance from the datum to the CG is:", "o": ["the index", "the moment", "the balance arm", "the station"], "a": 2, "x": "[Oxford ATPL Book 6 · p101 Q3]"}, {"type": "mcq", "t": "If the maximum structural landing mass is exceeded:", "o": ["The aircraft will be unable to get airborne", "The undercarriage could collapse on", "No damage will occur providing the aircraft is within the regulated landing mass", "No damage will occur providing the aircraft is within the performance limited landing mass"], "a": 1, "x": "[Oxford ATPL Book 6 · p101 Q5]"}, {"type": "mcq", "t": "For a conventional light aeroplane with a tricycle undercarriage configuration, the higher the take-off mass: 1. Stick forces at rotation will increase 2. Range will decrease but endurance will increase 3. Gliding range will reduce 4. Stalling speed will increase", "o": ["all statements are correct", "Statement 3 only is correct", "Statements 1 and 4 only are correct", "Statement 4 only is correct"], "a": 2, "x": "[Oxford ATPL Book 6 · p102 Q8]"}, {"type": "mcq", "t": "If the aeroplane was neutrally stable this would suggest that:", "o": ["the CG is forward", "the CG is in mid range", "the CG is on the rear limit", "the CG is behind the rear limit"], "a": 3, "x": "[Oxford ATPL Book 6 · p102 Q10]"}, {"type": "mcq", "t": "The CG position is:", "o": ["set by the pilot", "set by the manufacturer", "able to exist within a range", "fixed"], "a": 2, "x": "[Oxford ATPL Book 6 · p102 Q11]"}, {"type": "mcq", "t": "Which of the following would not affect the CG?", "o": ["Cabin crew members performing their normal duties", "Fuel usage", "Stabilator trim setting", "Mass added or removed at the neutral point"], "a": 2, "x": "[Oxford ATPL Book 6 · p102 Q12]"}, {"type": "mcq", "t": "The CG datum has to be along the longitudinal axis:", "o": ["between the nose and the tail", "between the leading and trailing edge of the MAC", "but does not have to be between the nose and the tail", "at the fire"], "a": 2, "x": "[Oxford ATPL Book 6 · p103 Q14]"}, {"type": "mcq", "t": "The CG is :", "o": ["the point on the aircraft where the datum is located", "the point on the aircraft at which gravity appears to act", "the point on the aircraft from where the dihedral angle is measured", "the point on the aircraft where the lift acts through"], "a": 1, "x": "[Oxford ATPL Book 6 · p103 Q15]"}, {"type": "mcq", "t": "The aircraft basic mass and CG position is found on :", "o": ["the weighing schedule and the aeroplane must be re-weighed if equipment change causes a change in mass or balance", "On the loading manifest and is DOM – traffic load", "On the loading manifest and is ZFM – useful load", "On the weighing schedule and is adjusted to take account of any mass changes"], "a": 0, "x": "[Oxford ATPL Book 6 · p103 Q16]"}, {"type": "mcq", "t": "When determining the mass of fuel/oil and the value of the SG is not known, the value to use is:", "o": ["determined by the operator (and laid down in the aeroplane OPS Manual. A pilot simply has to look it up)", "set out in JAR OPS Section 1", "determined by the aviation authority", "determined by the pilot"], "a": 0, "x": "[Oxford ATPL Book 6 · p103 Q17]"}, {"type": "mcq", "t": "In mass and balance terms, what is an index?", "o": ["A cut down version of a force", "A moment divided by a constant", "A moment divided by a mass", "A mass divided by a moment"], "a": 1, "x": "[Oxford ATPL Book 6 · p103 Q18]"}, {"type": "mcq", "t": "Standard masses for baggage can be used when:", "o": ["9 seats or more", "20 seats or more", "30 seats or more", "less than 30 seats"], "a": 1, "x": "[Oxford ATPL Book 6 · p103 Q19]"}, {"type": "mcq", "t": "What is the zero fuel mass?", "o": ["MTOM minus fuel to destination minus fuel to alternative airfield", "Maximum allowable mass of the aircraft with no usable fuel on board", "Operating mass minus the fuel load", "Actual loaded mass of the aircraft with no usable fuel on board"], "a": 3, "x": "[Oxford ATPL Book 6 · p104 Q20]"}, {"type": "mcq", "t": "If an aeroplane comes into lands below its MSLM but above the PLLM for the arrival airfield: 1. Airframe structural damage will occur. 2. Tyre temperature limits could be exceeded. 3. It might not have sufficient runway length in which to stop safely. 4 A go-around might not be achievable. 5. Brake fade could occur..", "o": ["All the answers are correct", "3 and 4 only are correct", "2, 3, 4 and 5 only are correct", "1, 3, 4 and 5 only are correct"], "a": 2, "x": "[Oxford ATPL Book 6 · p104 Q21]"}, {"type": "mcq", "t": "A twin engine aeroplane of mass 2500 kg is in balanced level flight. The CG limits are 82 in to 95 in from the nose position of the aeroplane and the CG is approximately mid range. A passenger of mass 85 kg, moves from the front seat 85.5 inches aft of the nose to the rear seat157.6 inches from the nose. What is the new CG position approximately?", "o": ["2.5 inches", "87.5 inches", "91 inches", "92.5 inches"], "a": 2, "x": "[Oxford ATPL Book 6 · p104 Q22]"}, {"type": "mcq", "t": "A twin engine aeroplane is certified for a MSTOM and a MLM of 58000 kg and 55000 kg respectfully. What is the limiting take-off mass for the aeroplane? PLTOM 61,000 kg PLLM 54,000 KG MZFM 3 6,000 kg Operating mass 55,000 kg Trip fuel 30,000 kg Contingency fuel 5% of trip fuel Alternative fuel 500 kg Final reserve 500 kg Flight duration 3 hours Fuel consumption 500 kg per hour per engine Useful load 41500 kg", "o": ["58,000 kg", "61,000 kg", "56,145 kg", "56,545 kg Refer to CAP 696 for answers to 25, 26 and 27"], "a": 0, "x": "[Oxford ATPL Book 6 · p105 Q24]"}, {"type": "mcq", "t": "The distance of the leading edge of the wing MAC from the datum is:", "o": ["undefined", "525.6 m", "625.6 in", "525.6 in"], "a": 2, "x": "[Oxford ATPL Book 6 · p105 Q26]"}, {"type": "mcq", "t": "What is the CG as a percentage of the MAC of the fully loaded aircraft? BEM 12,000 kg Arm 3 m CG 25% MAC MAC 2 m Item Balance arm Front seats 2.5 m Rear seats 3 m Fuel @ 0.74 410 Ltr Fuel arm 2.5 m Rear seats Empty Pilot 80 kg Front seat Pax 80 kg", "o": ["16%", "19%", "21%", "24%"], "a": 3, "x": "[Oxford ATPL Book 6 · p105 Q27]"}, {"type": "mcq", "t": "The maximum aircraft mass excluding all usable fuel is:", "o": ["fixed and listed in the aircraft’s Operations Manual", "variable and is set by the payload for the trip", "fixed by the physical size of the fuselage and cargo holds", "variable and depends on the actual fuel load for the trip"], "a": 0, "x": "[Oxford ATPL Book 6 · p106 Q28]"}, {"type": "mcq", "t": "Just prior to take-off, a baggage handler put an extra box of significant mass into the hold without recording it in the LMC’s. What are the effects of this action? The aeroplane has a normal, tricycle undercarriage. 1. V will increase if the extra load is forward of the datum. MC 2. Stick forces in flight will decrease if the extra load is behind the datum. 3. Stick forces at V will increase if the box is forward of the main wheels R 4. V will occur later MU 5. The safe stopping distance will increase.", "o": ["3, 4 and 5 only", "2, 3 and 4 only", "1 and 5 only", "all the above"], "a": 0, "x": "[Oxford ATPL Book 6 · p106 Q29]"}, {"type": "mcq", "t": "What is the maximum take-off mass given: MSTOM 43,000 kg MSLM 35,000 kg PLLM 33,000 kg MZFM 31,000 kg DOM 19,000 kg Total Fuel capacity 12,500 kg Maximum Trip Fuel 9,000 kg Contingency fuel 1000 kg Alternate fuel 500 kg Final reserve fuel 400 kg", "o": ["43,000 kg", "42,000 kg", "41,000 kg", "40,000 kg"], "a": 1, "x": "[Oxford ATPL Book 6 · p106 Q30]"}, {"type": "mcq", "t": "What is the maximum mass an aeroplane can be loaded to before it moves under its own power?", "o": ["Maximum Structural Ramp mass", "Maximum Structural take-off mass", "Maximum Regulated Ramp Mass", "Maximum Regulated Take-off mass"], "a": 0, "x": "[Oxford ATPL Book 6 · p106 Q31]"}, {"type": "mcq", "t": "The weight of an aircraft in all flight conditions acts:", "o": ["parallel to the CG", "at right angles to the aeroplane’s flight path", "always through the MAC", "vertically downwards"], "a": 3, "x": "[Oxford ATPL Book 6 · p106 Q32]"}, {"type": "mcq", "t": "If the CG moves rearwards during flight:", "o": ["range will decrease", "range will increase", "stability will increase", "range will remain the same but stalling speed will decrease"], "a": 1, "x": "[Oxford ATPL Book 6 · p107 Q34]"}, {"type": "mcq", "t": "The CG of an aeroplane is situated at 115.8 arm and the mass is 4750 kg. A weight of 160 kg is moved from a hold situated at 80 arm to a hold at 120 arm. What would be the new CG arm?.", "o": ["117.14", "118.33", "118.50", "120.01"], "a": 0, "x": "[Oxford ATPL Book 6 · p107 Q35]"}, {"type": "mcq", "t": "What is the effect of moving the CG from the front to the rear limit at constant altitude, CAS and temperature?", "o": ["Reduced optimum cruise range", "Reduced cruise range", "Increased cruise range", "Increased stall speed"], "a": 2, "x": "[Oxford ATPL Book 6 · p107 Q36]"}, {"type": "mcq", "t": "The baggage compartment floor-loading limit is 650 kg/m2. What is the maximum mass of baggage that can be placed in the baggage compartment on a pallet of dimensions 0.8m by 0.8m. The pallet has a mass of 6 kg?", "o": ["416 kg", "1,015 kg", "650 kg", "410 kg"], "a": 3, "x": "[Oxford ATPL Book 6 · p107 Q37]"}, {"type": "mcq", "t": "An aeroplane of 110,000kg has its CG at 22.6m aft of the datum. The CG limits are 18m to 22m aft of the datum. How much mass must be removed from a hold 30m aft of the datum to bring the CG to its mid point?", "o": ["26,800 kg", "28,600 kg", "86,200 kg", "62,800 kg"], "a": 1, "x": "[Oxford ATPL Book 6 · p107 Q38]"}, {"type": "mcq", "t": "Where does the mass act through when the aircraft is stationary on the ground?", "o": ["The centre of gravity", "The main wheels", "It doesn’t act through anywhere", "The aerodynamic centre"], "a": 0, "x": "[Oxford ATPL Book 6 · p107 Q39]"}, {"type": "mcq", "t": "If an aircraft is weighed prior to entry into service who is responsible for doing the re-weigh to prepare the plane for operations?", "o": ["The manufacturer", "The operator", "The pilot", "The flight engineer"], "a": 1, "x": "[Oxford ATPL Book 6 · p108 Q40]"}, {"type": "mcq", "t": "An aeroplane has a tank capacity of 50000 Imperial gallons. It is loaded with fuel to a quantity of 165000 kg (790 kg/m3). What is the specific gravity of the fuel and approximately how much more fuel could be taken up given that mass limits would not be exceeded?", "o": ["0.73 46,053 gallons", "0.81 3,940 gallons", "0.72 46,000 gallons", "0.79 3,946 gallons"], "a": 3, "x": "[Oxford ATPL Book 6 · p108 Q41]"}, {"type": "mcq", "t": "Define Balance Arm :", "o": ["BA = Mass / Moment", "BA = Moment / Mass", "BA = Mass / Distance", "BA = Moment / Distance"], "a": 2, "x": "[Oxford ATPL Book 6 · p108 Q42]"}, {"type": "mcq", "t": "You have been given 16500 litres of fuel at SG 0.78 but written down is 16500 kg. As a result you will experience :", "o": ["heavier stick forces at rotation and improved climb performance", "heavier stick forces on rotation and distance to take-off increases", "lighter stick forces on rotation and calculated V1 will be too high", "lighter stick forces on rotation and V2 will be too low"], "a": 2, "x": "[Oxford ATPL Book 6 · p108 Q43]"}]}, {"id": "pf1", "icon": "🛫", "color": "#a05828", "sub": "TODR · ASDA · V1 · flap · contamination", "title": "Performance: Take-off", "questions": [{"type": "mcq", "t": "How is wind considered in the take-off performance data of the Aeroplane Operations Manuals?", "o": ["Unfactored headwind and tailwind components are used", "Not more than 80% headwind and not less than 125% tailwind", "Since take-offs with tailwind are not permitted, only headwinds are considered", "Not more than 50% of a headwind and not less than 150% of the tailwind"], "a": 3, "x": "[Oxford ATPL Book 6 · p159 Q1]"}, {"type": "mcq", "t": "What will be the influence on the aeroplane performance if aerodrome pressure altitude is increased?", "o": ["It will increase the take-off distance", "It will decrease the take-off distance", "It will increase the take-off distance available", "It will increase the accelerate stop distance available"], "a": 0, "x": "[Oxford ATPL Book 6 · p159 Q2]"}, {"type": "mcq", "t": "The required Take-off Distance (TOD) and the field length limited Take-off Mass (TOM) are different for the zero flap case and take-off position flap case. What is the result of flap setting in take-off position compared to zero flap position?", "o": ["Increased TOD required and decreased field length limited TOM", "Increased TOD required and increased field length limited TOM", "Decreased TOD required and decreased field length limited TOM", "Decreased TOD required and increased field length limited TOM"], "a": 3, "x": "[Oxford ATPL Book 6 · p159 Q3]"}, {"type": "mcq", "t": "The take-off distance available is:", "o": ["the total runway length, without clearway even if this one exists", "the length of the take-off run available plus the length of the clearway available", "the runway length minus stopway", "the runway length plus half of the clearway"], "a": 1, "x": "[Oxford ATPL Book 6 · p159 Q4]"}, {"type": "mcq", "t": "During take-off, the thrust of a fixed pitch propeller:", "o": ["increases slightly while the aeroplane speed builds up", "varies with mass changes only", "has no change during take-off and climb", "decreases while the aeroplane speed builds up"], "a": 3, "x": "[Oxford ATPL Book 6 · p159 Q5]"}, {"type": "mcq", "t": "What will be the effect on an aeroplane’s performance if aerodrome pressure altitude is decreased?", "o": ["It will increase the take-off distance required", "It will increase the take-off ground run", "It will decrease the take-off distance required", "It will increase the accelerate stop distance"], "a": 2, "x": "[Oxford ATPL Book 6 · p159 Q6]"}, {"type": "mcq", "t": "The take-off distance of an aircraft is 800m in a standard atmosphere with no wind and at 0 ft pressure altitude. Using the following corrections: ± 20 m / 1 000 ft field elevation - 5 m / kt headwind + 10 m / kt tail wind ± 15 m / % runway slope ± 5 m / °C deviation from standard temperature The take-off distance from an airport at 2 000 ft elevation, temperature 21°C, QNH 1013.25 hPa, 2% up-slope, 5 kt tail wind is:", "o": ["810 m", "970 m", "890 m", "870 m"], "a": 1, "x": "[Oxford ATPL Book 6 · p160 Q7]"}, {"type": "mcq", "t": "An uphill slope:", "o": ["increases the take-off distance more than the accelerate stop distance", "decreases the accelerate stop distance only", "decreases the take-off distance only", "increases the allowed take-off mass"], "a": 0, "x": "[Oxford ATPL Book 6 · p160 Q8]"}, {"type": "mcq", "t": "Other factors remaining constant and not limiting, how does increasing pressure altitude affect allowable takeoff mass?", "o": ["Allowable take-off mass remains uninfluenced up to 5000 ft pressure altitude", "Allowable take-off mass decreases", "Allowable take-off mass increases", "There is no effect on allowable take-off mass"], "a": 1, "x": "[Oxford ATPL Book 6 · p160 Q9]"}, {"type": "mcq", "t": "In reality, the net thrust of a jet engine at constant RPM:", "o": ["does not change with changing altitude", "is independent of the airspeed", "decreases with the airspeed", "increases with the airspeed"], "a": 2, "x": "[Oxford ATPL Book 6 · p160 Q10]"}, {"type": "mcq", "t": "Which of the following are to be taken into account for the runway in use for take-off?", "o": ["Airport elevation, runway slope, standard temperature, pressure altitude and wind components", "Airport elevation, runway slope, outside air temperature, standard pressure and wind components", "Airport elevation, runway slope, outside air temperature, pressure altitude and wind components", "Airport elevation, runway slope, standard temperature, standard pressure and wind components"], "a": 2, "x": "[Oxford ATPL Book 6 · p160 Q11]"}, {"type": "mcq", "t": "For a take-off in slush, the slush drag:", "o": ["Will increase up to aquaplane speed and then remain constant", "Will increase up to aquaplane speed and then decrease", "Will increase up to aquaplane speed and then increase at a greater rate", "Will decrease progressively up to the lift off speed"], "a": 1, "x": "[Oxford ATPL Book 6 · p160 Q12]"}, {"type": "mcq", "t": "With contamination on the aircraft wings and fuselage only:", "o": ["The TODR will be unaffected", "The ASDR will decrease", "Stalling speed is not affected", "The lift off speed will be increased"], "a": 3, "x": "[Oxford ATPL Book 6 · p161 Q13]"}, {"type": "mcq", "t": "The gross take-off distance (TOD) is defined as being from brake release until:", "o": ["The aeroplane’s main wheel lifts off the runway", "The aeroplane has reached 35 ft", "The aeroplane has reached the screen height", "The aeroplane is safely off the ground"], "a": 2, "x": "[Oxford ATPL Book 6 · p161 Q14]"}, {"type": "mcq", "t": "The result of a higher flap setting up to the optimum at take-off is:", "o": ["a higher VR", "a longer take-off run", "a shorter ground roll", "an increased acceleration"], "a": 2, "x": "[Oxford ATPL Book 6 · p161 Q15]"}, {"type": "mcq", "t": "VR is the speed at which:", "o": ["The aeroplane nose wheel is off the ground", "The pilot initiate the action required t  be less than 1.2 VMC", "Must not be less than VMC"], "a": 1, "x": "[Oxford ATPL Book 6 · p301 Q10]"}, {"type": "mcq", "t": "For a single engine Class B aircraft at an aerodrome with stopway:", "o": ["The TOD x 1.3 must not exceed the ASDA", "The TOD must not exceed the ASDA x 1.3", "The TOD x 1.25 must not exceed the ASDA", "The TOD must not exceed the ASDA x 1.25"], "a": 0, "x": "[Oxford ATPL Book 6 · p301 Q11]"}]}, {"id": "pf6", "icon": "🔧", "color": "#a05828", "sub": "Climb gradient and rate", "title": "Class B Single Engine: Climb", "questions": [{"type": "mcq", "t": "Which of the following statements correctly describes one of the general requirements about the operation of Class B single engine aeroplanes in the public transport category?", "o": ["They may fly at night", "They must be flown so that an airfield can be reached following engine failure", "They are not to operate in IMC, except under special VFR", "They must not be operated over water"], "a": 2, "x": "[Oxford ATPL Book 6 · p318 Q1]"}, {"type": "mcq", "t": "According to the information in a light aircraft manual, which gives two power-settings for cruise, 65% and 75%. If you fly at 75% instead of 65%:", "o": ["Cruise speed will be higher and SFC will be the same", "Cruise speed will be higher and SFC will be lower", "Cruise speed will be higher and SFC will be higher", "Cruise speed will be the same and SFC will be the same"], "a": 2, "x": "[Oxford ATPL Book 6 · p318 Q2]"}, {"type": "mcq", "t": "According to the information in a light aircraft manual, which gives two power settings for cruise, 65% and 75%. If you fly at 65% instead of 75%:", "o": ["Endurance will be higher and SFC will be the same", "Endurance will be higher and SFC will be lower", "Endurance will be higher and SFC will be higher", "Endurance will be the same and SFC will be the same"], "a": 1, "x": "[Oxford ATPL Book 6 · p318 Q3]"}, {"type": "mcq", "t": "For the purpose of ensuring compliance with the en-route regulations, up to at minimum horizontal margin must the obstacle by cleared (assume wing span < 60 m)", "o": ["60 m + 1/2 wingspan + 0.125D", "90 m + 0.125D", "60 m / D + 0.125", "There is no minimum horizontal clearance requirement"], "a": 0, "x": "[Oxford ATPL Book 6 · p343 Q11]"}, {"type": "mcq", "t": "What is the maximum bank angle permitted within the take-off flight path up to 1,500 ft for a multi-engine class B aeroplane?", "o": ["25°", "10°", "5°", "15°"], "a": 3, "x": "[Oxford ATPL Book 6 · p343 Q12]"}]}, {"id": "pf9", "icon": "🛩️", "color": "#a05828", "sub": "Landing distance and factors", "title": "Class B: Landing", "questions": [{"type": "mcq", "t": "For a multi-engine class B aeroplane, the en-route phase extends from:", "o": ["1,000 ft above the take-of surface to 1,500 ft above the landing surface", "1,500 ft above the take-off surface to 1,000 ft above the landing aerodrome level", "From the start of level flight to the end of level flight", "50 ft above the take-off surface to 1,500 ft above the landing aerodrome level"], "a": 1, "x": "[Oxford ATPL Book 6 · p351 Q1]"}, {"type": "mcq", "t": "Following engine failure in the cruise, what is the name given to the descent procedure from the cruise altitude to the one engine inoperative ceiling?", "o": ["Descent profile", "Descent procedure", "Driftdown", "Emergency descent"], "a": 2, "x": "[Oxford ATPL Book 6 · p351 Q2]"}, {"type": "mcq", "t": "Why does the descent profile of the driftdown procedure steadily become shallower?", "o": ["As density increases, the remaining engine generates more thrust", "Drag starts to decrease towards the end of the driftdown procedure", "Weight apparent thrust decreases with increasing density", "The increase in gravitational acceleration causes the weight apparent thrust to increase"], "a": 0, "x": "[Oxford ATPL Book 6 · p351 Q3]"}, {"type": "mcq", "t": "Which of the statements below correctly describes on the en-route requirements for a multi- engine class B aeroplane?", "o": ["In the e ease the take-off ground run?", "o": ["Decreased take-off mass, increased pressure altitude, increased temperature", "Decreased take-off mass, increased density, increased flap setting", "Increased pressure altitude, increased outside air temperature, increased take-off mass", "Increased outside air temperature, decreased pressure altitude, decreased flap setting"], "a": 1, "x": "[Oxford ATPL Book 6 · p395 Q2]"}, {"type": "mcq", "t": "A multi engine aeroplane is flying at the minimum control speed (VMCA). Which parameter(s) must be maintainable after engine failure?", "o": ["Heading, altitude and a positive rate of climb of 100 ft/min", "Altitude", "Straight flight", "Straight flight and altitude"], "a": 2, "x": "[Oxford ATPL Book 6 · p395 Q3]"}, {"type": "mcq", "t": "How is VMCA influenced by increasing pressure altitude?", "o": ["VMCA decreases with increasing pressure altitude", "VMCA increases with pressure altitude higher than 4000 ft", "VMCA increases with increasing pressure altitude", "VMCA is not affected by pressure altitude"], "a": 0, "x": "[Oxford ATPL Book 6 · p395 Q4]"}, {"type": "mcq", "t": "Which of the following speeds can be limited by the ‘maximum tyre speed’?", "o": ["Lift-off groundspeed", "Lift-off IAS", "Lift-off TAS", "Lift-off EAS"], "a": 0, "x": "[Oxford ATPL Book 6 · p395 Q5]"}, {"type": "mcq", "t": "A higher outside air temperature (OAT):", "o": ["decreases the brake energy limited take-off mass", "increases the field length limited take-off mass", "increases the climb limited take-off mass", "decreases the take-off distance"], "a": 0, "x": "[Oxford ATPL Book 6 · p395 Q6]"}, {"type": "mcq", "t": "The take-off performance requirements for Class A transport category aeroplanes are based upon:", "o": ["failure of critical engine", "failure of critical engine or all engines operating which ever gives the largest take-off distance", "all engines operating", "only one engine operating"], "a": 1, "x": "[Oxford ATPL Book 6 · p396 Q7]"}, {"type":  take-off"], "a": 2, "x": "[Oxford ATPL Book 6 · p400 Q31]"}, {"type": "mcq", "t": "In which of the following distances can the length of a stopway be included?", "o": ["In the accelerate stop distance available", "In the one-engine failure case, take-off distance", "In the all-engine take-off distance", "In the take-off run available"], "a": 0, "x": "[Oxford ATPL Book 6 · p400 Q32]"}, {"type": "mcq", "t": "In the event of engine failure below V1, the first action to be taken by the pilot in order to decelerate the aeroplane is to:", "o": ["apply wheel brakes", "deploy airbrakes or spoilers", "reduce the engine thrust", "reverse engine thrust"], "a": 2, "x": "[Oxford ATPL Book 6 · p400 Q33]"}, {"type": "mcq", "t": "The climb limited take-off mass can be increased by:", "o": ["selecting a lower VR", "a lower flap setting for take-off and selecting a higher V2", "selecting a lower V1", "selecting a lower V2"], "a": 1, "x": "[Oxford ATPL Book 6 · p400 Q34]"}, {"type": "mcq", "t": "Which is the correct sequence of speeds during take-off?", "o": ["V1, VR, V2, VMCA", "VMCG, V1, VR, V2", "V1, VMCG, VR, V2", "V1, VR, VMCG, V2"], "a": 1, "x": "[Oxford ATPL Book 6 · p400 Q35]"}, {"type": "mcq", "t": "Which of the following distances will increase if you increase V1?", "o": ["All Engine Take-off distance", "Take-off run", "Accelerate Stop Distance", "Take-off distance"], "a": 2, "x": "[Oxford ATPL Book 6 · p400 Q36]"}, {"type": "mcq", "t": "If the value of the balanced V1 is found to be lower than VMCG, which of the following is correct?", "o": ["The ASDR will become greater than the one engine out take-off distance", "The take-off is not permitted", "The one engine out take-off distance will become greater than the ASDR", "The VMCG will be lowered to V1"], "a": 1, "x": "[Oxford ATPL Book 6 · p401 Q37]"}]}, {"id": "pf12", "icon": "📈", "color": "#a05828", "sub": "Segment gradients · WAT limits", "title": "Class A: Climb", "questions": [{"type": "mcq", "t": "For a take-off from when an aeroplane climbs at a constant Mach number?", "o": ["IAS stays constant so there will be no problems", "The “1.3G” altitude is exceeded, so Mach buffet will start immediately", "The lift coefficient increases", "The TAS continues to increase, which may lead to structural problems"], "a": 2, "x": "[Oxford ATPL Book 6 · p450 Q22]"}, {"type": "mcq", "t": "The speed range between low speed buffet and high speed buffet:", "o": ["decreases with increasing mass and is independent of altitude", "is only limiting at low altitudes", "increases with increasing mass", "narrows with increasing mass and increasing altitude"], "a": 3, "x": "[Oxford ATPL Book 6 · p450 Q23]"}, {"type": "mcq", "t": "A jet aeroplane descends with constant Mach number. Which of the following speed limits is most likely to be exceeded first?", "o": ["Maximum Operational Mach Number", "Maximum Operating Speed", "Never Exceed Speed", "High Speed Buffet Limit"], "a": 1, "x": "[Oxford ATPL Book 6 · p450 Q24]"}, {"type": "mcq", "t": "With respect to the optimum altitude, which of the following statements is correct?", "o": ["An aeroplane always flies below the optimum altitude, because Mach buffet might occur", "An aeroplane always flies at the optimum altitude because this is economically seen as the most attractive altitude", "An aeroplane flies most of the time above the optimum altitude because this yields the most economic result", "An aeroplane sometimes flies above or below the optimum altitude because optimum altitude increases continuously during flight. Class A En Route"], "a": 3, "x": "[Oxford ATPL Book 6 · p450 Q25]"}, {"type": "mcq", "t": "The aerodynamic ceiling:", "o": ["is the altitude at which the aeroplane reaches 50 ft/min", "is the altitude at which the speeds for low speed buffet and for high speed buffet are the same", "depends upon thrust setting and increase with increasing thrust", "is the altitude at which the best rate of climb theoretically is zero"], "a": 1, "x": "[Oxford ATPL Book 6 · p451 Q26]"}, {"type": "mcq", "t": "An aeroplane operating under the 180 minutes ETOPS rule may be up to:", "o": ["180 minutes flying time to a suitable airport in still air with one engine inoperative", "180 minutes flying time to a suitable airport under the prevailing weather condition with one engine inoperative", "180 minutes flying time from suitable airport in still air at a normal cruising speed", "90 minutes flying time from the first en-route airport and another 90 minutes from the second en-route airport in still air with one engine inoperative"], "a": 0, "x": "[Oxford ATPL Book 6 · p451 Q27]"}, {"type": "mcq", "t": "If the climb speed schedule is changed from 280/.74 to 290/.74 the new crossover altitude is:", "o": ["unchanged", "only affected by the aeroplane gross mass", "lower", "higher"], "a": 2, "x": "[Oxford ATPL Book 6 · p451 Q28]"}, {"type": "mcq", "t": "The drift down procedure specifies requirements concerning the:", "o": ["engine power at the altitude at which engine failure occurs", "climb gradient during the descent to the net level-off altitude", "weight during landing at the alternate", "obstacle clearance during descent to the net level-off altitude"], "a": 3, "x": "[Oxford ATPL Book 6 · p451 Q29]"}, {"type": "mcq", "t": "The drift down requirements are based on:", "o": ["the actual engine thrust output at the altitude of engine failure", "the maximum flight path gradient during the descent", "the landing mass limit at the alternate", "the obstacle clearance during a descent to the new cruising altitude if an engine has failed"], "a": 3, "x": "[Oxford ATPL Book 6 · p452 Q32]"}, {"type": "mcq", "t": "If the level-off altitude is below the obstacle clearance altitude during a drift down procedure?", "o": ["fuel jettisoning should be started at the beginning of drift down", "the recommended drift down speed should be disregarded and it should be flown at the stall speed plus 10 kt", "fuel jettisoning should be started when the reasing altitude"], "a": 0, "x": "[Oxford ATPL Book 6 · p453 Q39]"}, {"type": "mcq", "t": "The effect of flying at the Long Range Cruise Speed instead of the Maximum Range Cruise Speed is:", "o": ["Fuel flow is reduced and speed stability is improved", "Fuel flow is reduced and speed stability is reduced", "Fuel flow is increased and speed stability is improved", "Fuel flow is increased and speed stability is reduced"], "a": 2, "x": "[Oxford ATPL Book 6 · p453 Q41]"}, {"type": "mcq", "t": "An aircraft’s descent speed schedule is 0.74 M / 250 KIAS. During the descent from 30,000ft to sea level, the angle of attack will:", "o": ["Decrease, then remain constant", "Increase, then remain constant", "Remain constant", "Decrease"], "a": 0, "x": "[Oxford ATPL Book 6 · p453 Q42]"}, {"type": "mcq", "t": "During a drift down following engine failure, what would be the correct procedure to follow?", "o": ["Begin fuel jettison immediately, commensurate with having required reserves at destination", "Do not commence fuel jettison until en-route obstacles have been cleared", "Descend in the approach configuration", "Disregard the flight manual and descend at Vs + 10kts to the destination. Class A En Route"], "a": 0, "x": "[Oxford ATPL Book 6 · p453 Q43]"}]}, {"id": "pf15", "icon": "📊", "color": "#a05828", "sub": "Additional Class A questions", "title": "Performance: Mixed", "questions": [{"type": "mcq", "t": "The approach climb requirement has been established to ensure:", "o": ["minimum climb gradient in case of a go-around with one engine inoperative", "obstacle clearance in the approach area", "manoeuvrability in case of landing with one engine inoperative", "manoeuvrability during approach with full flaps and gear down, all engines operating"], "a": 0, "x": "[Oxford ATPL Book 6 · p461 Q1]"}, {"type": "mcq", "t": "The maximum mass for landing could be limited by:", "o": ["the climb requirements with all engines in the landing configuration but with gear up", "the climb requirements with one engine inoperative in the approach configuration", "the climb requirements with one engine inoperative in the landing configuration", "the climb requirements with all engines in the approach configuration"], "a": 1, "x": "[Oxford ATPL Book 6 · p461 Q2]"}, {"type": "mcq", "t": "Which of the following is true according to JAA regulations for turbo propeller powered aeroplanes not performing a steep approach?", "o": ["Maximum Take-off Run is 0.5 x runway length", "Maximum use of clearway is 1.5 x runway length", "Maximum Landing Distance at the destination aerodrome and at any alternate aerodrome is 0.7 x LDA (Landing Distance Available)", "Maximum Landing Distance at destination is 0.95 x LDA (Landing Distance Available)"], "a": 2, "x": "[Oxford ATPL Book 6 · p461 Q3]"}, {"type": "mcq", "t": "For a turboprop powered aeroplane, a 2,200 m long runway at the destination aerodrome is expected to be “wet”. To ensure the wet landing distance meets the requirement, the “dry runway” landing distance should not exceed:", "o": ["1,540 m", "1,147 m", "1,339 m", "1,771 m"], "a": 2, "x": "[Oxford ATPL Book 6 · p461 Q4]"}, {"type": "mcq", "t": "A flight is planned with a turbojet aeroplane to an aerodrome with a landing distance available of 2,400 m. Which of the following is the maximum landing distance for a dry runway?", "o": ["1 437 m", "1 250 m", "1 090 m", "1 655 m"], "a": 0, "x": "[Oxford ATPL Book 6 · p461 Q5]"}, {"type": "mcq", "t": "According to JAR-OPS 1, which one of the following statements concerning the landing distance for a turbojet aeroplane is correct?", "o": ["The landing distance is the distance from 35 ft above the surface of the runway to the full stop", "When determining the maximum allowable landing mass at destination, 60% of the available landing runway length should be taken into account", "Reverse thrust is one of the factors always taken into account when determining the landing distance required", "Malfunctioning of an anti-skid system h ": ["A gradient of 3.2% with one engine inoperative, the other engines at take off power in the landing configuration", "A gradient of 3.2% with all engines operating at take off power, in the landing configuration", "A gradient of 2.1% with all engines operating at take off power, with landing gear retracted, and approach flap", "A gradient of 3.2% with all engines operating at take off power, with landing gear retracted and approach flap"], "a": 1, "x": "[Oxford ATPL Book 6 · p463 Q16]"}]}, {"id": "pf16", "icon": "🎯", "color": "#a05828", "sub": "Full revision set, kept in book order", "title": "Performance Revision Questions", "questions": [{"type": "mcq", "t": "What happens to the speed for Vx and Vy with increasing altitude?", "o": ["Both remain constant", "Vx remains constant and Vy increases", "Vx increases and Vy remains constant", "Vx remains constant and Vy decreases"], "a": 3, "x": "[Oxford ATPL Book 6 · p467 Q1]"}, {"type": "mcq", "t": "The affect of a contaminated runway on the field limit mass :", "o": ["Decreased weight, increased V1, increased VR", "Decreased weight, same V1, increased VR", "Decreased weight, same V1, same VR", "Decreased weight, decreased V1, decreased VR"], "a": 3, "x": "[Oxford ATPL Book 6 · p467 Q2]"}, {"type": "mcq", "t": "When operating with anti-skid inoperative:", "o": ["Both landing and take off performance will be affected", "Only landing performance will be affected", "Only take off performance will be affected", "Neither take off or landing performance will be affected"], "a": 0, "x": "[Oxford ATPL Book 6 · p467 Q3]"}, {"type": "mcq", "t": "When comparing Vx to Vy:", "o": ["Vx will always be greater than Vy", "Vy will always be greater than or equal to Vx", "Vy will always be greater than Vx", "Vx will sometimes be greater than Vy, but sometimes be less than Vy"], "a": 1, "x": "[Oxford ATPL Book 6 · p467 Q4]"}, {"type": "mcq", "t": "Referring to Fig. 4.24. Why does the curve for an equivalent weight of 35 000 kg, only start 4 mins after engine failure?", "o": ["All the curves start at the same point higher up", "At that altitude the engine takes longer to spool down after failure", "At that weight the aircraft has a higher TAS and therefore more momentum", "At that weight the aircraft takes longer to slowdown to the optimum drift down speed"], "a": 3, "x": "[Oxford ATPL Book 6 · p467 Q5]"}, {"type": "mcq", "t": "With which conditions would one expect Vmc to be the lowest?", "o": ["Cold temp, low altitude, low humidity", "Hot temp, low pressure altitude, high humidity", "Hot temp, high pressure altitude, high humidity", "Cold temp, high altitude, low humidity"], "a": 2, "x": "[Oxford ATPL Book 6 · p467 Q6]"}, {"type": "mcq", "t": "Give the correct order for the following:", "o": ["Vmcg, VR, V1, V2", "Vmcg, V1, VR, V2", "V1, Vmcg, VR, V2", "Vmcg, V1, Vmca, VR, V2"], "a": 1, "x": "[Oxford ATPL Book 6 · p467 Q7]"}, {"type": "mcq", "t": "If the C of G moves aft from the most forward position:", "o": ["The range and the fuel consumption will increase", "The range and the fuel consumption will decrease", "The range will increase and the fuel consumption will decrease", "The range will decrease and the fuel consumption will increase"], "a": 2, "x": "[Oxford ATPL Book 6 · p468 Q8]"}, {"type": "mcq", "t": "Descending below the tropopause from FL370 to FL250 at a steady M#, then FL250 to FL100 at", "o": ["constant CAS. What happens to descent angle?", "Increase Increase", "Increase Constant", "Decrease Decrease"], "a": 1, "x": "[Oxford ATPL Book 6 · p468 Q9]"}, {"type": "mcq", "t": "With a constant weight and M#, a higher altitude will require:", "o": ["Lower CL", "Lower CD", "Higher AoA", "No change"], "a": 2, "x": "[Oxford ATPL Book 6 · p468 Q10]"}, {"type": "mcq", "t": "When approaching a wet runway, with the risk of hydroplaning, what technique should the pilot adapt?", "o": ["Positive touch down, full reverse and brakes as soon as possible", "Smoothest possible touch down, full reverse and : "If the maximum structural landing mass is exceeded:", "o": ["The aircraft will be unable to get airborne", "The undercarriage could collapse on", "No damage will occur providing the aircraft is within the regulated landing mass", "No damage will occur providing the aircraft is within the performance limited landing mass"], "a": 1, "x": "🔁 Also appears in an earlier chapter.\n\n[Oxford ATPL Book 6 · p112 Q8]"}, {"type": "mcq", "t": "For a conventional light aeroplane with a tricycle undercarriage configuration, the higher the take-off mass (assume a stab trim system is not fitted): 1. Stick forces at rotation will increase 2. Range will decrease but endurance will increase 3. Gliding range will reduce 4. Stalling speed will increase", "o": ["all statements are correct", "Statement 3 only is correct", "Statements 1 and 4 only are correct", "Statement 4 only is correct"], "a": 2, "x": "[Oxford ATPL Book 6 · p112 Q9]"}, {"type": "mcq", "t": "If the aeroplane was neutrally stable this would suggest that:", "o": ["the CG is forward", "the CG is in mid range", "the CG is on the rear limit", "the CG is behind the rear limit"], "a": 3, "x": "🔁 Also appears in an earlier chapter.\n\n[Oxford ATPL Book 6 · p112 Q11]"}, {"type": "mcq", "t": "The CG position is:", "o": ["set by the pilot", "set by the manufacturer", "able to exist within a range", "fixed"], "a": 2, "x": "🔁 Also appears in an earlier chapter.\n\n[Oxford ATPL Book 6 · p113 Q12]"}, {"type": "mcq", "t": "Which of the following would not affect the CG position?", "o": ["Cabin crew members performing their normal duties", "Fuel consumption during flight", "Horizontal stabilator trim setting", "Mass added or removed at the neutral point"], "a": 3, "x": "[Oxford ATPL Book 6 · p113 Q13]"}, {"type": "mcq", "t": "An aircraft is about to depart on an oceanic sector from a high elevation airfield with an exceptionally long runway in the tropics at 1400 local time. The regulated take-off mass is likely to be limited by :", e. 5. Brake fade could occur.", "o": ["1 and 5 only", "3 and 4 only", "2, 3, 4 and 5 only", "1, 3, 4 and 5 only"], "a": 2, "x": "🔁 Also appears in an earlier chapter.\n\n[Oxford ATPL Book 6 · p114 Q20]"}, {"type": "mcq", "t": "What is the zero fuel mass?", "o": ["MTOM minus fuel to destination minus fuel to alternative airfield", "Maximum allowable mass of the aircraft with no usable fuel on board", "Operating mass minus the fuel load", "Actual loaded mass of the aircraft with no usable fuel on board"], "a": 3, "x": "🔁 Also appears in an earlier chapter.\n\n[Oxford ATPL Book 6 · p114 Q21]"}, {"type": "mcq", "t": "An aeroplane develops a serious maintenance problem shortly after take-off and has to return to its departure airfield. In order to land safely the aircraft must jettison fuel. How much fuel must be jettisoned.", "o": ["Sufficient to reduce the mass to the zero fuel mass", "The pilot calculates the amount of fuel to jettison to reduce the mass to a safe level at or below the RLM", "The fuel system automatically stops the jettison at the RLM", "As much as the pilot feels is just insufficient to land safely"], "a": 1, "x": "[Oxford ATPL Book 6 · p114 Q22]"}]}, {"id": "pfclimb", "icon": "📈", "color": "#a05828", "sub": "Chapter 3 climb set", "title": "Climb Questions", "questions": [{"type": "mcq", "t": "What happens to the drag of a jet aeroplane if, during the initial climb after take off, a constant IAS and constant configuration is maintained? (Assume a constant mass..", "o": ["The drag decreases", "The drag increases initially and decreases thereafter", "The drag remains almost constant", "The drag increases considerably"], "a": 2, "x": "[Oxford ATPL Book 6 · p218 Q1]"}, {"type": "mcq", "t": "The speed for best rate of climb is called?", "o": ["VO", "VY", "VX", "V2"], "a": 1, "x": "[Oxford ATPL Book 6 · p218 Q2]"}, {"type": "mcq", "t": "An increase in atmospheric pressure has, among other things, the following consequences on take-off performance:", "o": ["a reduced take-off distance and degraded initial climb performance", "a reduced take-off distance and improved initial climb performance", "an increases take-off distance and degraded initial climb performance", "an increased take-off distance and improved initial climb performance"], "a": 1, "x": "[Oxford ATPL Book 6 · p218 Q3]"}, {"type": "mcq", "t": "A higher outside air temperature:", "o": ["does not have any noticeable effect on climb performance", "reduces the angle of climb but increases the rate of climb", "reduces the angle and the rate of climb", "increases the angle of climb but decreases the rate of climb"], "a": 2, "x": "[Oxford ATPL Book 6 · p218 Q4]"}, {"type": "mcq", "t": "In un-accelerated climb:", "o": ["thrust equals drag plus the uphill component of the gross weight in the flight path direction", "thrust equals drag plus the downhill component of the gross weight in the flight path direction", "lift is greater than the gross weight", "lift equals weight plus the vertical component of the drag"], "a": 1, "x": "[Oxford ATPL Book 6 · p218 Q5]"}, {"type": "mcq", "t": "A jet aeroplane is climbing at a constant IAS with maximum climb thrust. How will the climb angle / the pitch angle change?", "o": ["Remain constant / decrease", "Remain constant / become larger", "Reduce / decrease", "Reduce / remain constant. General Principles Climb and Descent"], "a": 2, "x": "[Oxford ATPL Book 6 · p218 Q6]"}, {"type": "mcq", "t": "Take-off performance data, for the ambient conditions, show the following limitations with flap 10° selected: Runway or Field limit mass: 5,270 kg Obstacle limit mass: 4,630 kg If the estimated take-off mass is 5,000kg it would be prudent to consider a take-off with flaps at:", "o": ["20°, both limitations are increased", "5°, the obstacle limit mass is increased but the runway limit mass decreases", "5°, both limitations are increased", "20°, the obstacle limit mass is increased but the runway limit mass decreases"], "a": 1, "x": "[Oxford ATPL Book 6 · p219 Q7]"}, {"type": "mcq", "t": "A four jet-engined aeroplane whose mass is 150 000 kg is established on climb with engines operating. The lift over drag ratio is 14:1. Each engine has a thrust of 75 000 Newtons. The gradient of climb is: (given: g = 10 m/s².", "o": ["12.86%", "27%", "7.86%", "92%"], "a": 0, "x": "[Oxford ATPL Book 6 · p219 Q8]"}, {"type": "mcq", "t": "How does the best angle of climb and best rate of climb vary with increasing altitude?", "o": ["Both decrease", "Both increase", "Best angle of climb increases while best rate of climb decreases", "Best angle of climb decreases while best rate of climb increases"], "a": 0, "x": "[Oxford ATPL Book 6 · p219 Q9]"}, {"type": "mcq", "t": "Following a take-off determined by the 50 ft (15m) screen height, a light twin climbs on a 10% ground gradient. It will clear a 900 m high obstacle situated at 10,000 m from the 50 ft clearing point with an obstacle clearance of:", "o": ["85 m", "It will not clear the obstacle", "115 m", "100 m"], "a": 2, "x": "[Oxford ATPL Book 6 · p219 Q10]"}, {"type": "mcq", "t": "The rate of climb:", "o": ["is approximately the climb gradient multiplied by the true airspeed divided by 100", "is the downhill component of the true airspeed", "is angle of climb multiplied by the true airspeed", "is the horizontal component of the true airspeed"], "a": 0, "x": "[Oxford ATPL Book 6 · p219 Q11]"}, {"type": "mcq", "t": "Assuming that the required lift exists, which forces determine an aeroplane’s angle of climb?", "o": ["Thrust and drag only", "Weight and thrust only", "Weight, drag and thrust", "Weight and drag only. General Principles Climb and Descent"], "a": 2, "x": "[Oxford ATPL Book 6 · p219 Q12]"}, {"type": "mcq", "t": "Which of the following provides maximum obstacle clearance during climb?", "o": ["1.2Vs", "The speed for maximum rate of climb", "The speed, at which the flaps may be selected one position further UP", "The speed for maximum climb angle Vx"], "a": 3,
