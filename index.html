ur at approximately?", "o": ["7.0 nm from the threshold", "5.0 nm from the threshold", "6.0 nm from the threshold", "4.5 nm from the threshold"], "a": 1, "x": "The distance or range reguired to achieve given height change can be calculated using the 1 in 60 rule as follows: Height = (glideslope angkb/60 ) x Range This can be rearranged to give: Range = Height x 60 I glideslope angle Inserting the data provided in the question gives: Dividing this by 6080 ftlnm gives range = 4.9 nm or approximately 5 nm (option\n\n[Keith Williams · DESCENTS 95]"}, {"type": "mcq", "t": "What will be the rate of descent when flying down a 6% glide slope, at a groundspeed of 250 knots?", "o": ["1403 ftlmin", "1509 ftlmin", "1520 ftlmin", "1303 ftlmin"], "a": 2, "x": "The % slope of a climb or descent represents the ROD or ROC as a percentage of the groundspeed. So in a 6% descent the ROD is 6% or 0.06 x the groundspeed. So the ROD in ftlmin can be calculated by converting the ground speed into ftlmin then multiplying by the decimal equivalent of the %. So in a 6% descent at 250 Kts: Groundspeed the ROD = 0.06 x 250 kt x 101.3 ftlminlkt Which gives ROD = 1520 ftlmin (option c).\n\n[Keith Williams · DESCENTS 96]"}, {"type": "mcq", "t": "When 85 nm from a VOR you commence a descent from FL330 with the intention of arriving at the VOR at FL100. What rate of descent is required if your mean ground speed is 340 knots?", "o": ["1503 ftlmin", "1550 ftlmin", "1633 ftlmin", "1533 ftlmin"], "a": 2, "x": "The aircraft is to descend from FL330 to FL100. The required height change can be calculated using the equation: Required change = (New FL - Initial FL) x 100 ft The ground distance available is 85 nm and the ground speed is 340 Kts. So the time taken to descend will be 85 nm / 340 nmlh = 0.25 hours, which is 1 5 ROD can now be calculated using the equation: ROD = height change / time taken. Inserting the figures calculated above gives:\n\n[Keith Williams · DESCENTS 98]"}, {"type": "mcq", "t": "At 105 nm from a VOR an aircraft commences a descent from FL350 in order to arrive overhead the VOR at FL120. What rate of descent is required if the mean groundspeed in the descent is to be 250 knots?", "o": ["950 ftlmin", "913 ftlrnin", "744 ft/min", "847 ftlrnin"], "a": 1, "x": "The aircraft is to descend f r o b FL350 to FL120. The required height change qan be calculated using the equation: Required change = (New FL j- Initial FL) x 100 ft The ground distance availablk is 105 nm and the ground speed is 250 Kts. So the time taken to descend bill be 105 nm / 250 nm/h = 0.42 hours, which is 25.2 minutes. ROD can now be calculated qsing the equation: ROD = height change / time taken. Inserting the figures calculated above gives: ROD = 23000 ftl25.2 min = 9112.7 or approximately 913 ftlmin (option b). The 1 in 60 rule states that over any given range, the height change = range x Inserting the data provided i?r this question gives: Height change between the I k S beam a t the threshold and the aircraft is = 18 nm But the ILS beam passes 50 ft above the threshold, so the height of the aircraft relative to the threshold is 5472 + 50 = 5522 ft (option a).\n\n[Keith Williams · DESCENTS 99]"}, {"type": "mcq", "t": "An aircraft leaves A to fly to B, 95 NM distance. Having flown 35 NM, the aircraft position is found from a ‘pinpoint’ (a geographical point over which the aircraft has flown); the pinpoint is 7 NM right of track.", "o": ["What is the track error?", "What alteration of heading is required to fly direct to B?", "What is the drift? (Trap question)"], "a": 0, "x": "12° right\n\n[Oxford ATPL · Oxford Ch11 Q3]"}, {"type": "mcq", "t": "Using the detail in questions 2 - 4, what rates of descent (ROD) are required to maintain the glide slopes in:", "o": ["question 2 if ground speed is 120 kt", "question 3 if ground speed is 180 kt", "question 4 if ground speed is 150 kt"], "a": 0, "x": "700 ft/min\n\n[Oxford ATPL · Oxford Ch12 Q5]"}, {"type": "mcq", "t": "You are flying an airway with a centre line QDM of 137 °(M) towards VOR/DME ‘A’. Your RMI reads 141°(M)/DME 90 NM.", "o": ["Are you left or right of centre line?", "What is your distance off the airway centre line?", "Are you in trouble with ATC? (Airways normally extend 5 NM either side of the centre line)"], "a": 0, "x": "left\n\n[Oxford ATPL · Oxford Ch12 Q8]"}]}, {"id": "ch12", "icon": "🛰️", "color": "#a05828", "sub": "Alignment · Schuler · RLG · FMC", "title": "INS / IRS / FMS / EFIS", "questions": [{"type": "mcq", "t": "Gyro compassing of an inertial reference system (IRS) is accomplished with the mode selector switched to?", "o": ["ALIGN", "STBY", "NAV", "ATT REF"], "a": 3, "x": "The Boeing 737-400 FMS is coupled to an Inertial reference System (IRS). This includes a back up battery and memory, which is able to remember the position of tlie aircraft a t the time of shut down a t the end of a flight. When the system is switched on in preparation for the next flight the pilot is required to input the geographical coordinates of its position. The IRS then compares these with the coordinates stored in IRS memory and warns the pilot if they are not the same. In this way the system is able to reject initial latitude and longitude errors (option d). This is an improvement on the older INS systems, which were only able to detect latitude errors.\n\n[Keith Williams · INS/IRS/FMS/EFIS 1]"}, {"type": "mcq", "t": "Some inertial reference and navigation systems are known as \"strapdown\". This means that?", "o": ["The accelerometers are fixed to the aircraft structure but the gyros are stabilised", "The gyros are stabilised but the accelerometers are fixed to the aircraft structure", "The gyroscopes and accelerometers become part of the unit's fixture to the aircraft structure", "The indicator units are strapped to the aircraft structure"], "a": 2, "x": "The principal difference between Inertial Navigation Systems (INS) and Inertial Reference systems (IRS) is that INS uses accelerometers mounted on gyro- stabilised platforms, whereas IRS platforms are not stabilised, but are fixed rigidly to the aircraft dtructure. The term \"strapdown\" refers to the IRS method, in which the gyroscopes and accelerometers become part of the unit's fixture to the aircraft structure (option c).\n\n[Keith Williams · INS/IRS/FMS/EFIS 3]"}, {"type": "mcq", "t": "In order to maintain an accurate vertical using a pendulous system, an aircraft inertial platform incorporates a device?", "o": ["With damping and a period of 84.4 MIN", "With damping and a period of 84.4 SEC", "With damping and a period of 48.4 MIN", "With damping and a period of 48.4 SEC"], "a": 0, "x": "The principal difference between Inertial Navigation Systems (INS) and Inertial Reference systems (IRS) is that INS uses accelerometers mounted on gyro- stabilised platforms, whereas IRS platforms are not stabilised, but are fixed rigidly to the aircraft structure. Both types of system are subject to oscillation errors as the unit is transported around the earth. The term \"Schuler tuning\" refers to a process by which such errors are reduced or eliminated. The Schuler tuning process is based on an oscillation period of 84.4 minutes (option a).\n\n[Keith Williams · INS/IRS/FMS/EFIS 5]"}, {"type": "mcq", "t": "In what way does IRS differ from INS?", "o": ["Has a shorter spin-up time and suffers from laser lock", "Does not need to correct for coriolis and central acceleration", "Has a longer spin-up time and is not affected by vertical accelerations due to gravity", "Does not experience Schuler errors as accelerometers are strapped down"], "a": 0, "x": "The principal advantdge of an IRS compared to an INS is that because the IRS does not use a gyro-stabilised platform, it is less complicated and has fewer moving parts. This makes the IRS more reliable and more accurate that the INS. A further advantige of the IRS is that it uses laser ring gyros rather than conventional spinning +ass gyros as used in the INS. Because IRS systems have no moving gyroscopes, they require a much shorter spin-up time than an INS with rotating gyros. One disadvantage of laser gyros however is the fact that they are sr~sceptibleto errorsdue to a phenomenon termed laser lock. So an IRS has a sorter spin-uptime and suffers from laser lock (option a).\n\n[Keith Williams · INS/IRS/FMS/EFIS 6]"}, {"type": "mcq", "t": "Which of the following statements is true of a Ring Laser Gyro?", "o": ["It is not necessarily fixed to true north and is quick to erect", "It is fixed to true north and is quick to erect", "It doesn't suffer from 'lock in' and is unaffected by the earth's gravitational force", "It is not necessarily fixed to true north but takes along time to erect"], "a": 0, "x": "Ring laser gyros, do no! employ spinning rotors, but use variations in the length of travel of beams of light within a triangular housing. Because there is no spinning mass to be accelerated to operating RPM, laser gyros can be erected more quickly than convkntional gyros. Laser gyros are employed in Inertial Reference systems (IRS). Unlike an INS, an IRS does not use a gyro-stabilised platform, but uses a platform mounted directly onto the aircraft structure. Although the platform @itchesand rolls with the aircraft, the IRS computers continuously calculate tFe true north, and vertical directions. The signals from the various gyros and accelerometers are then modified to take account of the actual alignment relatiqe to true north and vertical. This means that the laser gyros do not need to be aligned with true north. So a ring laser gyro it is not necessarily fixed to truei north and is quick to erect (option a).\n\n[Keith Williams · INS/IRS/FMS/EFIS 7]"}, {"type": "mcq", "t": "In a laser reference system (IRS), as compared to a gyro reference system (INS):", "o": ["The accelerometers are strapped down but the platform is gyro stabilised", "Accelerometers and platform are both strapped down", "The platform is strapped down but the accelerometers are gyro-stabilised", "Accelerometers and platform are both gyro-stabilised"], "a": 1, "x": "The principal advantage of an IRS compared to an INS is that because the IRS does not use a gyro-stablilised platform, it is less complicated and has fewer moving parts. Instead of a gyro stabilized platform the accelerometers and gyros in an IRS are strapped directly to the aircraft structure (option b). This makes the IRS more reliable a$d more accurate that the INS. A further advantage of the IRS is that it uses laper ring gyros rather than conventional spinning mass gyros as used in the INS. Because IRS systems have no moving gyroscopes, they require a much shorter spin-up time than an INS with rotating gyros.\n\n[Keith Williams · INS/IRS/FMS/EFIS 8]"}, {"type": "mcq", "t": "In a ring laser gyro, the purpose of the dither motor is to:", "o": ["Compensate for transport wander", "Stabilise the laser frequencies", "Enhance the accuracy of the gyro at all rotational rates", "Overcome laser lock"], "a": 3, "x": "The ring laser gyro senqes rates of rotation by measuring the difference between the resonant frequencies of two laser beams. The two beams travel in opposite directions around the triangle and are captured by a collecting mirror and detector unit. The detector unit then compares the resonant frequencies of the two beams to measure the difference between the two. These resonant frequencies are proportfonal to the length of the resonant structure through which they have passed.i If the gyro is stationary the path taken by the two beams and hence the reionant frequencies are identical. If however the aircraft yaws, the gyro will rotate with it. This means that the path of the beam travelling in the same direction as the gyro becomes slightly longer, whilst that of the other beam becomes slightly shorter. This difference in path length will cause a pifference in resonant frequency that is proportional to the rate and direction of rotation. But when the gyro is rotating scatter from the mirrored surfaces sohetimes causes the beams to lock together making the detection of small yaw rates impossible. To prevent this laser lock, a piezo- electric dither motor vibrates the gyro a t a resonant frequency, thereby causing the beams to unlock (option d). A simple ring laser gyro is illustrated below. 7 DII'HER M W O R VIUMI'ES(;YRO TO PREVENT LASER LOCK 5 PRISM REFLECPS LASER LIGHT ON1'0 ...\n\n[Keith Williams · INS/IRS/FMS/EFIS 9]"}, {"type": "mcq", "t": "A pilot turns off the power to his IRS whilst in flight. He switches it on again after just a few seconds. What will be the effect?", "o": ["It can be repositioned whilst in flight", "There will be no effect", "It cannot be used and must be shut down", "It cannot be used for navigation, but can be used to provide attitude information"], "a": 3, "x": "The principal of operation of an IRS is that the platform is mathematically aligned qo a known position and orientation prior to flight, then continuously recalculates its position and orientation by sensing all accelerations experienced by the aircraft during the subsequent flight. ~ h e i accelerations e are integrated once to give velocities and again to give distance moved. The ability of an IRS to provide accurate navigation information at any point during a flight is therefore dependent upon its having sensed all accelerations throughout all of the previous stages of the flight. Whenever an IRS is switched off its memory retains details of the situation a t the time of shutdown, but it is unable to detect accelerations that occur throughout the period during which it is left shut down. If the IRS is then switched on again, all subsequent navigation calculations will be based upon the posit/on a t the inqant a t whieh the shutdown occurred. Such calculations will therefore be inaccurate. A furthet. problem is that the platform will move out of alignment as the aircraft pitches rolls and yaws during the period of shutdown. Under normal circumstances after shut down on the ground, the platform would re-align itself prior the start of the next flight. But during the period of this alignment process the aircrnft must not be moved. So if an IRS is switched off in the air it ...\n\n[Keith Williams · INS/IRS/FMS/EFIS 10]"}, {"type": "mcq", "t": "In which IRS mode does gyro-compassing take place?", "o": ["ATT", "ALIGN", "ON", "NAV"], "a": 1, "x": "The term \"gyro compassing\" refers to the process whereby an IRS or INS system aligns itself with True Nairth prior to flight. It is achieved with the aircraft stationary on the groundland the \"ALIGN\" selected on the controller (option b). INS IRS FMS EFIS 12 c., If the spin axis of a gyro beparts from its initial orientation it is said to wander. If this change of orientation is in the horizontal plane then this wander is termed drift. If the change of orientation is in the vertical plane it is termed topple. So gyro drift occurs in the hbrizontal plane (option c).\n\n[Keith Williams · INS/IRS/FMS/EFIS 11]"}, {"type": "mcq", "t": "The IRS position is updated?", "o": ["Updating is normally carried out by the crew when over-flying a known position (VOR station or NDB)", "IRS positions are updated by pressing the 'Take-off/ Go-around' button at the start of the take-off roll", "During flight IRS positions are automatically updated by the FMC", "Only on the ground during the alignment procedure"], "a": 3, "x": "In considering this type f question its should be noted that the IRS position and tlie FMS position are twa different things. The INS position can be updated only on the ground during thd aIignment process (option d). But the FMS position is continuously using data from the IRS and various radio navigation aids. The FMS position is also updbte when the TOGA button is pushed a t the start of the talte-off roll. I\n\n[Keith Williams · INS/IRS/FMS/EFIS 14]"}, {"type": "mcq", "t": "Some inertial reference systems are known as 'strapdown'. This means:", "o": ["The system is mounted on a stabilised platform", "The gyros are fixed but the accelerometers are stabilised", "The system is mounted and fixed to the aircraft structure", "The accelerometers are fixed but the gyros are stabilised"], "a": 2, "x": "The principal difference between Inertial Navigation Systems (INS) and Inertial Reference systems (IRS) is that INS uses accelerometers mounted on gyro- stabilised platforms, whefeas IRS platforms are not stabilised, but are fixed rigidly to the aircraft strhcture. The term \"strapdown\" refers to the IRS method, in which the system is mounted and fixed to the aircraft structure (option c). INS 1RS:FMS EFIS 16 b. Tlie t e r d \"integration\" refers to a mathematical process whereby the outputs of the acceieromeiers in1an IRS or INS are converted into velocities and distances. An accellerometer produces an output signal that is proportional to acceleration in tlie direction of its alignment. The first integration of this signal produces another signal that is proportional to velocity. The second integration gives a signal thlat is proportional to distance moved. So the second integration of the output from an Eastlwest accelerometer is distance eastlwest (option b).\n\n[Keith Williams · INS/IRS/FMS/EFIS 15]"}, {"type": "mcq", "t": "The principle of 'Schuler Tuning' as applied to the operation of Inertial Navigation Systems/Inertial Reference Systems is applicable to:", "o": ["Only gyro-stabilised systems", "Both gyro-stabilised platform and strapdown systems", "Both gyro-stabilised and laser gyro systems but only when operating in the non 'strapdown' mode", "Only to 'strapdown' laser gyro systems"], "a": 1, "x": "Tlie pridcipal difference between Inertial Navigation Systems (INS) and Inertial Reference systems (IRS) is that INS uses accelerometers mounted on gyro- stabilised platforms, whereas IRS platforms are not stabilised, but are fixed rigidly to the aircraft structure. Both types of system are subject to oscillation errors as the unit is transported around the earth. The term \"Schuler tuning\" refers to a process by which such errors are reduced or eliminated. The Schuler tuning pirocess is applicable to both the gyro-stabilised platform and the strapdown systems (option b). INS I R a FMS EFIS 48 a. Tlie term \"integration\" refers to a mathematical process whereby the outputs of the accelerometers in an IRS or INS are converted into velocities and distances. An accelerometer produces an output signal that is proportional to acceleration in tlie dikection of its alignment. The first integration of this signal produces another signal that is proportional to velocity. The second integration gives a signal that is proportional to distance moved. So the output of the first stage integratbr of the northlsouth accelerometer is velocity along the local meridian (option a).\n\n[Keith Williams · INS/IRS/FMS/EFIS 17]"}, {"type": "mcq", "t": "Alignment of INS and IRS equipments can take place in which of the following modes?", "o": [", ALIGN only", "ALIGN and ATT", "ATT and ALIGN", "NAV and ALIGN"], "a": 3, "x": "In most INS and IRS systems the alignment process can be carried out only in the ALING mode. Bat in the Boeing 737-400 aircraft alignment can be carried out either in ALIGN or in NAV modes (option d), provided the aircraft is stationai-y on the g r o l n d at the time.\n\n[Keith Williams · INS/IRS/FMS/EFIS 19]"}, {"type": "mcq", "t": "On a triple-fit IRS system, present positions on the CDU?", "o": ["Are likely to differ as the information comes from different sources", "Will only differ if one IRS has been decoupled due to a detected malfunction", "Will only differ if an initial input error of aircraft position has been made", "Will not differ as the information is averaged"], "a": 0, "x": "On a triple fit IRS system the positions calculated by each IRS will be subject to its own individual minor errors. So because each of the three IRS positions is derived from different IRS systems with different error rates, the three positions will inevitably be slightly different (option a).\n\n[Keith Williams · INS/IRS/FMS/EFIS 20]"}, {"type": "mcq", "t": "What are the positions (in the order left to right) on the Boeing 737-400 IRS Mode Selector Unit (MSU)?", "o": ["OFF STBY ATT NAV", "OFF ALIGN NAV ATT", "OFF STBY NAV ATT", "OFF STBY ALIGN NAV"], "a": 1, "x": "IRS modes are usually selected by means of a rotary switch. On the Boeing 737- 400 IRS Mode Selector Unit (MSU) the switch positions listed from left to right (clockwise) are in the order OFF, ALIGN, NAV, ATT (option b)\n\n[Keith Williams · INS/IRS/FMS/EFIS 21]"}, {"type": "mcq", "t": "Gyro-compassing in an INS?", "o": ["It is not possible in flight because the gyros cannot differentiate between acceleration due to aircraft movement and initial alignment errors", "d. Is possible in flight as the gyros cannot differentiate between acceleration due to aircraft movement and initial alignment errors", "Is possible in flight as the gyros can differentiate between acceleration due to aircraft movement and initial alignment errors", "Is not possible in flight as the gyros can differentiate between acceleration due to aircraft movement and initial alignment errors"], "a": 0, "x": "The term \"Gyro compassing\" refers to the process whereby an INS platform is aligned in azimuth. To achieve this, the gyro normally used to stabilize the platform about the EastlbVest axis is connected to the azimuth gimbal motor. When the platform is cofrectly aligned in azimuth the East gyro will not be subject to rotation of its pxis by Earth rotation. But when the platform is out of alignment the East gyro will detect a component of earth rotation the produce an output signal. This signal is then used to apply torque to the azimuth motor until the platform is aligned. But when the aircraft is in flight, the stabilizing gyro is used to stabilise the platdorm, by sensing accelerations caused by the motion of the aircraft. Gyro compassing is not therefore possible in flight because the gyros cannot differentiatle between acceleration due to aircraft movement and initial alignment errors (bption a).\n\n[Keith Williams · INS/IRS/FMS/EFIS 22]"}, {"type": "mcq", "t": "In an INSIIRS, an azimuth gyro is found to have a drift rate. If t is the time since selecting the MSU from ALIGN to NAV the azimuth gyro heading error is?", "o": ["Proportional to t", "Proportional to the square root oft", "Proportional to tl2", "Sinusoidal"], "a": 0, "x": "The drifting of an azimuth gyro may be caused by a number of factors. The first of these is Earth Rate wqnder. This is caused by the rotation of the Earth. The drift caused by Earth Rdte (in degrees per hour) is equal to 1 5 times the sine of the latitude. The second possible cause is Transport Wander. This is caused by the movement of the aircraft across the surface of the earth. This (in degrees per hour) is equal to the 1/60 of the ground speed multiplied by the tangent of the latitude. The third possible cause is due to mechanical imperfections in the gyros. All three of these1 causes of drift are directly proportional to the elapsed time since the system wai switched from ALIGN to NAV (option a). INS IRS FMS EFIS 24 c.: The ATT selection is norbally used following a computer/processing failure. With ATT selected all of the navigation computations are disabled but the system is still able to provide pitch, roll and heading information. Option c is therefore the most accurate in this question. INS IRS FMS EFIS 25 c.1 Because they do not use bechanical gyros with spinning masses and do not physically level the platform, an IRS is able to complete the alignment process much more quickly than an INS. A modern IRS can complete alignment within 10 minutes (option c). INS IRS FMS EFIS 26 a.1 A simple ring laser gyro is illustrated below. 7 DITHER MO'l'OKVIBL4TES GYRO TO PKEVEHT ...\n\n[Keith Williams · INS/IRS/FMS/EFIS 23]"}, {"type": "mcq", "t": "The platform of an inertial navigation system (INS) is maintained at right angles to the local vertical by applying corrections for the effects of?", "o": ["Aircraft manoeuvres, earth rotation, transport wander and coriolis", "Movement in the yawing plane, secondary precession and pendulous oscillation", "Gyroscopic inertia, earth rotation and real drift", "Vertical velocities, earth precession, centrifugal forces and transport drift"], "a": 0, "x": "In order to ensure that the accelerometers in an INS sense only accelerations in their required directiods, it is essential that the platform remains level throughout all phases af flight. In order to achieve this, it is necessary to apply corrects to counter the kffects of a number of factors. The first of these is the pitching, rolling and yawing of the aircraft as it manoeuvres in flight. The second and third factors a r e Earth Rate Wander, caused by the rotation of the Earth and Transport Wanders caused by the movement of the aircraft above the surface of the earth. The fourth factor is coriolis effect which is caused by the fact that the aircraft takes a curved path around the world. Option a, is therefore the most accurate in this question.\n\n[Keith Williams · INS/IRS/FMS/EFIS 28]"}, {"type": "mcq", "t": "In an Inertial Navigation System (INS), Ground Speed (GS) is calculated?", "o": ["By integrating gyro precession in N/S and EIW directions respectively", "From TAS and WN from Air Data Computer (ADC)", "By integrating measured acceleration", "From TAS and WN from RNAV data"], "a": 2, "x": "The term \"integration\" refers to a mathematical process whereby the outputs of the accelerometers in an IRS or INS are converted into velocities and distances. An accelerometer produces an output signal that is proportional to acceleration in the direction of its alignment. The first integration of this signal produces another signal that is ptoportional to velocity. The second integration gives a signal that ed off its memory retains details of the situation a t the t i ~ of e shutdown, but it is unable to detect accelerations that occur throughout the period during which it is left shut down. The system will therefore lose its pq~itionas the flight progresses. If the IRS is then switched on again, all subsequent navigation calculations will be based upon the position a t the instant a t which tBe shutdown occurred. Such calculations will therefore be inaccprate. So if a n IRS loses its position in flight it cannot be used in the NAV made for the relmainder of the flight (option a). INS IRa FMS EFIS 32 b. The t e r d ~\"integration\" refers to a mathematical process whereby the outputs of the accelerometers in an IRS or INS are converted into velocities and distances. An ...\n\n[Keith Williams · INS/IRS/FMS/EFIS 31]"}, {"type": "mcq", "t": "The dither motor in a ring laser gyro sis used to?", "o": ["Compensate for transport wander", "Stabilise the laser frequencies", "Enhance the accuracy of the gyro at all rotational rates", "Overcome laser lock"], "a": 3, "x": "A simple ring laser gyro ib illustrated below. 7 Dl I HER MOI'OR V ~ I I W I ' E SGYRO 1 0 PRCVEh l L A S ~ RLOCK 5 PRISM REFLECTS LASER LIGHT ONTO FREQUENCIES O F T H E TWO LASER UEAMS HOLE lh' COLLECTING MlROR hllRRORS REFLECT LASER LIGHT AqOUSD C O W E R S 2 C A T H ~ D EATTRACTS ELECTRONS INTO LASER GYRO LASER RING GYRO The ring laser gyro senses rates of rotation by measuring the difference between the resonant frequencies of two laser beams. The two beams travel in opposite directions around the triangle and are captured by a collecting mirror and detector Unit. The detector unit then compares the resonant frequencies of the two beams to measurelthe difference between the two. These resonant frequencies are proportional to the length of the resonant structure through which thqy have passed. If the gyro is stationary the path taken by the two beams and hence the I'esonant frequencies are identical. If howe the period of this alignment process the aircraft must not belmoved. So if an IRS is switched off in ...\n\n[Keith Williams · INS/IRS/FMS/EFIS 44]"}, {"type": "mcq", "t": "Where and when are the IRS positions updated?", "o": ["During flight IRS positions are automatically updated by the FMC", "Only on the ground during the alignment procedure ", "Updating is normally carried out by the crew when over-flying a known position (VOR station or NDB)", "IRS positions are updated by pressing the 'Take-off1 Go-around' button at the start of the take-off roll"], "a": 1, "x": "In considering this typezofquestion its should be noted that the IRS position and the FMS position are d o different things. The INS position can be updated only on the ground during the alignment process (option b). But the FMS position is continuously using datalfrom the IRS and various radio navigation aids. The FMS position is also update when the TOGA button is pushed a t the start of the take-off roll. INS IRS FiMS EFIS 461 C. The principal differenee between Inertial Navigation Systems (INS) and Inertial Reference1systems (IRS) is that INS uses accelerometers mounted on gyro- stabilised platforms, whereas IRS platforms are not stabilised, but are fixed rigidly to the aircraft structure. The IRS system mounted and fixed to the aircraft structure is termed \"strapdown\" (option c). INS IRS l?MS EFIS 471 d. The term ''integration+ refers to a mathematical process whereby the outputs of the accelerometers in an IRS o r INS are converted into velocities and distances. An acceletometer produces an output signal that is proportional to acceleration in the direction of its alignment. The first integration of this signal produces allother signal that is proportional to velocity. The second integration gives a signal that is proportidnal to distance moved. So the second integration of the output frdm an Eastlwkst accelerometer is distance eastiwest (option d).\n\n[Keith Williams · INS/IRS/FMS/EFIS 45]"}, {"type": "mcq", "t": "The principle of 'Schuler Tuning' as applied to the operation of Inertial Navigation SystemslInertial Reference Systems is applicable to:", "o": ["Only gyro-stabilised systems", "Both gyro-stabilised platform and strapdown systems", "Both gyro-stabilised and laser gyro systems but only when operating in the non 'strapdown' mode", "Only to 'strapdown' laser gyro systems"], "a": 3, "x": "The principal differenbe between Inertial Navigation Systems (INS) and Inertial Referencd systems (IRS) is that INS uses accelerometers mounted on gyro- stabilised iplatforms, dhereas IRS platforms are not stabilised, but are fixed rigidly to ihe aircraft dtructure. ~ o t types h of system are subject to oscillation errors as the unit is trdnsported around the earth. The term \"Schuler tuning\" refers to a process by which such errors are reduced o r eliminated. The Schuler tuning process is applikable to both the gyro-stabilised platform and the strapdown systems (option d). INS IRS ]FMS EFIS 49 a. The term i6'integration?' refers to a mathematical process whereby the outputs of the acceletometers in An IRS or INS are converted into velocities and distances. An accelekometer prockuces an output signal that is proportional to acceleration in the direction of its dlignment. The first integration of this signal produces another signal that is $roportional to velocity. The second integration gives a signal thait is proportiqnal to distance moved. So first stage integration of the output from the northlsouth accelerometer is velocity northlsouth along the local meridian (option a). INS IRS ~ M EFISS 501b. In most INS and IRS dpstems the alignment process can be carried out only in the ALING mode. Butlin the Boeing 737-400 aircraft alignment can be carried out either in ALIGN o t in ...\n\n[Keith Williams · INS/IRS/FMS/EFIS 48]"}, {"type": "mcq", "t": "What does INS need for wind calculations?", "o": ["EAS", "TAS", "Mach Number", "Heading"], "a": 1, "x": "The term \"integration\" refers to a mathematical process whereby the outputs of the accelerometers in an INS are converted into velocities and distances. An accelerometer produces an output signal that is proportional to acceleration in the direction of its alignment. The first integration of this signal produces another signal that is proportional to velocity relative to the Earth. So ground speed is calculated by integrating acceleration. The difference between ground speed and TAS is the wind speed. So in order to calculate wind speed the INS also uses TAS (option b).\n\n[Keith Williams · INS/IRS/FMS/EFIS 63]"}, {"type": "mcq", "t": "What do you call a system of gyros and accelerometers that is fixed to the aircraft?", "o": ["Laser", "Stabilised", "Fixed", "Strapdown"], "a": 3, "x": "The principal difference between Inertial Navigation Systems (INS) and Inertial Reference systems (IRS) is that INS uses accelerometers mounted on gyro- stabilised platforms, whereas IRS platforms are not stabilised, but are fixed rigidly to the aircraft structure. The IRS system in which the gyros and accelerometers are fixed to the aircraft is termed \"strapdown\" (option d).\n\n[Keith Williams · INS/IRS/FMS/EFIS 64]"}, {"type": "mcq", "t": "What format is used to enter positions into INS systems?", "o": ["Waypoint names", "Hexadecimals", "Ranges and bearings", "Geographic coordinates"], "a": 3, "x": "Although INS systems designed by different manufacturers will inevitably differ in some respects, certain aspects are common to all systems. For example, positions are entered into all INS systems in the form of geographical coordinates (option d).\n\n[Keith Williams · INS/IRS/FMS/EFIS 66]"}, {"type": "mcq", "t": "When can a pilot change the data in the FMS database?", "o": ["Ewery 28 days", "When it is deemed to be necessary", "When there is a fault", "Never, because the FMS database is read-only"], "a": 3, "x": "The FMS database contains two sets of data each of which is valid for 28 days. Prior to each flight the pilot is able to select which set of data will be used. Maintenance personnel update the database regularly to ensure that it remains valid for all flights. From the viewpoint of the pilot, the FMS database is read only and can never be updated (option d).\n\n[Keith Williams · INS/IRS/FMS/EFIS 68]"}, {"type": "mcq", "t": "The FMC position is?", "o": ["The average of the IRS positions", "Computer generated from the radio navigation positions", "Half way between the IRS and radio navigation positions", "Computer generated from the IRS and radio navigation positions"], "a": 3, "x": "The position calculated by the IRS is most accurate immediately after alignment at the gate. As the flight progresses minor errors in detecting accelerations and integrating the results, cause the accuracy of the IRS position to gradual degrade. In order to compensate for this gradual degradation, the Flight Management Computer (FMC) continuously calculates aircraft position using information provided by the IRS and various radio navigation aids (option d). Because the information from radio aids is not cumulative, its accuracy does not degrade as the flight progresses. So by combining inputs from the IRS and the radio navigation aids, the FMC is able to maintain a more accurate estimate of aircraft position.\n\n[Keith Williams · INS/IRS/FMS/EFIS 69]"}, {"type": "mcq", "t": "What is the source of magnetic variation information in a Flight Management System (FMS)?", "o": ["The main directional gyro, which is coupled to the magnetic sensor (flux valve) positioned in the wingtip", "The FMS calculates M H and MT from the FMC position", "Magnetic variation information is stored in each IRS memory; it is applied to the true heading calculated by the respective IRS", "Magnetic variation is calculated by each IRS based on the respective IRS position and the aircraft magnetic heading"], "a": 2, "x": "An IRS system includes a memory in which it holds extensive records concerning the earth, together with the algorithms employed in making navigation computations. These records include details of Magnetic variation a t various points on the Earth. These details of Magnetic variation are applied to the true heading calculated by the respective IRS in order to calculate magnetic headings (option c).\n\n[Keith Williams · INS/IRS/FMS/EFIS 70]"}, {"type": "mcq", "t": "What are, in order of highest priority followed by lowest, the two levels of message produced by the CDU of the B737-400 Electronic Flight Instrument System?", "o": ["Warning and Advisory", "Caution and Advisory", "Urgent and Routine", "Warning and Caution"], "a": 0, "x": "Messages provided by the CDU of a Boeing 737-400 EFIS fall into three categories. The highest priority massages are Warnings. These relate to situations or events requiring immediate corrective action on the part of the crew. The second priority messages are Cautions. These refer to situations or events, which do not require immediate corrective action, but which may affect the performance or operation of tbe aircraft. The lowest category is Advisory messages, which informlthe crew of routine changes in the status of the aircraft and its systems, which do not require corrective action, Option a, is therefore the most accurate in this question. INSIRS FMS EFIS 72 In the Boeing 739-400 aircraft the MCDU is used for a number of functions including inserting data into the FMS and IRS. Prior to the start of a flight, the MCDU is used to initialize the TRSs such that the carry out their initial alignment processes. In addition to this the MCDU is used to insert dispatch information such as destination, waypoints and cost index values, in$o the FMS, It should be noted that the MCDU is not used to input data directly into the Flight Director nor Autothrottle because these systems get their information via the FMS. Option a, is therefore the most accurate in this question.\n\n[Keith Williams · INS/IRS/FMS/EFIS 71]"}, {"type": "mcq", "t": "The FMS on a 737-400 provides?", "o": ["Automatic navigation & manual performance management", "Automatic navigation & automatic performance management", "Manual navigation & manual performance management", "Manual navigation & automatic performance management"], "a": 1, "x": "The Boeing 737-400 Flight Management System (FMS) takes inputs from a wide range of sotlrces including the IRS, Air Data Computers, MCDU, radio navigatioil aids, Autopilot, Flight Director, and Autothrottle system. By combining the data from these sources it is able to provide a range of services. These include automatic navigation and automatic performance management (option b). As an example of this letter function, the pilot can control the trade- off between fuel costs and flight duration, by inputting various cost index values into the FMS MCDU. INS TRS FMS EFIS 74 b. The first page used after powering up the system is IDENT, which allows the crew to confirm the details of the aircraft. This in turn causes the system to produce a series of prompts to guide the crew through the route procedures that need to be generated for the flight. The second page is POS INIT, which enables the crew to confirm that the FMS clock and the aircraft clock are synchronised. This page is then used to align the TRS. The third page is RTE, which appears after the tasks on the POS INIT page have been completed. The RTE page is used to input details such as destination airport and route to be flown. Option b is therefore the most accurate in this question.\n\n[Keith Williams · INS/IRS/FMS/EFIS 73]"}, {"type": "mcq", "t": "FMC aircraft position determined by radio navigation is derived on the B737- 400 FMS from?", "o": ["VOWDME", "DME IADF", "VOWVOR", "DMEIDME"], "a": 3, "x": "FMC positions can be updated using information form various radio navigation aids. The most accurate of those used in the Boeing 737-400 is DMEIDME (option d)\n\n[Keith Williams · INS/IRS/FMS/EFIS 75]"}, {"type": "mcq", "t": "When initial position is put into a B737-400 FMS, the system?", "o": ["Rejects initial latitude error, but it will accept longitude error", "Rejects initial longitude error, but it will accept latitude error", "Rejects initial latitude or longitude error", "Cannot detect input errors, and accepts whatever is put in"], "a": 2, "x": "The Boeing 737-400 FMS is coupled to an Inertial reference System (IRS). This incl~ldesa back up battery and memory, which is able to remember the position of the aircraft a t the time of shut down at the end of a flight. When the system is switched on in preparation for the next flight the pilot is required to Input the geographical coordinates of its position. The IRS then compares these with the coordinates stored in IRS memory and warns the pilot if they are not the same. In this way the system is able to reject initial latitude and longitude errors (option c). This is an improvement on the older INS systems, whicl~were only able to detect latitude errors.\n\n[Keith Williams · INS/IRS/FMS/EFIS 76]"}, {"type": "mcq", "t": "The period of validity of an FMS database is?", "o": ["56 days", "One week", "28 days", "Variable"], "a": 2, "x": "The FMS database contains two sets of data each of which is valid for 28 davs (option c). Prior to each flight the pilot is able to select which set of data will be used. Maintenanke personnel update the database regularly to ensure that it remains valid for all flights. From the viewpoint of the pilot, the FMS database is read only and can never be updated.\n\n[Keith Williams · INS/IRS/FMS/EFIS 77]"}, {"type": "mcq", "t": "On the Boeing 737-400 EFIS EHSI, on which modes is a Weather Radar Display available?", "o": ["MAP, PLAN, FULL VOWILS", "MAP, PLAN, EXP VOR'ILS", "MAP, EXP VORIILS, E S P NAV", "MAP, FULL VORIILS, h $-'ILLNAV"], "a": 2, "x": "In designing their systems, each manufacturer determines the range of functions that will be provided and the means by which these functions can be accessed. Th  the earth, together with the algorithms employed in making navigation computations. These records include details of Magnetic variation a t various points on the Earth. These details of Magnetic variation are applied to the true heading calculated by the respective IRS in order to calculate magnetic headings (option a).\n\n[Keith Williams · INS/IRS/FMS/EFIS 84]"}, {"type": "mcq", "t": "What are, in order of highest priority followed by lowest, the two levels of message produced by the CDU of the B737-400 EFIS?", "o": ["Caution and Advisory", "Urgent and Routine", "Warning and Caution", "Warning and Advisory"], "a": 3, "x": "Messages provided by the CDU of a Boeing 737-400 EFIS fall into three categories. The highest priority massages are Warnings. These relate to situations or events requiring immediate corrective action on the part of the crew. The second priority messages are Cautions. These refer to situations or events, which do not require immediate corrective action, but which may affect the performance or operation of the aircraft. The lowest category is Advisory messages, which inform the crew of routine changes in the status-of the aircraft and its systems, which do not require corrective action. Option d, is therefore the most accurate in this question.\n\n[Keith Williams · INS/IRS/FMS/EFIS 85]"}, {"type": "mcq", "t": "The CDUs in the B737-400 Flight Management System are used during preflight to?", "o": ["Manually initialise the IRSs and FMC with dispatch information", "Manually initialise the IRSs, FMC and Autothrottle with dispatch information", "Automatically initialise the IRSs and FMC with dispatch information", "Manually initialise the Flight Director System and FMC with dispatch information"], "a": 0, "x": "In the Boeing 737-400 aircraft the MCDU is used for a number of functions including inserting data into the FMS and IRS. Prior to the start of a flight, the MCDU is used to initialize the IRSs such that the carry out their initial alignment processes. I n addition to this the MCDU is used to insert dispatch information such as destination, waypoints and cost index values, into the FMS. I t should be noted that the MCDU is not used to input data directly into the Flight Director nor Autothrottle because these systems get their information via the FMS. Option a, is therefore the most accurate in this question.\n\n[Keith Williams · INS/IRS/FMS/EFIS 86]"}, {"type": "mcq", "t": "The Boeing 737-400 Flight Management System (FMS) provides?", "o": ["Manual navigation & manual-performance management", "Manual navigation & automatic performance management", "Automatic navigation & manual performance management", "Automatic navigation & automatic performance management"], "a": 3, "x": "The Boeing 737-400 Flight Management System (FMS) takes inputs from a wide range of sources including the IRS, Air Data Computers, MCDU, radio navigation aids, Autopilot, Flight Director, and Autothrottle system. By combining the data from these sources it is able to provide a range of services. These include automatic navigation and automatic performance management (option d). As an example of this letter function, the pilot can control the trade- off between fuel costs and flight duration, by inputting various cost index values into the FMS MCDU.\n\n[Keith Williams · INS/IRS/FMS/EFIS 87]"}, {"type": "mcq", "t": "List the sequence of pages on start-up of the Boeing 737- 400 FMS?", "o": ["IDENT, POS INIT, RTE", "POS INIT, RTE, IDENT", "IDENT, POS INIT, DEPARTURES", "POS INIT, IDENT, DEPARTURES"], "a": 0, "x": "The first page used after powering up the system is IDENT, which allows the crew to confirm the details of the aircraft. This in turn causes the system to produce a series of prompts to guide the crew through the route procedures that need to be generated for the flight. The second page is POS INIT, which enables the crew to confirm that the FMS clock and the aircraft clock are synchronised. This page is then used to align the IRS. The third page is RTE, which appears after the tasks on the POS INIT page have been completed. The RTE page is used to input details such as destination airport and route to be flown. Option a, is therefore the most accurate in this question.\n\n[Keith Williams · INS/IRS/FMS/EFIS 88]"}, {"type": "mcq", "t": "In the Boeing 737-400 aircraft the FMC aircraft position determined by radio navigation is derived from?", "o": ["DMEIDME", "VORJDME", "DME /ADF", "VORNOR"], "a": 0, "x": "FMC positions can be updated using information form various radio navigation aids. The most accurate of those used in the Boeing 737-400 is DMEIDME (option a)\n\n[Keith Williams · INS/IRS/FMS/EFIS 89]"}, {"type": "mcq", "t": "When aligning the B737-400 FMS, the system?", "o": ["Rejects initial latitude or longitude error", "Cannot detect input errors, and accepts whatever is put in", "Rejects initial latitude error, but it will accept longitude error", "Rejects initial longitude error, but it will accept latitude error"], "a": 0, "x": "The Boeing 737-400 FMS is coupled to an Inertial reference System (IRS). This includes a back up battery and memory, which is able to remember the position of the aircraft a t the time of shut down a t the end of a flight. When the system is switched on in preparation for the next flight the pilot is required to input the geographical coordinate's of its position. The IRS then compares these with the coordinates stored in IRS memory and warns the pilot if they are not the same. In this way the system is able to reject initial latitude and longitude errors (option a): This is an improvement on the older INS systems,-which were only able to detect latitude errors.\n\n[Keith Williams · INS/IRS/FMS/EFIS 90]"}, {"type": "mcq", "t": "What is the period of validity of an FMS database?", "o": ["56 days", "One week", "28 days", "Variable"], "a": 2, "x": "The FMS database contains two sets of data each of which is valid for 28 days (option c). Prior to each flight the pilot is able to select which set of data will be used. Maintenance personnel update the database regularly to ensure that it remains valid for all flights. From the viewpoint of the pilot, the FMS database is read only and can never be updated.\n\n[Keith Williams · INS/IRS/FMS/EFIS 91]"}, {"type": "mcq", "t": "In what formats can created waypoints be entered into the scratch pad of the B737-400 FMS?", "o": ["Place BearingIDistance, Place DistanceIPlace Distance, Along-Track Displacement, Latitude and Longitude", "Place BearingIDistance, Place BearingIPlace Bearing, Across-Track Displacement, Latitude and Longitude", "Place, Place BearingIDistance, Along-Track Displacement, Latitude and Longitude", "Place BearingIDistance, Place BearingIPlace Bearing, Along-Track Displacement, Latitude and Longitude"], "a": 3, "x": "Each manufacturer of electronic equipment provides the range of facilities considered to be most appropriate at the time that the equipment is being designed. The methods available for the input of created waypoints in, depends upon the type of system being used. In the case of the B737-400 EFIS, these are methods are identifier berrring/dfstance; place bearing/place bearing; alohg-track displacemeat; latitude and longitude, (option d). INS IR§ FMS El??§94 d. The trend vector is represented on EFIS by a triangle with a series of dashed lines running from it in the direction of the trend (option d).\n\n[Keith Williams · INS/IRS/FMS/EFIS 93]"}, {"type": "mcq", "t": "What information is required by the FMS to enable it to calculate groundspeed ?", "o": ["Input from IRS", "Input from ADC of TAS and wind velocity", "Input from DME with change of range integrated with respect to time", "Input of heading from either the IRS or gyro compass, TAS from ADC and wind velocity from selected meteorological data"], "a": 0, "x": "The term \"integration7' refers to a mathematical process whereby the outputs of the accelerometers in a n IRS a r e converted into velocities and distances. An accelerometer produces a n output signal that is proportional to acceleration in the direction of its alignment. The first integration of this signal produces another signal that is proportional to velocity relative to the ground. So to carry out ground speed calculations the FMS uses inputs from the IRS (option a).\n\n[Keith Williams · INS/IRS/FMS/EFIS 95]"}, {"type": "mcq", "t": "Which FMCICDU page normally appears on initial power application to the B737-400 Electronic Flight Instrument System?", "o": ["IDENT", "POS INIT", "PERF INIT", "RTE"], "a": 0, "x": "W h e i ~first powered u p the Boeing 737-400 EFIS CDU displays the IDENT page (option a).\n\n[Keith Williams · INS/IRS/FMS/EFIS 96]"}, {"type": "mcq", "t": "A pilot accidentally turning OFF the INS in flight, and then turns it back ON a few moments later. Following this incident?", "o": ["I t cannot be used for the remainder of the flight", "It can only be used for attitude reference", "I t must be switched off or its gyros will topple", "I t can be used as normal"], "a": 1, "x": "The principal of operation of a n IRS is that the platform is mathematically aligned to a known position and orientation prior to flight, then continuously recalculates its position and orientation by sensing all accelerations experienced by the aircraft during the subsequent flight. These accelerations are integrated once to give velocities and again to give distance moved. The ability of a n IRS to provide accurate navigation information a t any point during a flight is therefore dependent upon its having sensed all accelerations throughout all of the previous stages of the flight. Whenever a n IRS is switched off its memory retains details of the situation a t the time of shutdown, but it is unable to detect accelerations that occur throughout the period during which it is left shut down. The system will therefore lose its position as the flight progresses. If the IRS is then switched on again, all subsequent s to a mathematical process whereby the outputs of tlie accelerometers in an IRS a r e converted into velocities and distances. The sensors in an INS measure acceleration in the direction of its alignment (option b). The Brst integration of the accelerometer output signal produces another signal that is proportional to velocity relative to the ground. The second integration produces a signal that is proportional to distance moved over the ground.\n\n[Keith Williams · INS/IRS/FMS/EFIS 100]"}, {"type": "mcq", "t": "Waypoints can be entered in a n INS memory in different formats. In which of the following formats can waypoints be entered into all INS systems?", "o": ["Grid references", "Airport names", "Geographic coordinates", "Index numbers"], "a": 2, "x": "Although INS systems designed by different manufacturers will inevitably differ in some respects, certain aspects are common to all systems. For example, positions are entered into all INS systems in the form of geographical coordinates (option c).\n\n[Keith Williams · INS/IRS/FMS/EFIS 101]"}, {"type": "mcq", "t": "How often can a pilot update the data in the FMS database?", "o": ["Every 28 days", "When it is deemed to be necessary", "When there is a fault", "Never, because the FMS database is read-only"], "a": 3, "x": "Tlie FMS database contains two sets of data each of which is valid for 28 days. Prior to each flight the pilot is able to select which set of data will be used. Maintenance personnel update the database regularly to ensure that it remains valid for all flights. From the viewpoint of the pilot, the FMS database is read only and can never be updated (option d).\n\n[Keith Williams · INS/IRS/FMS/EFIS 103]"}, {"type": "mcq", "t": "From what information is the FMC position calculated?", "o": ["Computer generated from the IRS and radio navigation positions", "The average of the IRS positions", "Computer generated from the radio navigation positions", "Half way between the IRS and radio navigation position
