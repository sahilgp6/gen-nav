re = ch.long (min) × cos lat, so ch.long = 900 ÷ cos 60° = 1800' = 30°. 160°E + 30° = 190°E, which is written as 170°W.\n\n[Keith Williams · CIRCLES 15 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "The 'departure' between positions 60°N 160°E and 60°N 'x' is 1200 NM. What is the longitude of 'x'?", "o": ["160°W", "200°E", "170°E", "140°E"], "a": 0, "x": "ch.long = 1200 ÷ cos 60° = 2400' = 40°. 160°E + 40° = 200°E, written as 160°W.\n\n[Keith Williams · CIRCLES 18 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "The 'departure' between positions 60°N 060°E and 60°N 'x' is 1800 NM East. What is the longitude of 'x'?", "o": ["120°E", "090°E", "150°E", "075°E"], "a": 0, "x": "ch.long = 1800 ÷ cos 60° = 3600' = 60° East. 060°E + 60° = 120°E.\n\n[Keith Williams · CIRCLES 19 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "The 'departure' between positions 60°N 100°E and 60°N 'x' is 1200 NM. What is the longitude of 'x'?", "o": ["140°E", "120°E", "160°E", "130°E"], "a": 0, "x": "ch.long = 1200 ÷ cos 60° = 2400' = 40°. 100°E + 40° = 140°E.\n\n[Keith Williams · CIRCLES 75 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "The 'departure' between positions 60°N 090°E and 60°N 'x' is 1200 NM. What is the longitude of 'x'?", "o": ["130°E", "110°E", "150°E", "120°E"], "a": 0, "x": "ch.long = 1200 ÷ cos 60° = 2400' = 40°. 090°E + 40° = 130°E.\n\n[Keith Williams · CIRCLES 78 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "The 'departure' between positions 60°N 160°E and 60°N 'x' is 1800 NM East. What is the longitude of 'x'?", "o": ["140°W", "220°E", "160°W", "130°E"], "a": 0, "x": "ch.long = 1800 ÷ cos 60° = 3600' = 60° East. 160°E + 60° = 220°E, written as 140°W.\n\n[Keith Williams · CIRCLES 79 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "The angle between the true great circle track and the true rhumb line track joining A (60°S 165°W) and B (60°S 177°E), at the place of departure A, is:", "o": ["7.8°", "15.6°", "9.0°", "4.5°"], "a": 0, "x": "Conversion angle = ½ × ch.long × sin(mean lat). Crossing the 180th meridian, 165°W to 177°E is 18°. CA = ½ × 18 × sin 60° = 7.79°, so about 7.8°.\n\n[Keith Williams · CIRCLES 31 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "An aircraft passes position A (60°00'N 120°00'W) en route to position B (60°00'N 140°30'W). What is the great circle track on departure from A?", "o": ["279°", "270°", "261°", "288°"], "a": 0, "x": "Both points share a latitude, so the rhumb line track is 270°. CA = ½ × 20°30' × sin 60° = 8.9°. Northern hemisphere westbound, the initial great circle track is the rhumb line plus the conversion angle: 270° + 9° = 279°.\n\n[Keith Williams · CIRCLES 36 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "An aircraft passes position A (75°00'N 120°00'W) en route to position B (75°00'N 140°30'W). What is the great circle track on departure from A?", "o": ["280°", "270°", "260°", "290°"], "a": 0, "x": "Rhumb line track 270°. CA = ½ × 20°30' × sin 75° = 9.9°. Initial great circle track = 270° + 10° = 280°.\n\n[Keith Williams · CIRCLES 96 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "What is the change of latitude from 52°15'N to 39°35'N?", "o": ["12°40'S", "12°40'N", "13°20'S", "91°50'S"], "a": 0, "x": "Same hemisphere, so subtract: 52°15' − 39°35' = 12°40'. Moving toward the equator from the north, so the change is southerly.\n\n[Oxford ATPL · Ch2 Q1a · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "What is the change of latitude from 49°35'N to 60°20'S?", "o": ["109°55'S", "10°45'S", "109°55'N", "10°45'N"], "a": 0, "x": "Crossing the equator, so add: 49°35' + 60°20' = 109°55', southerly.\n\n[Oxford ATPL · Ch2 Q1b · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "What is the change of latitude from 74°20'S to 34°30'S?", "o": ["39°50'N", "39°50'S", "108°50'N", "40°50'N"], "a": 0, "x": "Same hemisphere, subtract: 74°20' − 34°30' = 39°50'. Moving toward the equator from the south, so the change is northerly.\n\n[Oxford ATPL · Ch2 Q1c · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "What is the change of latitude from 71°20'N to 86°45'N travelling over the North Pole?", "o": ["21°55'", "15°25'", "18°40'", "158°05'"], "a": 0, "x": "Over the pole the two legs add: 90° − 71°20' = 18°40', then 90° − 86°45' = 3°15'. Total 21°55'. Going direct without crossing the pole would give 15°25'.\n\n[Oxford ATPL · Ch2 Q1d · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "What is the change of longitude from 075°40'W to 125°35'W?", "o": ["49°55'W", "49°55'E", "201°15'W", "50°55'W"], "a": 0, "x": "Same hemisphere, subtract: 125°35' − 075°40' = 49°55', westerly.\n\n[Oxford ATPL · Ch2 Q3a · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "What is the change of longitude from 001°20'E to 004°20'W?", "o": ["05°40'W", "03°00'W", "05°40'E", "03°00'E"], "a": 0, "x": "Crossing the Greenwich meridian, so add: 1°20' + 4°20' = 5°40', westerly.\n\n[Oxford ATPL · Ch2 Q3b · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "What is the change of longitude from 150°40'E to 179°30'E?", "o": ["28°50'E", "28°50'W", "29°50'E", "330°10'E"], "a": 0, "x": "Same hemisphere, subtract: 179°30' − 150°40' = 28°50', easterly.\n\n[Oxford ATPL · Ch2 Q3c · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "What is the change of longitude from 162°36'W to 140°42'E?", "o": ["56°42'W", "303°18'E", "56°42'E", "21°54'W"], "a": 0, "x": "Take the shorter arc across the 180th meridian: 180° − 162°36' = 17°24', then 180° − 140°42' = 39°18'. Total 56°42' westerly. Going the long way round gives 303°18', which is not what is wanted.\n\n[Oxford ATPL · Ch2 Q3d · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "You are at position A at 54°20'N 002°30'W. Given a ch.lat of 16°20'N and a ch.long of 20°30'W to B, what is the position of B?", "o": ["70°40'N 023°00'W", "38°00'N 023°00'W", "70°40'N 018°00'E", "70°40'N 018°00'W"], "a": 0, "x": "54°20'N + 16°20'N = 70°40'N. 002°30'W + 20°30'W = 023°00'W.\n\n[Oxford ATPL · Ch2 Q7 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "You are at position C at 36°47'S 179°21'E. Given a ch.lat of 46°47'N and a ch.long of 20°30'E to D, what is the position of D?", "o": ["10°00'N 160°09'W", "10°00'N 199°51'E", "83°34'N 160°09'W", "10°00'S 160°09'W"], "a": 0, "x": "36°47'S with 46°47'N applied crosses the equator: 46°47' − 36°47' = 10°00'N. 179°21'E + 20°30' = 199°51'E, which is written as 160°09'W.\n\n[Oxford ATPL · Ch2 Q8 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "What is the shortest distance, in nautical miles and kilometres, from position A (41°25'N) to position B (79°30'N)? Both are on the same meridian.", "o": ["2285 NM, 4232 km", "2285 NM, 1234 km", "3805 NM, 7047 km", "2285 NM, 2626 km"], "a": 0, "x": "ch.lat = 38°05' = 2285'. One minute of latitude is one nautical mile, so 2285 NM. Multiplying by 1.852 gives 4232 km.\n\n[Oxford ATPL · Ch2 Q2 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Give the change of latitude and change of longitude from X (50°31'N 006°30'W) to Y (52°00'N 008°35'W).", "o": ["01°29'N 002°05'W", "01°29'S 002°05'E", "01°29'N 002°05'E", "02°29'N 002°05'W"], "a": 0, "x": "52°00' − 50°31' = 01°29' northerly. 008°35' − 006°30' = 002°05' westerly.\n\n[Oxford ATPL · Ch2 Q4a · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Give the change of latitude and change of longitude from X (47°32'N 002°46'W) to Y (43°56'N 001°33'W).", "o": ["03°36'S 001°13'E", "03°36'N 001°13'W", "03°36'S 001°13'W", "04°36'S 001°13'E"], "a": 0, "x": "47°32' − 43°56' = 03°36' southerly. 002°46'W to 001°33'W moves toward Greenwich, so 001°13' easterly.\n\n[Oxford ATPL · Ch2 Q4b · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Give the change of latitude and change of longitude from X (61°47'N 003°46'W) to Y (62°13'N 001°36'E).", "o": ["00°26'N 005°22'E", "00°26'N 002°10'E", "00°26'S 005°22'E", "00°26'N 005°22'W"], "a": 0, "x": "62°13' − 61°47' = 00°26' northerly. Crossing Greenwich the longitudes add: 003°46' + 001°36' = 005°22' easterly.\n\n[Oxford ATPL · Ch2 Q4c · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Give the change of latitude and change of longitude from X (31°27'S 091°47'E) to Y (35°57'N 096°31'E).", "o": ["67°24'N 004°44'E", "04°30'N 004°44'E", "67°24'S 004°44'E", "67°24'N 004°44'W"], "a": 0, "x": "Crossing the equator the latitudes add: 31°27' + 35°57' = 67°24' northerly. 096°31' − 091°47' = 004°44' easterly.\n\n[Oxford ATPL · Ch2 Q4d · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Give the change of latitude and change of longitude from X (51°05'N 177°42'E) to Y (51°06'N 167°42'W).", "o": ["00°01'N 014°36'E", "00°01'N 010°00'W", "00°01'N 345°24'W", "00°01'S 014°36'E"], "a": 0, "x": "51°06' − 51°05' = 00°01' northerly. Across the 180th meridian: 180° − 177°42' = 002°18', then 180° − 167°42' = 012°18'. Total 014°36' easterly.\n\n[Oxford ATPL · Ch2 Q4e · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Give the shortest distance in nautical miles and kilometres between 52°06'N 002°32'E and 53°36'N 002°32'E.", "o": ["90 NM, 167 km", "90 NM, 49 km", "150 NM, 278 km", "90 NM, 104 km"], "a": 0, "x": "Same meridian, so ch.lat = 01°30' = 90' = 90 NM. 90 × 1.852 = 167 km.\n\n[Oxford ATPL · Ch2 Q5a · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Give the shortest distance in nautical miles and kilometres between 04°41'S 163°36'W and 03°21'N 163°36'W.", "o": ["482 NM, 893 km", "80 NM, 148 km", "482 NM, 260 km", "802 NM, 1485 km"], "a": 0, "x": "Same meridian and crossing the equator, so the latitudes add: 04°41' + 03°21' = 08°02' = 482' = 482 NM. 482 × 1.852 = 893 km.\n\n[Oxford ATPL · Ch2 Q5b · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Give the shortest distance in nautical miles and kilometres between 62°00'N 093°00'E and 62°00'N 087°00'W.", "o": ["3360 NM, 6223 km", "5070 NM, 9390 km", "10 800 NM, 20 000 km", "3360 NM, 1814 km"], "a": 0, "x": "The two meridians are 180° apart, so the great circle runs over the North Pole: (90° − 62°) × 2 = 56° = 3360 NM, which is 6223 km. Measuring along the parallel instead would give 5070 NM and would not be the shortest route.\n\n[Oxford ATPL · Ch2 Q5c · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Give the shortest distance in nautical miles and kilometres between 00°00' 176°00'E and 00°00' 173°00'W.", "o": ["660 NM, 1222 km", "660 NM, 356 km", "20 940 NM, 38 780 km", "180 NM, 333 km"], "a": 0, "x": "Both on the equator, which is itself a great circle. Across the 180th meridian: 4° + 7° = 11° = 660 NM, which is 1222 km.\n\n[Oxford ATPL · Ch2 Q5d · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Give the shortest distance in nautical miles and kilometres between 43°57'N 071°37'W and 43°57'S 108°23'E.", "o": ["10 800 NM, 20 000 km", "5274 NM, 9767 km", "21 600 NM, 40 000 km", "10 800 NM, 5832 km"], "a": 0, "x": "The positions are antipodal: the latitudes are equal and opposite and the longitudes differ by 180°. Any great circle between them is half the circumference: 180° × 60 = 10 800 NM, about 20 000 km.\n\n[Oxford ATPL · Ch2 Q5e · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "An aircraft is to fly from 72°00'N 002°30'E to 72°00'N 177°30'W by the shortest route. What is the initial true track?", "o": ["360°(T)", "270°(T)", "090°(T)", "180°(T)"], "a": 0, "x": "The two meridians are 180° apart, so the shortest route is the great circle over the North Pole. The initial track is true north, and after the pole it becomes true south.\n\n[Oxford ATPL · Ch2 Q6a · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "A flight is made along the parallel of latitude from A (48°00'N 004°00'W) to B (48°00'N 002°27'E). Calculate the distance.", "o": ["259 NM", "387 NM", "578 NM", "288 NM"], "a": 0, "x": "ch.long = 6°27' = 387'. Departure = 387 × cos 48° = 259 NM. 387 NM would be the answer only on the equator.\n\n[Oxford ATPL · Ch15 Q1 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "What is the track and distance measured along the parallel of latitude of 80°S from 176°15'W to 179°45'E?", "o": ["270°(T), 41.7 NM", "090°(T), 41.7 NM", "270°(T), 240 NM", "270°(T), 236 NM"], "a": 0, "x": "Across the 180th meridian the ch.long is 3°45' + 0°15' = 4°00' = 240'. Departure = 240 × cos 80° = 41.7 NM. Going from 176°15'W to 179°45'E is westward, so the track is 270°(T).\n\n[Oxford ATPL · Ch15 Q4 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "In which latitude is a difference in longitude of 44°10' the equivalent of a departure of 2295 NM?", "o": ["30°N or S", "60°N or S", "45°N or S", "15°N or S"], "a": 0, "x": "44°10' = 2650'. cos lat = departure ÷ ch.long = 2295 ÷ 2650 = 0.866, so lat = 30°N or S.\n\n[Oxford ATPL · Ch15 Q5 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "At which latitude is the departure in nautical miles between two points equal to their difference in longitude in minutes?", "o": ["The equator", "60°N or S", "45°N or S", "The poles"], "a": 0, "x": "Departure = ch.long × cos lat, so they are equal only where cos lat = 1, at the equator.\n\n[Oxford ATPL · Ch15 Q7a-i · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "At which latitude is the departure in nautical miles between two points equal to half their difference in longitude in minutes?", "o": ["60°N or S", "30°N or S", "45°N or S", "The equator"], "a": 0, "x": "Departure is half the ch.long where cos lat = 0.5, which is 60°N or S.\n\n[Oxford ATPL · Ch15 Q7a-ii · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "At latitude 52°N, what is the departure between the meridians of 136°16'W and 043°44'E?", "o": ["6653 NM", "10 800 NM", "8508 NM", "4560 NM"], "a": 0, "x": "ch.long = 136°16' + 043°44' = 180° = 10 800'. Departure = 10 800 × cos 52° = 6653 NM. Note this is the distance along the parallel, not the shortest distance.\n\n[Oxford ATPL · Ch15 Q7b-i · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "At latitude 52°N, what is the shortest distance between the meridians of 136°16'W and 043°44'E?", "o": ["4560 NM", "6653 NM", "10 800 NM", "2280 NM"], "a": 0, "x": "The meridians are 180° apart, so the great circle runs over the pole: (90° − 52°) × 2 = 76° = 4560 NM. The 6653 NM figure is the departure along the parallel, which is longer.\n\n[Oxford ATPL · Ch15 Q7b-ii · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "An aircraft flies for 1000 NM along a rhumb line track of 090°(T) from C (36°00'N 174°45'E) to D. What is the longitude of D?", "o": ["164°39'W", "195°21'E", "165°21'W", "154°45'E"], "a": 0, "x": "ch.long = 1000 ÷ cos 36° = 1236' = 20°36' easterly. 174°45'E + 20°36' = 195°21'E, which is written as 164°39'W.\n\n[Oxford ATPL · Ch15 Q2 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Starting from E in latitude 50°N the following rhumb line tracks and distances are flown: E to F 000°(T) 300 NM, F to G 090°(T) 300 NM, G to H 180°(T) 300 NM. What is the rhumb line bearing and distance of H from E?", "o": ["090°(T), 336 NM", "090°(T), 300 NM", "090°(T), 262 NM", "000°(T), 300 NM"], "a": 0, "x": "E to F puts F at 55°N. At 55°N, 300 NM eastward is a ch.long of 300 ÷ cos 55° = 523'. G to H returns to 50°N with the same ch.long. At 50°N that same 523' of longitude is 523 × cos 50° = 336 NM. So H is 336 NM due east of E.\n\n[Oxford ATPL · Ch15 Q3 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "An aircraft leaves J (36°00'S 130°14'E) at 0946 UTC on a rhumb line track of 270°(T) at FL100, temperature 0°C, Mach 0.81, with a 35 kt tailwind. What is its position at 1004 UTC?", "o": ["36°00'S 126°48'E", "36°00'S 133°40'E", "36°00'S 127°28'E", "36°00'S 128°21'E"], "a": 0, "x": "At 0°C the local speed of sound gives a TAS of about 520 kt; with 35 kt of tailwind the groundspeed is 555 kt. In 18 minutes that is 166.5 NM. ch.long = 166.5 ÷ cos 36° = 206' = 3°26' westerly. 130°14'E − 3°26' = 126°48'E.\n\n[Oxford ATPL · Ch15 Q6 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "An aircraft leaves L in latitude 37°S and makes good: L to M 270°(T) at 310 kt, M to N 180°(T) at 280 kt, N to P 090°(T) at 250 kt. P is due south of L. M is reached 80 minutes after leaving L, and P is reached 93.5 minutes after leaving N. What is the distance from M to N?", "o": ["240 NM", "413 NM", "390 NM", "517 NM"], "a": 0, "x": "L to M is 413.3 NM, which at 37°S is a ch.long of 413.3 ÷ cos 37° = 517'. N to P covers the same ch.long in 389.6 NM, so cos lat = 389.6 ÷ 517 = 0.7536, putting N and P at 41°00'S. M to N is 41° − 37° = 4° of latitude = 240 NM.\n\n[Oxford ATPL · Ch15 Q8 (distance) · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "An aircraft leaves L in latitude 37°S and makes good: L to M 270°(T) at 310 kt, M to N 180°(T) at 280 kt, N to P 090°(T) at 250 kt. P is due south of L. M is reached 80 minutes after leaving L, and P is reached 93.5 minutes after leaving N. How long does the leg from M to N take?", "o": ["51.25 min", "88.6 min", "42.5 min", "80 min"], "a": 0, "x": "M to N is 4° of latitude = 240 NM. At 280 kt that is about 51 minutes.\n\n[Oxford ATPL · Ch15 Q8 (time) · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Aircraft Q, groundspeed 301 kt, flies along the parallel of latitude 46°N through 10° of longitude. Aircraft R, groundspeed 364 kt, flies between the same meridians in the same time. What is the latitude of aircraft R's track?", "o": ["33°N or S", "46°N or S", "56°N or S", "23°N or S"], "a": 0, "x": "At 46°N, 10° of longitude is 600 × cos 46° = 417 NM, which at 301 kt takes 83 minutes. In 83 minutes R covers 503.5 NM over the same 600' of longitude, so cos lat = 503.5 ÷ 600 = 0.839, giving 33°N or S. R is nearer the equator because it must cover more distance for the same change of longitude.\n\n[Oxford ATPL · Ch15 Q9 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Aircraft S leaves 36°N 010°E at 1522 and flies 090°(T) at 470 kt to the 013°E meridian, then turns to 180°(T) at 460 kt. Aircraft T leaves 30°N 010°E at 1522 and flies 090°(T) at 150 kt. Which aircraft reaches 30°N 013°E first?", "o": ["Aircraft T", "Aircraft S", "They arrive together", "Neither reaches the position"], "a": 0, "x": "S covers 180' of longitude at 36°N, which is 145.6 NM at 470 kt = 18.5 min, then 360 NM south at 460 kt = 47 min, totalling 65.5 min. T covers 180' at 30°N, which is 155.9 NM at 150 kt = 62 min. T arrives first.\n\n[Oxford ATPL · Ch15 Q10-1 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Aircraft S leaves 36°N 010°E at 1522 and flies 090°(T) at 470 kt to the 013°E meridian, then turns to 180°(T) at 460 kt. Aircraft T leaves 30°N 010°E at 1522 and flies 090°(T) at 150 kt. At what time is 30°N 013°E first reached?", "o": ["1624", "1628", "1618", "1640"], "a": 0, "x": "Aircraft T arrives first, taking 62 minutes for 155.9 NM at 150 kt. 1522 + 62 min = 1624.\n\n[Oxford ATPL · Ch15 Q10-2 · converted from a free-answer exercise; distractors written for this app]"}, {"type": "mcq", "t": "Aircraft S leaves 36°N 010°E at 1522 and flies 090°(T) at 470 kt to the 013°E meridian, then turns to 180°(T) at 460 kt. Aircraft T leaves 30°N 010°E at 1522 and flies 090°(T) at 150 kt. Where is aircraft S when 30°N 013°E is first reached?", "o": ["30°27'N 013°00'E", "30°00'N 012°33'E", "29°33'N 013°00'E", "30°27'N 012°33'E"], "a": 0, "x": "S needs 65.5 minutes against T's 62, so S is 3.5 minutes short. At 460 kt that is 27 NM, which on a southbound track is 27' of latitude. S is at 30°27'N 013°00'E.\n\n[Oxford ATPL · Ch15 Q10-3 · converted from a free-answer exercise; distractors written for this app]"}]}, {"id": "ch5", "icon": "🧲", "color": "#9e2a1c", "sub": "Variation · Deviation · DRC", "title": "Magnetism & Compasses", "questions": [{"type": "mcq", "t": "When accelerating on an easterly heading in the Northern hemisphere, the compass card of a direct reading magnetic compass will turn?", "o": ["Anti-clockwise giving an apparent turn toward the south", "Clockwise giving an apparent turn toward the north", "Clockwise giving an apparent turn toward the south", "Anti-clock itude. So for example, the horizontal component is the same a t magnetic latitudes 50' N and 50' S (option d). .\n\n[Keith Williams · MAGNETISM & COMPASSES 9]"}, {"type": "mcq", "t": "Which of the following is correct when the variation is West?", "o": ["True North is East of Magnetic North", "Magnetic North is West of Compass North", "True North is West of Magnetic North", "Compass North is West of Magnetic North"], "a": 0, "x": "The term \"variation\" refers to the horizontal angle between the True North and Magnetic North. In effect variation indicates the position of Magnetic North relative to true North. So if variation is West then Magnetic North is West of True North. This means that True North is East of magnetic North (option a).\n\n[Keith Williams · MAGNETISM & COMPASSES 11]"}, {"type": "mcq", "t": "A line drawn on a chart which joins all points where the value of magnetic variation is zero is called an?", "o": ["Agonic line", "Aclinic line", "Isogonal", "Isotach"], "a": 0, "x": "The term \"variation\" refers to the horizontal angle between the True North and Magnetic North. I t may be West in which case Magnetic North is to the West of True North, or East, in which case Magnetic North is to the East of True North. Isogonal or Isogonic lines are lines on charts, joining points of equal variation. Isogonal lines joining points of zero variation are called Agonic lines (option a).\n\n[Keith Williams · MAGNETISM & COMPASSES 12]"}, {"type": "mcq", "t": "How is the direct reading magnetic compass made aperiodic or dead beat?", "o": ["Using a pendulous suspension system for the magnetic assembly", "Using the lowest possible viscosity liquid in the compass", "Using short magnets", "Positioning the magnetic assembly mass close to the compass point and using damping wires"], "a": 3, "x": "The terms \"aperiodic\" and \"dead beat\" mean that the compass must settle down quickly on steady indication following any disturbance such as turbulence or aircraft manoeuvres.  aircraft accelerates or decelerates on such a heading, the lateral ...\n\n[Keith Williams · MAGNETISM & COMPASSES 23]"}, {"type": "mcq", "t": "What is the main advantage of a remote indicating compass compared to a direct reading compass is that it?", "o": ["It has less moving parts", "I t requires less maintenance", "I t magnifies the earth's magnetic field in order to attain greater accuracy", "I t senses, rather than seeks, the magnetic meridian"], "a": 3, "x": "In a direct reading magnetic compass the magnet is required to align itself with the magnetic field of the Earth. This alignment process is commonly referred to as seeking the magnetic field. But the seeking process is inevitably subject to errors due to friction losses and inertia within the compass. I n a remote indicating compass, the detector unit does not align itself with the Earth's magnetic field, but detects this field. The detector unit then produces an electrical signal proportional to the direction of the magnetic field. This largely eliminates the friction and inertia losses thereby making the remote reading compass more accurate. (option d).\n\n[Keith Williams · MAGNETISM & COMPASSES 24]"}, {"type": "mcq", "t": "Where do the isogonal lines converge?", "o": ["At the both the North and South Geographic Poles", "At both the North and South Magnetic Poles", "Only at the Magnetic equator", "Only at the Magnetic North Pole"], "a": 1, "x": "The term \"variation\" refers to the horizontal angle between the True North and Magnetic North. I t may be West in which case Magnetic North is to the West of True North, or East, in which case Magnetic North is to the East of True North. Isogonal or Isogonic lines are lines on charts, joining points of equal variation. All Isogonals converge at both the North and South Magnetic Poles (option b).\n\n[Keith Williams · MAGNETISM & COMPASSES 25]"}, {"type": "mcq", "t": "When decelerating on a westerly heading in the Northern hemisphere, the compass card of a dire etic latitude. At the magnetic equator they are horizontal or parallel with the surface. As magnetic latitudes increase towards the magnetic poles the degree of inclination also increases. The inclination of the lines of force causes the magnets in compasses to dip below the horizontal, thereby reducing their accuracy. In order to minimise this problem, compasses are typically suspended such that their C of G is lower than their pivot. In this way the weight of the magnet is made to oppose the dipping caused by the lines of magnetic force. This is termed pendulous suspension. Although this reduces compass dip, it does not entirely eliminate it. This means that whenever an aircraft heading is anything other than magnetic north or south, the C of G of the compass magnet will be off-set to one side of the pivot. Whenever an aircraft accelerates or decelerates on such a heading, the lateral ...\n\n[Keith Williams · MAGNETISM & COMPASSES 40]"}, {"type": "mcq", "t": "What is the advantage of the remote indicating compass (slaved gyro compass) over the direct reading magnetic compass?", "o": ["It is lighter", "It is connected to a source of electrical power and so is more accurate", "It senses the earth's magnetic field rather than seeks it, so is more sensitive", "It is not affected by aircraft deviation"], "a": 2, "x": "In a direct reading miignetic compass the magnet is required to align itself with the magnetic field of the Earth. This alignment process is commonly referred to as seeking the magnetic field. But the seeking process is inevitably snbject to errors due to friction'losses and inertia within the compass. In a remote indicating compass, the detector unit does not align itself with the Earth's magnetic field, but detects this field. The detector unit then produces an electrical signal proportional to the direction of the magnetic field. This largely eliminates the friction and inertia losses thereby making the remote reading compass more accurate. (option c).\n\n[Keith Williams · MAGNETISM & COMPASSES 41]"}, {"type": "mcq", "t": "Isogrivs on a chart indicate lines of?", "o": ["Zero magnetic variation", "Equal magnetic dip", "Equal horizontal directive force", "Equal grivation"], "a": 3, "x": "The term \"grivation\" refers to the vector sum of the convergence of the meridians and the magnetic variation. An Isogiv is a line drawn on a chart to indicate lines of equal grivation (option d).\n\n[Keith Williams · MAGNETISM & COMPASSES 42]"}, {"type": "mcq", "t": "Compass deviation is defined as the angle between?", "o": ["True North and Compass North", "The horizontal and the total intensity of the earth's magnetic field", "Magnetic North and Compass North", "True North and Magnetic North"], "a": 2, "x": "Certain materials within the structure of an aircraft possess \"hard iron\" or permanent magnetism. This permanent magnetism causes the compass magnets to align in a direction slightly different to the local magnetic field of the Earth. The term \"Compass deviation\" refers to the angle between the local magnetic meridian and the direction in which the compass magnets are aligned. Deviation is therefore a measure of the angle between Magnetic North and Compass North (option c).\n\n[Keith Williams · MAGNETISM & COMPASSES 43]"}, {"type": "mcq", "t": "Isogonic lines connect positions that have?", "o": ["The same angle of magnetic dip", "The same variation", "0' variation", "The same elevation"], "a": 1, "x": "The term \"variation\" refers to the horizontal angle between the True North and Magnetic North. I t may be West in which case Magnetic North is to the West of True North, or East, in which case Magnetic North is to the East of True North. Isogonal or Isogonic lines are lines on charts, joining points of equal variation (option b).\n\n[Keith Williams · MAGNETISM & COMPASSES 44]"}, {"type": "mcq", "t": "When an aircraft on a westerly heading on the northern hemisphere accelerates, the effect of the acceleration error causes lieve that a significant change in deviation has occurred. Examples of such occasions are following lightning strikes or when a n aircraft has been left parked on any one heading for very long periods (months or years). Another such occasion is when there has been a large, and permanent, change of magnetic latitude (option b), such as when an aircraft has been transferred from an operating base in one hemisphere to a new base in the other hemisphere.\n\n[Keith Williams · MAGNETISM & COMPASSES 47]"}, {"type": "mcq", "t": "The annunciator of a remote indicating compass system is used when?", "o": ["Synchronising the magnetic and gyro compass elements", "Compensating for deviation", "Setting local magnetic variation", "Setting the 'heading' pointer"], "a": 0, "x": "In order to enable a remote indicating compass to be used, the magnet and the gyro compass elements must first be synchronized. The synchronisation state is indicated by an annunciator window, which usually uses two symbols, a small dot and a small cross. Synchronisation is achieved by turning a synchronisation knob until the annunciator window displays a midway position between the dot and cross, or alternating dot and cross indications. The purpose of the annunciator is therefore used when synchronizing the magnets and the gyro compass elements (option a).\n\n[Keith Williams · MAGNETISM & COMPASSES 49]"}, {"type": "mcq", "t": "The direct reading magnetic compass is made aperiodic (dead beat) by?", "o": ["Using long magnets", "Pendulous suspension of the magnetic assembly", "Keeping the magnetic assembly mass close to the compass point and by using damping wires", "Using the lowest acceptable viscosity compass liquid"], "a": 2, "x": "The terms \"aperiodic\" and \"dead beat\" mean that the compass must settle down quickly on steady indication following any disturbance such as turbulence or aircraft manoeuvres. This is achieved by including three design factors. Firstly by using several short magnets instead iquid swirl tend to increase or decrease the error (ii)?", "o": ["(i) Over-read (ii) Decrease", "(i) Over-read (ii) Increase", "(i) Under-read (ii) Decrease", "(i) Under-read (ii) Increase"], "a": 3, "x": "The lines of magnetic force in the magnetic field of the Earth are horizontal at the magnetic equator and dip down towards the surface as latitude increases to the North and South. This means that the lines of force are horizontal a t the magnetic equator and vertical a t the North and South magnetic poles. Because the compass magnet aligns itself with these lines of force, the magnet is horizontal only when the aircraft is over the magnetic equator. In order minimize the effects of this dipping of the lines of force the compass magnet uses a pendulous suspension system, whereby the magnet hangs below its point of suspension. Because the C of G of the magnet is no longer directly below its point of suspension, its inertia will cause its C of G to lag behind its suspension point. This will cause the compass to over-read or under-read depending upon whether the aircraft is turning towards or away from the nearest or furthest pole. This question specifies a turn from 3 3 0 ' ~to 0 4 0 ' ~in the northern hemisphere. This means that the aircraft is turning through the nearest pole, so the compass will over read as indicated in the left side of the diagram above. Both the aircraft and the compass are turning clockwise so the actual change of heading will be greater than the indicated change of heading. This means that the compass will under-read If the aircraft is not oved the ...\n\n[Keith Williams · MAGNETISM & COMPASSES 71]"}, {"type": "mcq", "t": "The sensitivity of a direct reading magnetic compass is?", "o": ["Inversely proportional to the horizontal and vertical components of the earth's magnetic field", "Directly proportional to the horizontal and vertical components of the earth's magnetic field", "Proportional to the horizontal component of the earth's magnetic field", "Proportional to the vertical component of the earth's magnetic field"], "a": 2, "x": "Magnetic compasses provide heading indications by aligning themselves with the horizontal component of the Earth's magnetic field. This horizontal component flows from South to Norah over the surface of the Earth. But the lines of force produced by the earths magnetic field flow vertically upwards, out of the ground a t the magnetic north pole and vertically into the ground a t the magnetic South Pole. The degree to which they are inclined vertically a t all other points on the earth is determined by tqe magnetic latitude. At the magnetic equator they are horizontal or parallel with the surface. As magnetic latitudes increase towards the magnetic poles the degree of inclination also increases. The inclifiation of the lines of force causes the magnets in compasses to dip below the horizontal, thereby reducing their accuracy. So the accuracy of a magnetic compass is proportional to the horizontal component of the Earth's magnetic field (option c).\n\n[Keith Williams · MAGNETISM & COMPASSES 72]"}, {"type": "mcq", "t": "The magnitude of variation?", "o": ["Has a maximum of 90'", "Has a maximum of 180'", "Is zero at the equator", "Has a maximum value of 4 5 ' ~or 4 5 ' ~ "], "a": 1, "x": "The term \"variationn refers to the horizontal angle between the True North and Magnetic North. Variation is greatest when at a point directly between these two poles. At this point the variation is 180' (option b).\n\n[Keith Williams · MAGNETISM & COMPASSES 73]"}, {"type": "mcq", "t": "Which of the following statements about the earth's magnetic field is most accurate?", "o": ["I t has no effect on aircraft deviation", "I t may be permanent, temporary or transient", "I t acts as if thei-e were a large red magnetic pole in northern Canada", "The dip angle is the angle between the total magnetic field and the earth horizontal"], "a": 3, "x": "The lines of force produced by the earths magnetic field flow vertically upwards, out of the ground at the magnetic north pole and vertically into the ground at the magnetic South Pole. The degree to which they are inclined vertically at all other points on the earth is determined by the magnetic latitude. At the magnetic equator they are horizontal or parallel with the surface. As magnetic latitudes increase towards the magnetic poles the degree of inclination also increases. The dip angle is the angle between the total magnetic field and the earth horizontal (option d).\n\n[Keith Williams · MAGNETISM & COMPASSES 74]"}, {"type": "mcq", "t": "Which of the following is the best definition of magnetic variation?", "o": ["The angle between the magnetic heading and the magnetic north", "The angle between the magnetic north and the true north", "The angk between the true north and the compass north", "Thefangle between the direction indicated on a magnetic compass and magnetic north"], "a": 1, "x": "The term \"variation\" refers to the horizontal angle between the Magnetic North and True North (option b). I t may be West in which case Magnetic North is to the West of True North, or East, in which case Magnetic North is to the East of True North. Isogonal lines are lines on charts, joining points of equal variation.\n\n[Keith Williams · MAGNETISM & COMPASSES 76]"}, {"type": "mcq", "t": "At which point on the surface of the earth is a magnetic compass most effective?", "o": ["O n the geographical equator", "Close to the magnetic north pole", "Close to the magnetic South Pole", "Approximately midway between the magnetic poles"], "a": 3, "x": "Magnetic compasses provide heading indications by aligning themselves with the horizontal component of the Earth's magnetic field. This horizontal component flows from South to North over the surface of the Earth. But the lines of force produced by the earths magnetic field flow vertically upwards, out of the ground at the magnetic north pole and vertically into the ground at the magnetic South Pole. The degree to which they are inclined vertically at all other points on the earth is determined by the magnetic latitude. At the magnetic equator they are horizontal or parallel with the surface. As magnetic latitudes increase towards the magnetic poles the degree of inclination also increases. The inclination of the lines of force causes the magnets in compasses to dip below the horizontal, thereby reducing their accuracy. So the accuracy of a magnetic aompass is greatest at Approximately midway between the magnetic poles (option d).\n\n[Keith Williams · MAGNETISM & COMPASSES 77]"}, {"type": "mcq", "t": "An aircraft is accelerating on a westerly heading in the northern hemisphere. Will the compass be over-reading or under-reading (i) and will it indicate a turn to the north or south (ii)?", "o": ["(i) Over-reading (ii) South turn", "(i) Over-reading (ii) North turn", "(i) Under-reading (ii) South turn", "(i) Under-reading (ii) North turn"], "a": 1, "x": "This question is concerned with the effects of deceleration on a direct reading magnetic compass. The& effects depend upon the magnetic latitude, the direction of flight and the deceleration rate. The lines of force produbed by the earths magnetic field flow vertically upwards, out of the ground at the knagnetic north pole and vertically into the ground at the magnetic South Pole. The degree to which they are inclined vertically at all other points on the earth is determined by the magnetic latitude. At the magnetic equator they are horizontal o r parallel with the surface. As magnetic latitudes increase towards the magnetic poles the degree of inclination also increases. The inclination of the lines of force causes the magnets in compasses to dip below the horizontal, thereby reducing their accuracy. In order to minimise this problem, compasses are typically suspended such that their C of G is lower than their pivot. In this way the weight of the magnet is made to oppose the dipping caused by the lines of magnetic force. This is termed pendulous suspension. Although this reduces compass dip, it does not entirely eliminate it. This means that whenever an aircraft heading is anything other than magnetic north or south, the C of G of the compass magnet will be off-set to one side of the pivot. Whenever an aircraft accelerates o r decelerates on such a heading, the lateral ...\n\n[Keith Williams · MAGNETISM & COMPASSES 79]"}, {"type": "mcq", "t": "What advantage does the remote indicating o r slaved gyro compass have in comparison to the direct reading magnetic compass?", "o": ["Not affected by deviation", "Lighter", "More accurate because it is not connected to any source of electrical power", "Is more sensitive because it senses the earth's magnetic field rather than seeking it"], "a": 3, "x": "In a direct reading magnetic compass the magnet is required to align itself with the magnetic field of the Earth. This alignment process is commonly referred to as seeking the magnetic field. But the seeking process is inevitably subject to errors due to friction losses and inertia within the compass. I n a remote indicating compass, the detector unit does not align itself with the Earth's magnetic field, but detects this field. The detector unit then produces a n electrical signal proportional to the direction of the magnetic field. This largely eliminates the friction and inertia losses thereby making the remote reading compass more sensitive. (option d).\n\n[Keith Williams · MAGNETISM & COMPASSES 80]"}, {"type": "mcq", "t": "An aircraft is on a heading of 1 3 5 ' ~using a direct reading magnetic compass in the northern hemisphere. After carrying out a rate 1turn for 30 seconds 011 what indicated heading should it roll out of the turn?", "o": ["225", "More than 225", "Less than 225", "I t is not possible to answer this question using the data provided"], "a": 1, "x": "The lines of magnetic force in the magnetic field of the Earth are horizontal at the magnetic equator and dip down towards the surface as latitude increases to the North and South. This means that the lines of force are horizontal at the magnetic equator and vertical a t the North and South magnetic poles. Because the compass magnet aligns itself with these lines of force, the magnet is horizontal only when the aircraft is over the magnetic equator. In order minimize the effects of this dipping of the lines of force the compass magnet uses a pendulous suspension system, whereby the magnet hangs below its point of suspension. Because the C of G of tHe magnet is no longer directly below its point of suspension, its inertia q l l cause its C of G to lag behind its suspension point. This will cause the compass to over-read or under-read depending upon whether the aircraft is turning towards or away from the nearest or furthest pole as illustrated below. North pole ning of aircraft pulls Inertia pulls magnct its C o f C to move away - Compass turning anti-clockwise TURNING ERROR WHEN AIRCRAFT IS TURNING ERROR WHEN AIRCRAFT IS POINTING TOWARDS NEAREST POLE POINTING AWAY FROM NEAREST POLE This question specifies a b aircraft in the northern hemisphere turning to the right, through the South Pole (180'). As illustrated in the right side of the diagram above, the airctaft is turning ...\n\n[Keith Williams · MAGNETISM & COMPASSES 81]"}, {"type": "mcq", "t": "What are indicated by isogrivs on a chart?", "o": ["Lines of equal grivation", "Lines of zero magnetic variation", "Lines of equal magnetic dip", "Lines of equal effective horizontal magnetic force"], "a": 0, "x": "The term \"grivation\" refers to the vector sum of the convergence of the meridians and the magnltic variation. An Isogiv is a line drawn on a chart to indicate lines of constant grivation (option a).\n\n[Keith Williams · MAGNETISM & COMPASSES 82]"}, {"type": "mcq", "t": "What is the angle between True North and Magnetic North known as?", "o": ["Alignment error", "Dip", "Deviation", "Variation"], "a": 3, "x": "The term \"variation\" refers to the horizontal angle between the True North and Magnetic North (option d). It may be West in which case Magnetic North is to the West of True North, or East, in which case Magnetic North is to the East of True North. Isogonal or Isogonic lines are lines on charts, joining points of equal variation. The greatest possibie value of variations is 180°, which occurs at all point located directly between the Magnetic and True North Poles.\n\n[Keith Williams · MAGNETISM & COMPASSES 85]"}, {"type": "mcq", "t": "Where do isogonal lines converge?", "o": ["At the North and South Magnetic Poles", "At the Magnetic equator", "A the North Magnetic Pole", "At the North and South Magnetic and Geographical Poles"], "a": 3, "x": "The term \"variation\" refers to the horizontal angle between the True North and Magnetic North. I t may be West in which case Magnetic North is to the West of True North, or East, in which case Magnetic North is to the East of True North. Isogonal lines are lines on charts, joining points of equal variation. All Isogonal lines converge at North and South Magnetic and Geographical Poles (option d). The sketch below illustrates this effect. D--~_s_ogo_oal--- Magnetic North True North\n\n[Keith Williams · MAGNETISM & COMPASSES 87]"}, {"type": "mcq", "t": "Why are the detector units of a slaved gyro-compass system usually located in or near to the aircraft wingtips?", "o": ["Having one detector unit in each wingtip, cancels out compass deviations", "To isolate the detector unit from the aircraft deviation sources", "To isolate the detector unit from the magnetic field of the Earth", "To minimise turning and acceleration errors"], "a": 1, "x": "In a direct reading magnetic compass the magnet must be located within the cockpit area in view of the pilot. This can cause inaccuracies due to the effects of magnetic fields caused b$ materials and electrical, equipment in the cockpit area. These fields represent additional deviation sources. One of the principal advantages of a remote dr slaved gyro compass is that it enables the detector unit to be located in another brea such as the wingtips, thereby isolating it from the aircraft deviation sources (option b). RfAGNETISM & COMPASSES 89 c. The dip angle is the angle between the total magnetic field and the earth horizontal. The lines of force produced by the earths magnetic field flow vertically upwards, out bf the ground at the magnetic north pole and vertically into the ground a t the mhgnetic South Pole. So the maximum possible dip angle is 90°, which occurs a t the magnetic poles (option c).\n\n[Keith Williams · MAGNETISM & COMPASSES 88]"}, {"type": "mcq", "t": "When must the compass of an aircraft be swung?", "o": ["If the aircraft has been in the hangar for a long time and has been moved several times", "After a change of theatre of operations a t the same magnetic latitude", "If the aircraft has been subjected to hammering", "Every maintenance inspection"], "a": 2, "x": "The creation of permanent magnetism in an object requires two things. Firstly the object must contain materials capable of supporting permanent magnetism. These materials are said to be \"magnetically hard\". This term does not refer to the physical hardness ofithe materials but to the degree of effort required to induce of remove permabent magnetism. One explanation of the nhagnetic properties of materials uses the concept of magnetic domains within the material. Each domain can be considered to be a microscopically small magnet, with a North and South Pole. If a majority of these domains become permanently aligned in one direction, the material possesses permanent maknetism. The second factor required to induce permanent magnetism is some means by which the magnetic domhins within the material can be aligned in one direction. Whenever a material is slubjected to physical shocks such as when hammering it, the magnetic domains are shaken lose from their alignment. If this process is repeated over a long period of time, such as when riveting together the skin of an aircraft, the magnetic domains can become aligned with the magnetic field of the earth. This combination1 of hammering and the effects of the earth's magnetic field during constructiod is the most common cause of permanent magnetism in aircraft (option c).\n\n[Keith Williams · MAGNETISM & COMPASSES 90]"}, {"type": "mcq", "t": "What is the title of a line of eqdal magnetic variation?", "o": ["An isocline", "An isobar", "An isogonal", "An isogriv"], "a": 2, "x": "The term \"variation\" refers to the horizontal angle between the True North and Magnetic North. I t may be West in which case Magnetic North is to the West of True North, or East, in which case Magnetic North is to the East of True North. Lines indicating points of equal variation on a chart are called Isogonal lines (option c). They are shown as pecked lines on charts.\n\n[Keith Williams · MAGNETISM & COMPASSES 92]"}, {"type": "mcq", "t": "How is the direct reading magnetic compass made to be aperiodic (dead beat)?", "o": ["Using long magnets", "Using a pendulous suspension system for the magnetic assembly", "UsIng the lowest practicable viscosity compass liquid", "By keeping the magnetic assembly mass close to the compass point and by using damping wires"], "a": 3, "x": "The terms \"aperiodic\" and \"dead beat\" mean that the compass must settle down quickly on steady indication following any disturbance such as turbulence or aircraft manoeuvres. This is achieved by including three design factors. Firstly by using several short magnets instead of a single long magnet, the mass of the magnet is brought closer to the compass point. This reduces the inertia of the unit thereby enabling oscillations to be damped out very quickly. Secondly the magnets are immersed in a liquid, which acts as a damping fluid. Thirdly by attaching damping wires to the magnets. As the magnets oscillate these wires move back and forth through the fluid. The fluid friction on these wires thereby damps out oscillations. (Option d), therefore gives the best description of the methods used.\n\n[Keith Williams · MAGNETISM & COMPASSES 93]"}, {"type": "mcq", "t": "If variation is West?", "o": ["True North is West of Magnetic North", "True North is East of Magnetic North", "Magnetic North is West of Compass North", "Compass North is West of Magnetic North"], "a": 1, "x": "The term \"variation\" refers to the horizontal angle between the True North and Magnetic North. If variation is West this means that Magnetic North is to the West of True North. This in turn means that True North is East of Magnetic North (option b).\n\n[Keith Williams · MAGNETISM & COMPASSES 94]"}, {"type": "mcq", "t": "What will be the effect on its direct reading compass when an aircraft on the Equator accelerates whilst traveling westwards?", "o": ["No change", "Indicates a decrease in heading", "Indicates an increase in heading", "Indicates an apparent turn to the North"], "a": 0, "x": "The lines of magnetic force in the magnetic field of the Earth are horizontal at the magnetic equator and dip down towards the surface as latitude increases to the North and South. This means that the lines of force are horizontal at the magnetic equator and vertical at the North and South magnetic poles. Because the compass magnet aligns itself with these lines of force, the magnet is horizontal only when the aircraft is over the magnetic equator. In order minimize the effects of this dipping of the lines of force the compass magnet uses a pendulous suspension :system, whereby the magnet hangs below its point of suspension. Because the C of G of the magnet is no longer directly below its point of suspension, its inertia will cause its C of G to lag behind its suspension point. This will cause the compass to over-read or under-read whenever an aircraft turns thrcrugh the poles br accelerates or decelerates in an easterly or Westerly direction. The magnitude of these errors is proportional to the degree of dip. So at the magnetic equator where the dip angle is zero there will be no acceleration errors. So when an aircraft on the Equator accelerates whilst traveling westwards there will be no change in compass indication (option a).\n\n[Keith Williams · MAGNETISM & COMPASSES 96]"}, {"type": "mcq", "t": "The angle between True North and Magnetic North is called?", "o": ["Drift", "Variation", "Deviation", "Compass error"], "a": 1, "x": "The term \"variation\" refers to the horizontal angle between the True North and Magnetic North (option b). It may be West in which case Magnetic North is to the West of True North, or East, in which case Magnetic North is to the East of True North.\n\n[Keith Williams · MAGNETISM & COMPASSES 100]"}, {"type": "mcq", "t": "What is the definition of magnetic variation? 3W 1W", "o": ["The angle between the direction indicated by a compass and Magnetic North", "The angle between True North and Compass North", "The angle between Magnetic North and True North", "The angle between Magnetic Heading and Magnetic North"], "a": 2, "x": "[Oxford ATPL · Oxford Ch3 Q2]"}, {"type": "mcq", "t": "Which of these is a correct statement about the Earth’s magnetic field?", "o": ["It acts as though there is a large blue magnetic pole in Northern Canada", "The angle of dip is the angle between the vertical and the total magnetic force", "It may be temporary, transient, or permanent", "It has no effect on aircraft deviation"], "a": 0, "x": "[Oxford ATPL · Oxford Ch3 Q4]"}, {"type": "mcq", "t": "Where is a compass most effective?", "o": ["About midway between the Earth’s magnetic poles", "In the region of the magnetic South Pole", "In the region of the magnetic North Pole", "On the geographic equator"], "a": 0, "x": "[Oxford ATPL · Oxford Ch3 Q5]"}, {"type": "mcq", "t": "The value of variation:", "o": ["is zero at the magnetic equator", "has a maximum value of 180°", "has a maximum value of 45°E or 45°W", "cann ly with magnetic latitude", "varies indirectly with magnetic latitude", "is maximum on east and west"], "a": 1, "x": "[Oxford ATPL · Oxford Ch30 Q4]"}, {"type": "mcq", "t": "Deviation due to coefficient A is mainly caused by:", "o": ["hard iron force acting along the longitudinal axis", "hard and soft iron forces acting along the lateral axis", "vertical soft iron forces", "a misaligned lubber line"], "a": 3, "x": "[Oxford ATPL · Oxford Ch30 Q6]"}]}, {"id": "ch6", "icon": "🎛️", "color": "#4a3570", "sub": "Triangle of velocities · TAS · Mach", "title": "Navigation Computer (CRP-5)", "questions": [{"type": "mcq", "t": "What is the ETA at Z if TAS = 120 Kts? ATD 'X'is 1232 UTC ETA 'Y' is 1247 UTC ATA 'Y' is 1250 UTC", "o": ["1255 UTC", "1305 UTC", "1320 UTC", "1325 UTC"], "a": 2, "x": "To solve this type of problem using the CRP5: b. To find the ground speed divide the distance between X and Y, (42 nm) by time (18 min) by setting 18 on the inner scale against 42 On the outer scale. The 60 min index on the inner scale will now align with 139.5 on the outer. This means that the ground speed is 139.5 kts. c. To find the time taken to fly from Y to Z divide the distance (70 nm) by the ground speed (139.5). To do this, align 139.5 on the inner scale with 70 on the outer scale. The 60 min index on the inner will now align with 30 on the outer. This means that the time between Y and Z will be 30 d. Adding this to the ATA at Y gives 1250 + 30 min = 1320 UTC (option c).\n\n[Keith Williams · CRP5 1]"}, {"type": "mcq", "t": "An aircraft is following a true track of 048' a t a constant TAS of 210 kt. The wind velocity is 350' / 30 kt. The GS and drift angle are?", "o": ["192 kt, 7'right", "196 kt, 7.S0right", "192 kt, 7' left", "136 kt, 7.5' left"], "a": 0, "x": "To sohe this type of problem using the CRP5: a. Insert the slide so that the low speed side is visible in the window disc on the back of the CRP5. b. Rotate the inner scale until the wind direction (350) aligns with the i  origin"], "a": 0, "x": "Transverse Mercator charts are produced by projecting the graticule of a model of the earth onto the inside of a sheet of paper wrapped around the earth to form a cylinder. This cylinder is aligned so that it contacts the surface of the earth at the poles and along a meridian and anti-meridian. This projection is then mathematically adjusted to achieve orthomorphism. The scale on such a chart is exactly correct only along the meridian of tangency, which is the line along which the cylinder is in contact with the surface of the earth (option a).\n\n[Keith Williams · CHART THEORY 11]"}, {"type": "mcq", "t": "The angular difference, on a Lambert conformal conic chart, between the,arrival and departure track is equal to?", "o": ["Departure angle", "Map convergence", "Secant of ?4latitude", "Secant of longitude"], "a": 1, "x": "A Lamberts chart is produced by projecting the graticule of a model of the earth onto the inside of a cone of paper which is then unfolded to form the chart. This process produces a graticule in which the meridians are straight lines converging upon the nearest pole. In the Northern hemisphere each meridian points directly a t the North Pole. Because the meridians converge, any straight line not in a north-south direction on such a chart will cross each successive meridian in its pa'h at a slightly different angle. This means that the direction of the track will ch;~ngecontinuously along any straight line track. This change of track is caused by the convergence of the meridians, so the difference in the departure and arrival track between two points is equal to the convergence of the chart (option b). This situation is illustrated below. North All meridians point towards true North Dotted line parallel to meridian a t position A\n\n[Keith Williams · CHART THEORY 12]"}, {"type": "mcq", "t": "On a Direct Mercator chart, meridians are?", "o": ["Parallel, equally spaced, horizontal straight lines", "Conveging curved lines", "Parallel, equally spaced, vertical straight lines", "Diverging curved lines"], "a": 2, "x": "Direct Mercator charts are based on a cylindrical projection where a light a t the centre of a model of the earth, projects the graticule out onto a sheet of paper, which has been wrapped around the model to form a cylinder. This process produces one of the requirements of an orthomorphic/conformal chart in that all of the meridians and parallels of latitude cross a t 90 degrees to each other. In addition to this, all of the meridians are straight lines. This means that all meridians on a Direct Mercator chart are parallel, equally spaced, vertical straight lines (option c).\n\n[Keith Williams · CHART THEORY 14]"}, {"type": "mcq", "t": "On a Lambert conformal conic chart, the distance between parallels of latitude spaced the same number of degrees apart?", "o": ["Increases between and reduces outside of the standard parallels", "Reduces between, and expands outside, the standard parallels", "Is constant between the standard parallels", "Is constant outside of the standard parallels"], "a": 1, "x": "A Lambert's chart is based upon a conical projection. This means that the graticule of the earth is projected onto the inside of a cone as illustrated below. Conical sheet of paper between the parallels of latitude increases above and below the point a t which the cone touches of the Earth This method of projection causes the scale to increase as distance increases away from the line at which the cone is in contact with the model of the Earth. The scale can therefore be correct only along this line of contact. In order to make such a projection conformal the scale is reduced mathematically a t all points. This is the equivalent of having the cone pass below the surface of the model of the earth as illustrated below. This produces two lines of parallel a t which the scale is correct. These are termed the \"Standard Parallels\". Scale between these parallels reduces while scale outsi wo standard parallels 3. Scale increases as distance increases outside of the two standard parallels\n\n[Keith Williams · CHART THEORY 28]"}, {"type": "mcq", "t": "The scale is correct on a Transverse Mercator chart?", "o": ["Along the datum meridian and meridians a t 90° to it", "At the prime meridian", "Along the great circle of tangency", "At thegoles and the equator"], "a": 2, "x": "A Great Circle is a ciqcle drawn on the surface of the earth such that its centre is the centre of the earth. Great circles 'include all meridians plus the equator. Mercator charts are based on a cylindrical projection where a light at the centre of a model of the earth, projects the graticule out onto a sheet of paper, which has been wrapped around the earth to form a cylinder. In the case of Transverse Mercator charts the lPne of contact between the paper cylinder and the earth is one of the meridians. This meridian is called the great circle of tangency. One of the effects of this form of projection is that the scale is correct only along this great circle of tangency (option c) then expands with increasing distance either side. CHART THEORY 30. A flight Information region (FIR) boundary is indicated by a line (option b). CHART THEORY 31. The symbol for an uncontrolled route is marked with a - - - - - - - - -------------- line (option d). CHART THEORY 32. The symbol for a Control Zone (CTR) on an aeronautical chart i option a.\n\n[Keith Williams · CHART THEORY 29]"}, {"type": "mcq", "t": "What is the magnetic track and distance from Connaught VOR/DME (CON, N53 54.8 WOO8 49.1) to overhead Abbey Shrule aerodrome (N5336 WOO7 39)?", "o": ["124\" - 47 nm", "116\" - 46 nm", "296\" - 46 nm", "304\" - 47 nm"], "a": 0, "x": "To solve this type of problem it is necessary to: a. Identify the two positions on the chart. b. Measure the distance between the two positions using dividers then convert this into nm using the scale on the edge of the chart. In this case the distance is 2.35 inches, ilwind). So to solve this problem it is necessary to calculate the head or tailwind component. This can be done using the CRPS or as indicated below. The track is 090' and the wind Wind is 045' 150 kts direction is 045' so the angle between the track and the wind Angle between wind is 45' as indicated in the diagram at the right. The along track wind is 50 kts x Cos 45' f Track is 090\" So outbound wind is 50 kts x Cos 45' = 35.36 kts headwind And homebound wind is 35.36 kts tailwind Groundspeed out = TAS (180 kts) - headwind (35.36 kts) = 144.64 kts Groundspeed home = TAS (180 kts) + tailwind (35.36 kts) = 215.36 kts Inserting these figures into the equation gives: PSR = 0.598 hours Multiplying this time by the groundspeed out (144.64 kts) gives a distance of 86.53 nm or approximately 85 nm (option b).\n\n[Keith Williams · PSR & PET 6]"}, {"type": "mcq", "t": "For a distance of 1860 NM between Q and R, a ground speed \"out\" of 385 kt, a ground speed \"back1' of 465 kt and an endurance of 8 HR (excluding reserves) the distance from Q to the point of safe return (PSR) is?", "o": ["1685 NM", "1532 NM", "930 NM", "1865 NM"], "a": 0, "x": "This type of problem can be solved using the standard equation: E = endurance, H = homebound groundspeed, 0 = outbound groundspeed. Inserting the data given in the question gives: Distance to PSR = time to PSR x outbound groundspeed. Inserting the data above gives distance to PSR = 385 nm/h x 4.38 h = 1684 nm or approximately 1685 nm (option a).\n\n[Keith Williams · PSR & PET 7]"}, {"type": "mcq", "t": "Two points A and B are 1000 NM apart. TAS = 490 kt. On the flight between A and B the equivalent headwind is -20 kt. On the return leg between B and A, the equivalent headwind is +40 kt. What distance from A, along the route A to B, is the Point of Equal Time (PET)?", "o": ["470 NM", "455 NM", "500 NM", "530 NM"], "a": 3, "x": "This type of problem can be solved using the standard equation: D = distance of total leg, H = homebound gro
