e. The lines of force produced by the earths magnetic field flow vertically upwards, out of the ground a t the magnetic north pole and vertically into the ground a t the magnetic South Pole. The degree to which they are inclined vertically a t all other points on the earth is determined by the magnetic latitude. At the magnetic equator they are horizontal or parallel with the surface. As magnetic latitudes increase towards the magnetic poles the degree of inclination also increases. The inclination of the lines of force causes the magnets in compasses to dip below the horizontal, thereby reducing their accuracy. In order to minimise this problem, compasses are typically suspended such that their C of G is lower than their pivot. In this way the weight of the magnet is made to oppose the dipping caused by the lines of magnetic force. This is termed pendulous suspension. Although this reduces compass dip, it does not entirely eliminate it. This means that whenever an aircraft heading is anything other than magnetic north or south, the C of G of the compass magnet will be off-set to one side of the pivot. Whenever an aircraft accelerates or decelerates on such a heading, the lateral ...\n\n[Keith Williams · MAGNETISM & COMPASSES 40]"}, {"type": "mcq", "t": "What is the advantage of the remote indicating compass (slaved gyro compass) over the direct reading magnetic compass?", "o": ["It is lighter", "It is connected to a source of electrical power and so is more accurate", "It senses the earth's magnetic field rather than seeks it, so is more sensitive", "It is not affected by aircraft deviation"], "a": 2, "x": "In a direct reading miignetic compass the magnet is required to align itself with the magnetic field of the Earth. This alignment process is commonly referred to as seeking the magnetic field. But the seeking process is inevitably snbject to errors due to friction'losses and inertia within the compass. In a remote indicating compass, the detector unit does not align itself with the Earth's magnetic field, but detects this field. The detector unit then produces an electrical signal proportional to the direction of the magnetic field. This largely eliminates the friction and inertia losses thereby making the remote reading compass more accurate. (option c).\n\n[Keith Williams · MAGNETISM & COMPASSES 41]"}, {"type": "mcq", "t": "Isogrivs on a chart indicate lines of?", "o": ["Zero magnetic variation", "Equal magnetic dip", "Equal horizontal directive force", "Equal grivation"], "a": 3, "x": "The term \"grivation\" refers to the vector sum of the convergence of the meridians and the magnetic variation. An Isogiv is a line drawn on a chart to indicate lines of equal grivation (option d).\n\n[Keith Williams · MAGNETISM & COMPASSES 42]"}, {"type": "mcq", "t": "Compass deviation is defined as the angle between?", "o": ["True North and Compass North", "The horizontal and the total intensity of the earth's magnetic field", "Magnetic North and Compass North", "True North and Magnetic North"], "a": 2, "x": "Certain materials within the structure of an aircraft possess \"hard iron\" or permanent magnetism. This permanent magnetism causes the compass magnets to align in a direction slightly different to the local magnetic field of the Earth. The term \"Compass deviation\" refers to the angle between the local magnetic meridian and the direction in which the compass magnets are aligned. Deviation is therefore a measure of the angle between Magnetic North and Compass North (option c).\n\n[Keith Williams · MAGNETISM & COMPASSES 43]"}, {"type": "mcq", "t": "Isogonic lines connect positions that have?", "o": ["The same angle of magnetic dip", "The same variation", "0' variation", "The same elevation"], "a": 1, "x": "The term \"variation\" refers to the horizontal angle between the True North and Magnetic North. I t may be West in which case Magnetic North is to the West of True North, or East, in which case Magnetic North is to the East of True North. Isogonal or Isogonic lines are lines on charts, joining points of equal variation (option b).\n\n[Keith Williams · MAGNETISM & COMPASSES 44]"}, {"type": "mcq", "t": "When an aircraft on a westerly heading on the northern hemisphere accelerates, the effect of the acceleration error causes the magnetic compass to?", "o": ["Lag behind the turning rate of the aircraft", "Indicate a turn towards the south", "Turn faster than the actual turning rate of the aircraft", "Indicate a turn towards the north"], "a": 3, "x": "This question is concerned with the effects of deceleration on a direct reading magnetic compass. These effects depend upon the magnetic latitude, the direction of flight and the deceleration rate. The lines of force produced by the earths magnetic field flow vertically upwards, out of the ground a t the magnetic north pole and vertically into the ground at the magnetic South Pole. The degree to which they are inclined vertically at all other points on the earth is determined by the magnetic latitude. At the magnetic equator they are horizontal or parallel with the surface. As magnetic latitudes increase towards the magnetic poles the degree of inclination also increases. The inclination of the lines of force causes the magnets in compasses to dip below the horizontal, thereby reducing their accuracy. In order to minimise this problem, compasses are typically suspended such that their C of G is lower than their pivot. In this way the weight of the magnet is made to oppose the dipping caused by the lines of magnetic force. This is termed pendulous suspension. Although this reduces compass dip, it does not entirely eliminate it. This means that whenever an aircraft heading is anything other than magnetic north or south, the C of G of the compass magnet will be off-set to one side of the pivot. Whenever an aircraft accelerates or decelerates on such a heading, the lateral ...\n\n[Keith Williams · MAGNETISM & COMPASSES 45]"}, {"type": "mcq", "t": "When is the magnetic compass most effective?", "o": ["In the region of the magnetic North Pole", "On the geographic equator", "About midway between the magnetic poles", "In the region of the magnetic South Pole"], "a": 2, "x": "Magnetic compasses provide heading indications by aligning themselves with the horizontal component of the Earth's magnetic field. This horizontal component flows from South to North over the surface of the Earth. But the lines of force produced by the earths magnetic field flow vertically upwards, out of the ground a t the magnetic north pole and vertically into the ground a t the magnetic South Pole. The degree to which they are inclined vertically a t all other points on the earth is determined by the magnetic latitude. At the magnetic equator they are horizontal o r parallel with the surface. As magnetic latitudes increase towards the magnetic poles the degree of inclination also increases. The inclination of the lines of force causes the magnets in compasses to dip below the horizontal, thereby reducing their accuracy. So the accuracy of a magnetic compass is greatest a t Approximately midway between the magnetic poles (option d).\n\n[Keith Williams · MAGNETISM & COMPASSES 46]"}, {"type": "mcq", "t": "An Agonic line is a line that connects?", "o": ["Positions that have 0' variation", "Positions that have the same variation", "Points of equal magnetic dip", "Points of equal magnetic horizontal field strength"], "a": 0, "x": "The term \"variation\" refers to the horizontal angle between the True North and Magnetic North. I t may be West in which case Magnetic North is to the West of True North, o r East, in which case Magnetic North is to the East of True North. Isogonal lines are lines on charts, joining points of equal variation. Isogonal lines indicating points of 0' variation are called Agonic Lines (option a). -MAGNETISM & COMPASSES 48 b. The term \"Compass swing\" refers to a process whereby the deviations in a magnetic compass is measured on various headings, and adjustments made to reduce these deviations to within acceptable limits. Residual deviations are then recorded on a compass deviation chart. Compass swings must be carried out before a newly constructed aircraft is brought into service and whenever there is reason to believe that a significant change in deviation has occurred. Examples of such occasions are following lightning strikes or when a n aircraft has been left parked on any one heading for very long periods (months or years). Another such occasion is when there has been a large, and permanent, change of magnetic latitude (option b), such as when an aircraft has been transferred from an operating base in one hemisphere to a new base in the other hemisphere.\n\n[Keith Williams · MAGNETISM & COMPASSES 47]"}, {"type": "mcq", "t": "The annunciator of a remote indicating compass system is used when?", "o": ["Synchronising the magnetic and gyro compass elements", "Compensating for deviation", "Setting local magnetic variation", "Setting the 'heading' pointer"], "a": 0, "x": "In order to enable a remote indicating compass to be used, the magnet and the gyro compass elements must first be synchronized. The synchronisation state is indicated by an annunciator window, which usually uses two symbols, a small dot and a small cross. Synchronisation is achieved by turning a synchronisation knob until the annunciator window displays a midway position between the dot and cross, or alternating dot and cross indications. The purpose of the annunciator is therefore used when synchronizing the magnets and the gyro compass elements (option a).\n\n[Keith Williams · MAGNETISM & COMPASSES 49]"}, {"type": "mcq", "t": "The direct reading magnetic compass is made aperiodic (dead beat) by?", "o": ["Using long magnets", "Pendulous suspension of the magnetic assembly", "Keeping the magnetic assembly mass close to the compass point and by using damping wires", "Using the lowest acceptable viscosity compass liquid"], "a": 2, "x": "The terms \"aperiodic\" and \"dead beat\" mean that the compass must settle down quickly on steady indication following any disturbance such as turbulence or aircraft manoeuvres. This is achieved by including three design factors. Firstly by using several short magnets instead of a single long magnet, the mass of the magnet is brought closer to the compass point. This reduces the inertia of the unit thereby enabling oscillations to be damped out very quickly. Secondly the magnets are immersed in a liquid which acts as a damping fluid. Thirdly by attaching damping wires to the magnets. As the magnets oscillate these wires move back and forth through the fluid. The fluid friction on these wires thereby damps out oscillations. (Option c), therefore gives the best description of the methods used.\n\n[Keith Williams · MAGNETISM & COMPASSES 50]"}, {"type": "mcq", "t": "The Earth can be considered as being a magnet with the?", "o": ["Red pole near the north pole of the earth and the direction of the magnetic force pointing straight down to the earth's surface", "Blue pole near the north pole of the earth and the direction of the , magnetic force pointing straight up from the earth's surface", "Red pole near the north pole of the earth and the direction of the magnetic force pointing straight up from the earth's surface", "Blue pole near the north pole of the earth and the direction of the magnetic force pointing straight down to the earth's surface"], "a": 3, "x": "The lines of force produced by the earths magnetic field flow vertically upwards, out of the ground a t the magnetic South Pole and vertically into the ground at the magnetic North pole. Magnetic fields are conventionally represented by lines of magnetic force flowing out of the North Pole of magnets and into the South Pole. So the North Pole of the earth, with its lines of force flowing into it is effectively the South Pole of a magnet. South Poles of magnets are conventionally painted Blue, so the the Earth can be considered as being a magnet with the blue pole near the North Pole of the earth and the direction of the magnetic force pointing straight down to the earth's surface (option d).\n\n[Keith Williams · MAGNETISM & COMPASSES 51]"}, {"type": "mcq", "t": "Deviation applied to magnetic heading gives?", "o": ["Magnetic track", "Compass heading", "True heading", "Magnetic course"], "a": 1, "x": "Magnetic headings can be converted into compass bearing by applying the compass deviation (option b), using the following reminders. \"If deviations in east then compass is least\" and \"If deviation is West then compass is best\". These reminders mean that Magnetic headings can be converted into compass headings by adding West deviations and by subtracting East deviations.\n\n[Keith Williams · MAGNETISM & COMPASSES 52]"}, {"type": "mcq", "t": "The angle between Magnetic North and Compass North is called?", "o": ["Compass deviation", "Compass error", "Magnetic variation", "Alignment error"], "a": 0, "x": "Certain materials within the structure of an aircraft possess \"hard iron\" or permanent magnetism. This permanent magnetism causes the compass magnets to align in a direction slightly different to the local magnetic field of the Earth. The term \"Compass deviation\" refers to the angle between the local magnetic meridian and the direction in which the compass magnets are aligned. Deviation is therefore a measure of the angle between Magnetic North and Compass North (option a).\n\n[Keith Williams · MAGNETISM & COMPASSES 53]"}, {"type": "mcq", "t": "Which of the following is an occasion for carrying out a compass swing on a Direct Reading Compass?", "o": ["Before an aircraft goes on any flight that involves a large change of magnetic latitude", "After any of the aircraft radio equipment has been changed due to unserviceability", "Whenever an aircraft carries a large freight load regardless of its content", "After an aircraft has passed through a severe electrical storm, or has been struck by lightning"], "a": 3, "x": "The term \"Compass swing\" refers to a process whereby the deviations in a magnetic compass is measured on various headings, and adjustments made to reduce these deviations to within acceptable limits. Residual deviations are then recorded on a compass deviation chart. Compass swings must be carried out before a newly constructed aircraft is brought into service and whenever there is reason to believe that a significant change in deviation has occurred. Examples of such occasions are following flight through severe electrical storms or lightning strikes (option d), or when a n aircraft has been left parked on any one heading for very long periods (months o r years). Another such occasion is when there has been a large, and permanent, change of magnetic latitude, such as when an aircraft has been transferred from an operating base in one hemisphere to a new base in the other hemisphere.\n\n[Keith Williams · MAGNETISM & COMPASSES 54]"}, {"type": "mcq", "t": "Which of the following statements is correct concerning the effect of turning errors on a direct reading compass?", "o": ["Turning errors are greatest on eastlwest headings, and are greatest at high latitudes", "Turning errors are greatest on northlsouth headings, and are greatest a t high latitudes", "Turning errors are greatest on eastlwest headings, and are least at high latitudes", "Turning errors are greatest on northlsouth headings, and are least a t high latitudes"], "a": 1, "x": "The lines of magnetic force in the magnetic field of the Earth are horizontal at the magnetic equator and dip down towards the surface as latitude increases to the North and South. This means that the lines of force are horizontal at the magnetic equator and vertical at the North and South magnetic poles. Because the compass magnet aligns itself with these lines of force, the magnet is horizontal only when the aircraft is over the magnetic equator. I n order minimize the effects of this dipping of the lines of force the compass magnet uses a pendulous suspension system, whereby the magnet hangs below its point of suspension. If the aircraft is not over the magnetic equator, its compass magnet will be dipped, due to the dip of the lines of magnetic force around the earth. This will cause the C of G of the magnet to be displaced as illustrated below. North pole Compass turning anti-clockwise TURNING ERROR WHEN AIRCRAFT IS TURNING ERROR WHEN AIRCRAFT IS POINTING TOWARDS NEAREST POLE POINTING AWAY FROM NEAREST POLE Because the C of G of the magnet is no longer directly below its point of suspension, its inertia will cause its C of g to lag behind its suspension point. This will cause the compass to over-read or under-read depending upon whether the aircraft is turning towards or away from the nearest or furthest pole. The magnitude of the errors that are caused by this effect are ...\n\n[Keith Williams · MAGNETISM & COMPASSES 55]"}, {"type": "mcq", "t": "Which one of the following is an advantage of a remote reading compass as compared with a standby compass?", "o": ["I t eliminates the effect of turning and acceleration errors by pendulously suspending the detector unit", "I t is more reliable because it is operated electrically and power is always available from sources within the aircraft", "It senses the magnetic meridian instead of seeking it, increasing compass' sensitivity", "I t is lighter than a direct reading compass because it employs, apart from the detector unit, existing aircraft equipment"], "a": 2, "x": "In a direct reading magnetic compass the magnet is required to align itself with the magnetic field of the Earth. This alignment process is commonly referred to as seeking the magnetic field. But the seeking process is inevitably subject to errors due to friction losses and inertia within the compass. In a remote indicating compass, the detector unit does not align itself with the Earth's magnetic field, but detects this field. The detector unit then produces an electrical signal proportional to the direction of the magnetic field. This largely eliminates the friction and inertia losses thereby making the remote reading compass more accurate. (option c).\n\n[Keith Williams · MAGNETISM & COMPASSES 56]"}, {"type": "mcq", "t": "The north and south magnetic poles are the only positions on the earth's surface where?", "o": ["The value of magnetic variation equals 90'", "A freely suspended compass needle will stand vertical", "Isogonals converge", "A freely suspended compass needle will stand horizontal"], "a": 1, "x": "The magnetic field of the Earth is made up of lines of magnetic force flowing into the ~ a r i at h the North Pole and out of t h e ~ a r t ha t the south Pole. These lines are vertical a t the poles and horizontal a t the magnetic equator. A freely suspended magnet will align with these lines of force so such a magnet will stand vertical only a t the magnetic North and South Poles (option b).\n\n[Keith Williams · MAGNETISM & COMPASSES 58]"}, {"type": "mcq", "t": "The main reason for mounting the detector unit of a remote reading compass in the wingtip of an aeroplane is?", "o": ["To ensure that the unit is in the most accessible position on the aircraft for ease of maintenance", "By having detector units on both wingtips, to cancel out the deviation effects caused by the aircraft strucure", "To minimise the amount of deviation caused by aircraft magnetism and electrical circuits", "To maximise the units exposure to the earth's magnetic field"], "a": 2, "x": "In a direct reading magnetic compass the magnet must be located within the cockpit area in view of the pilot. This can cause inaccuracies due to the effects of magnetic fields caused by materials and electrical, equipment in the cockpit area. These fields represent additional deviation sources. One of the principal advantages of a remote o r slaved gyro compass is that it enables the detector unit to be located in another area such as the wingtips, thereby isolating it from the aircraft deviation sources (option c).\n\n[Keith Williams · MAGNETISM & COMPASSES 59]"}, {"type": "mcq", "t": "The main advantage of a remote indicating compass over a direct reading compass is that it?", "o": ["Requires less maintenance", "Is able to magnify.the earth's magnetic field in order to attain greater accuracy", "Senses, rather than seeks, the magnetic meridian", "Has less moving parts"], "a": 2, "x": "In a direct reading magnetic compass the magnet is required to align itself with the magnetic field of the Earth. This alignment process is commonly referred to as seeking the magnetic field. But the seeking process is inevitably subject to errors due to friction losses and inertia within the compass. In a remote indicating compass, the detector unit does not align itself with the Earth's magnetic field, but detects this field. The detector unit then produces an electrical signal proportional to the direction of the magnetic field. This largely eliminates the friction and inertia losses thereby making the remote reading compass more accurate. (option c).\n\n[Keith Williams · MAGNETISM & COMPASSES 60]"}, {"type": "mcq", "t": "The main reason for usually mounting the detector unit of a remote indicating compass in the wingtip of an aeroplane is to?", "o": ["Place it where it will not be subjected to electrical or magnetic interference from the aircraft", "Reduce the amount of deviation caused by aircraft magnetism and electrical circuits", "Facilitate easy maintenance of the unit and increase its exposure to the Earth's magnetic field", "Place it in a position where there is no electrical wiring to cause deviation errors"], "a": 1, "x": "In a direct reading magnetic compass the magnet must be located within the cockpit area in view of the pilot. This can cause inaccuracies due to the effects of magnetic fields caused by materials and electrical, equipment in the cockpit area. These fields represent additional deviation sources. One of the principal advantages of a remote o r slaved gyro compass is that it enables the detector unit to be located in another area such as the wingtips, thereby isolating it from the aircraft deviation sources (option b).\n\n[Keith Williams · MAGNETISM & COMPASSES 61]"}, {"type": "mcq", "t": "Permanent magnetism in aircraft arises chiefly from?", "o": ["The combined effect of aircraft electrical equipment and the earth's magnetic field", "The effect of internal wiring and exposure to electrical storms", "Hammering, and the effect of the earth's magnetic field, whilst under construction", "Exposure to the earth's magnetic field during normal operation"], "a": 2, "x": "The creation of permanent magnetism in an object requires two things. Firstly the object must contain materials capable of supporting permanent magnetism. These materials are said to be \"magnetically hard\". This term does not refer to the physical hardness of the materials but to the degree of effort required to induce of remove permanent magnetism. One explanation of the magnetic properties of materials uses the concept of magnetic domains within the material. Each domain can be considered to be a microscopically small magnet, with a North and South Pole. If a majority of these domains become permanently aligned in one direction, the material possesses permanent magnetism. The second factor required to induce permanent magnetism is some means by which the magnetic domains within the material can be aligned in one direction. Whenever a material is subjected to physical shocks such as when hammering it, the magnetic domains are shaken lose from their alignment. If this process is repeated over a long period of time, such as when riveting together the skin of an aircraft, the magnetic domains can become aligned with the magnetic field of the earth. This combination of hammering and the effects of the earth's magnetic field during construction is the most common cause of permanent magnetism in aircraft (option c).\n\n[Keith Williams · MAGNETISM & COMPASSES 62]"}, {"type": "mcq", "t": "Which of the following statements concerning the earth's magnetic field is completely correct?", "o": ["Dip is the angle between total magnetic field and vertical field component", "The blue pole of the earth's magnetic field is situated in North Canada", "At the earth's magnetic equator, the inclination varies depending on whether the geographic equator is north or south of the magnetic equator", "The earth's magnetic field can be classified as transient, semi-permanent o r permanent"], "a": 1, "x": "The lines of force produced by the earths magnetic field flow vertically upwards, out of the ground a t the magnetic South Pole and vertically into the ground a t the magnetic North pole. Magnetic fields are conventionally represented by lines of magnetic force flowing out of the North Pole of magnets and into the South Pole, So the North Pole of the earth, with its lines of force flowing into it is effectively the South Pole of a magnet. South Poles of magnets are conventionally painted Blue, so the the Earth can be considered as being a magnet with the blue pole near the North Pole of the earth which is situated in North Canada (option b).\n\n[Keith Williams · MAGNETISM & COMPASSES 63]"}, {"type": "mcq", "t": "The lines on the earth's surface that join points of equal magnetic variation are called?", "o": ["Isogrives", "Isoclines", "Isogonals", "Isotachs"], "a": 2, "x": "The term \"variation\" refers to the horizontal angle between the True North and Magnetic North. I t may be West in which case Magnetic North is to the West of True North, o r East, in which case Magnetic North is to the East of True North. Isogonal lines are lines on charts, joining points of equal variation (option c).\n\n[Keith Williams · MAGNETISM & COMPASSES 64]"}, {"type": "mcq", "t": "Concerning direct reading magnetic'compasses, in the northern hemisphere, it can be said that?", "o": ["On an Easterly heading, a longitudinal acceleration causes an apparent turn to the South", "On a Westerly heading, a longitudinal acceleration causes an apparent turn to the South", "On a Westerly heading, a longitudinal deceleration causes an apparent turn to the North", "On an Easterly heading, a longitudinal acceleration causes an apparent turn to the North"], "a": 3, "x": "This question is concerned with the effects of acceleration on a direct reading magnetic compass. These effects depend upon the magnetic latitude, the direction of flight and the acceleration rate. The lines of force produced by the earths magnetic field flow vertically upwards, out of the ground a t the magnetic north pole and vertically into the ground at the magnetic South Pole. The degree to which they are inclined vertically at all other points on the earth is determined by the magnetic latitude. At the magnetic equator they are horizontal or parallel with the surface. As magnetic latitudes increase towards the magnetic poles the degree of inclination also increases. The inclination of the lines of force causes the magnets in compasses to dip below the horizontal, thereby reducing their accuracy. In order to minimise this problem, compasses are typically suspended such that their C of G is lower than their pivot. In this way the weight of the magnet is made to oppose the dipping caused by the lines of magnetic force. This is termed pendulous suspension. Although this reduces compass dip, it does not entirely eliminate it. This means that whenever an aircraft heading is anything other than magnetic north or south, the C of G of the compass magnet will be off-set to one side of the pivot, as illustrated below. 1 Aircraft tlying on castcrly heading in the northern ...\n\n[Keith Williams · MAGNETISM & COMPASSES 65]"}, {"type": "mcq", "t": "At a specific location, the value of magnetic variation?", "o": ["Depends on the type of compass installed", "Depends on the magnetic heading", "Depends on the true heading", "Varies slowly over time"], "a": 3, "x": "The term \"variation\" refers to the horizontal angle between the True North and Magnetic North. I t may be West in which case Magnetic North is to the West of True North, or East, in which case Magnetic North is to the East of True North. Because of the continuous movement of the magnetic materials within the core of the Earth magnetic variation at any point varies slowly with time (option d).\n\n[Keith Williams · MAGNETISM & COMPASSES 66]"}, {"type": "mcq", "t": "Isogonals are lines of equal?", "o": ["Wind velocity", "Magnetic variation", "Compass deviation", "Pressure"], "a": 1, "x": "The term \"variation\" refers to the horizontal angle between the True North and Magnetic North. It may be West in which case Magnetic North is to the West of True North, or East, in which case Magnetic North is to the East of True North. Isogonal lines are lines on charts, joining points of equal magnetic variation (option b).\n\n[Keith Williams · MAGNETISM & COMPASSES 67]"}, {"type": "mcq", "t": "In northern hemisphere, during an acceleration in an easterly direction, the magnetic compass will indicate?", "o": ["A heading of East", "A decrease in heading", "An increase in heading", "An apparent turn to the South"], "a": 1, "x": "This question - is concerned with the effects of acceleration on a direct reading magnetic compass. These effects depend upon the magnetic latitude, the direction of flight and the ,acceleration rate. The lines of force produced by the earths magnetic field flow vertically upwards, out of the ground at the magnetic north pole and vertically into the ground at the magnetic South Pole. The degree to which they are inclined vertically at all other points on the earth is determined by the magnetic latitude. At the magnetic equator they are horizontal or parallel with the surface. As magnetic latitudes increase towards the magnetic poles the degree of inclination also increases. The inc e second factor required to induce permanent magnetism is some means by which the magnetic domhins within the material can be aligned in one direction. Whenever a material is slubjected to physical shocks such as when hammering it, the magnetic domains are shaken lose from their alignment. If this process is repeated over a long period of time, such as when riveting together the skin of an aircraft, the magnetic domains can become aligned with the magnetic field of the earth. This combination1 of hammering and the effects of the earth's magnetic field during constructiod is the most common cause of permanent magnetism in aircraft (option c).\n\n[Keith Williams · MAGNETISM & COMPASSES 90]"}, {"type": "mcq", "t": "What is the title of a line of eqdal magnetic variation?", "o": ["An isocline", "An isobar", "An isogonal", "An isogriv"], "a": 2, "x": "The term \"variation\" refers to the horizontal angle between the True North and Magnetic North. I t may be West in which case Magnetic North is to the West of True North, or East, in which case Magnetic North is to the East of True North. Lines indicating points of equal variation on a chart are called Isogonal lines (option c). They are shown as pecked lines on charts.\n\n[Keith Williams · MAGNETISM & COMPASSES 92]"}, {"type": "mcq", "t": "How is the direct reading magnetic compass made to be aperiodic (dead beat)?", "o": ["Using long magnets", "Using a pendulous suspension system for the magnetic assembly", "UsIng the lowest practicable viscosity compass liquid", "By keeping the magnetic assembly mass close to the compass point and by using damping wires"], "a": 3, "x": "The terms \"aperiodic\" and \"dead beat\" mean that the compass must settle down quickly on steady indication following any disturbance such as turbulence or aircraft manoeuvres. This is achieved by including three design factors. Firstly by using several short magnets instead of a single long magnet, the mass of the magnet is brought closer to the compass point. This reduces the inertia of the unit thereby enabling oscillations to be damped out very quickly. Secondly the magnets are immersed in a liquid, which acts as a damping fluid. Thirdly by attaching damping wires to the magnets. As the magnets oscillate these wires move back and forth through the fluid. The fluid friction on these wires thereby damps out oscillations. (Option d), therefore gives the best description of the methods used.\n\n[Keith Williams · MAGNETISM & COMPASSES 93]"}, {"type": "mcq", "t": "If variation is West?", "o": ["True North is West of Magnetic North", "True North is East of Magnetic North", "Magnetic North is West of Compass North", "Compass North is West of Magnetic North"], "a": 1, "x": "The term \"variation\" refers to the horizontal angle between the True North and Magnetic North. If variation is West this means that Magnetic North is to the West of True North. This in turn means that True North is East of Magnetic North (option b).\n\n[Keith Williams · MAGNETISM & COMPASSES 94]"}, {"type": "mcq", "t": "What will be the effect on its direct reading compass when an aircraft on the Equator accelerates whilst traveling westwards?", "o": ["No change", "Indicates a decrease in heading", "Indicates an increase in heading", "Indicates an apparent turn to the North"], "a": 0, "x": "The lines of magnetic force in the magnetic field of the Earth are horizontal at the magnetic equator and dip down towards the surface as latitude increases to the North and South. This means that the lines of force are horizontal at the magnetic equator and vertical at the North and South magnetic poles. Because the compass magnet aligns itself with these lines of force, the magnet is horizontal only when the aircraft is over the magnetic equator. In order minimize the effects of this dipping of the lines of force the compass magnet uses a pendulous suspension :system, whereby the magnet hangs below its point of suspension. Because the C of G of the magnet is no longer directly below its point of suspension, its inertia will cause its C of G to lag behind its suspension point. This will cause the compass to over-read or under-read whenever an aircraft turns thrcrugh the poles br accelerates or decelerates in an easterly or Westerly direction. The magnitude of these errors is proportional to the degree of dip. So at the magnetic equator where the dip angle is zero there will be no acceleration errors. So when an aircraft on the Equator accelerates whilst traveling westwards there will be no change in compass indication (option a).\n\n[Keith Williams · MAGNETISM & COMPASSES 96]"}, {"type": "mcq", "t": "The angle between True North and Magnetic North is called?", "o": ["Drift", "Variation", "Deviation", "Compass error"], "a": 1, "x": "The term \"variation\" refers to the horizontal angle between the True North and Magnetic North (option b). It may be West in which case Magnetic North is to the West of True North, or East, in which case Magnetic North is to the East of True North.\n\n[Keith Williams · MAGNETISM & COMPASSES 100]"}, {"type": "mcq", "t": "What is the definition of magnetic variation? 3W 1W", "o": ["The angle between the direction indicated by a compass and Magnetic North", "The angle between True North and Compass North", "The angle between Magnetic North and True North", "The angle between Magnetic Heading and Magnetic North"], "a": 2, "x": "[Oxford ATPL · Oxford Ch3 Q2]"}, {"type": "mcq", "t": "Which of these is a correct statement about the Earth’s magnetic field?", "o": ["It acts as though there is a large blue magnetic pole in Northern Canada", "The angle of dip is the angle between the vertical and the total magnetic force", "It may be temporary, transient, or permanent", "It has no effect on aircraft deviation"], "a": 0, "x": "[Oxford ATPL · Oxford Ch3 Q4]"}, {"type": "mcq", "t": "Where is a compass most effective?", "o": ["About midway between the Earth’s magnetic poles", "In the region of the magnetic South Pole", "In the region of the magnetic North Pole", "On the geographic equator"], "a": 0, "x": "[Oxford ATPL · Oxford Ch3 Q5]"}, {"type": "mcq", "t": "The value of variation:", "o": ["is zero at the magnetic equator", "has a maximum value of 180°", "has a maximum value of 45°E or 45°W", "cannot exceed 90°"], "a": 1, "x": "[Oxford ATPL · Oxford Ch3 Q6]"}, {"type": "mcq", "t": "The angle between True North and Magnetic North is known as:", "o": ["deviation", "variation", "alignment error", "dip"], "a": 1, "x": "[Oxford ATPL · Oxford Ch3 Q8]"}, {"type": "mcq", "t": "The value of magnetic variation on a chart changes with time. This is due to:", "o": ["Movement of the magnetic poles, causing an increase", "Increase in the magnetic field, causing an increase", "Reduction in the magnetic field, causing a decrease", "Movement of the magnetic poles, which can cause either an increase or a decrease"], "a": 3, "x": "[Oxford ATPL · Oxford Ch3 Q9]"}, {"type": "mcq", "t": "Isogonal lines converge as follows:", "o": ["At the North Magnetic Pole", "At the North and South Magnetic and Geographical Poles", "At the North and South Magnetic Poles", "At the Magnetic equator"], "a": 1, "x": "[Oxford ATPL · Oxford Ch3 Q10]"}, {"type": "mcq", "t": "What is the maximum possible value of dip angle?", "o": ["66°", "180°", "90°", "45°"], "a": 2, "x": "[Oxford ATPL · Oxford Ch3 Q11]"}, {"type": "mcq", "t": "What is the dip angle at the South Magnetic Pole?", "o": ["0°", "90°", "180°", "64°"], "a": 1, "x": "[Oxford ATPL · Oxford Ch3 Q12]"}, {"type": "mcq", "t": "European regulations (CS Ops-1) state that the maximum permissible deviations after compensation for the DRC are: to find deviation on the cardinal headings and to calculate coefficients A, B and C.", "o": ["Ten degrees", "Three degrees", "One degree", "Two degrees"], "a": 0, "x": "[Oxford ATPL · Oxford Ch30 Q1]"}, {"type": "mcq", "t": "Compass swings should be carried out: to eliminate or reduce the coefficients found.", "o": ["on the apron", "only on the compass swinging base or site", "at the holding point", "on the active runway"], "a": 1, "x": "[Oxford ATPL · Oxford Ch30 Q2]"}, {"type": "mcq", "t": "Aircraft magnetism caused by hard iron:", "o": ["is not usually influenced by the Earth’s magnetic field", "varies directly with magnetic latitude", "varies indirectly with magnetic latitude", "is maximum on east and west"], "a": 1, "x": "[Oxford ATPL · Oxford Ch30 Q4]"}, {"type": "mcq", "t": "Deviation due to coefficient A is mainly caused by:", "o": ["hard iron force acting along the longitudinal axis", "hard and soft iron forces acting along the lateral axis", "vertical soft iron forces", "a misaligned lubber line"], "a": 3, "x": "[Oxford ATPL · Oxford Ch30 Q6]"}]}, {"id": "ch6", "icon": "🎛️", "color": "#4a3570", "sub": "Triangle of velocities · TAS · Mach", "title": "Navigation Computer (CRP-5)", "questions": [{"type": "mcq", "t": "What is the ETA at Z if TAS = 120 Kts? ATD 'X'is 1232 UTC ETA 'Y' is 1247 UTC ATA 'Y' is 1250 UTC", "o": ["1255 UTC", "1305 UTC", "1320 UTC", "1325 UTC"], "a": 2, "x": "To solve this type of problem using the CRP5: b. To find the ground speed divide the distance between X and Y, (42 nm) by time (18 min) by setting 18 on the inner scale against 42 On the outer scale. The 60 min index on the inner scale will now align with 139.5 on the outer. This means that the ground speed is 139.5 kts. c. To find the time taken to fly from Y to Z divide the distance (70 nm) by the ground speed (139.5). To do this, align 139.5 on the inner scale with 70 on the outer scale. The 60 min index on the inner will now align with 30 on the outer. This means that the time between Y and Z will be 30 d. Adding this to the ATA at Y gives 1250 + 30 min = 1320 UTC (option c).\n\n[Keith Williams · CRP5 1]"}, {"type": "mcq", "t": "An aircraft is following a true track of 048' a t a constant TAS of 210 kt. The wind velocity is 350' / 30 kt. The GS and drift angle are?", "o": ["192 kt, 7'right" ": "mcq", "t": "Given: True Heading = 090' TAS = 200 kt W N = 220' / 30 kt. Calculate the GS?", "o": ["200 kt", "240 kt", "180 kt", "220 kt"], "a": 3, "x": "To solve this type of problem using the CRPS: a. Insert the slide so that the low speed side is visible in the window disc on the back of the CRP5. b. Rotate the inner scale until the wind direction (220) aligns with the index on the outer scale. c. Move the slide until the centre dot on the window disc aligns with the TAS d. Using the scale on the slide as a guide, draw a cross below the centre dot to represent the wind speed. In this case the wind is 30 Kts so with the centre dot a t 200 Kts the cross for wind speed should be a t 170 Kts. This situation is illustrated below. 1. Rotate window to set wind direction 220' against true heading index mark Set the slide so tgat 200 TAS 3. Draw a cross 30 kts below the is under the centre dot centre dot to show 30 kt wind e. Rotate the inner scale to align the heading (090) on the inner scale with the index mark on the outer scale. f. Read off the ground speed using the scale a t the location of the cross that was drawn in operation d above. This situation is illustrated below. 1. Rotate window to align aircraft headin 90' with true heading index mark 2. Read off ground speed against cross on window. In this case the ground speed is approximately 220 Kts (option d). To solve this type of problem using the CRP5: Set the low speed slide with 180 kts TAS a t the centre dot. Set wind direction 045' against the true heading index. Draw a ...\n\n[Keith Williams · CRP5 11]"}, {"type": "mcq", "t": "The following information is displayed on an Inertial Navigation System: GS 520 kt, True HDG 090°, Drift angle 5' right, TAS 480 kt. SAT (static air temperature) -51°C. The W/V being experienced is?", "o": ["322' / 60 kt", "320' / 60 kt", "320' 1 4 5 kt", "321' / 50 kt"], "a": 1, "x": "To solve this type of problem on the C W 5 : a. On high speed side of slide set 480 Kts TAS a t t  (option a). These settings are illustrated below. 1. 2.085 nm on outer scale is set against 47 minutes on inner scale. 2. 60 min index on inner scale aligns with 2.66 kts on outer scale. Multplying this by 60 gives 159.9 kts\n\n[Keith Williams · CRP5 19]"}, {"type": "mcq", "t": "Given: M 0.80, OAT -50°C, FL 330, GS 490 kt, VAR 20°W, Magnetic heading 140°, Drift is 1lo Right. Calculate the true W/V?", "o": ["025\"/95 kts", "020°/80 kts", "025\"/90 kts", "020°/95 kts"], "a": 3, "x": "To solve this type of problem using the CRPS: a. Convert the mach number to TAS by setting the mach index against - 5 0 ' ~in the Airspeed window. Align the cursor with mach 0.80 on the inner scale and read off 465 kts TAS on the outer scale. b. Using the high speed slide set 465 TAS at the centre dot. c. Rotate the window to align the magnetic heading (140') with the 20'W variation on the outer scale. d. Draw a cross where the 11' right drift radial intersects the 490 kt groud speed arc. This situation is illustrated below. 1. Magnetic heading 140' aligned with 2 0 ' variation. 1R drift radial crosses 490 Kt ground speed arc. e. Rotate the window to position the cross on the centre line below the centre f. Read off wind direction (020') at the true heading index and wind speed (95 kts) by counting down from the centre dot to the cross. So the wind is 020'195 kts (option d). These settings are illustrated below. 1. Wind direction 0200 indicated by true heading index mark. 2. Cross on centre line below centre dot. 3. ~ i s t z n c down e from centre dot to cross indicates 95 kt wind speed..\n\n[Keith Williams · CRP5 22]"}, {"type": "mcq", "t": "Given: Pressure Altitude 29000 FT, OAT -55OC. Calculate the Density Altitude?", "o": ["28900 ft", "28000 ft", "27850 ft", "27500ft"], "a": 3, "x": "Density altitude calculations carried out on the CRPS are notoriously inaccurate. A more accurate estimation can be made using the standard equation: Density Alt = Pressure Alt + (120 x temperature deviation). Where temp deviation is actual temperature - ISA temperature Setting 10 on the inner scale against 10 on the outer scale on the CRPS causes the altitude window to indicate that at 29000 ft the ISA temperature is - 4 3 ' ~ . Subtracting this from theactual temperature gives temperature deviat,ioo = - Inserting this value into tbe equation ,gives: (option c).\n\n[Keith Williams · CRP5 23]"}, {"type": "mcq", "t": "Given: Compass Heading 090°, Deviation 2OW, Variation 12OE, TAS 160 kt. Whilst maintaining a radial 070' from a VOR station, the aircraft flies a ground distance of 14 NM in 6 MIN. What is the W N '(T)?", "o": ["160°/50 kt", "150°/50 kt", "160°/60 kt", "150°/60 kt"], "a": 0, "x": "To solve this problem using the CRPS. The 6 min taken to fly 14 nm s 1/10 of an hour, so its ground speed is 14 x Compass heading is 090' with 12' E variation and 2' W deviation, so true heading is loo0 , set this on the window against the true heading index. Course is the 0 7 0 ' ~VOR radial. With variation 1 2 ' ~this is 0 8 2 ' ~ . Set the low speed slide so that 160 kts TAS is at the centre dot. Align 1000 on the inner scale with the true heading index mark on the outer scale. The aircraft is maintaining course 082'~,while on true heading 100' so it is drifting so it is 18' left. Draw a cross where the 140 kt arc intersects the 180 left drift radial. This represents the ground speed. This situation is illustrated below. 1. 100' aligned with true heading index mark. 3. Cross drawn at 140 kts 18' left drift. 2. c e n t r e dot on 160 kts TAS. Rotate the window to align the cross with the centre line below the centre Read off the wind direction 160' opposite the true heading index and the wind speed by counting down from the centre dot to the cross. This gives 160'153 kts or approximately 160'150 kts (option a,) This situation is illustrated below. 3. Read off 160' wind direction o posite the true heading index mark. 1. Set cross on ceztre line below centre dot. 2. Cross 53 kts below centre dot.\n\n[Keith Williams · CRP5 24]"}, {"type": "mcq", "t": "Fuel flow per HR is 22 US-GAL, total fuel on board is 83 IMP GAL. What is the endurance?", "o": ["4 h r 32 min", "3 b r 46 min", "4 h r 46 min", "3 hr 32 min"], "a": 0, "x": "To solve this type of problem using the CRPS: First convert Imp Gal into USG by setting 83 on the inner scale against the Imp Gal arrow on the outer scale. Now put the cursor on the USG arrow and read off 99.5 USG on the inner scale. Align the 60 min index mark on the inner scale with the fuel consumption of 22 USG/Hr on the outer scale. Position the cursor through the fuel available (99.5 USG) on the outer scale and read off 4 h 32 min on the yellow inner scale (option a). These settings are illustrated below. 1. 60 min index is set against 22 USGIhr fuel consumption rate. llow inner scale at 4 hours 32 rnin.\n\n[Keith Williams · CRP5 26]"}, {"type": "mcq", "t": "What is the ratio between the fitre and the US-GAL ?1 US-GAL equals?", "o": ["3.5 litres", "4.3 litres", "3.78 litres", "3.65 litres"], "a": 2, "x": "To solve this type of problem on the CRP5: Set 1USG on the inner scale against the USG arrow on the outer scale. Against the Itr arrow on the outer scale read off 3.48 Its on the inner scale (option c). these settings are illustrated below. 1. Set 1USG on the inner scale against the USG arrow on the outer scale. 2. Cursor set on the ltr arrow crosses the inner scale at 3.78.\n\n[Keith Williams · CRP5 27]"}, {"type": "mcq", "t": "A11 aircraft travels 100 statute miles in 20 min, how long does it take to travel 215 nm?", "o": ["50 min", "46 min", "48 min", "51 min"], "a": 0, "x": "To solve this type of problem using a CRPS: a. Set 106) on the inner scale against the statute miles arrow on the outer scale. b. The nautical mile arrow on the outer scale will now align with 87 nm on the inner scale. This means that 100 statute mile = 87 nautical miles, which the aircraft flies in 20 minutes. c. 20 minutes is 113 of a tand 3. Scale increases as distance increases outside of the two standard parallels\n\n[Keith Williams · CHART THEORY 10]"}, {"type": "mcq", "t": "On a Transverse Mercator chart, scale is exactly correct along the?", "o": ["Meridian of tangency", "Prime meridian", "Standard latitudes", "latitude of origin"], "a": 0, "x": "Transverse Mercator charts are produced by projecting the graticule of a model of the earth onto the inside of a sheet of paper wrapped around the earth to form a cylinder. This cylinder is aligned so that it contacts the surface of the earth at the poles and along a meridian and anti-meridian. This projection is then mathematically adjusted to achieve orthomorphism. The scale on such a chart is exactly correct only along the meridian of tangency, which is the line along which the cylinder is in contact with the surface of the earth (option a).\n\n[Keith Williams · CHART THEORY 11]"}, {"type": "mcq", "t": "The angular difference, on a Lambert conformal conic chart, between the,arrival and departure track is equal to?", "o": ["Departure angle", "Map convergence", "Secant of ?4latitude", "Secant of longitude"], "a": 1, "x": "A Lamberts chart is produced by projecting the graticule of a model of the earth onto the inside of a cone of paper which is then unfolded to form the chart. This process produces a graticule in which the meridians are straight lines converging upon the nearest pole. In the Northern hemisphere each meridian points directly a t the North Pole. Because the meridians converge, any straight line not in a north-south direction on such a chart will cross each successive meridian in its pa'h at a slightly different angle. This means that the direction of the track will ch;~ngecontinuously along any straight line track. This change of track is caused by the convergence of the meridians, so the difference in the departure and arrival track between two points is equal to the convergence of the chart (option b). This situation is illustrated below. North All meridians point towards true North Dotted line parallel to meridian a t position A\n\n[Keith Williams · CHART THEORY 12]"}, {"type": "mcq", "t": "On a Direct Mercator chart, meridians are?", "o": ["Parallel, equally spaced, horizontal straight lines", "Conveging curved lines", "Parallel, equally spaced, vertical straight lines", "Diverging curved lines"], "a": 2, "x": "Direct Mercator charts are based on a cylindrical projection where a light a t the centre of a model of the earth, projects the graticule out onto a sheet of paper, which has been wrapped around the model to form a cylinder. This process produces one of the requirements of an orthomorphic/conformal chart in that all of the meridians and parallels of latitude cross a t 90 degrees to each other. In addition to this, all of the meridians are straight lines. This means that all meridians on a Direct Mercator chart are parallel, equally spaced, vertical straight lines (option c).\n\n[Keith Williams · CHART THEORY 14]"}, {"type": "mcq", "t": "On a Lambert conformal conic chart, the distance between parallels of latitude spaced the same number of degrees apart?", "o": ["Increases between and reduces outside of the standard parallels", "Reduces between, and expands outside, the standard parallels", "Is constant between the standard parallels", "Is constant outside of the standard parallels"], "a": 1, "x": "A Lambert's chart is based upon a conical projection. This means that the graticule of the earth is projected onto the inside of a cone as illustrated below. Conical sheet of paper between the parallels of latitude increases above and below the point a t which the cone touches of the Earth This method of projection causes the scale to increase as distance increases away from the line at which the cone is in contact with the model of the Earth. The scale can therefore be correct only along this line of contact. In order to make such a projection conformal the scale is reduced mathematically a t all points. This is the equivalent of having the cone pass below the surface of the model of the earth as illustrated below. This produces two lines of parallel a t which the scale is correct. These are termed the \"Standard Parallels\". Scale between these parallels reduces while scale outside of the standard parallels increases as distance away from the parallels increases. This means that the distance between parallels of latitude equal numbers of degrees apart, reduces between and increases outside of the standard parallels (option b). 1. Cone touches the earth along two standard parallels 4. Scale decreases between the two standard parallels 3. Scale increases as distance increases outside of the two standard parallels\n\n[Keith Williams · CHART THEORY 17]"}, {"type": "mcq", "t": "Which of the following statements best describes how scale varies on a Mercator chart?", "o": ["I t is correct on the standard parallels, but expands outside them, and contracts within them", "Expands as the secant of the EastWest great circle distance", "Expands as the secant (% x co-latitude )", "Expands directly with the secant of the latitude"], "a": 3, "x": "Direct Mercator charts ar? based on a cylindrical projection where a light at the centre of a model of the esrth, projects the graticule out onto a sheet of paper, which has been wrapped qround the model to form a cylinder. This process produces one of the requirements of an orthomorphic/conformal chart in that all of the meridians and parallels of latitude cross at 90 degrees to each other. In addition to this, all of the meridians are straight lines. But the scale on such charts is correct only at the Equator, then expands directly with the secant of the latitude north and south (option d).\n\n[Keith Williams · CHART THEORY 23]"}, {"type": "mcq", "t": "Where is the convergency correct on a Transverse Mercator chart?", "o": ["At the datum meridian and the Equator", "Only at the Equator and Poles", "Only at the datum meridian", "At the Parallel of Origin"], "a": 0, "x": "Transverse Mercator charts are produced by projecting the graticule of a model of the earth onto the inside of a sheet of paper wrapped around the earth to form a cylinder. This cylinder is aligned so that it contacts the surface of the earth at the poles and along a meridian and anti-meridian. This projection is then mathematically adjusted to achieve orthomorphism. The line of contact between the cylinder and the earth is called the meridian of tangency, and this is the only meridian that appealis a straight line on the chart. All of the other meridians are distorted such that they appear as complex curves. Because of this distortion, the convergency of the chart is correct only along the datum meridian and at the poles and equator (option a).\n\n[Keith Williams · CHART THEORY 25]"}, {"type": "mcq", "t": "The scale on a Lambert's conformal conic chart?", "o": ["Is constant", "Is constant along a parallel of latitude", "Is constant along a meridian of longitude", "Varies slightly as a function of longitude and latitude"], "a": 1, "x": "A Lambert's chart is based upon a conical projection. This means that the graticule of the earth is projected onto the inside of a cone as illustrated below. Conical $beet o - \\ of latitude increases above and below the point at which the cone touches of the Earth This method of projection causes the scale to increase as distance increases away from the line at which the Lone is in contact with the model of the Earth. The scale can therefore be correct only along this line of contact. In order to make such a projection conformal the scale is reduced mathematically at all points. This is the equivalent of having the cone pass below the surface of the model of the earth as illustrated below. This produces two lines of parallel at which the scale is correct. These are termed the \"Standard Parallels\". Scale between these parallels reduces while scale outside of the standard parallels increases as distance away from the parallels increases. The nominal scale of a Lambert's Conformal chart is therefore constant along any parallel of latitude (option b). 1. Cone touches the earth dong two standard parallels along the two 2. Scale is correct nly standard parallels l between the two standard parallels 3. Scale increases as distance increases outside of the two standard parallels\n\n[Keith Williams · CHART THEORY 28]"}, {"type": "mcq", "t": "The scale is correct on a Transverse Mercator chart?", "o": ["Along the datum meridian and meridians a t 90° to it", "At the prime meridian", "Along the great circle of tangency", "At thegoles and the equator"], "a": 2, "x": "A Great Circle is a ciqcle drawn on the surface of the earth such that its centre is the centre of the earth. Great circles 'include all meridians plus the equator. Mercator charts are based on a cylindrical projection where a light at the centre of a model of the earth, projects the graticule out onto a sheet of paper, which has been wrapped around the earth to form a cylinder. In the case of Transverse Mercator charts the lPne of contact between the paper cylinder and the earth is one of the meridians. This meridian is called the great circle of tangency. One of the effects of this form of projection is that the scale is correct only along this great circle of tangency (option c) then expands with increasing distance either side. CHART THEORY 30. A flight Information region (FIR) boundary is indicated by a line (option b). CHART THEORY 31. The symbol for an uncontrolled route is marked with a - - - - - - - - -------------- line (option d). CHART THEORY 32. The symbol for a Control Zone (CTR) on an aeronautical chart i option a.\n\n[Keith Williams · CHART THEORY 29]"}, {"type": "mcq", "t": "What is the magnetic track and distance from Connaught VOR/DME (CON, N53 54.8 WOO8 49.1) to overhead Abbey Shrule aerodrome (N5336 WOO7 39)?", "o": ["124\" - 47 nm", "116\" - 46 nm", "296\" - 46 nm", "304\" - 47 nm"], "a": 0, "x": "To solve this type of problem it is necessary to: a. Identify the two positions on the chart. b. Measure the distance between the two positions using dividers then convert this into nm using the scale on the edge of the chart. In this case the distance is 2.35 inches, which equates to 47 nm. c. Measure the radial from the first position to the second using a protractor. The question specifies magnetic track, so the protractor must be aligned with the magnetic north ticks on the chart. I n this case the magnetic track is 1 2 4 ' ~ . So the required mean true track is 124\" M 47 nm (option a).\n\n[Keith Williams · PLOTTING 16]"}, {"type": "mcq", "t": "A normal Mercator chart is a ________________ projection? (i) Cylindrical (ii) Perspective (iii) Non-perspective (iv) Conformal (v) Conical (vi) Azimuthal The correct combination of the above statements is:", "o": ["(i), (ii) and (iii)", "(ii), (iv) and (v)", "(i), (iii) and (iv)", "(iii), (iv) and (vi)"], "a": 2, "x": "[Oxford ATPL · Oxford Ch18 Q1]"}, {"type": "mcq", "t": "A direct Mercator graticule is:", "o": ["Rectangular", "Square", "Circular", "Convergent"], "a": 0, "x": "[Oxford ATPL · Oxford Ch18 Q2]"}, {"type": "mcq", "t": "On a normal Mercator chart, rhumb lines are represented as:", "o": ["Curves concave to the Equator", "Curves convex to the Equator", "Complex curves", "Straight lines"], "a": 3, "x": "[Oxford ATPL · Oxford Ch18 Q3]"}, {"type": "mcq", "t": "On a direct Mercator, great circles can be represented as:", "o": ["Straight lines", "Curves", "Straight lines and curves"], "a": 2, "x": "[Oxford ATPL · Oxford Ch18 Q4]"}, {"type": "mcq", "t": "On a direct Mercator, with the exception of the meridians and the Equator, great circles are represented as:", "o": ["Curves concave to the Nearer Pole", "Curves convex to the Equator", "Curves concave to the Equator", "Straight lines"], "a": 2, "x": "[Oxford ATPL · Oxford Ch18 Q5]"}, {"type": "mcq", "t": "The angle between a straight ng the standard equation: E = endurance, H = homebound groundspeed, 0 = outbound groundspeed. The outbound groundspeed (300 kts - 50 kts headwind) = 250 kts. The homebound groundspeed is (300 kts + 50 kts tailwind) = 350 kts. The stated endurance is 10 hours. Inserting these figures into the equation gives: Distance to PSR = time to PSR x outbound groundspeed. Inserting the data above gives distance to PSR = 250 nmlh x 5.83 h = 1458 nm (option a).\n\n[Keith Williams · PSR & PET 1]"}, {"type": "mcq", "t": "What is the time to the point of safe return (PSR) if the distance from A to B is 2368 nautical miles, the outbound groundspeed in 365 knots, the homebound groundspeed is 480 knots, and safe endurance is 8 hours 30 minutes?", "o": ["190 min", "209 min", "219 Min", "290 Min"], "a": 3, "x": "This type of problem can be solved using the standard equation: E = endurance, H = homebound groundspeed, 0 = outbound groundspeed. The endurance of 8 hours and 30 minutes is equal to 510 minutes Inserting these figures into the equation gives: PSR = (510 min x 480 nmlh) I (365 nmlh + 480 nmlh) = 289 o r approximately 290 minutes (option d). I t should be noted that the distance between A and B is not relevant to the solution of this problem.\n\n[Keith Williams · PSR & PET 2]"}, {"type": "mcq", "t": "What is the distance from 'Q' to the Point of Safe Return (PSR) for an aircraft that was over 'Q' at 1320 hours flying direct to 'R', given the following data? Distance 'Q' to 'R' 3016 nm, True airspeed 480 kt, Safe endurance 10 Hours, if the mean wind component 'outbound' -90 kt, and the mean wind component 'homebound' is +75 kt.", "o": ["1320 nm", "1530 nm", "2290 nm", "2375 nm"], "a": 2, "x": "This type of problem can be solved using the standard equation: E = endurance, H = homebound groundspeed, 0 = outbound groundspeed. The outbound groundspeed (480 kts - 90 kts headwind) = 390 kts. The homebound groundspeed is (480 kts + 75 kts tailwind) = 555 kts. The stated endurance is 10 hours. Inserting these figures into the equation gives: Distance to PSR = time to PSR x outbound groundspeed. Inserting the data above gives distance to PSR = 390 nm/h x 5.87 h = 2290 nm (option c).\n\n[Keith Williams · PSR & PET 3]"}, {"type": "mcq", "t": "What is the distance to B from the equal-time-point given the following data? Distance A to B is 360 nm Wind component A - B is -15 kt TAS is 180 kt Wind component B -A is +15 kt", "o": ["165 nm", "170 nm", "175 nm", "180 nm"], "a": 0, "x": "This type of problem can be solved using the standard equation below to find the distance to PSR then subtracting this from the distance to point B: D = distance of total leg, H = homebound groundspeed, 0 = outbound groundspeed. The distance of total leg is 360 nm Outward groundspeed = (TAS - headwind) = (180 kts - 1 5 kts) = 165 kts. Homebound groundspeed = (TAS + tailwind) = (180 kts + 15 kts) = 195 kts Inserting these figures into the equation gives: The distance from PET to point B is distance from A to B (360 nm) - PET (195\n\n[Keith Williams · PSR & PET 4]"}, {"type": "mcq", "t": "An aircraft is flying at a TAS of 300 knots over a stretch of water between 2 airfields 500 nm apart. What is the distance from the first airfield to the equal time point (ETP) if the wind component is 60 knots head?", "o": ["200 nm", "250 nm", "280 nm", "300 nm"], "a": 3, "x": "This type of problem can be solved using the standard equation: D = distance of total leg, H = homebound groundspeed, 0 = outbound groundspeed. The distance of total leg is 500 nm Outward groundspeed = (TAS - headwind) = (300 kts - 60 kts) = 240 kts. Homebound groundspeed = (TAS + tailwind) = (300 kts + 60 kts) = 360 kts Inserting these figures into the equation gives:\n\n[Keith Williams · PSR & PET 5]"}, {"type": "mcq", "t": "How far can the aeroplane fly out from its base and return in one hour, when flying at TAS 180 kt on a track of 090°, if the W N is 045°/50kt?", "o": ["58 nm", "85 nm", "88 nm", "175 nm"], "a": 1,
