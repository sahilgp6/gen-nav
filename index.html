<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ATPL Gen Nav — Williams + Oxford Question Bank</title>
<style>
:root{--bg:#ddd8cc;--surface:#f5f0e6;--surface2:#ede8dc;--border:#c4b99a;--accent:#1a3a6b;--accent2:#9e2a1c;--green:#2d6a30;--red:#9e2a1c;--yellow:#8b6914;--orange:#a05828;--purple:#4a3570;--text:#1c1814;--muted:#7a6f60;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:16px;line-height:1.6;min-height:100vh}
.screen{display:none}.screen.active{display:block}
.home-header{background:var(--surface);border-bottom:1px solid var(--border);padding:20px;text-align:center}
.home-header h1{font-size:22px;font-weight:800;color:var(--text)}
.home-header p{font-size:13px;color:var(--muted);margin-top:4px}
.home-body{padding:16px 16px 40px;max-width:700px;margin:0 auto}
.section-label{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:20px 0 10px}
.chapter-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chapter-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.chapter-card:active{transform:scale(.97)}.chapter-card:hover{border-color:var(--accent)}
.card-icon{font-size:22px;margin-bottom:6px}.card-title{font-size:13px;font-weight:700;line-height:1.3}
.card-sub{font-size:11px;color:var(--muted);margin-top:3px}
.ch-acc-row{display:flex;align-items:center;gap:6px;margin-top:6px}
.card-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:rgba(26,58,107,.1);color:var(--accent);border:1px solid rgba(26,58,107,.3)}
.ch-mini-bar{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:2px}
.ch-mini-bar-inner{height:100%;border-radius:2px;transition:width .4s}
/* PROGRESS */
.overall-stats{display:flex;justify-content:space-around;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.overall-stats span{display:flex;flex-direction:column;align-items:center;gap:2px}
.stat-val{font-size:20px;font-weight:800}.stat-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.streak-banner{background:rgba(160,88,40,.1);border:1px solid rgba(160,88,40,.3);border-radius:8px;padding:10px 14px;font-size:13px;font-weight:600;color:var(--orange);margin-bottom:12px;text-align:center}
.prog-chapter{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:7px;display:flex;align-items:center;gap:10px}
.prog-ch-name{font-size:12px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog-bar-outer{flex:2;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.prog-bar-inner{height:100%;border-radius:3px;transition:width .4s}
.prog-ch-pct{font-size:12px;font-weight:700;min-width:36px;text-align:right}
.weak-btn{width:100%;padding:13px;background:rgba(158,42,28,.08);border:2px solid var(--red);border-radius:var(--radius);font-size:14px;font-weight:700;color:var(--red);cursor:pointer;margin-top:8px;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;gap:8px}
.weak-btn:active{transform:scale(.97)}
.weak-btn-flag{background:rgba(160,88,40,.08)!important;border-color:var(--orange)!important;color:var(--orange)!important}
.mock-btn{width:100%;padding:13px;background:rgba(26,58,107,.08);border:2px solid var(--accent);border-radius:var(--radius);font-size:14px;font-weight:700;color:var(--accent);cursor:pointer;margin-top:8px;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;gap:8px}
.mock-btn:active{transform:scale(.97)}
.mock-btn-full{background:rgba(26,58,107,.15);font-size:15px;padding:15px}
.progress-actions{margin-top:10px}
.no-data-note{font-size:12px;color:var(--muted);text-align:center;padding:16px 0}
.reset-link{font-size:11px;color:var(--muted);text-align:center;cursor:pointer;text-decoration:underline;margin-top:6px}
.sync-row{display:flex;gap:8px;margin-top:10px}
.sync-btn{flex:1;padding:10px 8px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text);-webkit-tap-highlight-color:transparent;transition:all .15s}
.sync-btn:active{transform:scale(.97)}
.sync-btn.export{border-color:var(--accent);color:var(--accent);background:rgba(26,58,107,.08)}
.sync-btn.import{border-color:var(--green);color:var(--green);background:rgba(45,106,48,.08)}
.session-history{margin-top:14px}
.session-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.session-title{font-size:12px;flex:1;color:var(--text)}
.session-date{font-size:10px;color:var(--muted)}
.session-pct{font-size:12px;font-weight:700;min-width:36px;text-align:right}
.io-modal{position:fixed;inset:0;background:rgba(28,24,20,.8);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px}
.io-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;width:100%;max-width:480px}
.io-box h3{font-size:15px;font-weight:700;margin-bottom:8px}
.io-box p{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.5}
.io-ta{width:100%;height:110px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px;font-size:11px;font-family:monospace;resize:none;outline:none}
.io-actions{display:flex;gap:8px;margin-top:12px}
.io-actions button{flex:1;padding:11px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent}
.io-cancel{background:var(--surface2);color:var(--text);border:1px solid var(--border)!important}
.io-confirm{background:var(--accent2);color:#fff}
/* QUIZ */
.quiz-header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px;position:sticky;top:0;z-index:100}
.quiz-header-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.back-btn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--text);cursor:pointer;-webkit-tap-highlight-color:transparent}
.quiz-title{font-size:15px;font-weight:700;flex:1}
.live-score{font-size:12px;font-weight:700;color:var(--accent)}
.prog-bar-wrap{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:4px}
.prog-bar{height:100%;background:var(--accent);border-radius:2px;transition:width .3s ease;width:0%}
.prog-text{font-size:11px;color:var(--muted)}
.quiz-body{padding:14px 16px 100px;max-width:700px;margin:0 auto}
.quiz-footer{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:10px;z-index:100}
.btn{flex:1;padding:13px;border-radius:var(--radius);font-size:14px;font-weight:700;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;transition:all .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent2);color:#fff}
.btn-secondary{background:var(--surface2);border:1px solid var(--border);color:var(--text)}
/* CARDS */
.qcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;transition:border-color .2s}
.qcard.correct{border-color:var(--green)}.qcard.wrong{border-color:var(--red)}
.qcard-header{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.qnum{background:var(--accent2);color:#fff;font-size:11px;font-weight:700;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.qnum-calc{background:var(--yellow)}
.qnum-tbl{background:var(--purple)}
.qtype-badge{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:10px;display:inline-block;margin-bottom:5px}
.qtype-calc{color:var(--yellow);background:rgba(139,105,20,.1);border:1px solid rgba(139,105,20,.3)}
.qtype-tbl{color:var(--purple);background:rgba(74,53,112,.1);border:1px solid rgba(74,53,112,.3)}
.qtext{font-size:14px;font-weight:500;line-height:1.5;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;align-items:flex-start;gap:9px;padding:11px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s;background:var(--surface2);-webkit-tap-highlight-color:transparent;user-select:none}
.opt:active{transform:scale(.98)}
.opt.sel{border-color:var(--accent);background:rgba(26,58,107,.08)}
.opt.ok{border-color:var(--green)!important;background:rgba(45,106,48,.1)!important}
.opt.fail{border-color:var(--red)!important;background:rgba(158,42,28,.1)!important}
.opt.miss{border-color:var(--green);background:rgba(45,106,48,.05)}
.opt-l{font-size:11px;font-weight:700;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--border);color:var(--muted);flex-shrink:0;margin-top:2px;transition:all .15s}
.opt.sel .opt-l{background:var(--accent);color:#fff}
.opt.ok .opt-l{background:var(--green);color:#fff}
.opt.fail .opt-l{background:var(--red);color:#fff}
.opt.miss .opt-l{background:var(--green);color:#fff}
.opt-t{font-size:13px;color:var(--text);line-height:1.4}
.exp{margin-top:12px;padding:11px 13px;background:var(--surface2);border-radius:8px;font-size:13px;line-height:1.6;color:var(--muted);display:none;border-left:3px solid var(--accent)}
.exp strong{color:var(--text)}
.verdict{font-weight:700;margin-bottom:4px;display:block}
.v-ok{color:var(--green)}.v-fail{color:var(--red)}
.flag-btn{background:none;border:none;cursor:pointer;font-size:16px;opacity:1;padding:2px 6px;transition:background .15s,color .15s;flex-shrink:0;border-radius:4px;color:var(--muted)}
.flag-btn.flagged{background:rgba(158,42,28,.15);color:#9e2a1c}
/* CALC CARD */
.calc-body{font-size:13px;line-height:1.7;color:var(--text);white-space:pre-wrap;word-break:break-word}
.show-ans-btn{margin-top:12px;padding:9px 16px;background:rgba(139,105,20,.1);border:1px solid rgba(139,105,20,.4);border-radius:8px;font-size:12px;font-weight:700;color:var(--yellow);cursor:pointer;width:100%;-webkit-tap-highlight-color:transparent;transition:all .15s}
.show-ans-btn:active{transform:scale(.97)}
.calc-ans{margin-top:10px;padding:11px 13px;background:var(--surface2);border-radius:8px;font-size:13px;line-height:1.6;color:var(--text);display:none;border-left:3px solid var(--yellow);white-space:pre-wrap}
.calc-ans.visible{display:block}
/* TABLE CARD */
.tbl-caption{font-size:12px;color:var(--purple);font-weight:600;margin-bottom:8px}
.ref-table{width:100%;border-collapse:collapse;font-size:12px;overflow-x:auto;display:block}
.ref-table th{background:var(--surface2);color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:7px 10px;border:1px solid var(--border);text-align:center;white-space:nowrap}
.ref-table td{padding:6px 10px;border:1px solid var(--border);text-align:center;color:var(--text);white-space:nowrap}
.ref-table td.hi{background:var(--surface2);color:transparent;font-weight:700;border-color:rgba(139,105,20,.5);cursor:pointer;user-select:none;position:relative;min-width:40px}
.ref-table td.hi::after{content:"?";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(139,105,20,.5);font-size:13px;font-weight:700}
.ref-table td.hi.revealed{background:rgba(139,105,20,.2);color:var(--yellow);cursor:default}
.ref-table td.hi.revealed::after{display:none}
.tbl-reveal-btn{margin-top:10px;padding:9px 16px;background:rgba(74,53,112,.1);border:1px solid rgba(74,53,112,.4);border-radius:8px;font-size:12px;font-weight:700;color:var(--purple);cursor:pointer;width:100%;-webkit-tap-highlight-color:transparent;transition:all .15s}
.tbl-reveal-btn:active{transform:scale(.97)}
/* RESULTS */
.result-header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:10px}
.result-header h2{font-size:16px;font-weight:700;flex:1}
.result-body{padding:16px;max-width:700px;margin:0 auto}
.result-circle{width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;margin:0 auto 8px;border:4px solid}
.rc-pass{border-color:var(--green);color:var(--green);background:rgba(45,106,48,.1)}
.rc-mid{border-color:var(--yellow);color:var(--yellow);background:rgba(139,105,20,.1)}
.rc-fail{border-color:var(--red);color:var(--red);background:rgba(158,42,28,.1)}
.result-meta{text-align:center;margin-bottom:20px}
.result-meta h3{font-size:16px;font-weight:700}
.result-meta p{font-size:12px;color:var(--muted);margin-top:4px}
.score-row{display:flex;justify-content:center;gap:24px;margin:12px 0}
.score-item{display:flex;flex-direction:column;align-items:center;gap:2px}
.score-val{font-size:22px;font-weight:800}
.score-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.result-actions{display:flex;gap:10px;margin-bottom:20px}
/* TABS */
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;position:sticky;top:0;z-index:90;overflow-x:auto}
.tab{padding:12px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;-webkit-tap-highlight-color:transparent;transition:all .15s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-content{display:none}.tab-content.active{display:block}
/* CHAPTER CHIPS */
.ch-chips{display:none;flex-wrap:wrap;gap:6px;padding-top:10px;border-top:1px solid var(--border);margin-top:8px}
.ch-chips.open{display:flex}
.ch-chip{padding:6px 11px;border-radius:20px;font-size:12px;font-weight:600;background:var(--surface2);border:1px solid var(--border);color:var(--text);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s}
.ch-chip:active{transform:scale(.95)}
.ch-chip-primary{background:var(--accent2);color:#fff;border-color:var(--accent2)}
/* CHAPTER PROGRESS */
.ch-prog-bar{height:3px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden}
.ch-prog-fill{height:100%;border-radius:2px;transition:width .4s}
.ch-stat-row{display:flex;align-items:center;gap:5px;margin-top:5px}
.stale-dot{width:6px;height:6px;border-radius:50%;background:var(--yellow);flex-shrink:0}
/* RESUME BANNER */
.resume-banner{display:none;margin:0 16px 12px;background:linear-gradient(135deg,rgba(26,58,107,.12),rgba(26,58,107,.06));border:1.5px solid var(--accent);border-radius:var(--radius);padding:14px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s}
.resume-banner:active{transform:scale(.98)}
.resume-banner.visible{display:block}
.resume-banner-top{display:flex;align-items:center;gap:10px}
.resume-banner-icon{font-size:22px;flex-shrink:0}
.resume-banner-title{font-size:14px;font-weight:700;color:var(--accent)}
.resume-banner-meta{font-size:11px;color:var(--muted);margin-top:2px}
.resume-banner-cta{margin-top:10px;background:var(--accent2);color:#fff;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:700;width:100%;cursor:pointer;-webkit-tap-highlight-color:transparent}
/* GLOBAL STATS STRIP */
.global-stats{display:flex;gap:20px;padding:10px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);grid-column:1/-1;margin-bottom:4px}
.global-stat{display:flex;flex-direction:column;align-items:center;gap:1px;flex:1}
.global-stat-val{font-size:16px;font-weight:800;color:var(--text)}
.global-stat-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.quiz-timer{margin-top:6px;font-size:13px;font-weight:800;letter-spacing:.5px;color:var(--accent);background:rgba(26,58,107,.10);border:1px solid rgba(26,58,107,.30);border-radius:8px;padding:5px 10px;text-align:center}.quiz-timer.warn{color:var(--orange);background:rgba(160,88,40,.12);border-color:rgba(160,88,40,.40)}.quiz-timer.crit{color:var(--red);background:rgba(158,42,28,.14);border-color:rgba(158,42,28,.45);animation:tpulse 1s ease-in-out infinite}@keyframes tpulse{0%,100%{opacity:1}50%{opacity:.55}}.ui-dialog-msg{font-size:15px;line-height:1.5;color:var(--text);margin:0 0 4px}.io-confirm.copied{background:var(--green)}.stwarn{background:rgba(158,42,28,.10);border:1px solid rgba(158,42,28,.35);border-left:4px solid var(--red);border-radius:10px;padding:12px 14px;margin:0 0 14px}.stwarn b{color:var(--red)}.stwarn p{margin:6px 0 0;font-size:13px;line-height:1.5;color:var(--text)}.stwarn ol{margin:8px 0 0;padding-left:20px;font-size:13px;line-height:1.6}.stwarn .btnrow{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}.stwarn button{flex:1;min-width:130px;padding:9px 12px;border-radius:8px;border:none;font-size:13px;font-weight:700;background:var(--accent);color:#fff}.stok{background:rgba(45,106,48,.09);border:1px solid rgba(45,106,48,.30);border-radius:10px;padding:10px 13px;margin:0 0 14px;font-size:13px;color:var(--text)}.bkrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.bkrow button{flex:1;min-width:135px;padding:11px;border-radius:9px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;font-weight:700}.bkrow button.pri{background:var(--accent);color:#fff;border-color:transparent}
</style>
</head>
<body>

<!-- HOME -->
<div id="home" class="screen active">
  <div class="home-header">
    <h1>✈️ Gen Nav · Williams + Oxford</h1>
    <p>1514 questions · 38 chapters · Keith Williams 1000 Q&amp;A + Oxford ATPL Gen Nav · 1491 MCQ + 16 worked examples + 7 fill-in tables · shuffled options · timed mocks</p>
  </div>
  <div class="home-body">
    <div id="resume-banner" class="resume-banner" onclick="resumeSession()">
      <div class="resume-banner-top">
        <div class="resume-banner-icon">↩️</div>
        <div><div class="resume-banner-title" id="resume-banner-title">Resume session</div><div class="resume-banner-meta" id="resume-banner-meta"></div></div>
      </div>
      <button class="resume-banner-cta" onclick="event.stopPropagation();resumeSession()">Continue where you left off →</button>
    </div>
    <div class="tabs" style="position:relative;top:0">
      <div class="tab active" onclick="switchTab('chapters')">Chapters</div>
      <div class="tab" onclick="switchTab('progress')">Progress</div>
      <div class="tab" onclick="switchTab('mock')">🎯 Mock</div>
      <div class="tab" onclick="switchTab('flagged')">🚩 Flagged</div>
    </div>
    <div id="tab-chapters" class="tab-content active" style="padding-top:12px">
      <div class="section-label">Chapters</div>
      <div class="chapter-grid" id="chapter-grid"></div>
    </div>
    <div id="tab-progress" class="tab-content" style="padding-top:12px">
      <div id="progress-section"></div>
    </div>
    <div id="tab-mock" class="tab-content" style="padding-top:12px">
      <div id="mock-section"></div>
    </div>
    <div id="tab-flagged" class="tab-content" style="padding-top:12px">
      <div id="flagged-section"></div>
    </div>
  </div>
</div>

<!-- QUIZ -->
<div id="quiz" class="screen">
  <div class="quiz-header">
    <div class="quiz-header-top">
      <button class="back-btn" onclick="goHome()">← Home</button>
      <span class="quiz-title" id="quiz-title"></span>
      <span class="live-score" id="live-score"></span>
    </div>
    <div class="prog-bar-wrap"><div class="prog-bar" id="prog-bar"></div></div>
    <div class="prog-text" id="prog-text"></div>
  </div>
  <div class="quiz-body" id="quiz-body"></div>
  <div class="quiz-footer" id="quiz-footer"></div>
</div>

<!-- RESULTS -->
<div id="results" class="screen">
  <div class="result-header">
    <button class="back-btn" onclick="goHome()">← Home</button>
    <h2 id="r-title"></h2>
  </div>
  <div class="result-body">
    <div class="result-meta">
      <div class="result-circle" id="r-circle"></div>
      <h3 id="r-label"></h3>
      <p id="r-sub"></p>
    </div>

<script>
const CHAPTERS=[{"id": "ch1", "icon": "☀️", "color": "#f0883e", "sub": "Ecliptic · Seasons · Twilight", "title": "Solar System", "questions": [{"type": "mcq", "t": "In which months is the difference between apparent noon and mean noon the greatest?", "o": ["March and September", "June and December", "November and February", "January and July"], "a": 2, "x": "The mean solar day is the average length of time that it takes for the earth to complete one 360' rotation about its axis as measured by reference to a distance star. The mean noon is the time in a mean day at which the earth has completed 180' of rotation about its axis. At any point on the earth, the mean noon is the time at which the star being used as a reference is directly above the meridian on which the point lies. If the earth were not rotating about the sun, the mean noon at any point on the Earth, would also be the time at which the sun and the star being used as a reference would be directly above the meridian on which the point lies. In this situation the sun and the star would be in a straight line above the meridian as illustrated where the earth is at point A in the diagram below. The apparent noon is the time at which the sun appears to be directly overhead of a point on a meridian. Because the earth rotates around the sun, the mean noon and the apparent noon are not always the same point in time. The diagram shows the Earth as viewed from above the North Pole. When the Earth is at point A in the diagram, the sun and the star are in a straight line above the same meridian, so it is both mean noon and apparent noon. But when the earth has moved point B in its orbit around the sun, the star and the sun are no longer in a straight line. So although it is mean ...\n\n[Keith Williams · SOLAR SYSTEM & TIME 1]"}, {"type": "mcq", "t": "What is the reason for seasonal changes in climate?", "o": ["Because the Earth's spin axis is inclined to the plane of its orbit round the Sun", "Because the distance between the Earth and the Sun varies over a year", "Because the Earth's orbital speed round the Sun varies according to the time of the year", "Because of the difference between the Tropical Year and the Calendar year"], "a": 0, "x": "The main reason for the seasonal changes is because the earth's spin axis is inclined to the plane of its orbit around the sun (option a). As illustrated below this causes the sun to appear to move north of the equator for half of the year and south of the equator fro the other half. This means that the duration of daylight and the apparent intensity of the suns heating effect changes over a 12 month cycle. Earth's axis of rotation is tilted at 66.50 to its plane of rotation around the sun Equator- The Sun appears to be North The Sun appears to be South of Equator when the Earth of the equator when the earth is at this point in its orbit is at this point in its orbit\n\n[Keith Williams · SOLAR SYSTEM & TIME 2]"}, {"type": "mcq", "t": "The main reason that day and night, throughout the year, have different duration, is due to the?", "o": ["Relative speed of the sun along the ecliptic", "Inclination of the ecliptic to the equator", "Earth's rotation", "Gravitational effect of the sun and moon on the speed of rotation of the Earth"], "a": 1, "x": "Night and day are caused by the rotation of the Earth about its spin axis. Daytime is that part of the rotation during which the sun is visible, and night is that part of the rotation during which it is not. In addition to spinning about its own axis, the earth also orbits the Sun in a plane called the Ecliptic. The Earth spins about its axis at a constant rate of approximately 360' every 24 hours. So if the spin axis of the Earth were at 90' to the Ecliptic, the duration of the day and the night would be equal. Under these circumstances the change from day to night would be almost entirely due to the rotation of the earth about its axis. But if spin axis were in line with or at 0' to the Ecliptic, then during each 24 hour period, the sun would be permanently visible in the hemisphere closest to it and permanently invisible in the other. It would therefore be permanently day in one hemisphere and permanently night in the other. If the spin axis were set at any angle between 90' and 0' each 24 hour period would be part day and part night, but the day would be longer than the night in the hemisphere closest to the Sun. The spin axis of the Earth is set at 66.5' to the Ecliptic. This means that as the earth orbits the Sun, the poles alternate between being the closer and the further from the sun. So the lengths of day and night gradually change as the Earth orbits the Sun. So the ...\n\n[Keith Williams · SOLAR SYSTEM & TIME 5]"}, {"type": "mcq", "t": "At what approximate date is the earth furthestSrom the sun (aphelion)?", "o": ["Beginning of July", "End of September", "Beginning of January", "End of December"], "a": 0, "x": "The Earth orbits the Sun in an elliptical orbit the plane of which is called the Ecliptic. Each orbit takes.approximate1y 1year to complete. The point in the orbit at which the Earth is at its greatest distance from the Sun is called the Aphelion. It occurs at the beginning (approximately 4\"') of July each year (option a).\n\n[Keith Williams · SOLAR SYSTEM & TIME 10]"}, {"type": "mcq", "t": "Which is the highest latitude listed below a t which the sun will rise above the horizon and set every day?", "o": ["66'", "23.5'", "32.5'", "The tropics of Cancer and Capricorn"], "a": 0, "x": "Because the spin axis of the Earth is inclined a t an angle of 66.5' to the Ecliptic plane aboarr which it orbits the Sun, the Sun appears to move to the north then to the south c:f the equator as the year progresses. When the sun is south of the equator, the extreme north of the earth is permanently shielded from its rays, so the Sun does r~otrise over that area. Similarly, when the Sun is over the northerax liemisphere the extreme south of the earth does not experience sunrise. The latitudes 6 6 \" and ~ 66's are the extremes beyond which the sun does not rise and set every day (option a).\n\n[Keith Williams · SOLAR SYSTEM & TIME 22]"}, {"type": "mcq", "t": "In which two months of the year is the difference between the transit of the Apparent Sun and Mean Sun across the Greenwich Meridian the greatest?", "o": ["February and November", "March and July", "June and December", "January and August"], "a": 0, "x": "The mean solar day is the average I h g t h of time that it takes for the earth to complete one 360' rotatio,n about its axis as measured by reference to a distance star. The mean noon is the time in a mean day at which the earth has completed 1800 of rotation about its axis. At any point on the earth, the mean noon is the time at which the star being used as a reference is directly above the meridian on which the point lies. If the earth were not rotating about the sun, the mean noon at any point on the Earth, would also be the time at which the sun and the star being used as a reference would be directly above the meridian on which the point lies. In this situation the sun and the star would be in a straight line above the meridian as illustrated where the earth is at point A in the diagram below. ORBIT OF THE EARTH AROUND THE SUN EARTH ngle C The earth is at the same point in its rotation about its axis at points A and B, but is a t different points in its orbit around the Sun. The apparent noon is the time at which the sun appears to be directly overhead of a point on a meridian. Because the earth rotates around the sun, the mean noon and the apparent noon are not always the same point in time. The diagram show the Earth as viewed from above the North Pole. When the Earth is at point A in the diagram, the sun and the star are in a straight line above the same meridian, so ...\n\n[Keith Williams · SOLAR SYSTEM & TIME 30]"}, {"type": "mcq", "t": "When does perihelion occur?", "o": ["early January", "mid March", "early July", "September 21"], "a": 0, "x": "[Oxford ATPL · Oxford Ch24 Q1]"}, {"type": "mcq", "t": "When does aphelion occur?", "o": ["early January", "mid March", "early July", "September 21"], "a": 2, "x": "[Oxford ATPL · Oxford Ch24 Q2]"}, {"type": "mcq", "t": "Viewed from the North Celestial Pole (above the North Pole), the Earth orbits the Sun:", "o": ["clockwise in a circular orbit", "anticlockwise in a circular orbit", "clockwise in an elliptical orbit", "anticlockwise in an elliptical orbit"], "a": 3, "x": "[Oxford ATPL · Oxford Ch24 Q3]"}, {"type": "mcq", "t": "When do the ‘equinoxes’ occur?", "o": ["December and June", "February and November", "March and September", "January and July"], "a": 2, "x": "[Oxford ATPL · Oxford Ch24 Q4]"}, {"type": "mcq", "t": "When it is the Winter Solstice in the Southern hemisphere, the Declination of the Sun is:", "o": ["0°N/S", "23½°N", "66½°N", "23½°S"], "a": 1, "x": "[Oxford ATPL · Oxford Ch24 Q5]"}, {"type": "mcq", "t": "What is the angle between the Equinoctial and the Ecliptic?", "o": ["66½°", "23½°", "varies between 23½°N and 23½°S", "varies between 66½°N and 66½°S"], "a": 1, "x": "[Oxford ATPL · Oxford Ch24 Q7]"}, {"type": "mcq", "t": "The declination of a celestial body (the Sun) measured on the Celestial Sphere is analogous (equivalent) to ________________ on the Earth?", "o": ["latitude", "longitude", "altitude of the body measured from the sensible horizon", "co-latitude"], "a": 0, "x": "[Oxford ATPL · Oxford Ch24 Q8]"}, {"type": "mcq", "t": "‘The length of daylight/night depends upon the declination of the Sun and the latitude of the observer’. When is the rate of change of the length of daylight greatest?", "o": ["February/November", "January/July", "at the Equinoxes", "at the Solstices"], "a": 2, "x": "[Oxford ATPL · Oxford Ch24 Q9]"}, {"type": "mcq", "t": "A sidereal day is:", "o": ["longer than an apparent solar day", "longer than a real solar day", "shorter than an apparent solar day", "equal to a real solar day"], "a": 2, "x": "[Oxford ATPL · Oxford Ch24 Q10]"}, {"type": "mcq", "t": "The maximum difference between mean noon (1200LMT) and real/apparent noon occurs in ________?", "o": ["January/July", "March/September", "November/February", "December/June"], "a": 2, "x": "[Oxford ATPL · Oxford Ch24 Q11]"}, {"type": "mcq", "t": "The maximum difference between mean time and apparent time is:", "o": ["21 minutes", "16 minutes", "30 minutes", "there is no difference"], "a": 1, "x": "[Oxford ATPL · Oxford Ch24 Q12]"}, {"type": "mcq", "t": "What is the length of a Sidereal Year?", "o": ["365 days", "366 days", "365 days 6 hrs", "365 days 5 hrs 48.75 minutes"], "a": 2, "x": "[Oxford ATPL · Oxford Ch24 Q13]"}, {"type": "mcq", "t": "‘The Calendar Year and the Tropical Year are of different lengths. The difference is adjusted partly by using leap years every fourth calendar year. However, some years are not designated as leap years’. Which of the following years will be a leap year?", "o": ["2001", "2100", "2300", "2400"], "a": 3, "x": "[Oxford ATPL · Oxford Ch24 Q14]"}, {"type": "mcq", "t": "The Hour Angle (Greenwich Hour Angle) of a celestial body is analogous/ equivalent on the Earth to ________?", "o": ["latitude", "longitude", "co-latitude", "UTC"], "a": 1, "x": "[Oxford ATPL · Oxford Ch24 Q15]"}, {"type": "mcq", "t": "A star has a Greenwich Hour Angle (GHA) of 220°. Which meridian is the star transiting (crossing)?", "o": ["040W", "040E", "140W", "140E"], "a": 3, "x": "[Oxford ATPL · Oxford Ch24 Q16]"}]}, {"id": "ch2", "icon": "🕐", "color": "#8b6914", "sub": "LMT · UTC · Sunrise/Sunset", "title": "Time & Conversions", "questions": [{"type": "mcq", "t": "How would you define standard time in relation to UTC?", "o": ["It is local time", "It is local time adjusted to whole or half hours difference from UTC", "It is based on local sunrise and sunset", "I t is another term for UTC"], "a": 1, "x": "Coordinated Universal Time (UTC) is derived from atomic clocks and changes at a constant rate. It is regularly corrected to match Greenwich Mean Time (GMT). For all practical navigation purposes it can be assumed that UTC = GMT. UTC is used as the datum for world time. The difference between Local Mean Time (LMT) at any point (in hours) and UTC is equal to 1/15 of the longitude of the point measured to the West of the prime (Greenwich) meridian. But in countries that span a large range of longitude, this would cause the time to be different in different parts of the country. To overcome this problem some countries use Standard Time across the entire country, which is the Local Mean Time, adjusted to the whole hour or half hour difference from UTC (option b).\n\n[Keith Williams · SOLAR SYSTEM & TIME 3]"}, {"type": "mcq", "t": "The sun rises a t 50 O N and 025\"E on the 25th January a t 0254 UTC. On the same day what time does it rise a t 50 O N and 040°W?", "o": ["0254 UTC", "2154 UTC", "0714 UTC", "0514 UTC"], "a": 2, "x": "This type of problem can be solved using the standard equation: Time difference (in hours) UTC = Change in longitude West (in degrees) 115 The change in longitude in this question = 40' W + 25' E = 65' W Inserting this into the above equation gives: Time difference = 65 I15 = 4.33 hours which is 4 h 20 mins. Adding this to the sunrise time at 2 5 ' ~gives: Sunrise time at 40' W 0254 UTC + 4 h 20 rnin = 0714 UTC (option c).\n\n[Keith Williams · SOLAR SYSTEM & TIME 6]"}, {"type": "mcq", "t": "On the 27th of February, a t 52's and 040°E. the sunrise is a t 0243UTC. On the same day, a t 52's and 035'W, the sunrise is at?", "o": ["2143 UTC", "0243 UTC", "0743 UTC", "0523 UTC"], "a": 2, "x": "This type of problem can be solved using the standard equation: Time difference (in hours) UTC = Change in longitude West (in degrees) I15 The change in longitude in this question = 35' W + 40' E = 75' W Inserting this into the above equation gives: Time difference = 75 I 15 = 5 hours. Adding this to the sunrise time at 4 0 ' ~gives: Sunrise time at 35' W 0243 UTC + 5 h = 0743 UTC (option c).\n\n[Keith Williams · SOLAR SYSTEM & TIME 7]"}, {"type": "mcq", "t": "On the 27th of February, a t 55's and 020°W. The sunrise is a t 0250 UTC. On the same day, a t 55's and 075'W, the sunrise is at?", "o": ["0630 UTC", "0243 UTC", "0743 UTC", "0523 UTC"], "a": 0, "x": "This type of problem can be solved using the standard equation: Time difference (in hours) UTC = Change in longitude West (in degrees) 115 The change in longitude ih this question = 75' W 20' W = 55' W Inserting this into the above equation gives: Time difference = 55 I 15 = 3.667 hours which is 3 hours 40 mins. Adding this to the sunrise time at 2 0 ' ~gives: Sunrise time at 75' W 0250 UTC + 3 h 40 min = 0630 UTC (option a).\n\n[Keith Williams · SOLAR SYSTEM & TIME 8]"}, {"type": "mcq", "t": "At what times of the year does the length of the hours of daylight change most rapidly?", "o": ["Autumn Equinox and Winter Solstice", "Spring (Vernal) Equinox and Autumn Equinox", "Summer Solstice and Winter Solstice", "Spring (Vernal) Equinox and Summer Solstice"], "a": 1, "x": "The Earth spins about its own axis whilst orbiting the Sun in an elliptical orbit. The plane of this orbit is called the Ecliptic. Because the spin axis of the Earth is not at right angles to the Ecliptic, the length of day and night vary as the position of the earth changes throughout the year. The rate of change of the lengths of day and night is greatest at the points in the year when day and night are of equal length. These times are the Spring (or Vernal) Equinox and the Autumn Equinox (option b). The points in the year when the difference between day and night is greatest are called the summer and winter Solstices.\n\n[Keith Williams · SOLAR SYSTEM & TIME 11]"}, {"type": "mcq", "t": "Civil Twilight occurs between?", "o": ["Sunrise and sunset", "Sunset and when the sun is 6O below the horizon", "The times when the sun is between 6O and 12' below the horizon", "The times when the sun is between 12O and 18O below the horizon"], "a": 1, "x": "The term sensible horizon refers to the points at which the sun would become visible when rising, and cease to be visible when setting, if its light traveled in straight lines. Although light in a vacuum travels in straight lines, sunlight passing through the atmosphere is refracted downwards by the atmosphere. This means that the Sun will become visible shortly before it rises above and remain visible shortly after it sets below the sensible horizon. The term Twilight refers to these periods before sunrise and after sunset, during which the Sun is visible. The term Civil Twilight refers between sunset and when the centre of the Sun is 6'or less below the sensible horizon ( option b).\n\n[Keith Williams · SOLAR SYSTEM & TIME 12]"}, {"type": "mcq", "t": "What is the Standard Time in Hawaii when it is 0600 ST on the 16 July in Queensland, Australia?", "o": ["1000 on the 15 th", "2000 on the 15 th", "1000 on the 16 th", "1000 on the 17 th"], "a": 0, "x": "For this type of questionlit is necessary to refer to an extract from the Air Almanac, an example of ;whichis in the Key Facts section of this book. A suitable extract be provided as an Annex to the examination paper. Solving this type of problem involves finding the time difference between UTC and Standard Time at the two location$ and using these differences to convert the time at one location into the time at the second. The extract from the Almanac includes tables of the differences between UTC and the Standard Times at various locations. The extract on page 25 of this book shows that the standard time in Hawaii is 10 hour earlier than UTC. Page 24 of the extract also shows that standard time in Queensland Australia is 110 hours later than UTC. This means that the time difference between Hawaii and Queensland is either 20 hours or 4 hours. But the International Datelide runs between the two, to the East of Australia and to the West of Hawaii. The sun moves from East to West so the timeldate in Hawaii is ahead of that in Australia. So when it is 0600 ST on the 1 6 ' ~in Hawaii it is 20 hours earlier, which is 1d00 St on the isth in Queensland Australia (option a). This situation is illustrated below. Queensland July Dateline I Motion of the Sun 20 hours difference Hawaii For this type of question kt is necessary to refer to an extract from the Air Almanac, an example of ...\n\n[Keith Williams · SOLAR SYSTEM & TIME 15]"}, {"type": "mcq", "t": "At 1200 Standard Time on the 10th July in Queensland, Australia, what is the Standard Time in Hawaii, USA?", "o": ["1600 09 th July", "0200 10 th July", "1200 10 th July", "1000 10 th July"], "a": 0, "x": "For this type 7 - of question it is necessary to refer to an extract from the Air Almanac, an example of which is in the Key Facts section of this book. A suitable extract be provided as an Annex to the examination paper. Solving this type of problem involves finding the time difference between UTC and Standard Time'at the two locations and using these differences to convert the time a t one location into the time a t the second. The extract from the Almanac includes tables of the differences between UTC and the Standard Times a t various locations. The extract on page 24 of this book shows that standard time in Queensland Australia is 10 hours later than UTC. The extract on page 24 also shows that the standard time in Hawaii is 10 hour earlier than UTC. This means that the time difference between Hawaii and Queensland is 20 hours. This could mean that the time in Hawaii is 20 hours earlier but on the same day ad Queensland, or the Queensland is 20 hours earlier but on an earlier day. The International Dateline runs between the two, to the East of Australia and to the West of Hawaii. The sun moves from East to West, and Queensland is West of Hawaii, so if there is a date difference between the two, Hawaii will be 1 day ahead of Queensland. So when it is 1200 ST on the lothJuly in Queensland it is 20 hours earlier, or 1600 S T on the 9thJuly in Hawaii (option a).\n\n[Keith Williams · SOLAR SYSTEM & TIME 17]"}, {"type": "mcq", "t": "What is the time of sunrise in Vancouver, British Columbia, Canada (49N 123' 30'W) on the 6th January expressed in UTC?", "o": ["0754 UTC", "0717 UTC", "1608 UTC", "2340 UTC"], "a": 2, "x": "For this type of question it is necessary to refer to an extract from the Air Almanac, an example of which is in the Key Facts section of this book. A suitable extract be provided as an Annex to the examination paper. Solving this type of problem involves finding the LMT time of the event a t the stated latitude, then adjusting this to UTC by taking account of the longitude quoted in the question. The extract from the Almanac includes tables showing the times of events a t various latitudes, and figures for the Arc of Time between the Prime meridian and various other longitudes. The extract provided on page 26 of this book shows that a t 49N on the 6thof January the sunrises is a t 0754 LMT. Vancouver is a t longitude 123' 30'W so UTC a t sunrise a t Vancouver can be calculated using the arc of time as follows: Arc of time in hours = Change of longitude in degrees1 15 123' 30' is equal to 123.50 so inserting this into the above equation gives: Arc of time = 123.5 / 15 = 8.23 hours which is 8 hours and 14 mins. Sunrise at Vancouver is 0754 + 8 hours and 14 mins = 1608 LMT (option c).\n\n[Keith Williams · SOLAR SYSTEM & TIME 18]"}, {"type": "mcq", "t": "The duration of civil twilight is the.time?", "o": ["Between Sunset and when the centre of the sun is 6' below the true horizon", "Between Sunset and when the top of the Sun is 6' below the visual horizon", "Between sunset and when the centre of the Sun is 6' below the visual horizon", "When the Sunset and Sunrise"], "a": 0, "x": "The term sensible horizon refers to the points at which the sun would become visible when rising, and cease to be visible when setting, if its light traveled in straight lines. Although light in a vacuum travels in straight lines, sunlight passing through the atmosphere is refracted downwards by the atmosphere. This means that the Sun will become visible shortly before it rises above and remain visible shortly after it sets below the sensible horizon. The term Twilight refers to these periods before sunrise and after sunset, during which the Sun is visible. The term Civil Twilight refers between sunset and when the centre of the Sun is 6Oor less below the sensible horizon (option a).\n\n[Keith Williams · SOLAR SYSTEM & TIME 20]"}, {"type": "mcq", "t": "An aircraft takes off from Guam at 2300 Standard Time on 30 April local date. After a flight of 11 HR 15 MIN it lands at Los Angeles (California). What is the Standard Time and local date of arrival (assume summer time rules apply)?", "o": ["1715 on 30 April", "1715 on 01 May", "1715 on 29 April", "2415 on 30 April"], "a": 0, "x": "For this type of question it is necessary to refer to an extract from the Air Almanac, an example of which is in the Key Facts section of this book. A suitable extract be provided as an Annex to the examination paper. Solving this type of problem involves finding the Arc of Time between the two locations. The extract from the Almanac includes tables showing the difference between UTC a ~ i dthe Standard Time a t various locations. By comparing figures for two locations it is possible to calculate the difference between the two. The extract on page 24 of this book shows that standard time in Guam is 10 hours ahead of UTC, so a t 2300 standard time in Guam it is 1300 UTC. After an 11 hour 15 min flight the time of landing in Los Angeles will be 1300 + 11 hour I5 min = 2415 UTC. But page 25 shows that standard time in Los Angeles (in California) is 8 hours behind UTC. So the landing will occur a t 2415 - 8 = 1615. But the question states that summer time rules apply, and the notes a t the base of the Almanac extract indicate that this means that Los Angeles time is a further 1 hour behind UTC. So the landing will occur at 1715 Lss Angeles standard time on the 30th (option a).\n\n[Keith Williams · SOLAR SYSTEM & TIME 25]"}, {"type": "mcq", "t": "Assuming mid-latitudes (40° to 50°NIS). At which time of year is the relationship between the length of day and night, as well as the rate of change of declination of the sun, changing a t the greatest rate?", "o": ["Winter Solstice", "Spring equinox and autumn equinox", "Summer solstice", "Mid July"], "a": 1, "x": "The spin axis of the Earth is tilted at an angle of 66.5' to the Ecliptic plane in which it orbits the Sun. Because of this tilt, the North Pole is tilted towards the Sun at one point in the year, then gradually becomes tilted away from it during the subsequent 6 mobths. Having reached its maximum tilt away, the pole then gradually returns to plting towards the Sun over the following 6 months. This cyclic variation causes the Sun to move first in a northerly direction then in a southerly direction relative to the Equator as the year progresses. The apparent angle of the Sun nordh or south of the Equator is termed its declination. The path of the Sun takes the form of a cosine wave as illustrated below. The maximum northerly bosition occurs on 21 June and the maximum southerly position on 21 December each year. On 21 March and 21 September the Sun is directly above the equator and the lengths of day and night are equal. These dates are termed thelspring Equinox and the Autumn Equinox respectively. The illustration also shows that the rate of change of the lengths of day and night and the rate of change of declination are greatest on the Spring and Autumn Equinox (option b). Rate of change of declination is smallest at top and bottom of curve on 21 December and 21 June Autumn Equinox then UTC is best\" this correction is added to the LMT to give UTC = 1959 + 0032 = 2031, or ...\n\n[Keith Williams · SOLAR SYSTEM & TIME 32]"}, {"type": "mcq", "t": "The sun rises at 55 \" N and 050°E on the 25th January at 0254 UTC. On the same day what time does it rise at 55 \" N and 040°W?", "o": ["0854 UTC", "2154 UTC", "0714 UTC", "0514 UTC"], "a": 0, "x": "This type of problem can be solved using the standard equation: Time difference (in hours) UTC = Change in longitude West (in degrees) /15 The change in longitude in this question = 40' W + 50' E = 90' W Inserting this into the above equation gives: Time difference = 90 I 15 = 6hours. Adding this to the sunrise time a t 5 0 ' ~gives: Sunrise time a t 40' W 0254 UTC + 6hours = 0854 (option a).\n\n[Keith Williams · SOLAR SYSTEM & TIME 43]"}, {"type": "mcq", "t": "The sun sets at 45 \" N and 02S0E on the 21st March a t 1633 UTC. On the same day what time does it rise at 45 \" N and 060°W?", "o": ["2254 UTC", "2154 UTC", "1714 UTC", "2213 UTC"], "a": 3, "x": "This type of problem can be solved using the standard equation: Time difference (in hours) UTC = Change in longitude West (in degrees) /15 The change in longitude in this question = 60' W + 25' E = 85' W Inserting this into the above equation gives: Time difference = 85 1 15 = 5.67 hours, which is 5 h 40 mins. Adding this to the sunrise time a t 2 5 ' ~gives:\n\n[Keith Williams · SOLAR SYSTEM & TIME 44]"}, {"type": "mcq", "t": "The sun rises at 50 \" N and 025\"W on the 25th January at 0654 UTC. On the same day what time does it rise a t 50 O N and 040°E?", "o": ["0254 UTC", "0154 UTC", "0234 UTC", "0514 UTC"], "a": 2, "x": "This type of problem can be solved using the standard equation: Time difference (in hours) UTC = Change in longitude West (in degrees) /15 The change in longitude in this question = 40' E from 25' W = 65' E Inserting this into the above equation gives: Time difference = 65 / 15 = 4.33 hours which is 4 h 20 mins. Subtracting this from the sunrise time at 25'W gives: Sunrise time at 40' E 0654 UTC - 4 h 20 min = 0234 UTC (option c).\n\n[Keith Williams · SOLAR SYSTEM & TIME 45]"}, {"type": "mcq", "t": "Without using the Air Almanac, convert 153°30’ of arc of longitude into time.", "o": ["10 hrs 24 min", "10 hrs 22 min", "10 hrs 14 min", "10 hrs 8 min"], "a": 2, "x": "[Oxford ATPL · Oxford Ch25 Q1]"}, {"type": "mcq", "t": "The definition of Local Mean Time (LMT) is:", "o": ["time based upon the average movement of the Earth around the Sun", "when the mean Sun is transiting (crossing) your meridian, it is 1200hrs LMT", "when the mean Sun is transiting (crossing) your anti-meridian, it is 0000hrs LMT (2400 hrs LMT, previous day)", "all of the above"], "a": 3, "x": "[Oxford ATPL · Oxford Ch25 Q2]"}, {"type": "mcq", "t": "Local Mean Time (LMT) always changes by a day when crossing:", "o": ["the Greenwich Meridian", "180°E/W", "the International Date Line", "the Equator"], "a": 1, "x": "[Oxford ATPL · Oxford Ch25 Q3]"}, {"type": "mcq", "t": "Zone Time (ZT) is used:", "o": ["by aircraft on trans-oceanic routes", "as legal time in all countries", "by ships at sea", "in polar regions"], "a": 2, "x": "[Oxford ATPL · Oxford Ch25 Q4]"}, {"type": "mcq", "t": "A ship at longitude 83E observes sunrise at a Zone Time of 0500 ZT on Zone Date 15th May. What is the UTC?", "o": ["2300 UTC 14th May", "1100 UTC 15th May", "2328 UTC 14th May", "1032 UTC 15th May"], "a": 0, "x": "[Oxford ATPL · Oxford Ch25 Q5]"}, {"type": "mcq", "t": "On Mid-summer Day in the Southern hemisphere, the Sun will be overhead:", "o": ["66½ S", "23½ N", "23½ S", "the Equator"], "a": 2, "x": "[Oxford ATPL · Oxford Ch25 Q6]"}, {"type": "mcq", "t": "On Mid-winter Day in the Northern hemisphere, the Sun will be overhead:", "o": ["66½ S", "23½ N", "23½ S", "the Equator"], "a": 2, "x": "[Oxford ATPL · Oxford Ch25 Q7]"}, {"type": "mcq", "t": "On June 21, what is the lowest northerly latitude (listed in the Air Almanac) at which the Sun will be above the horizon for 24 hrs (all day)?", "o": ["64N", "66N", "68N", "70N"], "a": 1, "x": "[Oxford ATPL · Oxford Ch26 Q1]"}, {"type": "mcq", "t": "On December 21, what is the lo  the same time. So the distances in each side of the above equation by the groundspeeds to give: s = Groundspeed at Equator 1Cos 00' Groundspeed at 6 0 ' ~I ~ b 60' This can be rearranged t6 give: (Groundspeed at 6 0 ' ~140s 60') x Cos 00' = Groundspeed at the Equator Inserting the data provided in the question gives: (240 Kts I 0.5) x 1 = Groundspeed at Equator = 480 Kts (option c).\n\n[Keith Williams · SOLAR SYSTEM & TIME 41]"}, {"type": "mcq", "t": "The circumference of the Earth is approximately?", "o": ["5,600 km", "13,200 km", "16,400 km", "40,000 km"], "a": 3, "x": "The Earth is not a perfect sphere but is an oblate spheroid. This means that its diameter parallel to the equator is slightly greater than its diameter in a North- South direction. But the average diameter of the Earth is taken to be 12732.4 km. Multiplying this by IC gives a circumference of 40000 km (option d).\n\n[Keith Williams · SOLAR SYSTEM & TIME 42]"}, {"type": "mcq", "t": "Two aircraft are flying eastwards around the earth. Aircraft A is flying along the 50N parallel of latitude and aircraft B is flying along the equator. If aircraft A is flying at a groundspeed of 340 knots, what would be the groundspeed of aircraft B both aircraft fly once round the Earth in the same journey time?", "o": ["529 knots", "540 knots", "480 knots", "600 knots"], "a": 0, "x": "This type of problem can be solved by using the departure equation: Distance between two meridians = change in longitude (in min) x cos latitude This can be rearranged to give: Change in longitude = Distance between meridians / Cos latitude For a complete circumnavigation of the earth a t any latitude the change of longitude is 360'. So the change in longitude at the equator will be the same as that at 50N. This means that: Distance at 5 0 ' ~/ Cos 50' = Distance at equator / Cos 00' But the groundspeed is equal to the distance divided by the time and both aircraft complete their journeys in the same time. So the distances in each side ns that: Distance at 7 5 ' ~/ Cos 75' = Distance at 45's / Cos 45' But the groundspeed is equal to the distance divided by the time and both aircraft complete their journeys in the same time. So the distances in each side of the above equation can be replaced by the groundspeeds to give: Groundspeed at 7 5 ' ~1 Cos 75' = Groundspeed at 45's 1 Cos 45' This can be rearranged to give: (Groundspeed at 7 5 ' ~/ Cos 75') x Cos 45' = Groundspeed at 45's Inserting the data provided in the question gives:\n\n[Keith Williams · SOLAR SYSTEM & TIME 49]"}, {"type": "mcq", "t": "Two aircraft are flying eastwards around the earth. Aircraft A is flying along the 30N parallel of latitude and aircraft B is flying along the equator. If aircraft A is flying a t a groundspeed of 400 knots, what would be the groundspeed of aircraft B both aircraft fly once ronnd the Earth in the same journey time?", "o": ["320 knots", "462 knots", "480 knots", "560 knots"], "a": 1, "x": "This type of problem can be solved by using the departure equation: Distance between two meridians = change in longitude (in min) x cos latitude This can be rearranged to give: Change in longitude = Distance between meridians / Cos latitude For a complete circumnavigation of the earth at any latitude the change of longitude is 360'. So the change in longitude at the equator will be the same as that at 30N. This means that: Distance a t 3 0 ' ~1 Cos 30' = Distance at equator I Cos 00\" But the groundspeed is equal to the distance divided by the time and both aircraft complete their journeys in the same time. So the distances in each side of the above equation can be replaced by the groundspeeds to give: Groundspeed a t 3 0 ' ~1 Cos 30' = Groundspeed at Equator I Cos 00' This can be rearranged to give: (Groundspeed a t 3 0 ' ~/ Cos 30') x Cos 00' = Groundspeed a t the Equator Inserting the data provided in the question gives: (400 Kts / 0.866) x 1 = Groundspeed at Equator = 462 Kts (option b).\n\n[Keith Williams · SOLAR SYSTEM & TIME 50]"}, {"type": "mcq", "t": "What is the approximate compression of the Earth?", "o": ["3%", "0.03%", "0.3%", "1/3000"], "a": 2, "x": "[Oxford ATPL · Oxford Ch1 Q1]"}, {"type": "mcq", "t": "A Graticule is the name given to:", "o": ["a series of lines drawn on a chart", "a series of Latitude and Longitude lines drawn on a chart or map", "a selection of small circles as you get nearer to either pole"], "a": 1, "x": "[Oxford ATPL · Oxford Ch1 Q2]"}, {"type": "mcq", "t": "Given that the compression value of the Earth is 1/297 and that the semi-major axis of the Earth, measured at the axis of the Equator, is 6378.4 km, what is the semi-minor (i.e. radius) axis of the Earth measured at the axis of the Poles?", "o": ["6399.9 km", "6356.9 km", "6378.4 km", "6367.0 km"], "a": 1, "x": "[Oxford ATPL · Oxford Ch1 Q5]"}, {"type": "mcq", "t": "An aircraft is to fly from position 72°00’N 002°30’E to position 72°00’N 177°30’W on the shortest possible route.", "o": ["Give the initial (True) track direction", "Will the track direction remain the same for the whole flight?", "Give a reason for the answer given in b above"], "a": 0, "x": "[Oxford ATPL · Oxford Ch2 Q6]"}, {"type": "mcq", "t": "Any Meridian Line is a:", "o": ["Rhumb Line", "Semi Great Circle", "Rhumb Line and a semi Great Circle"], "a": 2, "x": "[Oxford ATPL · Oxford Ch2 Q10]"}, {"type": "mcq", "t": "A Rhumb Line cuts all meridians at the same angle. This gives:", "o": ["The shortest distance between two points", "A line which could never be a Great Circle track", "A line of constant direction"], "a": 2, "x": "[Oxford ATPL · Oxford Ch2 Q11]"}]}, {"id": "ch4", "icon": "🧭", "color": "#1a3a6b", "sub": "Convergency · CA · GC vs RL", "title": "Great Circles & Convergency", "questions": [{"type": "mcq", "t": "A great circle track joins position A (59O S 141°W) and B (61' S 148OW). What is the difference between the great circle track at A and B?", "o": ["I t increases by 6'", "It decreases by 6'", "It increases by  "mcq", "t": "In order to fly from position A (10\" OO'N, 030\" OO'W) to position B (30\" OO'N, 050\" OO'W), maintaining a constant true course, it is necessary to fly?", "o": ["The great-circle route", "A straight line plotted on a Lambert chart", "A rhumb line track", "The constant average drift route"], "a": 2, "x": "A rhumb line is one that cuts all meridians along its path at the same angle. In the case of meridians this angle is zero. Although a rhumb line will not give the shortest distance between two points, it has the advantage that its direction does not change along its length. So two fly between any two points a t a constant true heading it is necessary to fly a rhumb line track (option c).\n\n[Keith Williams · CIRCLES 30]"}, {"type": "mcq", "t": "Which of the following is true of all parallels of latitude?", "o": ["They are neither rhumb lines nor great circles", "They are rhumb lines but not great circles", "They are both rhumb lines and great circles", "They are great circles but not rhumb lines"], "a": 1, "x": "A great circle is one for which the radius of the circle is the same as the radius of the earth. This means that the centre of any great circle must be the centre of the earth. Rhumb lines are circles or arcs of circles which intersect all of the meridians that they cross a t the same angle. Parallels of latitude are rhumb lines because they cross all meridians at the same angle. But the centre of a parallel of latitude will be the centre of the earth only if the parallel is the equator. So parallels of latitude are rhumb lines but not great circles (option b).\n\n[Keith Williams · CIRCLES 32]"}, {"type": "mcq", "t": "An aircraft departs from position A (04\" 10' S 178\" 22'W) and flies northward following the meridian for 2950 NM. I t then flies westward along the parallel of latitude for 382 NM to position B. The coordinates of position B are?", "o": ["53\" 20'N 172\" 38'E", "45\" OO'N 172\" 38'E", "53\" 20'N 169\" 22W", "45\" OO'N 169\" 22W"], "a": 1, "x": "To solve this type of problem it is helpful to start with a simple sketch of the situation as illustrated below: Final latitude Equator Final meridian Initial meridian The distance flown in nm along any meridian is equal the change in latitude in minutes. So flying 2950 nm North causes a change of latitude of 2950' N or 49' 10' N making the final latitude equal to the initial latitude (04' 10' S) + 49' 10' N The change in longitude caused by flying 382 nm westward at the new latitude can be calculated using the equation: Departure = Change in longitude x Cos latitude, Where the departure is equal to the distance flown along the parallel of latitude. This equation can be rearranged to give: Change in longitude = Departure I Cos latitude Inserting the above figures gives: Change in longitude = 382 nm I Cos 45' which = 540.2' o r approximately 9' Adding this to the initial longitude gives (178O 22'W) + 9' W = 187' 22' W. But maximum possible longitudes are 180' W and 180' E, so 187' 22' W is more properly expressed as 172' 28' E (option b).\n\n[Keith Williams · CIRCLES 33]"}, {"type": "mcq", "t": "A Rhumb line is?", "o": ["A line convex to the nearest pole on a Mercator projection", "A line on the surface of the earth cutting all meridians a t the same angle", "The shortest distance between two points on a Polyconic projection", "Any straight line on a Lambert projection"], "a": 1, "x": "A rhumb line is a line on the surface of the earth cutting all meridians within its length at the same angle (option b). Rhumb lines include all parallels of latitude and all meridians.\n\n[Keith Williams · CIRCLES 34]"}, {"type": "mcq", "t": "Parallels of latitude, except the equator, are?", "o": ["Rhumb lines", "Great circles", "Both Rhumb lines and Great circles", "Neither Rhumb lines nor Great circles"], "a": 0, "x": "A rhumb line is a line on the surface of the earth cutting all meridians within its length a t the same angle (option b). Rhumb lines are all parallels of latitude and all meridians (option a). I t should be noted that the equator is also a Rhumb Line.\n\n[Keith Williams · CIRCLES 37]"}, {"type": "mcq", "t": "On a Lambert Conformal Conic chart great circles that are not meridians are?", "o": ["Curves concave to the pole of projection", "Straight lines within the standard parallels", "Curves concave to the parallel of origin", "Straight lines regardless of distance"], "a": 2, "x": "A Lamberts chart is produced by projecting the graticule of the Earth onto a cone of paper the inside surface of which touches the surface of the reduced Earth along two parallels of latitude. This causes the parallels of latitude to be represented by curves concave to the nearest pole, and the meridians to be represented by straight lines radiating outwards from the nearest pole. Great circles are circles, the centre of which is that of the earth. So any Great Circle that is not a meridian will appear as a curve concave to the parallel of origin on a Lamberts Conformal conic chart (option c). The closer a Great Circle is to being a meridian the closer it will come to being a straight line on a Lamberts Conformal Conic chart.\n\n[Keith Williams · CIRCLES 39]"}, {"type": "mcq", "t": "On a Direct Mercator chart, a rhumb line appears as a?", "o": ["Curves convex to the Equator", "Curves concave to the nearest pole", "Straight line", "Complex curves cancave to the Equator"], "a": 2, "x": "A Rhumb Line is one that crosses all meridians in its path a t the same angle. On a Direct Mercator chart, the meridians are represented by straight parallel lines. This means that Rhumb Lines on such charts are also represented by straight lines (option c).\n\n[Keith Williams · CIRCLES 40]"}, {"type": "mcq", "t": "On a Direct Mercator chart a great circle will be represented by a?", "o": ["Straight lines", "Complex curves convex to the Equator", "Curve concave to the equator", "Complex curves concave to the Poles"], "a": 2, "x": "On a.Direct Mercator c  59]"}, {"type": "mcq", "t": "A great circle track joins position A (57' S 140°W) and B (63' S 150°W). What is the difference between the great circle track at A and B?", "o": ["I t increases by 9'", "I t decreases by 9'", "I t increases by 6'", "It decreases by 6\""], "a": 0, "x": "The track at any point on a great Change in track due to circle is the angle between the meridian convergence great circle direction and the meridian a t that point. All meridians are parallel a t the equator, but gradually converge as latitude increases towards either of the two poles. This causes the track of great circles other than the meridians and the equator, to change as latitude changes. This effect is illustrated a t the right. This change of track between any two points on a great circle is equal to the convergency of the meridians between these two points. The change in great circle track between two points can be calculated using the convergency equation below: Convergency = change in longitude x Sin of mean latitude. The change in longitude = initial longitude - final longitude Which in this question = 150' W - 140' W = 10' The mean latitude = (initial latitude + final latitude) / 2 Inserting these figures into the standard equation gives: So between points A and B, the great circle track increases by approximately 9' (option a).\n\n[Keith Williams · CIRCLES 61]"}, {"type": "mcq", "t": "An aircraft flies the following rhumb line tracks and distances from position 04' OO'N 030' OO'W: 700 NM South, then 700 NM East, then 700 NM North, then 700 NM West. The final position of the aircraft is?", "o": ["04' OO'N 030' 30'W", "03' 58'N 030' 02'W", "04' OO'N 029' 55'W", "04' OO'N 029' 55'E"], "a": 2, "x": "When solving this type of question it is helpful to start with a sketch of the situation as illustrated below. Initial position A 04' 00' N 30' OO'W Initial lati ~ Equator Most southerly latitude reached Meridian converge to the North and South of the equator To calculate the change in latitude during the first leg (Northerly) and third leg (Southerly) use the fact that each nm along any meridian is equal to 1' latitude. So 700 nm = 700' which is 11' 409 change of latitude. So the most Southerly latitude reached is 11' 40:South of the initial latitude of (04' 00' N). The most Southerly latitude is therefore 07' 40' S. During the second leg the aircraft flies 700 nm to the East a t latitude 07' 40' S. Using the departure equation to calculate the change in longitude gives: Departure = Change in longitude x Cos latitude Which can be rearranged to give: Change in longitude = DepartureICos latitude Inserting the data above gives: Change in longitude = 700 nm / Cos 07' 40' which = 706.3' E. Dividing this by 60 gives change in longitude = 11' 46.3' E so the longitude a t the end of the second leg: During the fourth leg a t latitude 04' 00' N the aircraft flies 700 nm west. The final change in longitude can be calculated using the same departure equation: Change in longitude = 700 nm / Cos 04' 00' which = 701.71' W. Dividing this by 60 gives change in longitude = 11' 41.719W, so the ...\n\n[Keith Williams · CIRCLES 67]"}, {"type": "mcq", "t": "The Great Circle bearing of 'B' (70' S 050' E), from 'A' (70' S 030' W), is approximately?", "o": ["150°(T)", "090°(T)", "115' (T)", "12g0(T)"], "a": 3, "x": "The great circle bearing from any point to any other point is equal to the Rhumb line bearing plus the conversion angle. This can be calculated using the equation: Conversion angle = ?hChange in longitude x Sin of the mean latitude The change in longitude in this question is from 050' E to 030' W, which is a change of 80° Both points are at 70' S, so the change in latitude is nil, so the mean latitude is Inserting these figures into the conversion angle equation gives: Conversion angle = ?h x 80' x Sin 70' which = 37.59' The rhumb line bearing from point A to point B is 090°, so the great circle bearing is 090°+ 37.59' = 127.59' or approximately 128' (option d).\n\n[Keith Williams · CIRCLES 70]"}, {"type": "mcq", "t": "Given: The autopilot is coupled to the Inertial Navigation System steering from Waypoint 1 at 60°N 040°W, to Waypoint 2 at 60°N 030°W, to Waypoint 3 a t 60°N ' 020°W. What is the approximate track change on passing WPT 2?", "o": ["Zero", "49 decrease", "9O decrease", "9O increase"], "a": 2, "x": "The track change a t any point on a great circle is equal to the convergence of the meridian between the initial point and the point being considered. This can be calculated using the standard equation: Convergence = Change in longitude x sin of the mean latitude Change in longitude = final longitude - initial longitude which in this question is Change in longitude between waypoints 1 and 2 = 030' W - 040' W = -10' The mean latitude = (initial latitude + final latitude) 1 2 which in this question is Inserting the above data into the convergence equation above gives: Convergence = -10' x Sin 60' = -8.66' or approximately -9' So the great circle track must be decreased by 9' (option c).\n\n[Keith Williams · CIRCLES 76]"}, {"type": "mcq", "t": "An aeroplane flies from A (59O S 140' W) to B (61' S 149' W) with a TAS of 480 kt. The autopilot is engaged and coupled with an Inertial Navigation System in which AB track is active. On route AB, the true track?", "o": ["Varies by 10\"", "Decreases by 6'", "Varies by 4O", "Increases by So"], "a": 3, "x": "The difference in great circle track between any two points is equal to the convergence of the meridians between these points. This can be calculated using the equation: Convergence = Change in longitude x Sin of the mean latitude The change in longitude in this question is from 140' W to 149' W, which is a change of 9'. The mean latitude is equal to (Initial latitude + final latitude)/2 which in this Inserting these figures into the conversion angle equation gives: So the great circle track from a to B increases by 7.79' or approximately 8' at point B (option d).\n\n[Keith Williams · CIRCLES 82]"}, {"type": "mcq", "t": "The following points are entered into an inertial navigation system (INS). WPT 1: 70' N 50°W, WPT 2: 70° N 40°W, WPT 3: 70\" N 30°W. The inertial navigation system is connected to the automatic pilot on route (1-2-3). The track change when passing WPT 2 will be approximately?", "o": ["Zero", "A 9O increase", "A 6' decrease", "A 9' decrease"], "a": 3, "x": "The direction of a great circle track varies along its path in direct proportion to the convergence of the meridians crossed. This convergence can be calculated using the equation: Convergence = Change in longitude x Sin of the mean latitude The change in longitude in this question is from 50° W at waypoint 1to 30' W a t waypoint 2, which is a change of -10'. The latitude is constant a t 70° S. Inserting these figures into the convergence equation gives: So the track decreases by 9.4', o r approximately 9' when passing waypoint 2 (option d).\n\n[Keith Williams · CIRCLES 87]"}, {"type": "mcq", "t": "An aircraft departs from position A (09\" 10' S 178\" 22'W) and flies northward following the meridian for 2750 NM. It then flies westward along the parallel of latitude for 400 NM to position B. The coordinates of position B are?", "o": ["53\" 20'N 172\" 38'E", "36\" 40'N 173\" 19'E", "36\" 20'N 169\" 22W", "40\" OO'N 169\" 22W"], "a": 1, "x": "To solve this type of problem it is helpful to start with a simple sketch of the situation as illustrated below: Final latitude Equator $itial position A Final meridian Initial meridian The distance flown in nm along any meridian is equal the change in latitude in minutes. So flying 2750 nm North causes a change of latitude of 2750' N or 45' 50' N making the final latitude equal to the initial latitude (09' 10' S) + 45' 50' N The change in longitude caused by flying 400 nm westward at the new latitude can be calculated using the equation: Departure = Change in longitude x Cos latitude, Where the departure is equal to the distance flown along the parallel of latitude. This equation can be rearranged to give: Change in longitude = Departure I Cos latitude Inserting the above figures gives: approximately 8' 19' Adding this to the initial longitude gives (178' 22'W) + 8' 19 W = 186' 41' W. But maximum possible longitudes are 180' W and 180' E, so 186' 41' W is more properly expressed as 173' 19' E. So taking into account both the change in latitude and the change in longitude, the new position is 36' 40' N 173' 19' W (option b).\n\n[Keith Williams · CIRCLES 93]"}, {"type": "mcq", "t": "How do rhumb lines, other than meridians appear on Polar Stereo charts?", "o": ["As lines convex to the nearer pole", "As straight lines", "As lines concave to the nearer pole", "As ellipses around the pole"], "a": 2, "x": "A polar Stereographic chart is one that is projected onto a flat sheet of paper that is in contact with the nearest pole. This means that only the nearest hemisphere is visible. The parallels of latitude are represented by concentric circles centred on the pole. The meridians are represented by straight lines passing through the nearest Pole. A Rhumb Line is one that crosses all meridians in its path a t the same angle. Because the meridians on a Polar Stereographic chart radiate outwards from the nearest pole, Rhumb Lines (other than meridians) on such charts are represented by curves concave to the nearest pole (option d).\n\n[Keith Williams · CIRCLES 109]"}, {"type": "mcq", "t": "On a Polar Stereographic chart, the initial great circle course from A 75\" N 060° W to B 75O N 060° E is approximately?", "o": ["032O (T)", "330°(T)", "150' (T)", "210° (T)"], "a": 0, "x": "On a Polar stereographic chart Great Circles at latitudes of 70\"r more can be considered to be straight lines. This question can therefore be solved by calculating the conversion angle using the equation below, then applying this to the Rhumb Line track. Conversion angle = % Change in longitude x Sin of mean latitude. In this question the change in longitude is from 60'W to 60' E which = 120' W The latitude of both positions of 75' S so the mean latitude is 75' S. Putting these figures into the above equation gives: Both positions are on the same parallel of latitude and position B is West of position A, so the Rhumb Line track is 090'. Applying the conversion angle gives an initial true Great Circle track of 090' - 57.96' = 32.044'. The option closest to this answer is option a, 032'.\n\n[Keith Williams · CIRCLES 111]"}, {"type": "mcq", "t": "On a Lambert chart (standard parallels 37' N and 65' N), with respect to the straight line drawn on the map between A ( N49' W030° ) and B (N48' W040° ), the?", "o": ["Great circle and rhumb line are to the north", "Great circle is to the north, the rhumb line is to the south", "Rhumb line is to the north, the great circle is to the south", "Great circle and rhumb line are to the south"], "a": 3, "x": "The Parallel of Origin of a Lamberts Chart is midway between the standard parallels. The standard parallels in this chart are at 37' N and 6 5 ' ~so the Great Circles on Lamberts Charts are represented by straight lines between any two points on the Parallel of Origin. At all other points on the chart, Great Circles are represented by curves concave to the Parallel of origin. The two points in this question are south of the Parallel of Origin, so the Great Circle between them will also be to the South of a straight line between them. Rhumb lines of Lamberts Charts are curves concave to the pole of origin ,which in this case is the North Pole. So the Rhumb Line between points a and B will also be to the South. So both the Great Circle and the Rhumb Line between points A and B will be to the South (option d)\n\n[Keith Williams · CIRCLES 115]"}, {"type": "mcq", "t": "Given: Position A 45O N, ?O E, Position B 45' N, 45' 15'E Distance A-B = 350 NM, B is to the East of A, What is the longitude of position A?", "o": ["37O OO'E", "48O OO'E", "51° 15'E", "8' 15'E"], "a": 0, "x": "The distance in nm between any two meridians along a specified parallel of latitude is called the departure. This can calculated using the departure equation: Departure (in nm) = Change in longitude x Cos latitude This can be rearranged to give: Change in longitude = Departure (in nm) / Cos latitude. In this question the latitude is constant at 45' N, and the departure is 350 nm. Inserting these figures into the above equation gives: The question states that point B is to the east of point A so subtracting the above figure from the longitude of b gives: B (4S0 15'E ) - (8' 15') = 37' (option a).\n\n[Keith Williams · CIRCLES 119]"}, {"type": "mcq", "t": "Position X 64°00’S 11°50’W. Position Y 64°00’S 05°10’W. Give:", "o": ["The convergency between the meridians of X and Y", "The approximate initial great circle track from Y to X", "The rhumb line track from X to Y"], "a": 0, "x": "[Oxford ATPL · Oxford Ch14 Q7]"}, {"type": "mcq", "t": "An aircraft starts at position 0410S 17822W and heads true north for 2950 NM, then turns 90 degrees left, and maintains a rhumb line track for 314 kilometres. What is its final position?", "o": ["5500N 17422W", "4500N 17422W", "5500N 17738E", "4500N 17738E"], "a": 3, "x": "[Oxford ATPL · Oxford Ch15 Q11]"}, {"type": "mcq", "t": "An aircraft at position 50N 006E travels 300 NM due South, then travels 300 NM due East, then 300 NM due North and then 300 NM due West. What is the aircraft’s final position relative to its start point?", "o": ["North", "East", "West", "South"], "a": 2, "x": "[Oxford ATPL · Oxford Ch15 Q12]"}, {"type": "mcq", "t": "An aircraft departs a point 0400N 17000W and flies 600 NM South, followed by 600 NM East, then 600 NM North, then 600 NM West. What is its final position?", "o": ["0400N 17000W", "0600S 17000W", "0400N 169°58.1’W", "0400N 170°01.8’W"], "a": 2, "x": "[Oxford ATPL · Oxford Ch15 Q13]"}, {"type": "mcq", "t": "An aircraft is flying around the Earth eastwards along the 60N paral
