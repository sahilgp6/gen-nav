adwind component:", "o": ["increases the angle of flight path during climb", "increases the best rate of climb", "decreases the angle of climb", "increases the maximum endurance"], "a": 0, "x": "[Oxford ATPL Book 6 · p221 Q19]"}, {"type": "mcq", "t": "A higher gross mass at the same altitude will cause:", "o": ["VY and VX to decrease", "VX to increase and VY to decrease", "VY and VX to remain constant since they are not affected by a higher gross mass", "VY and VX to increase"], "a": 3, "x": "[Oxford ATPL Book 6 · p221 Q20]"}, {"type": "mcq", "t": "With an true airspeed of 194 kt and a vertical speed of 1,000 ft/min, the climb gradient is approximately:", "o": ["3°", "3%", "5°", "8%"], "a": 0, "x": "[Oxford ATPL Book 6 · p221 Q21]"}, {"type": "mcq", "t": "With take-off flaps set, Vx and Vy will be:", "o": ["lower than that for clean configuration", "higher than that for clean configuration", "same as that for clean configuration", "changed so that Vx increases and Vy decreases compared to clean configuration"], "a": 0, "x": "[Oxford ATPL Book 6 · p221 Q22]"}, {"type": "mcq", "t": "The maximum rate of climb that can be maintained at the absolute ceiling is:", "o": ["0 ft/min", "125 ft/min", "500 ft/min", "100 ft/min"], "a": 0, "x": "[Oxford ATPL Book 6 · p221 Q23]"}, {"type": "mcq", "t": "A head wind will:", "o": ["increase the rate of climb", "shorten the time of climb", "increase the climb flight path angle", "increase the angle of climb"], "a": 2, "x": "[Oxford ATPL Book 6 · p221 Q24]"}, {"type": "mcq", "t": "The best rate of climb at a constant gross mass:", "o": ["decreases with increasing altitude since the thrust available decreases due to the lower air density", "increases with increasing altitude since the drag decreases due to the lower air density", "increases with increasing altitude due to the higher true airspeed", "is independent of altitude"], "a": 0, "x": "[Oxford ATPL Book 6 · p222 Q26]"}, {"type": "mcq", "t": "With a jet aeroplane, the maximum climb angle can be flown at approximately:", "o": ["1.2 Vs", "1.1 Vs", "The highest L/C ratio", "The highest L/D² ratio"], "a": 2, "x": "[Oxford ATPL Book 6 · p222 Q27]"}, {"type": "mcq", "t": "During a climb with all engines operating, the altitude where the rate of climb reduces to 100 ft/min is called:", "o": ["Thrust ceiling", "Maximum transfer ceiling", "Service ceiling", "Absolute ceiling"], "a": 2, "x": "[Oxford ATPL Book 6 · p222 Q28]"}, {"type": "mcq", "t": "With all other factors remaining constant, how does increasing altitude affect Vx and Vy as a TAS:", "o": ["Vx will decrease and Vy will increase", "Both will increase", "Both will remain the same", "Both will decrease"], "a": 1, "x": "[Oxford ATPL Book 6 · p222 Q29]"}, {"type": "mcq", "t": "Any acceleration in climb, with a constant power setting:", "o": ["improves the climb gradient if the airspeed is below VX", "improves the rate of climb if the airspeed is below VY", "decreases rate of climb and increases angle of climb", "decreases the rate of climb and the angle of climb"], "a": 3, "x": "[Oxford ATPL Book 6 · p222 Q30]"}, {"type": "mcq", "t": "For an aircraft maintaining 100 kt true airspeed and a climb gradient of 3.3% with no wind, what would be the approximate rate of climb?", "o": ["3.30 m/s", "33.0 m/s", "330 ft/min", "3,300 ft/min"], "a": 2, "x": "[Oxford ATPL Book 6 · p222 Q31]"}, {"type": "mcq", "t": "During a climb to the cruising level, any headwind component:", "o": ["decreases the climb time", "decreases the ground distance flown during that climb", "increases the amount of fuel for the climb", "increases the climb time. General Principles Climb and Descent"], "a": 1, "x": "[Oxford ATPL Book 6 · p222 Q32]"}, {"type": "mcq", "t": "The pilot of a single engine aircraft has established the climb performance. The carriage of an additional passenger will cause the climb performance to be:", "o": ["Degraded", "Improved", "Unchanged", "Unchanged, if a short field take-off is adopted"], "a": 0, "x": "[Oxford ATPL Book 6 · p223 Q33]"}, {"type": "mcq", "t": "A headwind component increasing with altitude, as compared to zero wind condition: (assuming IAS is constant.", "o": ["improves angle and rate of climb", "decreases angle and rate of climb", "has no effect on rate of climb", "does not have any effect on the angle of flight path during climb"], "a": 2, "x": "[Oxford ATPL Book 6 · p223 Q34]"}, {"type": "mcq", "t": "Which of the following combinations adversely affects take-off and initial climb performance?", "o": ["High temperature and low relative humidity", "Low temperature and low relative humidity", "High temperature and high relative humidity", "Low temperature and high relative humidity"], "a": 2, "x": "[Oxford ATPL Book 6 · p223 Q35]"}, {"type": "mcq", "t": "A decrease in atmospheric pressure has, among other things, the following consequences on take-off performance:", "o": ["a reduced take-off distance and degraded initial climb performance", "an increased take-off distance and degraded initial climb performance", "a reduced take-off distance and improved initial climb performance", "an increased take-off distance and improved initial climb performance"], "a": 1, "x": "[Oxford ATPL Book 6 · p223 Q36]"}, {"type": "mcq", "t": "The angle of climb with flaps extended, compared to that with flaps retracted, will normally be:", "o": ["Increase at moderate flap setting, decrease at large flap setting", "Smaller", "Larger", "Not change"], "a": 1, "x": "[Oxford ATPL Book 6 · p223 Q37]"}, {"type": "mcq", "t": "What is the effect of tail wind on the time to climb to a given altitude?", "o": ["The time to climb increases", "The time to climb decreases", "The effect on time to climb will depend on the aeroplane type", "The time to climb does not change"], "a": 3, "x": "[Oxford ATPL Book 6 · p223 Q38]"}, {"type": "mcq", "t": "Changing the take-off flap setting from flap 15° to flap 5° will normally result in:", "o": ["a longer take-off distance and a better climb", "a shorter take-off distance and an equal climb", "a better climb and an equal take-off distance", "a shorter take-off distance and a better climb. General Principles Climb and Descent"], "a": 0, "x": "[Oxford ATPL Book 6 · p223 Q39]"}, {"type": "mcq", "t": "What is the influence of the mass on maximum rate of climb (ROC. speed if all other parameters remain constant?", "o": ["The ROC is affected by the mass, but not the ROC speed", "The ROC and the ROC speed are independent of the mass", "The ROC speed increases with increasing mass", "The ROC speed decreases with increasing mass"], "a": 2, "x": "[Oxford ATPL Book 6 · p224 Q40]"}, {"type": "mcq", "t": "Following a take-off to the 50 ft (15 m. screen height, a light twin climbs on a gradient of 5%. It will clear a 160 m obstacle situated at 5,000 m from the 50 ft point with an obstacle clearance margin of:", "o": ["it will not clear the obstacle", "105 m", "90 m", "75 m"], "a": 1, "x": "[Oxford ATPL Book 6 · p224 Q41]"}, {"type": "mcq", "t": "When flying an aircraft at: i Vx without flap ii Vx with flap iii Vy without flap iv Vy with flap the aircraft should be achieving:", "o": ["i The best rate of climb. ii The best rate of climb, but using- a slightly faster speed than in (i). iii The best angle of climb. iv The best angle of climb, but using a slightly faster speed than in (iii)", "i A good angle of climb. ii The best angle of climb. iii A good rate of climb. iv The best rate of climb", "i The best angle of climb. ii A slightly reduced angle of climb compared to (i) if using a slightly reduced speed than in (i). iii The best rate of climb. iv A slightly reduced rate of climb compared to (iii) if using a slightly reduced speed than in (iii)", "i A good rate of climb. ii The best rate of climb. iii A good angle of climb. iv The best angle of climb"], "a": 2, "x": "[Oxford ATPL Book 6 · p224 Q43]"}]}, {"id": "pfdesc", "icon": "📉", "color": "#a05828", "sub": "Chapter 3 descent set", "title": "Descent Questions", "questions": [{"type": "mcq", "t": "Two identical aeroplanes at different masses are descending at idle thrust. Which of the following statements correctly describes their descent characteristics?", "o": ["At a given angle of attack, both the vertical and the forward speed are greater for the heavier aeroplane", "There is no difference between the descent characteristics of the two aeroplanes", "At a given angle of attack the heavier aeroplane will always glide further than the lighter aeroplane", "At a given angle of attack the lighter aeroplane will always glide further than the heavier aeroplane"], "a": 0, "x": "[Oxford ATPL Book 6 · p225 Q1]"}, {"type": "mcq", "t": "In a steady descending flight equilibrium of forces acting on the aeroplane is given by: (T = Thrust, D = Drag, W = Weight, descent angle = GAMMA)", "o": ["T + D = - W sin GAMMA", "T + W sin GAMMA = D", "T - W sin GAMMA = D", "T - D = W sin GAMMA"], "a": 1, "x": "[Oxford ATPL Book 6 · p225 Q2]"}, {"type": "mcq", "t": "Which of the following combinations has an effect on the angle of descent in a glide? (Ignore compressibility effects.)", "o": ["Configuration and mass", "Configuration and angle of attack", "Mass and altitude", "Altitude and configuration"], "a": 1, "x": "[Oxford ATPL Book 6 · p225 Q3]"}, {"type": "mcq", "t": "Which statement is correct for a descent without engine thrust at maximum lift to drag ratio speed?", "o": ["The mass of an aeroplane does not have any effect on the speed for descent", "The higher the gross mass the greater is the speed for descent", "The higher the gross mass the lower is the speed for descent", "The higher the average temperature (OAT. the lower is the speed for descent"], "a": 1, "x": "[Oxford ATPL Book 6 · p225 Q4]"}, {"type": "mcq", "t": "An aeroplane is in a power off glide at best gliding speed. If the pilot increases pitch attitude the glide distance:", "o": ["increases", "remains the same", "may increase or decrease depending on the aeroplane", "decreases"], "a": 3, "x": "[Oxford ATPL Book 6 · p225 Q5]"}, {"type": "mcq", "t": "Is there any difference between the vertical speed versus forward speed curves for two identical aeroplanes having different masses? (assume zero thrust and wind)", "o": ["Yes, the difference is that the lighter aeroplane will always glide a greater distance", "Yes, the difference is that for a given angle of attack both the vertical and forward speeds of the heavier aeroplane will be larger", "No difference", "Yes, the difference is that the heavier aeroplane will always glide a greater distance. General Principles Climb and Descent"], "a": 1, "x": "[Oxford ATPL Book 6 · p225 Q6]"}, {"type": "mcq", "t": "An aeroplane executes a steady glide at the speed for minimum glide angle. If the forward speed is kept constant at V , what is the effect of a lower mass on the Rate of descent / Glide MD angle / CL/CD ratio?", "o": ["decreases / constant / decreases", "increases / increases / constant", "increases / constant / increases", "decreases / constant/ constant"], "a": 3, "x": "[Oxford ATPL Book 6 · p226 Q8]"}, {"type": "mcq", "t": "Which of the following factors leads to the maximum flight time of a glide?", "o": ["Low mass", "High mass", "Headwind", "Tailwind"], "a": 0, "x": "[Oxford ATPL Book 6 · p226 Q9]"}, {"type": "mcq", "t": "A constant headwind:", "o": ["increases the descent distance over ground", "increases the angle of the descent flight path", "increases the angle of descent", "increases the rate of descent"], "a": 1, "x": "[Oxford ATPL Book 6 · p226 Q10]"}, {"type": "mcq", "t": "An aeroplane carries out a descent maintaining at a constant Mach number in the first part of the descent and then at a constant indicated airspeed in the second part of the descent. How does the angle of descent change in the first and in the second part of the descent? Assume idle thrust and clean configuration and ignore compressibility effects.", "o": ["Increases in the first part; is constant in the second", "Increases in the first part; decreases in the second", "Is constant in the first part; decreases in the second", "Decreases in the first part; increases in the second"], "a": 0, "x": "[Oxford ATPL Book 6 · p226 Q11]"}, {"type": "mcq", "t": "Which of the following factors will lead to an increase of ground distance during a glide, while maintaining the appropriate minimum glide angle speed?", "o": ["Headwind", "Tailwind", "Increase of aircraft mass", "Decrease of aircraft mass. General Principles Climb and Descent"], "a": 1, "x": "[Oxford ATPL Book 6 · p226 Q13]"}, {"type": "mcq", "t": "A twin jet aeroplane is in cruise, with one engine inoperative, and has to overfly a high terrain area. In order to allow the greatest height clearance , the appropriate airspeed must be the airspeed:", "o": ["giving the lowest Cd/Cl ratio", "for long-range cruise", "of greatest lift-to-drag ratio", "giving the lowest Cl/Cd ratio"], "a": 2, "x": "[Oxford ATPL Book 6 · p227 Q14]"}, {"type": "mcq", "t": "What is the effect of increased mass on the performance of a gliding aeroplane at VMD?", "o": ["The lift/drag ratio decreases", "The speed for best angle of descent increases", "There is no effect", "The gliding angle decreases"], "a": 1, "x": "[Oxford ATPL Book 6 · p227 Q15]"}, {"type": "mcq", "t": "A twin engined aeroplane in cruise flight with one engine inoperative has to fly over high ground. In order to maintain the highest possible altitude the pilot should choose:", "o": ["the speed corresponding to the minimum value of lift / drag ratio", "the speed at the maximum lift", "the speed corresponding to the maximum value of the lift / drag ratio", "the long range speed"], "a": 2, "x": "[Oxford ATPL Book 6 · p227 Q16]"}, {"type": "mcq", "t": "With all engines out, a pilot wants to fly for maximum time. Therefore he has to fly the speed corresponding to:", "o": ["the minimum power required", "the critical Mach number", "the minimum angle of descent", "the maximum lift"], "a": 0, "x": "[Oxford ATPL Book 6 · p227 Q17]"}, {"type": "mcq", "t": "Descending from cruising altitude to ground level at a constant IAS in a headwind, compared to still air conditions, will:", "o": ["Reduce the time to descend", "Increase the time to descend", "Reduce the ground distance taken", "Reduce the fuel used in the descent"], "a": 2, "x": "[Oxford ATPL Book 6 · p227 Q18]"}, {"type": "mcq", "t": "When descending at a constant Mach number:", "o": ["The angle of attack remains constant", "The IAS decreases then increases", "The pitch angle will increase", "The pitch angle will decrease"], "a": 3, "x": "[Oxford ATPL Book 6 · p227 Q19]"}]}, {"id": "pfspec", "icon": "📝", "color": "#a05828", "sub": "40 question specimen exam, book order", "title": "Performance Specimen Paper", "questions": [{"type": "mcq", "t": "How does the thrust from a fixed propeller change during the take-off run of an aircraft?", "o": ["It remains constant", "It increases slightly as the aircraft speed builds up", "It decreases slightly as the aircraft speed builds up", "It only varies with changes in mass"], "a": 2, "x": "As speed increases then the angle of attack and hence the thrust of the propeller decrease.\n\n[Oxford ATPL Book 6 · p497 Q2]"}, {"type": "mcq", "t": "The take-off run is defined as:", "o": ["distance to V and then to stop, assuing the engine failure is recognised at V 1 1", "distance from brake release to the point where the aircraft reaches V", "the horizontal distance from the start of the take-off roll to a point equidistant between V and 35 ft LOF", "the distance to 35 ft with an engine failure at V or 1.15 times the all engine distance to 35 ft"], "a": 2, "x": "[Oxford ATPL Book 6 · p497 Q3]"}, {"type": "mcq", "t": "What effect does a downhill slope have on the take-off speeds?", "o": ["It has no effect on V", "It decreases V", "It increases V", "It increases the IAS for take-off"], "a": 1, "x": "With a downhill slope the effort required to continue acceleration after VEF is less than the effort required to stop the aircraft because of the effect of gravity. Hence take-off can be achieved from a lower speed, but stopping the aircraft within the distance available can only be achieved from a lower speed.\n\n[Oxford ATPL Book 6 · p497 Q4]"}, {"type": "mcq", "t": "Which of the following combinations most reduces the take-off and climb performance of an aircraft?", "o": ["high temperature and high pressure", "low temperature and high pressure", "low temperature and low pressure", "high temperature and low pressure"], "a": 3, "x": "The lowest take-off performance will occur when air density is at its lowest, hence high temperature and low pressure.\n\n[Oxford ATPL Book 6 · p497 Q5]"}, {"type": "mcq", "t": "Density altitude is:", "o": ["the true altitude of the aircraft", "the altitude in the standard atmosphere corresponding to the actual conditions", "the indicated altitude on the altimeter", "used to calculate en-route safety altitudes"], "a": 1, "x": "[Oxford ATPL Book 6 · p498 Q6]"}, {"type": "mcq", "t": "The take-off climb gradient:", "o": ["increases in a head wind and decreases in a tail wind", "decreases in a head wind and increases in a tail wind", "is independent of the wind component", "is determined with the aircraft in the take-off configuration"], "a": 2, "x": "In determining take-off climb performance, the still air gradient is considered.\n\n[Oxford ATPL Book 6 · p498 Q7]"}, {"type": "mcq", "t": "The effect of changing altitude on the maximum rate of climb (ROC) and speed for best rate of climb for a turbo-jet aircraft, assuming everything else remains constant, is:", "o": ["as altitude increases the ROC and speed both decrease", "as altitude increases the ROC and speed both increase", "as altitude increases the ROC decreases but the speed remains constant", "as altitude increases the ROC remains constant but the speed increases"], "a": 0, "x": "As altitude increases the speed for best gradient of climb remains constant, but the speed for best rate of climb decreases until the two speed coincide at the absolute ceiling.\n\n[Oxford ATPL Book 6 · p498 Q8]"}, {"type": "mcq", "t": "A runway at an aerodrome has a declared take-off run of 3000 m with 2000 m of clearway. The maximum distance that may be allowed for the take-off distance is:", "o": ["5000m", "6000 m", "3000 m", "4500 m"], "a": 3, "x": "TODA is limited by the lower of TORA plus clearway and 1.5 x TORA.\n\n[Oxford ATPL Book 6 · p498 Q9]"}, {"type": "mcq", "t": "An aircraft may use either 5° or 15° flap setting for take off. The effect of selecting the 5° setting as compared to the 15° setting is:", "o": ["take-off distance and take-off climb gradient will both increase", "take-off distance and take-off climb gradient will both decrease", "take-off distance will increase and take-off climb gradient will decrease", "take-off distance will decrease and take-off climb gradient will increase"], "a": 0, "x": "With a reduced flap setting the lift generated decreases and the stalling speed increases, so a greater take-off speed is required increasing the take-off distance. The reduced flap setting reduces the drag so the climb gradient increases.\n\n[Oxford ATPL Book 6 · p498 Q10]"}, {"type": "mcq", "t": "The use of reduced thrust for take-off is permitted:", "o": ["if the field length limited take-off mass is greater than the climb limited take-off mass", "if the actual take-off mass is less than the structural limiting mass", "if the actual take-off mass is less than the field length and climb limited take-off masses", "if the take-off distance required at the actual take-off mass does not exceed the take-off distance available"], "a": 2, "x": "The use of reduced thrust means that the take-off distance will be increased and the climb gradient reduced, so neither of these can be limiting.\n\n[Oxford ATPL Book 6 · p498 Q11]"}, {"type": "mcq", "t": "Planning the performance for a runway with no obstacles, it is found that the climb limiting take-off mass is significantly greater than the field limiting take-off mass with 5° flap selected. How can the limiting take-off mass be increased?", "o": ["use an increased V procedure", "increase the flap setting", "reduce the flap setting", "reduce the V"], "a": 1, "x": "Increasing the flap setting will reduce the TODR so the weight can be increased, but the climb gradient will reduce with the increased flap setting.\n\n[Oxford ATPL Book 6 · p499 Q12]"}, {"type": "mcq", "t": "The maximum and minimum values of V are limited by:", "o": ["V and V R MCG", "V and V 2 MCG", "V and V R MCA", "V and V 2 MCA"], "a": 0, "x": "see CAP698 page 62, paragraph 2.5.1.\n\n[Oxford ATPL Book 6 · p499 Q13]"}, {"type": "mcq", "t": "If the TAS is 175 kt and the rate of climb 1250 ft per minute, the climb gradient is approximately:", "o": ["7%", "14%", "12%", "10%"], "a": 0, "x": "Gradient of climb can be approximated to rate of climb divided by TAS.\n\n[Oxford ATPL Book 6 · p499 Q14]"}, {"type": "mcq", "t": "A pilot inadvertently selects a V which is lower than the correct V for the actual take-off weight. 1 1 What problem will the pilot encounter if an engine fails above the selected V but below the true V?", "o": ["the accelerate-stop distance required will exceed the distance available", "the climb gradient will be increased", "the take-off distance required will exceed that available", "there will be no significant effect on the performance"], "a": 2, "x": "The decision to continue the take-off will be made, but because the speed is below the normal V, the distance required to accelerate will be greater, so the TODA may well be exceeded.\n\n[Oxford ATPL Book 6 · p499 Q15]"}, {"type": "mcq", "t": "A turbo-jet is in a climb at a constant IAS what happens to the drag?", "o": ["It increases", "It decreases", "it remains constant", "it increases initially then decreases"], "a": 2, "x": "At a constant IAS drag will remain constant.\n\n[Oxford ATPL Book 6 · p499 Q16]"}, {"type": "mcq", "t": "Comparing the take-off performance of an aircraft from an aerodrome at 1000 ft to one taking off from an aerodrome at 6000 ft, the aircraft taking off from the aerodrome at 1000 ft:", "o": ["will require a greater take-off distance and have a greater climb gradient", "will require a greater take-off distance and have a lower climb gradient", "will require a shorter take-off distance and have a lower climb gradient", "will require a shorter take-off distance and have a greater climb gradient"], "a": 3, "x": "The air density is greater at the lower aerodrome so the performance will be better in terms of acceleration and gradient.\n\n[Oxford ATPL Book 6 · p499 Q17]"}, {"type": "mcq", "t": "Which is the correct sequence of speed?", "o": ["V , V , V S Y X", "V , V , V X Y X", "V , V , V S X Y", "V , V , V X Y S"], "a": 2, "x": "All speeds must be greater than V. s\n\n[Oxford ATPL Book 6 · p500 Q18]"}, {"type": "mcq", "t": "Which of the following will increase the accelerate-stop distance on a dry runway?", "o": ["a headwind component", "an uphill slope", "temperatures below ISA", "low take-off mass, because of the increased acceleration"], "a": 1, "x": "Although a uphill slope will enhance the deceleration, the effect on the acceleration to V will result in increased distances.\n\n[Oxford ATPL Book 6 · p500 Q19]"}, {"type": "mcq", "t": "A turbo-jet aircraft is climbing at a constant Mach number in the troposphere. Which of the following statements is correct?", "o": ["TAS and IAS increase", "TAS and IAS decrease", "TAS decreases, IAS increases", "TAS increases, IAS decreases"], "a": 1, "x": "Temperature is decreasing therefore the speed of sound and the TAS will decrease, and as altitude increases the IAS will also decrease.\n\n[Oxford ATPL Book 6 · p500 Q20]"}, {"type": "mcq", "t": "The induced drag in an aeroplane:", "o": ["increases as speed increases", "is independent of speed", "decreases as speed increases", "decreases as weight decreases"], "a": 2, "x": "As speed increases the induced drag reduces proportional to the square of the speed increase.\n\n[Oxford ATPL Book 6 · p500 Q21]"}, {"type": "mcq", "t": "The speed range between low speed and high speed buffet:", "o": ["decreases as altitude increases and weight decreases", "decreases as weight and altitude increase", "decreases as weight decreases and altitude increases", "increases as weight decreases and altitude increases"], "a": 1, "x": "As altitude increases at a given weight the IAS for the onset of high speed buffet decreases and the IAS for the onset of low speed buffet remains constant, hence the speed range decreases. As weight increases at a given altitude the IAS for the onset of low speed buffet increases and there is a small decrease in the IAS for the onset of high speed buffet so once again the speed range decreases.\n\n[Oxford ATPL Book 6 · p500 Q22]"}, {"type": "mcq", "t": "Thrust equals drag:", "o": ["in unaccelerated level flight", "in an unaccelerated descent", "in an unaccelerated climb", "in a climb, descent or level flight if unaccelerated"], "a": 0, "x": "In the climb and descent an element of gravity acts along the aircraft axis either opposing (climb) or adding to (descent) the thrust, so only in level unaccelerated flight will the two forces be equal.\n\n[Oxford ATPL Book 6 · p500 Q23]"}, {"type": "mcq", "t": "A higher mass at a given altitude will reduce the gradient of climb and the rate of climb. But the speeds:", "o": ["V and V will decrease X Y", "V and V will increase X Y", "V will increase and V will decrease X Y", "V and V will remain constant X Y"], "a": 1, "x": "As altitude increases the speed for best gradient of climb remains constant but the speed for the best rate of climb decreases. (see Q8)\n\n[Oxford ATPL Book 6 · p501 Q24]"}, {"type": "mcq", "t": "If the other factors are unchanged the fuel mileage (nm per kg) is:", "o": ["independent from the centre of gravity (CofG)", "lower with a forward CofG", "lower with an aft CofG", "higher with a forward CofG"], "a": 1, "x": "As the CofG moves forward the download on the tail increases, so the lift required also increases. To create the extra lift either speed or angle of attack must increase. In either case more thrust is required and the fuel required per nm will increase.\n\n[Oxford ATPL Book 6 · p501 Q25]"}, {"type": "mcq", "t": "Concerning maximum range in a turbo-jet aircraft, which of the following is true?", "o": ["the speed to achieve maximum range is not affected by the wind component", "to achieve maximum range speed should be increased in a headwind and reduced in a tailwind", "to achieve maximum range speed should be decreased in a headwind and increased in", "tailwind"], "a": 1, "x": "The speed for maximum range in a jet aircraft is found where the line from the origin is tangential to the drag curve. With a head wind the origin moves to the right by the amount of the wind component so the line from the origin will be tangential at a higher speed, and to the left with a tail wind giving a lower speed.\n\n[Oxford ATPL Book 6 · p501 Q26]"}, {"type": "mcq", "t": "V is the speed:", "o": ["above which take-off must be rejected if engine failure occurs", "below which take-off must be continued if engine failure occurs", "engine failure recognised below this speed, take-off must be rejected and above which take-off must be continued", "the assumed speed for engine failure"], "a": 2, "x": "V1 is the decision speed. If engine failure is recognised below V1 take-off must be abandoned and engine failure recognised above V take-off must be continued.\n\n[Oxford ATPL Book 6 · p501 Q27]"}, {"type": "mcq", "t": "A constant headwind in the descent:", "o": ["Increases the angle of descent", "Increases the rate of descent", "Increases the angle of the descent flight path", "Increases the ground distance travelled in the descent"], "a": 2, "x": "the rate of descent is independent of the wind, but the descent path is modified by the wind, the angle increasing with a head wind because of the reduced ground distance covered.\n\n[Oxford ATPL Book 6 · p501 Q28]"}, {"type": "mcq", "t": "For a turbojet aircraft what is the reason for the use of maximum range speed?", "o": ["Greatest flight duration", "Minimum specific fuel consumption", "Minimum flight duration", "Minimum drag"], "a": 1, "x": "The maximum range speed is the speed at which the greatest distance can be flown, which means the lowest possible fuel usage. To achieve this implies we must have the lowest specific fuel consumption.\n\n[Oxford ATPL Book 6 · p501 Q29]"}, {"type": "mcq", "t": "Why are step climbs used on long range flights in jet transport aircraft?", "o": ["to comply with ATC flight level constraints", "step climbs have no significance for jet aircraft, they are used by piston aircraft", "to fly as close as possible to the optimum altitude as mass reduces", "they are only justified if the actual wind conditions differ significantly from the forecast conditions used for planning"], "a": 2, "x": "The most efficient way to operate a jet aircraft is to cruise climb, that is to set optimum cruise power and fly at the appropriate speed and allow the excess thrust as weight decreases to climb the aircraft.. For obvious safety reasons this is not possible, so the aircraft operates as close as possible to the optimum altitude by using the step climb technique.\n\n[Oxford ATPL Book 6 · p502 Q30]"}, {"type": "mcq", "t": "The absolute ceiling of an aircraft is:", "o": ["where the rate of climb reaches a specified value", "always lower than the aerodynamic ceiling", "where the rate of climb is theoretically zero", "where the gradient of climb is 5%"], "a": 2, "x": "The absolute ceiling is the highest altitude to which the aircraft could be climbed, where, at optimum climb speed, thrust = drag, so with no excess of thrust the rate (and gradient) of climb will be zero.\n\n[Oxford ATPL Book 6 · p502 Q31]"}, {"type": "mcq", "t": "In the take-off flight path, the net climb gradient when compared to the gross gradient is:", "o": ["greater", "the same", "smaller", "dependent on aircraft type"], "a": 2, "x": "Net performance is gross (ie average) performance reduced by a regulatory amount to give a ‘worst case’ view. Therefore the worst case for the climb gradient will be a lower gradient than it is expected to achieve.\n\n[Oxford ATPL Book 6 · p502 Q32]"}, {"type": "mcq", "t": "The effect of a headwind component on glide range:", "o": ["the range will increase", "the range will not be affected", "the range will decrease", "the range will only be affected if incorrect speeds are flown"], "a": 2, "x": "With a head wind component the glide performance will not be affected but the distance covered will reduce because of the reduced groundspeed.\n\n[Oxford ATPL Book 6 · p502 Q35]"}, {"type": "mcq", "t": "A twin engine turbo-jet aircraft having lost one engine must clear obstacles in the drift down by", "o": ["minimum of:", "35 ft", "1000 ft", "1500 ft"], "a": 3, "x": "This is the JAR regulatory requirement.\n\n[Oxford ATPL Book 6 · p503 Q37]"}, {"type": "mcq", "t": "The landing speed, V , for a single engine aircraft must be not less than: REF", "o": ["1.2V MCA", "1.1V S0", "1.05V S0", "1.3V S0"], "a": 3, "x": "Again the JAR regulatory requirement.\n\n[Oxford ATPL Book 6 · p503 Q38]"}, {"type": "mcq", "t": "What factor must be applied to the landing distance available at the destination aerodrome to determine the landing performance of a turbo-jet aircraft on a dry runway?", "o": ["1.67", "1.15", "0.60", "0.70"], "a": 2, "x": "The JAR regulatory requirement.\n\n[Oxford ATPL Book 6 · p503 Q39]"}, {"type": "mcq", "t": "An aircraft is certified to use two landing flap positions, 25° and 35°. If the pilot selects 25° instead of 35° then the aircraft will have:", "o": ["an increased landing distance and reduced go-around performance", "an reduced landing distance and reduced go-around performance", "an increased landing distance and increased go-around performance", "an reduced landing distance and increased go-around performance"], "a": 2, "x": "With a reduced flap setting the stalling speed and hence the VREF will increase, so a greater landing distance will be required. With a reduced flap setting the drag will decrease, so the climb gradient will be better.\n\n[Oxford ATPL Book 6 · p503 Q40]"}]}]
/* ================= storage durability =================
   iOS Safari gives a file:// page a throwaway origin, so localStorage is
   discarded when the tab closes. Detect it, say so plainly, and provide a
   backup route that does not depend on the browser keeping anything.        */
let _storageMode='unknown';
function storageProbe(){
  try{
    const k='__probe__'+Date.now();
    localStorage.setItem(k,'1');
    const ok=localStorage.getItem(k)==='1';
    localStorage.removeItem(k);
    if(!ok)return 'blocked';
  }catch(e){return 'blocked';}
  if(location.protocol==='file:')return 'ephemeral';
  return 'ok';
}
function storageBanner(){
  _storageMode=storageProbe();
  if(_storageMode==='ok')
    return '<div class="stok">💾 Progress is saving normally in this browser. '
      +'Still take a backup file now and then.</div>';
  const why = _storageMode==='blocked'
    ? 'This browser is refusing to store anything, which usually means Private Browsing.'
    : 'You opened this file directly from Files or a download, so the browser treats it as a '
      +'temporary page and throws the saved progress away when you close the tab.';
  return '<div class="stwarn"><b>⚠️ Progress will not survive closing this tab.</b>'
    +'<p>'+why+'</p>'
    +'<p><b>To fix it permanently, pick one:</b></p>'
    +'<ol><li>Put the file on a free static host (Netlify Drop, GitHub Pages), open that '
    +'https link in Safari, then Share → <b>Add to Home Screen</b>. Progress then persists like an app.</li>'
    +'<li>Or keep using it as-is and press <b>Save backup file</b> before you close. '
    +'Restore it next time with <b>Load backup file</b>.</li></ol>'
    +'<div class="btnrow"><button onclick="downloadBackup()">💾 Save backup file</button>'
    +'<button onclick="pickBackup()">📂 Load backup file</button></div></div>';
}
/* ---- file-based backup, works even with no storage at all ---- */
function backupPayload(){
  const m=loadMem();
  return JSON.stringify({app:MEM_KEY,v:1,savedAt:new Date().toISOString(),mem:m});
}
function downloadBackup(){
  try{
    const blob=new Blob([backupPayload()],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='atpl-progress-'+MEM_KEY.replace(/^atpl_/,'')+'-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},800);
    uiNotice('Backup saved. Keep it in Files or email it to yourself, then load it next time.');
  }catch(e){ uiNotice('Could not create the file. Use Export instead and paste the text somewhere safe.'); }
}
function pickBackup(){
  let inp=document.getElementById('bk-file');
  if(!inp){
    inp=document.createElement('input');
    inp.type='file'; inp.accept='.json,application/json'; inp.id='bk-file';
    inp.style.display='none';
    inp.addEventListener('change',()=>{
      const f=inp.files&&inp.files[0]; if(!f)return;
      const r=new FileReader();
      r.onload=()=>{ applyBackup(String(r.result)); inp.value=''; };
      r.onerror=()=>uiNotice('Could not read that file.');
      r.readAsText(f);
    });
    document.body.appendChild(inp);
  }
  inp.click();
}
function applyBackup(text){
  let d=null;
  try{ d=JSON.parse(text); }catch(e){ uiNotice('That file is not a valid backup.'); return; }
  if(d&&d.app&&d.app!==MEM_KEY){
    uiNotice('That backup is from a different question bank, so its progress would not match '
      +'any question here. Load the file saved from this app instead.');
    return;
  }
  const incoming = d && d.mem ? d.mem : d;
  const looksLikeRecord=v=>v&&typeof v==='object'&&('a' in v||'c' in v||'f' in v||'del' in v);
  const bareMap = incoming && typeof incoming==='object' && !incoming.qs
    && Object.keys(incoming).length>0
    && Object.values(incoming).every(looksLikeRecord);
  if(!incoming || typeof incoming!=='object' || (!incoming.qs && !bareMap)){
    uiNotice('That file does not contain any progress.'); return;
  }
  const src = incoming.qs ? incoming : {qs:incoming,sessions:[],streak:{last:'',count:0}};
  const cur = loadMem();
  Object.keys(src.qs||{}).forEach(k=>{
    const a=cur.qs[k], b=src.qs[k];
    if(!a){ cur.qs[k]={...b}; return; }
    a.a=Math.max(a.a||0,b.a||0); a.c=Math.max(a.c||0,b.c||0);
    a.f=a.f||b.f; a.del=a.del||b.del; a.last=Math.max(a.last||0,b.last||0);
  });
  const seen=new Set(cur.sessions.map(s=>s.ts));
  (src.sessions||[]).forEach(s=>{ if(!seen.has(s.ts)) cur.sessions.push(s); });
  cur.sessions.sort((x,y)=>y.ts-x.ts);
  if(cur.sessions.length>25)cur.sessions=cur.sessions.slice(0,25);
  if((src.streak&&src.streak.count||0)>(cur.streak.count||0))cur.streak=src.streak;
  saveMem(cur);
  buildHome(); switchTab('progress');
  uiNotice('✅ Progress restored from the file.');
}
/* remind the user to back up when storage cannot be trusted */
function maybeRemindBackup(){
  if(_storageMode==='ok')return;
  const m=loadMem();
  const answered=Object.keys(m.qs||{}).length;
  if(answered && answered % 40 === 0){
    uiConfirm('You have worked '+answered+' questions and this browser will not keep them. '
      +'Save a backup file now?', downloadBackup, 'Save backup');
  }
}

/* ===== in-app dialogs: iOS Safari suppresses native alert/confirm in
   home-screen web apps and after async work, so both are replaced. ===== */
function uiNotice(msg,kind){
  const old=document.getElementById('ui-dialog');if(old)old.remove();
  const m=document.createElement('div');m.className='io-modal';m.id='ui-dialog';
  m.innerHTML='<div class="io-box"><p class="ui-dialog-msg">'+msg+'</p>'
    +'<div class="io-actions"><button class="io-confirm" '
    +'onclick="document.getElementById(\'ui-dialog\').remove()">OK</button></div></div>';
  m.addEventListener('click',e=>{if(e.target===m)m.remove();});
  document.body.appendChild(m);
}
function uiConfirm(msg,onYes,yesLabel){
  const old=document.getElementById('ui-dialog');if(old)old.remove();
  window.__uiYes=()=>{const d=document.getElementById('ui-dialog');if(d)d.remove();onYes();};
  const m=document.createElement('div');m.className='io-modal';m.id='ui-dialog';
  m.innerHTML='<div class="io-box"><p class="ui-dialog-msg">'+msg+'</p>'
    +'<div class="io-actions">'
    +'<button class="io-cancel" onclick="document.getElementById(\'ui-dialog\').remove()">Cancel</button>'
    +'<button class="io-confirm" onclick="window.__uiYes()">'+(yesLabel||'Continue')+'</button>'
    +'</div></div>';
  m.addEventListener('click',e=>{if(e.target===m)m.remove();});
  document.body.appendChild(m);
}
/* ===== clipboard that actually works on iOS ===== */
function copyExport(btn){
  const ta=document.getElementById('export-ta');if(!ta)return;
  const done=ok=>{
    btn.textContent=ok?'✅ Copied':'⚠️ Select & copy manually';
    btn.classList.toggle('copied',ok);
    setTimeout(()=>{btn.textContent='📋 Copy';btn.classList.remove('copied');},2200);
  };
  const legacy=()=>{
    /* iOS ignores select() on a readonly field, so drop readonly first */
    const ro=ta.hasAttribute('readonly');
    if(ro)ta.removeAttribute('readonly');
    ta.focus();ta.setSelectionRange(0,ta.value.length);
    let ok=false;try{ok=document.execCommand('copy');}catch(e){ok=false;}
    if(ro)ta.setAttribute('readonly','');
    done(ok);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText&&window.isSecureContext){
    navigator.clipboard.writeText(ta.value).then(()=>done(true)).catch(legacy);
  }else legacy();
}

/* ===== per-session answer-option shuffling ===== */
const _LTR='abcdefgh';
function _remapExpl(x,perm){
  if(!x)return x;
  const map={};
  perm.forEach((oldIdx,newIdx)=>{map[_LTR[oldIdx]]=_LTR[newIdx];});
  const sw=l=>{const lo=l.toLowerCase();if(!(lo in map))return l;
    const nl=map[lo];return l===l.toUpperCase()?nl.toUpperCase():nl;};
  /* One pass over "option c" / "answers a. and b." / "(d)" phrases only, so that
     enumerated worked-solution steps ("a. Flight time = ...") are left alone and
     no letter is remapped twice. */
  return x.replace(
    /\b(?:answers?|options?)\b\s*\(?[a-h]\)?\.?(?:\s*(?:,|and)\s*\(?[a-h]\)?\.?)*|\([a-h]\)/gi,
    m=>m.replace(/([^a-z]|^)([a-h])(?![a-z])/gi,(mm,pre,l)=>pre+sw(l))
  );
}
function _applyPerm(q,perm){
  if(q.type!=='mcq'||!q.o||!perm||perm.length!==q.o.length)return q;
  return {...q,o:perm.map(k=>q.o[k]),a:perm.indexOf(q.a),x:_remapExpl(q.x||'',perm),_perm:perm};
}
function _shuffleOpts(q){
  if(q.type!=='mcq'||!q.o||q.o.length<2)return q;
  const n=q.o.length,perm=[...Array(n).keys()];
  for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[perm[i],perm[j]]=[perm[j],perm[i]];}
  return _applyPerm(q,perm);
}
/* ===== countdown timer for timed exams ===== */
let _timerId=null,_deadline=0,_forceSubmit=false;
function stopTimer(){
  if(_timerId){clearInterval(_timerId);_timerId=null;}
  const el=document.getElementById('quiz-timer');if(el)el.remove();
}
function startTimer(mins){
  stopTimer();
  const hdr=document.querySelector('#quiz .quiz-header');if(!hdr)return;
  const el=document.createElement('div');el.id='quiz-timer';el.className='quiz-timer';
  hdr.appendChild(el);
  _deadline=Date.now()+mins*60000;
  const tick=()=>{
    const left=Math.max(0,_deadline-Date.now());
    const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);
    el.textContent='⏱ '+m+':'+String(s).padStart(2,'0')+' left';
    el.classList.toggle('warn',left<=300000&&left>60000);
    el.classList.toggle('crit',left<=60000);
    if(left<=0){
      clearInterval(_timerId);_timerId=null;
      el.textContent='⏱ Time up';
      if(!submitted){_forceSubmit=true;submitQuiz();_forceSubmit=false;}
    }
  };
  tick();_timerId=setInterval(tick,1000);
}

const MEM_KEY='atpl_nav_kw_ox';
function hashQ(s){let h=5381,i=s.length;while(i--)h=((h<<5)-h+s.charCodeAt(i))|0;return(h>>>0).toString(36);}

/* ===== soft-delete support ===== */
function isDel(m,qId){const r=m&&m.qs?m.qs[qId]:null;return !!(r&&r.del);}
let _lastDel=null;
function delQ(qId,ev){
  if(ev)ev.stopPropagation();
  if(!qId)return;
  const m=loadMem();if(!m.qs[qId])m.qs[qId]={a:0,c:0};
  m.qs[qId].del=true;m.qs[qId].delAt=Date.now();saveMem(m);
  const i=currentQ.findIndex(q=>q._qId===qId);
  _lastDel=i>=0?{q:currentQ[i],i,a:userA[i]}:{qId};
  if(i>=0&&!submitted){
    currentQ.splice(i,1);userA.splice(i,1);
    if(!currentQ.length){delToast(qId);clearSession();goHome();return;}
    renderQuiz();saveSession();
  }else{
    const c=document.getElementById('card-'+i);if(c)c.style.display='none';
  }
  delToast(qId);
}
function undoDel(qId){
  const m=loadMem();if(m.qs[qId]){m.qs[qId].del=false;delete m.qs[qId].delAt;}saveMem(m);
  const t=document.getElementById('del-toast');if(t)t.remove();
  if(_lastDel&&_lastDel.q&&!submitted&&document.getElementById('quiz').classList.contains('active')){
    currentQ.splice(_lastDel.i,0,_lastDel.q);userA.splice(_lastDel.i,0,_lastDel.a);
    renderQuiz();saveSession();
  }else{buildHome();}
  _lastDel=null;
}
function delToast(qId){
  const old=document.getElementById('del-toast');if(old)old.remove();
  const t=document.createElement('div');t.id='del-toast';t.className='del-toast';
  t.innerHTML='<span>🗑 Question deleted</span><button onclick="undoDel(\''+qId+'\')">Undo</button>';
  document.body.appendChild(t);
  setTimeout(()=>{const el=document.getElementById('del-toast');if(el)el.remove();},6000);
}
function getDeletedCount(){const m=loadMem();return Object.keys(m.qs).filter(k=>m.qs[k].del).length;}
function restoreAllDeleted(){
  const m=loadMem();Object.keys(m.qs).forEach(k=>{if(m.qs[k].del){m.qs[k].del=false;delete m.qs[k].delAt;}});
  saveMem(m);buildHome();buildProgress();
}

let _memCache=null,_lsOk=true;
function _emptyMem(){return{qs:{},sessions:[],streak:{last:'',count:0}};}
function _fixMem(d){if(!d.qs)d.qs={};if(!d.sessions)d.sessions=[];if(!d.streak)d.streak={last:'',count:0};return d;}
function loadMem(){if(_memCache)return _memCache;try{let d=JSON.parse(localStorage.getItem(MEM_KEY)||'null');if(!d)d={qs:{},sessions:[],streak:{last:'',count:0}};_memCache=_fixMem(d);return _memCache;}catch(e){_memCache=_emptyMem();return _memCache;}}
function saveMem(m){_memCache=m;try{localStorage.setItem(MEM_KEY,JSON.stringify(m));_lsOk=true;}catch(e){_lsOk=false;}}
function recordResult(qId,isCorrect){if(!qId)return;const m=loadMem();if(!m.qs[qId])m.qs[qId]={a:0,c:0};m.qs[qId].a++;if(isCorrect)m.qs[qId].c++;m.qs[qId].last=Date.now();saveMem(m);}
function toggleFlag(qId,ev){if(ev)ev.stopPropagation();const m=loadMem();if(!m.qs[qId])m.qs[qId]={a:0,c:0};m.qs[qId].f=!m.qs[qId].f;saveMem(m);const f=!!m.qs[qId].f;const btn=document.getElementById('flag-'+qId);if(btn){btn.classList.toggle('flagged',f);btn.textContent=f?'🚩':'⚑';}const fl=document.getElementById('tab-flagged');if(fl&&fl.classList.contains('active'))buildFlaggedTab();}
function recordSession(title,correct,total){const m=loadMem();const today=new Date().toISOString().slice(0,10);const yest=new Date(Date.now()-86400000).toISOString().slice(0,10);if(m.streak.last===today){}else if(m.streak.last===yest){m.streak.count++;m.streak.last=today;}else{m.streak.count=1;m.streak.last=today;}m.sessions.unshift({ts:Date.now(),title,c:correct,t:total,p:Math.round(correct/total*100)});if(m.sessions.length>25)m.sessions=m.sessions.slice(0,25);saveMem(m);}
function getWeakQ(min,thresh,max){min=min||1;thresh=thresh||0.65;max=max||500;const m=loadMem();const weak=[];CHAPTERS.forEach(ch=>ch.questions.forEach((q,i)=>{if(q.type!=='mcq')return;const id=ch.id+'_'+hashQ(q.t||''),r=m.qs[id];if(r&&!r.del&&r.a>=min&&r.c/r.a<thresh)weak.push({...q,_ch:ch.title,_qId:id,_acc:Math.round(r.c/r.a*100)});}));return weak.sort((a,b)=>a._acc-b._acc).slice(0,max);}
function getFlaggedQ(){const m=loadMem();const fl=[];CHAPTERS.forEach(ch=>ch.questions.forEach((q,i)=>{if(q.type!=='mcq')return;const id=ch.id+'_'+hashQ(q.t||''),r=m.qs[id];if(r&&r.f&&!r.del)fl.push({...q,_ch:ch.title,_qId:id});}));return fl;}
function getChStats(){const m=loadMem();return CHAPTERS.map(ch=>{let a=0,c=0,f=0,qs=0,attempted=0,lastAt=0;ch.questions.forEach((q)=>{if(q.type!=='mcq')return;const r=m.qs[ch.id+'_'+hashQ(q.t||'')];if(r&&r.del)return;qs++;if(r){a+=r.a;c+=r.c;if(r.f)f++;if(r.a>0){attempted++;if((r.last||0)>lastAt)lastAt=r.last||0;}}});return{id:ch.id,title:ch.title,icon:ch.icon,qs,a,c,f,attempted,lastAt,acc:a>0?Math.round(c/a*100):null};});}

function switchTab(t){const TABS=['chapters','progress','mock','flagged'];document.querySelectorAll('.tabs .tab').forEach((el,i)=>el.classList.toggle('active',TABS[i]===t));document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));document.getElementById('tab-'+t).classList.add('active');if(t==='progress')buildProgress();if(t==='mock')buildMockTab();if(t==='flagged')buildFlaggedTab();}

function buildProgress(){
  const sec=document.getElementById('progress-section');if(!sec)return;
  const m=loadMem();const stats=getChStats();const attempted=stats.filter(s=>s.a>0);
  const noData=!attempted.length&&!m.sessions.length;let html=storageBanner();
  if(noData)html+='<div class="no-data-note">📊 Complete any quiz to see your progress here</div>';
  if(!noData){
    if(m.streak&&m.streak.count>0)html+=`<div class="streak-banner">🔥 ${m.streak.count}-day study streak — keep going!</div>`;
    const totalA=stats.reduce((s,x)=>s+x.a,0);const totalC=stats.reduce((s,x)=>s+x.c,0);
    if(totalA>0){const op=Math.round(totalC/totalA*100);const oc=op>=80?'var(--green)':op>=60?'var(--yellow)':'var(--red)';html+=`<div class="overall-stats"><span><span class="stat-val" style="color:${oc}">${op}%</span><span class="stat-lbl">Overall</span></span><span><span class="stat-val">${totalA}</span><span class="stat-lbl">Attempts</span></span><span><span class="stat-val" style="color:var(--green)">${totalC}</span><span class="stat-lbl">Correct</span></span></div>`;}
    stats.forEach(s=>{if(!s.a)return;const pct=s.acc;const color=pct>=80?'var(--green)':pct>=60?'var(--yellow)':'var(--red)';html+=`<div class="prog-chapter"><span style="font-size:16px">${s.icon}</span><div class="prog-ch-name">${s.title}</div><div class="prog-bar-outer"><div class="prog-bar-inner" style="width:${pct}%;background:${color}"></div></div><span class="prog-ch-pct" style="color:${color}">${pct}%</span></div>`;});
    const weak=getWeakQ(1,.65,500);const flagged=getFlaggedQ();let btns='';
    if(weak.length)btns+=`<button class="weak-btn" onclick="startWeakQuiz()">⚠️ Weak Areas (${weak.length} Q)</button>`;
    if(flagged.length)btns+=`<button class="weak-btn weak-btn-flag" onclick="startFlaggedQuiz()">🚩 Flagged (${flagged.length} Q)</button>`;
    if(btns)html+=`<div class="progress-actions">${btns}</div>`;
    if(m.sessions.length){html+='<div class="session-history"><div class="section-label">Recent Sessions</div>';m.sessions.slice(0,10).forEach(s=>{const d=new Date(s.ts);const ds=d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});const color=s.p>=80?'var(--green)':s.p>=60?'var(--yellow)':'var(--red)';html+=`<div class="session-row"><span class="session-title">${s.title}</span><span class="session-date">${ds}</span><span class="session-pct" style="color:${color}">${s.p}%</span></div>`;});html+='</div>';}
  }
  html+=`<div class="sync-row"><button class="sync-btn export" onclick="exportProgress()">📤 Export</button><button class="sync-btn import" onclick="importProgress()">📥 Import</button></div>`;
  html+=`<div class="bkrow"><button class="pri" onclick="downloadBackup()">💾 Save backup file</button><button onclick="pickBackup()">📂 Load backup file</button></div>`;
  const _dc=getDeletedCount();
  if(_dc)html+=`<div style="display:flex;align-items:center;gap:10px;justify-content:center;font-size:12px;color:var(--muted);margin-top:12px">🗑 ${_dc} deleted question${_dc>1?'s':''}<button class="weak-btn" style="padding:4px 10px;font-size:12px;margin:0" onclick="restoreAllDeleted()">Restore all</button></div>`;
  if(!noData)html+=`<div class="reset-link" onclick="resetMem()">Reset all progress</div>`;
  sec.innerHTML=html;
}

function doImport(){const ta=document.getElementById('import-ta');if(!ta)return;try{const inc=JSON.parse(ta.value.trim());if(!inc||typeof inc!=='object')throw new Error();const cur=loadMem();const inQs=inc.qs||inc;Object.keys(inQs).forEach(k=>{if(!cur.qs[k])cur.qs[k]=inQs[k];else{cur.qs[k].a=Math.max(cur.qs[k].a,inQs[k].a||0);cur.qs[k].c=Math.max(cur.qs[k].c,inQs[k].c||0);if(inQs[k].f)cur.qs[k].f=true;if(inQs[k].del)cur.qs[k].del=true;}});const existTs=new Set(cur.sessions.map(s=>s.ts));(inc.sessions||[]).forEach(s=>{if(!existTs.has(s.ts))cur.sessions.push(s);});cur.sessions.sort((a,b)=>b.ts-a.ts);if(cur.sessions.length>25)cur.sessions=cur.sessions.slice(0,25);if(inc.streak&&(inc.streak.count||0)>(cur.streak.count||0))cur.streak=inc.streak;saveMem(cur);document.getElementById('io-modal').remove();buildHome();uiNotice('✅ Imported successfully!');}catch(e){uiNotice('❌ Could not read that. Paste the full exported text and try again.');}}

function startMockExam(n){
  const stats=getChStats();
  const weighted=CHAPTERS.map(ch=>{
    const s=stats.find(x=>x.id===ch.id);
    const err=s&&s.acc!==null?(100-s.acc)/100:0.5;
    const mcqs=ch.questions.filter(q=>q.type==='mcq'&&!isDel(loadMem(),ch.id+'_'+hashQ(q.t||'')));
    return{ch,mcqs,weight:Math.max(err,0.05)*mcqs.length};
  }).filter(x=>x.mcqs.length>0);
  const totalWeight=weighted.reduce((s,x)=>s+x.weight,0);
  const picked=[];
  weighted.forEach(x=>{
    const share=Math.max(1,Math.round(x.weight/totalWeight*n));
    const shuffled=[...x.mcqs].sort(()=>Math.random()-0.5).slice(0,share);
    shuffled.forEach(q=>picked.push({...q,_qId:x.ch.id+'_'+hashQ(q.t||''),_ch:x.ch.title}));
  });
  const final=[...picked].sort(()=>Math.random()-0.5).slice(0,n);
  if(!final.length){uiNotice('No questions available. Complete some chapter quizzes first.');return;}
  const mins=final.length*2;
  startQuiz(final,`🎯 Mock Exam (${final.length} Q · ${mins} min)`,{mins});
}

function pickWorstFirst(ch,n,mem){
  const mcqs=ch.questions.filter(q=>q.type==='mcq').map(q=>({...q,_qId:ch.id+'_'+hashQ(q.t||''),_ch:ch.title})).filter(q=>!isDel(mem,q._qId));
  const attempted=mcqs.filter(q=>{const r=mem.qs[q._qId];return r&&r.a>0;}).sort((a,b)=>{const ra=mem.qs[a._qId],rb=mem.qs[b._qId];return(ra.c/ra.a)-(rb.c/rb.a);});
  const unseen=mcqs.filter(q=>{const r=mem.qs[q._qId];return !r||r.a===0;}).sort(()=>Math.random()-0.5);
  return[...attempted,...unseen].slice(0,n);
}
function startClusterExam(idx){
  const cl=CLUSTERS[idx];if(!cl)return;
  const mem=loadMem();
  const chs=cl.chs.map(id=>CHAPTERS.find(c=>c.id===id)).filter(Boolean);
  const perCh=Math.max(1,Math.round(cl.total/chs.length));
  const picked=[];
  chs.forEach(ch=>{picked.push(...pickWorstFirst(ch,perCh,mem));});
  const final=[...picked].sort(()=>Math.random()-0.5).slice(0,cl.total);
  if(!final.length){uiNotice('No questions available.');return;}
  const cmins=final.length*2;
  startQuiz(final,`${cl.icon} ${cl.name} (${final.length} Q · ${cmins} min)`,{mins:cmins});
}

function saveSession(){try{localStorage.setItem(SESSION_KEY,JSON.stringify({q:currentQ.map(q=>q._qId),a:userA,t:currentTitle,p:currentQ.map(q=>q._perm||null),ts:Date.now()}));}catch(e){}}

function resumeSession(){
  try{
    const s=JSON.parse(localStorage.getItem(SESSION_KEY));
    if(!s||!s.q)return;
    const idMap={};
    CHAPTERS.forEach(ch=>ch.questions.forEach((q,i)=>{const id=ch.id+'_'+hashQ(q.t||'');idMap[id]={...q,_ch:ch.title,_qId:id};}));
    const keep=s.q.map((id,i)=>({q:idMap[id],p:(s.p||[])[i]}))
      .filter(o=>o.q&&!isDel(loadMem(),o.q._qId));
    const qs=keep.map(o=>o.q);
    if(!qs.length)return;
    startQuiz(qs,s.t||'Resumed Session',{perms:keep.map(o=>o.p)});
    setTimeout(()=>{s.a.forEach((a,i)=>{if(a!==null)userA[i]=a;});renderQuiz();},50);
  }catch(e){}
}

function renderTableCard(q,idx){
  if(!q.rows||!q.rows.length)return'';
  const tblId='tbl-'+idx;
  const firstRow=q.rows[0];
  const isHeader=firstRow.every(c=>!c.hi&&isNaN(parseFloat(c.t)));
  let thead='',tbody='';
  const dataRows=isHeader?q.rows.slice(1):q.rows;
  if(isHeader){thead='<thead><tr>'+firstRow.map(c=>`<th>${c.t}</th>`).join('')+'</tr></thead>';}
  tbody='<tbody>'+dataRows.map(row=>'<tr>'+row.map(c=>c.hi
    ?`<td class="hi" onclick="revealTblCell(this)" title="Tap to reveal">${c.t}</td>`
    :`<td>${c.t}</td>`
  ).join('')+'</tr>').join('')+'</tbody>';
  const hasHidden=dataRows.some(row=>row.some(c=>c.hi));
  const hint=hasHidden?`<div style="font-size:11px;color:var(--muted);margin-top:6px">🟡 Tap any cell to reveal · or</div><button class="tbl-reveal-btn" id="rbtn-${tblId}" onclick="revealAllTbl('${tblId}')">👁 Reveal All Answers</button>`:'';
  return `<div class="qcard"><div class="qcard-header"><div class="qnum qnum-tbl">${idx+1}</div><div style="flex:1"><span class="qtype-badge qtype-tbl">📋 Fill-in Table</span><div class="tbl-caption">${q.caption}</div></div></div><div style="overflow-x:auto"><table class="ref-table" id="${tblId}">${thead}${tbody}</table></div>${hint}</div>`;
}

function renderCalcCard(q,idx,qId){
  const mem=loadMem();const qr=mem.qs[qId]||{};const isFlagged=!!qr.f;
  const flagBtn=`<button class="flag-btn${isFlagged?' flagged':''}" id="flag-${qId}" onclick="toggleFlag('${qId}',event)" title="Flag">${isFlagged?'🚩':'⚑'}</button>`+(qId?`<button class="del-btn" onclick="delQ('${qId}',event)" title="Delete this question">🗑</button>`:'');
  const ansHtml=q.ans?`<div class="calc-ans" id="cans-${idx}">${q.ans.replace(/\n/g,'<br>')}</div><button class="show-ans-btn" id="sab-${idx}" onclick="toggleCalcAns(${idx})">▶ Show Working / Answer</button>`:
    `<div class="calc-ans visible" id="cans-${idx}" style="color:var(--muted);font-style:italic">No answer provided in source.</div>`;

}

function startQuiz(questions,title,opts){
  opts=opts||{};
  currentQ=opts.perms
    ?questions.map((q,i)=>_applyPerm(q,opts.perms[i]))
    :questions.map(_shuffleOpts);
  questions=currentQ;
  userA=new Array(questions.length).fill(null);submitted=false;currentTitle=title;
  document.getElementById('quiz-title').textContent=title;
  document.getElementById('live-score').textContent='';
  renderQuiz();
  const mcqCount=questions.filter(q=>q.type==='mcq').length;
  const footer=document.getElementById('quiz-footer');
  if(mcqCount>0){footer.innerHTML='<button class="btn btn-secondary" onclick="clearAll()">Clear</button><button class="btn btn-primary" onclick="submitQuiz()">Submit</button>';}
  else{footer.innerHTML='<button class="btn btn-primary" onclick="goHome()">← Back to Home</button>';}
  if(opts.mins&&mcqCount>0)startTimer(opts.mins);else stopTimer();
  show('quiz');
}

function renderQuiz(){
  const body=document.getElementById('quiz-body');body.innerHTML='';
  let mcqIdx=0;
  currentQ.forEach((q,i)=>{
    const qId=q._qId||(q._ch?q._ch+'_'+i:'');
    if(q.type==='table'){body.innerHTML+=renderTableCard(q,i);return;}
    if(q.type==='calc'){body.innerHTML+=renderCalcCard(q,i,qId);return;}
    // MCQ
    const chBadge=q._ch?`<span style="font-size:10px;color:var(--muted)">${q._ch}</span><br>`:'';
    let opts='';['A','B','C','D'].forEach((l,j)=>{if(j<q.o.length)opts+=`<div class="opt" id="opt-${i}-${j}" onclick="sel(${i},${j})"><span class="opt-l">${l}</span><span class="opt-t">${q.o[j]}</span></div>`;});
    const mem=loadMem();const qr=mem.qs[q._qId||'']||{};const isFlagged=!!qr.f;
    const flagId=q._qId?`flag-${q._qId}`:`flag-qi-${i}`;
    const flagBtn=`<button class="flag-btn${isFlagged?' flagged':''}" id="${flagId}" onclick="toggleFlag('${q._qId||''}',event)" title="Flag">${isFlagged?'🚩':'⚑'}</button>`+(q._qId?`<button class="del-btn" onclick="delQ('${q._qId}',event)" title="Delete this question">🗑</button>`:'');
    const noAns=q.a<0?'<div style="font-size:11px;color:var(--muted);margin-top:8px;font-style:italic">⚠️ Answer not available in source PDF</div>':'';
    const card=document.createElement('div');card.className='qcard';card.id='card-'+i;
    card.innerHTML=`<div class="qcard-header"><div class="qnum">${i+1}</div><div style="flex:1">${chBadge}<div class="qtext">${q.t}</div></div>${flagBtn}</div><div class="opts">${opts}</div>${noAns}<div class="exp" id="exp-${i}"></div>`;
    body.appendChild(card);
    if(userA[i]!==null){const so=document.getElementById(`opt-${i}-${userA[i]}`);if(so)so.classList.add('sel');}
    mcqIdx++;
  });
  updateProg();
}

function sel(qi,oi){if(submitted)return;if(userA[qi]!==null)document.getElementById(`opt-${qi}-${userA[qi]}`).classList.remove('sel');userA[qi]=oi;saveSession();document.getElementById(`opt-${qi}-${oi}`).classList.add('sel');updateProg();}

function updateProg(){
  const mcqs=currentQ.filter(q=>q.type==='mcq');const tot=mcqs.length;if(!tot)return;
  const ans=mcqs.reduce((s,q,i)=>{const qi=currentQ.indexOf(q);return s+(userA[qi]!==null?1:0);},0);
  const pct=Math.round(ans/tot*100);
  document.getElementById('prog-bar').style.width=pct+'%';
  document.getElementById('prog-text').textContent=`${ans} of ${tot} MCQ answered`;
  document.getElementById('live-score').textContent=`${ans}/${tot}`;
}

function clearAll(){if(submitted)return;userA=new Array(currentQ.length).fill(null);renderQuiz();}

function submitQuiz(){
  const mcqs=currentQ.map((q,i)=>({q,i})).filter(({q})=>q.type==='mcq');
  const una=mcqs.filter(({i})=>userA[i]===null).length;
  if(una>0&&!_forceSubmit){uiConfirm(`${una} unanswered question`+(una>1?'s':'')+`. Submit anyway?`,()=>{_forceSubmit=true;submitQuiz();_forceSubmit=false;},'Submit');return;}
  stopTimer();
  submitted=true;let correct=0,total=0;
  currentQ.forEach((q,i)=>{
    if(q.type!=='mcq')return;
    const ca=q.a,ua=userA[i];
    total++;
    if(ca>=0){if(ua===ca)correct++;recordResult(q._qId||null,ua===ca);}
    const card=document.getElementById('card-'+i);
    if(card){card.classList.add(ca>=0&&ua===ca?'correct':'wrong');}
    ['A','B','C'].forEach((_,j)=>{
      const opt=document.getElementById(`opt-${i}-${j}`);if(!opt)return;
      opt.style.cursor='default';
      if(ca>=0){if(j===ca&&ua!==ca)opt.classList.add('miss');if(j===ua&&ua!==ca)opt.classList.add('fail');if(j===ua&&ua===ca)opt.classList.add('ok');}
      else if(j===ua){opt.classList.add('miss');}
    });
    const exp=document.getElementById('exp-'+i);
    if(exp){
      const isOk=ca>=0&&ua===ca;
      const label=ca>=0?(['A','B','C','D'][ca]||'?'):'?';
      exp.innerHTML=`<span class="verdict ${isOk?'v-ok':'v-fail'}">${isOk?'✓ Correct':ca<0?'⚠️ No answer key':'✗ Wrong — Correct: '+label}</span>${q.x||''}`;
      exp.style.display='block';
    }
  });
  if(total===0){goHome();return;}
  const pct=Math.round(correct/total*100);
  document.getElementById('r-title').textContent=currentTitle;
  document.getElementById('s-correct').textContent=correct;
  document.getElementById('s-wrong').textContent=total-correct;
  document.getElementById('s-pct').textContent=pct+'%';
  const circle=document.getElementById('r-circle');
  const rLabel=document.getElementById('r-label');const rSub=document.getElementById('r-sub');
  if(pct>=90){circle.className='result-circle rc-pass';rLabel.textContent='Exam Ready ✓';rSub.textContent=`${correct}/${total} correct · Target 90%+ achieved`;}
  else if(pct>=70){circle.className='result-circle rc-mid';rLabel.textContent='Good — Review Needed';rSub.textContent=`${correct}/${total} correct · Study marked questions`;}
  else{circle.className='result-circle rc-fail';rLabel.textContent='Needs More Study';rSub.textContent=`${correct}/${total} correct · Focus on red questions`;}
  circle.textContent=pct+'%';
  recordSession(currentTitle,correct,total);
  clearSession();
  // Per-question review on the results screen (was previously only shown on the hidden quiz screen)
  const rq=document.getElementById('results-quiz');
  if(rq){
    rq.innerHTML='';
    currentQ.forEach((q,i)=>{
      if(q.type!=='mcq')return;
      const ca=q.a,ua=userA[i],isOk=ca>=0&&ua===ca;
      const chBadge=q._ch?`<span style="font-size:10px;color:var(--muted)">${q._ch}</span><br>`:'';
      let opts='';['A','B','C','D'].forEach((l,j)=>{
        if(j>=q.o.length)return;
        let cls='opt';
        if(ca>=0){
          if(j===ca&&ua!==ca)cls+=' miss';
          if(j===ua&&ua!==ca)cls+=' fail';
          if(j===ua&&ua===ca)cls+=' ok';
        }else if(j===ua){cls+=' miss';}
        opts+=`<div class="${cls}"><span class="opt-l">${l}</span><span class="opt-t">${q.o[j]}</span></div>`;
      });
      const label=ca>=0?(['A','B','C','D'][ca]||'?'):'?';
      const verdict=`<span class="verdict ${isOk?'v-ok':'v-fail'}">${isOk?'✓ Correct':ca<0?'⚠️ No answer key':'✗ Wrong — Correct: '+label}</span>${q.x||''}`;
      const card=document.createElement('div');
      card.className=`qcard ${isOk?'correct':'wrong'}`;
      card.dataset.qi=i;
      card.innerHTML=`<div class="qcard-header"><div class="qnum">${i+1}</div><div style="flex:1">${chBadge}<div class="qtext">${q.t}</div></div></div><div class="opts">${opts}</div><div class="exp" style="display:block">${verdict}</div>`;
      rq.appendChild(card);
    });
  }
  const oldWrongBtn=document.getElementById('wrong-only-btn');if(oldWrongBtn)oldWrongBtn.remove();
  const wrongBtn=document.createElement('button');
  wrongBtn.className='weak-btn';wrongBtn.id='wrong-only-btn';
  wrongBtn.textContent='👁 Wrong Only';
  let showAll=true;
  wrongBtn.onclick=()=>{
    showAll=!showAll;
    wrongBtn.textContent=showAll?'👁 Wrong Only':'👁 Show All';
    document.querySelectorAll('#results-quiz .qcard').forEach(card=>{
      const qi=+card.dataset.qi;const q=currentQ[qi];if(!q)return;
      const ua=userA[qi];const ca=q.a;
      card.style.display=(!showAll&&ua===ca)?'none':'';
    });
  };
  if(rq)rq.parentNode.insertBefore(wrongBtn,rq);
  show('results');
}

function retake(){startQuiz(currentQ,currentTitle);}

let _pendingChId=null;
function _pickSize(n){const id=_pendingChId;const m=document.getElementById('size-modal');if(m)m.remove();if(id)doStartCh(id,n);}
function doStartCh(chId,n){
  const ch=CHAPTERS.find(c=>c.id===chId);if(!ch)return;
  const mem=loadMem();
  let qs=ch.questions.map((q,i)=>({...q,_qId:ch.id+'_'+hashQ(q.t||''),_ch:ch.title})).filter(q=>q.type==='table'||!isDel(mem,q._qId));
  if(n===-1){
    const unseen=qs.filter(q=>q.type==='mcq'&&(!mem.qs[q._qId]||mem.qs[q._qId].a===0));
    if(!unseen.length){uiNotice('All questions attempted! Try a random drill instead.');return;}
    qs=[...unseen,...qs.filter(q=>q.type!=='mcq')];n=0;
  }
  if(n>0&&qs.filter(q=>q.type==='mcq').length>n){
    const mcq=qs.filter(q=>q.type==='mcq');
    const shuffled=[...mcq].sort(()=>Math.random()-0.5).slice(0,n);
    const nonMcq=qs.filter(q=>q.type!=='mcq');
    qs=[...shuffled,...nonMcq];
  }
  startQuiz(qs,ch.title+(n>0?' ('+n+' random)':''));
}

function buildHome(){
  const stats=getChStats();const statMap={};stats.forEach(s=>statMap[s.id]=s);
  const mem=loadMem();
  const cg=document.getElementById('chapter-grid');cg.innerHTML='';
  const banner=document.getElementById('resume-banner');
  try{
    const raw=localStorage.getItem(SESSION_KEY);
    if(raw){
      const s=JSON.parse(raw);
      const qCount=(s.q||[]).length;
      const answered=(s.a||[]).filter((a,i)=>a!==null).length;
      const elapsed=s.ts?Math.round((Date.now()-s.ts)/60000):null;
      const timeStr=elapsed===null?'':elapsed<60?elapsed+'m ago':Math.round(elapsed/60)+'h ago';
      document.getElementById('resume-banner-title').textContent=s.t||'Session';
      document.getElementById('resume-banner-meta').textContent=`${answered}/${qCount} answered · ${timeStr}`;
      banner.classList.add('visible');
    }else{banner.classList.remove('visible');}
  }catch(e){banner.classList.remove('visible');}
  // Global stats strip
  const totalQs=stats.reduce((s,c)=>s+c.qs,0);
  const totalAttempted=stats.reduce((s,c)=>s+c.attempted,0);
  const totalA=stats.reduce((s,c)=>s+c.a,0);
  const totalC=stats.reduce((s,c)=>s+c.c,0);
  const globalAcc=totalA>0?Math.round(totalC/totalA*100):null;
  const strip=document.createElement('div');strip.className='global-stats';
  strip.innerHTML=`<div class="global-stat"><div class="global-stat-val">${totalAttempted}/${totalQs}</div><div class="global-stat-lbl">Attempted</div></div><div class="global-stat"><div class="global-stat-val">${globalAcc!==null?globalAcc+'%':'—'}</div><div class="global-stat-lbl">Accuracy</div></div><div class="global-stat"><div class="global-stat-val">${CHAPTERS.length}</div><div class="global-stat-lbl">Chapters</div></div>`;
  cg.appendChild(strip);
  const now=Date.now();
  let lastSection='';
  CHAPTERS.forEach(ch=>{
    const sec=ch.section||'General Navigation';
    if(sec!==lastSection){
      lastSection=sec;
      const lbl=document.createElement('div');
      lbl.className='section-label';lbl.style.gridColumn='1/-1';
      lbl.textContent=sec;
      cg.appendChild(lbl);
    }
    const s=statMap[ch.id];
    const acc=s&&s.acc!==null?s.acc:null;
    const attempted=s?s.attempted:0;
    const mcqTotal=s?s.qs:ch.questions.filter(q=>q.type==='mcq').length;
    const attemptedPct=mcqTotal>0?Math.round(attempted/mcqTotal*100):0;
    const accColor=acc===null?'var(--muted)':acc>=80?'var(--green)':acc>=60?'var(--yellow)':'var(--red)';
    const isStale=s&&s.lastAt>0&&(now-s.lastAt>7*86400000);
    const staleDot=isStale?'<span class="stale-dot" title="Not practiced in 7+ days"></span>':'';
    const calcs=ch.questions.filter(q=>q.type==='calc'&&!isDel(mem,ch.id+'_'+hashQ(q.t||''))).length;
    const tbls=ch.questions.filter(q=>q.type==='table').length;
    const extraStr=(calcs||tbls)?` · ${[calcs?calcs+' calc':'',tbls?tbls+' tbl':''].filter(Boolean).join(' · ')}`:'';
    const statText=attempted>0?`<span style="color:var(--muted)">${attempted}/${mcqTotal}</span> · <span style="color:${accColor};font-weight:700">${acc!==null?acc+'%':'—'}</span>${extraStr}`:`<span style="color:var(--muted)">${mcqTotal} MCQ${extraStr}</span>`;
    const sub=ch.sub||'';
    const nonMcqCount=ch.questions.filter(q=>q.type==='table'||(q.type!=='mcq'&&!isDel(mem,ch.id+'_'+hashQ(q.t||'')))).length;
    const totalQ=mcqTotal+nonMcqCount;
    const unseenMcq=ch.questions.filter(q=>{
      if(q.type!=='mcq')return false;
      const r=mem.qs[ch.id+'_'+hashQ(q.t||'')];
      if(r&&r.del)return false;
      return !r||r.a===0;
    }).length;
    const unseenTotal=unseenMcq+nonMcqCount;
    const chipSizes=[{l:'All ('+totalQ+')',v:0,p:true},{l:'▶ '+unseenTotal+' unseen',v:-1,p:false},{l:'50',v:50,p:false},{l:'30',v:30,p:false},{l:'20',v:20,p:false},{l:'10',v:10,p:false}];
    const chipsHtml=chipSizes.map(cs=>`<button class="ch-chip${cs.p?' ch-chip-primary':''}" onclick="event.stopPropagation();doStartCh('${ch.id}',${cs.v})">${cs.l}</button>`).join('');
    const card=document.createElement('div');card.className='chapter-card';card.id='ch-card-'+ch.id;
    card.innerHTML=`<div style="display:flex;align-items:flex-start;gap:8px"><div class="card-icon">${ch.icon}</div><div style="flex:1"><div class="card-title">${ch.title}</div><div class="card-sub">${sub}</div></div>${staleDot}</div><div class="ch-prog-bar"><div class="ch-prog-fill" style="width:${attemptedPct}%;background:${accColor}"></div></div><div class="ch-stat-row"><span style="font-size:11px">${statText}</span></div><div class="ch-chips" id="chips-${ch.id}">${chipsHtml}</div>`;
    card.onclick=()=>{
      const chips=document.getElementById('chips-'+ch.id);
      const wasOpen=chips.classList.contains('open');
      document.querySelectorAll('.ch-chips.open').forEach(c=>c.classList.remove('open'));
      if(!wasOpen)chips.classList.add('open');
    };
    cg.appendChild(card);
  });
}
buildHome();
</script>
