re corrective action. Option b, is therefore the most accurate in this question.\n\n[Keith Williams · INS/IRS/FMS/EFIS 106]"}, {"type": "mcq", "t": "What is the function of the MCDUs in the B737-400 Flight Management System when carrying out preflight checks?", "o": ["Manually initialise the IRSs, FMC and Autothrottle with dispatch information", "Automatically initialise the IRSs and FMC with dispatch information", "Manually initialise the Flight Director System and FMC with dispatch information", "Manually initialise the IRSs and FMC with dispatch information"], "a": 3, "x": "In the Boeing 737-400 aircraft the MCDU is used for a number of functions including inserting data into the FMS and IRS. Prior to the start of a flight, the MCDU is used to initialize the IRSs such that the carry out their initial alignment processes. I n addition to this the MCDU is used to insert dispatch information such as destination, waypoints and cost index values, into the FMS. I t should be noted that the MCDU is not used to input data directly into the Flight Director nor Autothrottle because these systems get their information via the FMS. Option d, is therefore the most accurate in this question.\n\n[Keith Williams · INS/IRS/FMS/EFIS 107]"}, {"type": "mcq", "t": "The functions of the Boeing 737-400 FMS include?", "o": ["Automatic navigation & automatic performance management", "Manual navigation & manual performance management", "Manual navigation & automatic performance management", "Automatic navigation & manual performance management"], "a": 0, "x": "Tlie Boeing 737-400 Flight Management System (FMS) takes inputs from a wide range of sources including the IRS, Air Data Computers, MCDU, radio navlgatlon aids, Autopilot, Flight Director, and Autothrottle system. By combinirig the data from these sources it is able to provide a range of services, Tliese include automatic navigation and automatic performance management (option a), As an example of this letter function, the pilot can control the trade- off between fuel costs and flight duration, by inputting various cost index values into the FMS MCDU. LNS IRS FMS EFlS 109 b. Tlie first page used after powering up the system is IDENT, which allows the crew to confirm the detalls of the aircraft. This in turn causes the system to produce a series of prompts to guide the crew through the route procedures that need to be geherated for tlie flight. The second page is PO§ INIT, which enables the crew to confirm that the FMS clock and the aircraft clock are synchronised, This page is then used to align the IRS. The third page is RTE, which appears after the tasks on the POS INIT page have been completed. The RTE page is used to input details such as destination airport and route to be flown. Option b is therefore the most accurate in this question.\n\n[Keith Williams · INS/IRS/FMS/EFIS 108]"}, {"type": "mcq", "t": "From what source is the FMC aircraft position determined by radio navigation in the Boeing 737-400 aircraft derived?", "o": ["VOWDME", "DMEIDME", "DME IADF", "VOWVOR"], "a": 1, "x": "FMC positions can be updated using information form various radio navigation aids. The most accurate of those used in the Boeing 737-400 is DMEIDME (option b)\n\n[Keith Williams · INS/IRS/FMS/EFIS 110]"}, {"type": "mcq", "t": "For how long does the data in the FMS database remain valid?", "o": ["56 days", "One week", "28 days", "Variable"], "a": 2, "x": "Tlie FhllS database contains two sets of data each of which is valid for 28 days (option c). Prior to each flight the pilot is able to select which set of data will be used. Maintenance personnel update the database regularly to ensure that it remains valid for all flights. From the viewpoint of the pilot, the FMS database is read only and can never be updated.\n\n[Keith Williams · INS/IRS/FMS/EFIS 112]"}, {"type": "mcq", "t": "Weather radar Displays are available on the Boeing 737-400 EFIS EHSI, when the system is set to?", "o": ["MAP, PLAN, FULL VOWILS", "MAP, PLAN, EXP VORIILS", "MAP, EXP VORIILS, EXP NAV", "MAP, FULL VOWILS, FULL NAV"], "a": 2, "x": "In designing their systems, each manufacturer determines the range of functions that will be provided and the means by which these functions can be accessed. This inevitably means that different systems will provide different functions, which will be activated by different methods. In the case of the Boeing 737- 400 aircraft, the Weather Radar Display is available on the EFIS EHSI in the MAP, EXP VORIILS, and EXP NAV modes (option c).\n\n[Keith Williams · INS/IRS/FMS/EFIS 113]"}, {"type": "mcq", "t": "How does the FMS calculate groundspeed ?", "o": ["Input from IRS", "Input from ADC of TAS and wind velocity", "Input from DME with change of range integrated with respect to time", "Input of heading from either the IRS or gyro compass, TAS from ADC and wind velocity from selected meteorological data"], "a": 0, "x": "The term \"integration\" refers to a mathematical process whereby the outputs of the accelerometers in an IRS are converted into velocities and distances. An accelerometer produces an output signal that is proportional to acceleration in the direction of its alignment. The first integration of this signal produces another signal that is proportional to velocity relative to the ground. So to carry out ground speed calculations the FMS uses inputs from the IRS (option a).\n\n[Keith Williams · INS/IRS/FMS/EFIS 116]"}, {"type": "mcq", "t": "A Ring Laser Gyro?", "o": ["It is fixed to true north and is quick to erect", "I t doesn't suffer from 'lock in' and is unaffected by the earth's gravitational force", "I t is not necessarily fixed to true north but takes along time to erect", "It is not necessarily fixed to true north and is quick to erect"], "a": 3, "x": "Ring laser gyros, do not employ spinning rotors, but use variations in the length of travel of beams of light within a triailgular housing. Because there is no spinning mass to be accelerated to operating RPM, laser gyros can be erected more quickly than conventional gyros. Laser gyros are employed in Inertial Reference systems (IRS). Unlike an INS, an IRS does not use a gyro stabilised platform, but uses a platform mounted directly onto the aircraft structure. Although the platform pitches and rolls with the aircraft, the IRS computers coiltinuously calculate the true north, and vertical directions. The signals from the various gyros and accelerometers are then modified to take account of the actual alignment relative to true north and vertical. This means that the laser gyros do not need to be aligned with true north. So a ring laser gyro it is not necessarily fixed to true north and is quick to erect (option d).\n\n[Keith Williams · INS/IRS/FMS/EFIS 118]"}, {"type": "mcq", "t": "I11 a laser reference system (IRS), as compared to a gyro reference system (INS):", "o": ["The accelerometers are strapped down but the platform is gyro stabilised", "Accelerometers and platform are both strapped down", "The platform is strapped down but the accelerometers are gyro-stabilised", "Accelerometers and platform are both gyro-stabilised"], "a": 1, "x": "The principal difference between Inertial Navigation Systems (INS) and Inertial Reference systems (IRS) is that INS uses accelerometers mounted on gyro- stabilised platforms, whereas IRS platforms are not stabilised, but are fixed rigidly to the aircraft structure. So in the IRS system the gyros and accelerometers are both strapped down (option b).\n\n[Keith Williams · INS/IRS/FMS/EFIS 119]"}, {"type": "mcq", "t": "What will be the effect if the crew of an aircraft switch off the power to his IRS whilst in flight, before switching it back on a few seconds later?", "o": ["I t cannot be used for navigation, but can be used to provide attitude information", "I t must be re-aligned whilst in flight", "The system will operate normally", "I t cannot be used and must be shut down or the gyros will topple"], "a": 0, "x": "The principal of operation of an IRS is that the platform is mathematically aligned to a known position and orientation prior to flight, then continuously recalculates its position and orientation by sensing all accelerations experienced by the aircraft during the subsequent flight. These accelerations are integrated oilce to give velocities and again to give distance moved. The ability of an IRS to provide accurate navigation information a t any point during a flight is therefore dependent upon its having sensed all accelerations throughout all of the previous stages of the flight. Whenever an IRS is switched off its memory retains details of the situation a t the time of shutdown, but it is unable to detect accelerations that occur throughout the period during which it is left shut down. If the IRS is then switched on again, all subsequent navigation calculations will be based upon the position a t the instant at which the shutdown occurred. Such calculations will therefore be inaccurate. A further problem is that the platform will move out of alignment as the aircraft pitches rolls and yaws during the period of shutdown. Under normal circumstances after shut down on the ground, the platform would re-align itself prior the start of the next flight. But during the period of this alignment process the aircraft must not be moved. So if an IRS is switched off in the air it ...\n\n[Keith Williams · INS/IRS/FMS/EFIS 121]"}, {"type": "mcq", "t": "If an INSIIRS, an azimuth gyro is found to be drifting in flight, and if t is the time since selecting the system from ALIGN to NAV, the azimuth gyro heading error will be?", "o": ["Proportional to the square root oft", "Proportional to tl2", "Sinusoidal", "Proportional to t"], "a": 3, "x": "The drifting of an azimuth gyro may be caused by a number of factors. The first of these is Earth Rate wander. This is caused by the rotation of the Earth. The drift caused by Earth Rate (in degrees per hour) is equal to 15 times the sine of the latitude. The second possible cause is Transport Wander. This is caused by the movement of the aircraft across the surface of the earth. This (in degrees per hour) is equal to the 1/60 of the ground speed multiplied by the tangent of the latitude. The third possible cause is due to mechanical imperfections in the gyros. All three of these causes of drift are directly proportional to the elapsed time since the system was switched from ALIGN to NAV (option d).\n\n[Keith Williams · INS/IRS/FMS/EFIS 134]"}, {"type": "mcq", "t": "On the IRS, selection of ATT mode gives attitude?", "o": ["Altitude, and heading", "Only", "Heading, and groundspeed", "And heading"], "a": 3, "x": "The ATT selection is normally used following a computer/processing failure. With ATT selected all of the navigation computations are disabled but the system is still able to provide pitch, roll and heading information. Option d is therefore the most accurate in this question.\n\n[Keith Williams · INS/IRS/FMS/EFIS 135]"}, {"type": "mcq", "t": "How much time is required to align an Inertial Reference System?", "o": ["1 minute", "5 minutes", "10 minutes", "15 minutes"], "a": 2, "x": "Because they do not use mechanical gyros with spinning masses and do not physically level the platform, an IRS is able to complete the alignment process much more quickly than an INS. A modern IRS can complete alignment within 10 minutes (option c).\n\n[Keith Williams · INS/IRS/FMS/EFIS 136]"}, {"type": "mcq", "t": "What principle is utilized by employing a piezo-electric motor to overcome laser lock in an IRS system?", "o": ["Shake", "Shudder", "Dither", "Vibrate"], "a": 2, "x": "The ring laser gyro senses rates of rotation by measuring the difference between the resonant frequencies of two laser beams. The two beams travel in opposite directions around the triangle and are captured by a collecting mirror and detector unit. The detector unit then compares the resonant frequencies of the two beams to measure the difference between the two. These resonant frequencies are proportional to the length of the resonant structure through which they have passed. If the gyro is stationary the path taken by the two beams and hence the resonant frequencies are identical. If however the aircraft yaws, the gyro will rotate with it. This means that the path of the beam travelling in the same direction as the gyro becomes slightly longer, whilst that of the lother beam becomes slightly shorter. This difference in path length will cause a difference in resonant frequency that is proportional to the rate and direction of rotation. But when the gyro is rotating scatter from the mirrored surfaces sometimes causes the beams to lock together making the detection of small yaw rates impossible. To prevent this laser lock, a piezo- electric dither motor vibrates the gyro a t a resonant frequency, thereby causing the beams to unlock (option c). A simple ring laser gyro is illustrated below. 7 DITHER MOTOR VIBRATES GYRO TO PREVENT LASER LOCK 5 PRISM REFLECTS LASER LIGHT ONTO 6 ...\n\n[Keith Williams · INS/IRS/FMS/EFIS 137]"}, {"type": "mcq", "t": "In order to keep the platform of an inertial navigation system (INS) at right angles to the local vertical in flight, corrections must be applied to compensate for?", "o": ["Aircraft manoeuvres, earth rotation, transport wander and coriolis", "Vertical velocities, earth precession, centrifugal forces and transport drift", "Movement in the yawing plane, secondary precession and pendulous oscillation", "Gyroscopic inertia, earth rotation and real drift"], "a": 0, "x": "In order to ensure that the accelerometers in an INS sense only accelerations in their required directions, it is essential that the platform remains level throughout all phases of flight. I n order to achieve this, it is necessary to apply corrects to counter the effects of a number of factors. The first of these is the pitching, rolling and yawing of the aircraft as it manoeuvres in flight. The second and third factors are Earth Rate Wander, caused by the rotation of the Earth and Transport Wanders caused by the movement of the aircraft above the surface of the earth. The fourth factor is coriolis effect, which is caused by the fact that the aircraft takes a curved path around the world. O$tion a, is therefore the most accurate in this question. ! The term \"integration\" refers to a mathematical process whereby the outputs of the accelerometers in an IRS or INS are converted into velocitiks and distances. An accelerometer produces an output signal that is proportional to acceleration in the direction of its alignment. The first integration of this s i p a l produces another signal that is proportional to velocity. The second inteeration gives a signal that is proportional to distance moved. So the ground sqeed is calculated by integrating measured accelerations (option c).\n\n[Keith Williams · INS/IRS/FMS/EFIS 139]"}, {"type": "mcq", "t": "After an IRS has lost its position mid-flight it must?", "o": ["Not be used in NAV mode", "Be turned OFF", "Have a new position inserted", "Be selected to ALIGN and then to NAV"], "a": 0, "x": "The principal of operation of an IRS is that the platform is mathematically aligned to a known position and orientation prior to flight, then continuously recalculates its position and orientation by sensing all accelerations experienced by the aircraft during the subsequent flight. These accelerations are integrated once to give velocities and again to give distance moved. The ability of an IRS to provide accurate navigation information at any point during a flight is therefore dependent upon its having sensed all accelerations throughout all of the previous stages of the flight. Whenever an IRS is switched off its memory retains details of the situation at the time of shutdown, but it is unable to detect accelerations that occur throughout the period during which it is left shut down. The system will therefore lose its position as the flight progresses. If the IRS is then switched on. again, all subsequent navigation calculations will be based upon the position at the instant at which the shutdown occurred. Such calculations will therefore be inaccurate. So if an IRS loses its position in flight it cannot be used in the NAV mode for the remainder of the flight (option a).\n\n[Keith Williams · INS/IRS/FMS/EFIS 142]"}, {"type": "mcq", "t": "What is the latest time a t which the INSIIRS may be selected to NAV mode?", "o": ["After passengers and freight are aboard", "Immediately prior to push back or taxi from the gate", "On operation of the TOGA switch when opening the throttles for the take-off", "At the holding point"], "a": 1, "x": "Prior to the commencement of each flight the INSIIRS systems must be aligned. This must be carried out with the aircraft stationary on the ground a t the gate (or ramp). During the alignment process the pilot inputs the geographical coordinates of the gate. The system then uses these coordinates as the starting point for all subsequent calculations. The system is then set to NAV, which causes it to continuously calculate accelerations, velocities and distances moved from the ramp. I n order for these calculations to be accurate the system must be set to NAV immediately prior to push back from the gate (option d). Selecting NAV a t any later time will inevitably reduce the accuracy of the system, by an amount equal to the distance from the gate a t the time that NAV is actually selected.\n\n[Keith Williams · INS/IRS/FMS/EFIS 145]"}, {"type": "mcq", "t": "What can be used to enter positions on all INS systems?", "o": ["Waypoint names", "Hexadecimals", "Geographic coordinates", "Ranges and bearings"], "a": 2, "x": "Although INS systems designed by different manufacturers will inevitably differ in some respects, certain aspects are common to all systems. For example, positions are entered into all INS systems in the form of geographical coordinates (option c).\n\n[Keith Williams · INS/IRS/FMS/EFIS 146]"}, {"type": "mcq", "t": "Which of the following lists all of the methods that can be used to enter 'Created Waypoints' into the CDU of a B737-400 Electronic Flight Instrument System?", "o": ["Identifier name and range; location name; Height above MSL; latitude and longitude", "Identifier grid reference, location name, Height above MSL, latitude and Rhumb line position", "Identifier range, location name; Height above MSL; latitude and longitude", "Identifier bearingldistance; place bearinglplace bearing; along-track displacement; latitude and longitude"], "a": 3, "x": "Each manufacturer of electronic equipment provides the range of facilities considered to be most appropriate a t the time that the equipment is being designed. The methods available for the input of created waypoints in, depends upon the type of system being used. In the case of the B737-400 EFIS, these are methods are identifier bearingldistance; place bearinglplace bearing; along-track displacement; latitude and longitude, (option d).\n\n[Keith Williams · INS/IRS/FMS/EFIS 149]"}]}, {"id": "ch13", "icon": "📝", "color": "#8b6914", "sub": "Oxford mid-course test", "title": "Mid Course Test", "questions": [{"type": "mcq", "t": "What is the shortest distance in kilometres between San Francisco (38N 123W) and Dubai (25N 057E)?", "o": ["7020", "8073", "13001", "11250"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q1]"}, {"type": "mcq", "t": "A great circle has a northern vertex of 50N 100W. the southern vertex is:", "o": ["40S 100W", "40S 080E", "50S 100W", "50S 080E"], "a": 3, "x": "[Oxford ATPL · Oxford Ch20 Q2]"}, {"type": "mcq", "t": "An ICAO nautical mile is defined as:", "o": ["6080 feet", "1852 metres", "1863 feet", "6062 feet"], "a": 1, "x": "[Oxford ATPL · Oxford Ch20 Q3]"}, {"type": "mcq", "t": "How much is the polar diameter of the Earth different from the equatorial diameter?", "o": ["less by 40 km", "greater by 27 statute miles", "less by 27 statute miles", "greater by 27 nautical miles"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q4]"}, {"type": "mcq", "t": "The maximum difference between geodetic and geocentric latitude occurs at about?", "o": ["45° North and South", "90° North and South", "60° North and South", "0° (Equator)"], "a": 0, "x": "[Oxford ATPL · Oxford Ch20 Q5]"}, {"type": "mcq", "t": "Required course 045°(T), W/V = 190°(T)/30, FL=55@ISA, Variation = 15°E. CAS = 120 knots. What is magnetic heading and G/S?", "o": ["052°(M) 154", "067°(M) 154", "037°(M) 154", "037°(M) 113"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q6]"}, {"type": "mcq", "t": "What is the shortest distance in kilometres between Cairo (30°17’N 030°10’E) and Durban(29°48’S 030°10’E)?", "o": ["3605", "4146", "4209", "6676"], "a": 3, "x": "[Oxford ATPL · Oxford Ch20 Q7]"}, {"type": "mcq", "t": "An aircraft at latitude 02°20’N tracks 180°(T) for 685 km. What is its latitude at the end of the flight?", "o": ["03°50’S", "02°50’S", "02°10’S", "08°55’S"], "a": 0, "x": "[Oxford ATPL · Oxford Ch20 Q8]"}, {"type": "mcq", "t": "An aircraft is at latitude 10N and is flying south at 444 km/hour. After 3 hours the latitude is:", "o": ["10S", "02N", "02S", "0N/S"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q9]"}, {"type": "mcq", "t": "SAT = +35°C. Pressure alt (corrected for barometric error) = 5000 feet. What is true alt?", "o": ["4550 feet", "5550 feet", "4920 feet", "5320 feet"], "a": 1, "x": "[Oxford ATPL · Oxford Ch20 Q11]"}, {"type": "mcq", "t": "Given that the value of ellipticity of the Earth is 1/297 and that the semi-major axis of the Earth, measured at the axis of the Equator is 6378.4 km, what is the semi- major axis of the Earth measured at the axis of the Poles?", "o": ["6399.9 km", "6356.9 km", "6378.4 km", "6367.0 km"], "a": 1, "x": "[Oxford ATPL · Oxford Ch20 Q12]"}, {"type": "mcq", "t": "You plan to fly a track (course) of 348°(T), Drift is 17°port, Variation is 32°W. Deviation is 4°E. What compass heading should you fly?", "o": ["041°", "033°", "016°", "359°"], "a": 1, "x": "[Oxford ATPL · Oxford Ch20 Q13]"}, {"type": "mcq", "t": "One purpose of a compass calibration is to reduce the difference, if any, between:", "o": ["Compass North and True North", "Compass North and Magnetic North", "True North and Magnetic North", "Compass North and the lubber line"], "a": 1, "x": "[Oxford ATPL · Oxford Ch20 Q17]"}, {"type": "mcq", "t": "Given: True Track = 352°(T) Variation = 11°W Deviation = - 5° Drift = 10°R What is heading °(C)?", "o": ["078°(C)", "346°(C)", "358°(C)", "025°(C)"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q18]"}, {"type": "mcq", "t": "Pressure altitude is 27 000 feet, OAT = -35°C, Mach No. = 0.45, W/V = 270/85, Track = 200°(T). What is drift and ground speed?", "o": ["18L / 252 knots", "15R / 310 knots", "17L / 228 knots", "17R / 287 knots"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q19]"}, {"type": "mcq", "t": "You plan to take off from Khamis Mushayt, Saudi Arabia, elevation 6500 ft. The ambient temperature is +25°C. What is your density altitude?", "o": ["3500 ft", "6500 ft", "9500 ft", "12 500 ft"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q20]"}, {"type": "mcq", "t": "You are flying at 400 kt TAS, Indicated temperature -50°C. What is your COAT?", "o": ["-67°C", "-50°C", "-33°C", "-17°C"], "a": 0, "x": "[Oxford ATPL · Oxford Ch20 Q21]"}, {"type": "mcq", "t": "You are flying at FL330 at Mach No. 0.9. Ambient temperature is ISA +15. What is your TAS?", "o": ["600 knots", "595 knots", "540 knots", "505 knots"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q22]"}, {"type": "mcq", "t": "You plan to land on R/W 14. The met forecast wind velocity is 110/30. Variation is 30°W. What crosswind do you expect?", "o": ["15 kt", "0 kt", "26 kt", "30 kt"], "a": 1, "x": "[Oxford ATPL · Oxford Ch20 Q23]"}, {"type": "mcq", "t": "Given: IAS 120 knots, FL80, OAT +20°C. What is the TAS?", "o": ["132 kt", "141 kt", "102 kt", "120 kt"], "a": 1, "x": "[Oxford ATPL · Oxford Ch20 Q24]"}, {"type": "mcq", "t": "Given: TAS 200 kt, Track 110°(T), W/V 015/40, calculate heading (°T) and ground speed.", "o": ["097° - 201 kt", "099° - 200 kt", "121° - 207 kt", "121° - 199 kt"], "a": 1, "x": "[Oxford ATPL · Oxford Ch20 Q25]"}, {"type": "mcq", "t": "Given: True Hdg 145°, TAS 240 kt, True Track 150°, G/S 210 kt, calculate the W/V.", "o": ["360/35", "295/35", "180/35", "115/35"], "a": 3, "x": "[Oxford ATPL · Oxford Ch20 Q26]"}, {"type": "mcq", "t": "Given: TAS 140 kt, heading 005°(T), W/V 265/25, calculate the drift and ground speed.", "o": ["11R - 140 kt", "10R - 146 kt", "9R - 140 kt", "11R - 142 kt"], "a": 1, "x": "[Oxford ATPL · Oxford Ch20 Q27]"}, {"type": "mcq", "t": "An aircraft is maintaining a 5.2% gradient on a flat terrain. Its height at 7 NM from the runway is approximately:", "o": ["3640 feet", "1890 feet", "2210 feet", "680 feet"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q28]"}, {"type": "mcq", "t": "G/S = 240 knots, distance to go = 500 NM. What is time to go?", "o": ["20 minutes", "29 minutes", "2h 05 m", "2h 12 m"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q29]"}, {"type": "mcq", "t": "Course 040°(T), TAS 120 kt, wind speed = 30 knots. From which direction will the wind give the greatest drift?", "o": ["215°(T)", "230°(T)", "235°(T)", "240°(T)"], "a": 3, "x": "[Oxford ATPL · Oxford Ch20 Q30]"}, {"type": "mcq", "t": "X Y Z 30 NM 20 NM ATA X is 1420. ETA Y is 1447. ATA Y is 1450. What is new ETA Z?", "o": ["1506", "1512", "1510", "1515"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q31]"}, {"type": "mcq", "t": "Heading is 156°(T), TAS is 320 knots, W/V 130/45. What is your true track?", "o": ["160", "152", "104", "222"], "a": 0, "x": "[Oxford ATPL · Oxford Ch20 Q32]"}, {"type": "mcq", "t": "You are flying at a True Mach No. of .72 in a SAT of -45°C. At 1000 hours you are 100 NM from the CPT DME and your ETA at CPT is 1012. ATC ask you to slow down to be at CPT at 1016. What should your new Mach No be if you reduce speed at 100 NM to go?", "o": [".67", ".63", ".54", ".51"], "a": 3, "x": "[Oxford ATPL · Oxford Ch20 Q33]"}, {"type": "mcq", "t": "Track = 090°(T), TAS = 460 knots, W/V = 360°(T) / 100, Variation = 10°E, Deviation = -2. What is compass heading and ground speed?", "o": ["079° - 470 kt", "069° - 450 kt", "068° - 460 kt", "070° - 455 kt"], "a": 1, "x": "[Oxford ATPL · Oxford Ch20 Q34]"}, {"type": "mcq", "t": "You leave A to fly to B, 475 NM away, at 1000 hours. Your ETA at B is 1130. At 1040, you are 190 NM from A. What ground speed is required to arrive on time at B?", "o": ["317 knots", "330 knots", "342 knots", "360 knots"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q35]"}, {"type": "mcq", "t": "The wind velocity is 359/25. An aircraft is heading 180°(T)at a TAS of 198 knots. (All directions are True). What is its track and ground speed?", "o": ["180° - 223 kt", "179° - 220 kt", "180° - 220 kt", "179° - 223 kt"], "a": 0, "x": "[Oxford ATPL · Oxford Ch20 Q36]"}, {"type": "mcq", "t": "An aircraft is climbing at a constant CAS in ISA conditions. What will be the effect on TAS and Mach No.?", "o": ["TAS increases and Mach No. decreases", "Both increase", "Both decrease", "TAS decreases and Mach No. increases"], "a": 1, "x": "[Oxford ATPL · Oxford Ch20 Q37]"}, {"type": "mcq", "t": "Convert 70 metres/sec into knots.", "o": ["136 knots", "36 knots", "146 knots", "54 knots"], "a": 0, "x": "[Oxford ATPL · Oxford Ch20 Q38]"}, {"type": "mcq", "t": "Airfield elevation is 1000 feet. The QNH is 988. Use 27 feet per hectopascal. What is pressure altitude?", "o": ["675 feet", "325 feet", "1675 feet", "825 feet"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q39]"}, {"type": "mcq", "t": "You are flying from A to B, planned track 245°(M), distance 225 NM. Your ground speed is 180 knots. After 15 minutes flying, you fix your position as 3 NM left of planned track. Which of the following statements is correct?", "o": ["Your drift is 2P", "Your drift is 4P", "You should turn 5 right to go direct to B", "You should turn 8 right to go direct to B"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q40]"}, {"type": "mcq", "t": "A pilot receives the following signals from a VOR DME station. Radial = 180° +/- 1°, distance = 200 NM What is the approximate maximum error?", "o": ["+/- 2 NM", "+/- 3.5 NM", "+/- 7 NM", "+/- 1 NM"], "a": 1, "x": "[Oxford ATPL · Oxford Ch20 Q41]"}, {"type": "mcq", "t": "An aircraft has planned to fly from A to B a total distance of 135 NM. After flying 45 NM the aircraft is 3 NM left of the planned track. Using the 1 in 60 Rule, what would be the alteration of heading to flying directly to B?", "o": ["6˚ right", "4˚ right", "8˚ right", "4˚ left"], "a": 0, "x": "[Oxford ATPL · Oxford Ch20 Q42]"}, {"type": "mcq", "t": "By what amount must you change your rate of descent given a 10 knot increase in headwind on a 3° glide slope?", "o": ["50 feet per minute increase", "30 feet per minute increase", "50 feet per minute decrease", "30 feet per minute decrease"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q43]"}, {"type": "mcq", "t": "You are on an ILS 3-degree glide slope which passes over the runway threshold at 50 feet. Your DME range is 25 NM from the threshold. What is your height above the runway threshold elevation? (Use the 1 in 60 rule and 6000 feet = 1 nautical mile).", "o": ["8010 feet", "7450 feet", "6450 feet", "7550 feet"], "a": 3, "x": "[Oxford ATPL · Oxford Ch20 Q44]"}, {"type": "mcq", "t": "An aircraft flies directly from 56N 020W to 56N 030W. The initial Great Circle track from 020W is:", "o": ["086°(T)", "082°(T)", "274°(T)", "278°(T)"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q45]"}, {"type": "mcq", "t": "An aircraft starts at position 0410S 17822W and tracks true north for 2950 NM, then turns 90 degrees left, and maintains a rhumb line track for 314 kilometres. What is the final position?", "o": ["5500N 17422W", "4500N 17422W", "5500N 17738E", "4500N 17738E"], "a": 3, "x": "[Oxford ATPL · Oxford Ch20 Q46]"}, {"type": "mcq", "t": "On a chart, 49 nautical miles is represented by 7.0 centimetres. What is the scale?", "o": ["1 / 700 000", "1 / 2 015 396", "1 / 1 296 400", "1 / 1 156 600"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q47]"}, {"type": "mcq", "t": "Which of the following differences in latitude will give the biggest difference in the initial great circle track and the mean great circle track between 2 points separated by 10° change of longitude?", "o": ["60N and 60S", "60N and 55N", "30S and 30N", "30S and 25S"], "a": 1, "x": "[Oxford ATPL · Oxford Ch20 Q49]"}, {"type": "mcq", "t": "On a chart, meridians at 43N are shown every 10 degrees apart. This is shown on the chart by a distance of 14 cm. What is the approximate scale?", "o": ["1 / 2 00 000", "1 / 4 000 000", "1 / 5 000 000", "1 / 6 000 000"], "a": 3, "x": "[Oxford ATPL · Oxford Ch20 Q50]"}, {"type": "mcq", "t": "A non-perspective chart:", "o": ["is produced directly from a light projection of a Reduced Earth", "cannot be used for navigation", "is produced by mathematically adjusting a light projection of the Reduced Earth", "is used for a polar stereographic projection"], "a": 2, "x": "[Oxford ATPL · Oxford Ch20 Q51]"}, {"type": "mcq", "t": "On a Mercator chart, a rhumb line appears as a:", "o": ["small circle concave to the nearer pole", "curve convex to the nearer pole", "complex curve", "straight line"], "a": 3, "x": "[Oxford ATPL · Oxford Ch20 Q52]"}, {"type": "mcq", "t": "Mercator charts use ................... projections.", "o": ["cylindrical", "conical", "plane/azimuthal", "complex"], "a": 0, "x": "[Oxford ATPL · Oxford Ch20 Q53]"}, {"type": "mcq", "t": "How does scale change on a normal Mercator chart?", "o": ["expands as the secant2 (½ co-latitude)", "expands directly with the secant of the latitude", "correct on the standard parallels, expands outside them, contracts within them", "expands as the secant of the E/W great circle distance"], "a": 1, "x": "[Oxford ATPL · Oxford Ch20 Q54]"}]}, {"id": "ch14", "icon": "🎯", "color": "#2d6a30", "sub": "Oxford full revision set", "title": "Revision Questions", "questions": [{"type": "mcq", "t": "Pressure Altitude is 28 000 feet, OAT = -45°C, Mach No = 0.46, W/V = 270/85, Track = 200°T. What is the drift and groundspeed?", "o": ["18L / 252 knots", "15R / 310 knots", "17L / 228 knots", "17R / 287 knots"], "a": 2, "x": "A common mistake here is to set the W/V, then put 200 up at the 12 o’clock\n\n[Oxford ATPL · Oxford Ch32 Q1]"}, {"type": "mcq", "t": "G/S = 240 knots, Distance go = 530 NM. What is time to go?", "o": ["27 minutes", "29 minutes", "2 h 05 m", "2 h 12 m"], "a": 3, "x": "[Oxford ATPL · Oxford Ch32 Q2]"}, {"type": "mcq", "t": "‘ISA Dev = +30°C, Pressure alt = 5000 feet. What is true alt?", "o": ["4550 feet", "5600 feet", "4290 feet", "5320 feet"], "a": 1, "x": "We recommend that you use the CRP-5 for true altitude problems, especially if\n\n[Oxford ATPL · Oxford Ch32 Q3]"}, {"type": "mcq", "t": "Required course 045°(T), W/V = 190 /30, FL = 55 @ ISA, Variation = 15°W. CAS = 120 knots. What is mag heading and G/S?", "o": ["052°(M) 154", "067°(M) 154", "037°(M) 154", "037°(M) 113"], "a": 1, "x": "[Oxford ATPL · Oxford Ch32 Q5]"}, {"type": "mcq", "t": "An aircraft flies a great circle track from 56°N 070°W to 62°N 110°E. The total distance travelled is:", "o": ["3720 NM", "5420 NM", "1788 NM", "2040 NM"], "a": 0, "x": "You should note that these longitudes are meridian and anti-meridian. This is\n\n[Oxford ATPL · Oxford Ch32 Q6]"}, {"type": "mcq", "t": "An aircraft at position 60°N 005°W tracks 090°(T) for 315 km. On completion of the flight the longitude will be:", "o": ["010°40’W", "000°15’E", "000°40’E", "002°10’W"], "a": 2, "x": "This is a departure question. A very similar example is given in Chapter 15\n\n[Oxford ATPL · Oxford Ch32 Q10]"}, {"type": "mcq", "t": "What is the definition of magnetic variation?", "o": ["The angle between the direction indicated by a compass and Magnetic North", "The angle between True North and Compass North", "The angle between Magnetic North and True North", "The angle between Magnetic Heading and Magnetic North"], "a": 2, "x": "[Oxford ATPL · Oxford Ch32 Q11]"}, {"type": "mcq", "t": "Grivation is the combination of", "o": ["Variation and Deviation", "Deviation and the Agonic value", "Variation and Grid Convergence", "Grid Convergence and Deviation"], "a": 2, "x": "[Oxford ATPL · Oxford Ch32 Q16]"}, {"type": "mcq", "t": "A useful method of a pilot resolving, on a visual flight, any uncertainty in the aircraft’s position is to maintain visual contact with the ground and:", "o": ["set heading towards a line feature such as a coastline, river or motorway", "fly the reverse of the heading being flown prior to becoming uncertain until a pinpoint is obtained", "fly expanding circles until a pinpoint is obtained", "fly reverse headings and associated timings until the point of departure is reached"], "a": 0, "x": "[Oxford ATPL · Oxford Ch32 Q21]"}, {"type": "mcq", "t": "An aircraft is at FL140 with an IAS of 210 and a true OAT of -5°(C). The wind component is -35 knots. When the aircraft is at 150 NM from a reporting point, ATC request the crew to lose 5 minutes by the time they get to the beacon. How much do they need to reduce IAS?", "o": ["15 knots", "25 knots", "30 knots", "20 knots"], "a": 3, "x": "Find the present TAS, apply the wind and get the present G/S (230 knots)\n\n[Oxford ATPL · Oxford Ch32 Q22]"}, {"type": "mcq", "t": "Given: Airport elevation is 1000 feet. QNH is 988 hPa What is the approximate airport pressure altitude?", "o": ["320", "1680", "-320", "680"], "a": 1, "x": "The QNH is 988 hPa. The datum for Pressure Altitude is 1013 hPa, which is 25\n\n[Oxford ATPL · Oxford Ch32 Q24]"}, {"type": "mcq", "t": "An aircraft starts at position 0410S 17822W and heads true north for 2950 NM, then turns 90 degrees right, and maintains a rhumb line track for 314 kilometres. What is its final position?", "o": ["5500N 17422W", "4500N 17422W", "5500N 17738E", "4500N 17738E"], "a": 1, "x": "The aircraft flies 2950 NM N, which takes it to 4500N 17822W. Now convert\n\n[Oxford ATPL · Oxford Ch32 Q25]"}, {"type": "mcq", "t": "You are heading 080°(T) when you get a range and bearing fix from your AWR on a headland at 185 NM 30° left of the nose. What true bearing do you plot on the chart?", "o": ["050 from the headland, using the headland’s meridian", "050 from the headland, using the aircraft’s meridian", "230 from the headland, using the headland’s meridian", "230 from the headland, using the aircraft’s meridian"], "a": 3, "x": "The true bearing from you TO the headland is 050°(T). However, you are going\n\n[Oxford ATPL · Oxford Ch32 Q26]"}, {"type": "mcq", "t": "By what amount must you change your rate of descent given a 10 knot decrease in headwind on a 3° glide slope?", "o": ["50 feet per minute increase", "30 feet per minute increase", "50 feet per minute decrease", "30 feet per minute decrease"], "a": 0, "x": "[Oxford ATPL · Oxford Ch32 Q27]"}, {"type": "mcq", "t": "5 hours 20 minutes and 20 seconds time difference is equivalent to which change of longitude?", "o": ["81°30’", "78°15’", "79°10’", "80°05’"], "a": 3, "x": "Multiply by 15° per hour. The easiest way of dealing with minutes and seconds\n\n[Oxford ATPL · Oxford Ch32 Q31]"}, {"type": "mcq", "t": "The main reason that day and night, throughout the year, have different durations is due to the:", "o": ["Earth’s rotation", "relative speed of the Sun along the ecliptic", "inclination of the ecliptic to the Equator", "gravitational effect of the Sun and the Moon on the speed of rotation of the Earth"], "a": 2, "x": "The combination of the inclination of the ecliptic to the Equator and the orbit\n\n[Oxford ATPL · Oxford Ch32 Q32]"}, {"type": "mcq", "t": "A Lambert’s Conical conformal chart has standard parallels at 63N and 41N. What is the convergence factor?", "o": [".891", ".788", ".656", ".707"], "a": 1, "x": "On a Lambert chart, the Parallel of Origin is midway between the 2 Standard\n\n[Oxford ATPL · Oxford Ch32 Q33]"}, {"type": "mcq", "t": "On a chart, 90.74 km is represented by 7.0 centimetres. What is the scale?", "o": ["1 / 700 000", "1 / 2 015 396", "1 / 1 296 400", "1 / 1 156 600"], "a": 2, "x": "See Example 1 in Chapter 16, which is the same type of question.\n\n[Oxford ATPL · Oxford Ch32 Q34]"}, {"type": "mcq", "t": "On a direct Mercator chart, great circles are shown as:", "o": ["Curves convex to the nearer pole", "Straight lines", "Rhumb lines", "Curves concave to the nearer pole"], "a": 0, "x": "[Oxford ATPL · Oxford Ch32 Q35]"}, {"type": "mcq", "t": "Heading is 156°(T), TAS is 320 knots, W/V is 130/45 and the Variation is 10°W. What is your magnetic track?", "o": ["170", "150", "160", "222"], "a": 0, "x": "[Oxford ATPL · Oxford Ch32 Q39]"}, {"type": "mcq", "t": "You are heading 345°(M), the variation is 20°E, and you take a radar bearing of 30° left of the nose from an island. What bearing do you plot from the island?", "o": ["160°(T)", "155°(T)", "140°(T)", "180°(T)"], "a": 1, "x": "Apply 20°E variation to 345°(M) to get 005°(T). 30° left of this is a true bearing\n\n[Oxford ATPL · Oxford Ch32 Q40]"}, {"type": "mcq", "t": "Your pressure altitude is FL55, the QNH is 998, and the SAT is +30°(C). What is density altitude?", "o": ["6980 feet", "7750 feet", "8620 feet", "10 020 feet"], "a": 2, "x": "As per the reply to Q3.\n\n[Oxford ATPL · Oxford Ch32 Q41]"}, {"type": "mcq", "t": "On a particular take-off, you can accept up to 10 knots tailwind. The runway QDM is 047, the variation is 17°E and the ATIS gives the wind direction as 210. What is the maximum wind strength you can accept?", "o": ["18 knots", "4 knots", "8 knots", "11 knots"], "a": 3, "x": "[Oxford ATPL · Oxford Ch32 Q42]"}, {"type": "mcq", "t": "On a 5% glide slope your groundspeed is 150 kt. What should be your rate of descent to maintain the glide slope?", "o": ["750 feet/min", "450 feet/min", "900 feet/min", "650 feet/min"], "a": 0, "x": "A 5% glide slope means that for every 100 knots you go forward horizontally,\n\n[Oxford ATPL · ormal way, then apply variation and deviation.\n\n[Oxford ATPL · Oxford Ch32 Q66]"}, {"type": "mcq", "t": "An aircraft is at 10°N and is flying North at 444 km/hour. After 3 hours the latitude is:", "o": ["10°S", "02°S", "22°N", "00°N/S"], "a": 2, "x": "3 × 444 is 1332 km. Divide by 1.852 to get 719.2 NM. This has obviously been\n\n[Oxford ATPL · Oxford Ch32 Q69]"}, {"type": "mcq", "t": "Given that: A is N55° E/W 000° B is N54° E 010°, If the average true course of the great circle is 100°(T), the true course of the rhumb line at point A is:", "o": ["096°", "107°", "104°", "100°"], "a": 3, "x": "The average great circle track is the rhumb line track.\n\n[Oxford ATPL · Oxford Ch32 Q70]"}, {"type": "mcq", "t": "The angle between the plane of the Equator and the plane of the Ecliptic is:", "o": ["66.5°", "23.5°", "25.3°", "65.6°"], "a": 1, "x": "[Oxford ATPL · Oxford Ch32 Q72]"}, {"type": "mcq", "t": "Position A is at 70S 030W, position B is 70S 060E. What is the great circle track of B from A, measured at A?", "o": ["132°(T)", "048°(T)", "090°(T)", "228°(T)"], "a": 0, "x": "The rhumb line track from 70S to 70S is along a parallel of latitude, so it will\n\n[Oxford ATPL · Oxford Ch32 Q73]"}, {"type": "mcq", "t": "Position A is 55N 30W. Position B is 54N 20W. The great circle track from A to B, measured at A, is 100°(T). What is the rhumb line bearing from A to B?", "o": ["104°(T)", "090°(T)", "100°(T)", "284°(T)"], "a": 0, "x": "[Oxford ATPL · Oxford Ch32 Q76]"}, {"type": "mcq", "t": "An aircraft departs a point 0400N 17000W and flies 240 NM South, followed by 240 NM East, then 240 NM North, then 240 NM West. What is its final position?", "o": ["0400N 17000W", "0600S 17000W", "0400N 170°35.9’W", "0400N 170°01.8’W"], "a": 2, "x": "6°S is a greater value of latitude than 4°N. Therefore, for a given departure,\n\n[Oxford ATPL · Oxford Ch32 Q77]"}, {"type": "mcq", "t": "At 1000 hours an aircraft is on the 310 radial from a VOR/DME, at 40 nautical miles range. At 1015 the r
